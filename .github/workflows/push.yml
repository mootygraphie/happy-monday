# Notifications push : regarde la base et envoie ce qui est dû (sondage ouvert, rappel 3 h avant
# la clôture, récap de la soirée, booster dispo à 10h).
# GitHub ne respecte pas le « toutes les 10 min » (en pratique toutes les 3 à 5 h) : un déclencheur
# extérieur (cron-job.org) lance cette Action toutes les 10 min via l'API (workflow_dispatch).
# Chaque lancement reste ensuite éveillé 9 min et envoie en ~15 s les messages, le Vestiaire et la Messagerie ;
# le cron ci-dessous reste en secours.
# La clé privée d'envoi est dans le secret VAPID_PRIVATE_KEY (jamais dans le code).
name: Notifications push

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_player:
        description: "Envoyer une notification de test à ce joueur (nom de fiche, ex. Boris)"
        required: false
        default: ""
      dry_run:
        description: "Simulation : afficher sans rien envoyer (1 = oui)"
        required: false
        default: ""

concurrency:
  group: push
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pywebpush>=2.0.3,<3" "google-auth>=2.29,<3" requests "firebase-admin>=6.5,<7"
      - name: Envoyer les notifications dues
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}  # accès administrateur à la base (règles verrouillées)
          TEST_PLAYER: ${{ github.event.inputs.test_player }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          WATCH: "540"  # reste éveillée 9 min (surveillance toutes les 15 s), sauf test et simulation
        run: python .github/scripts/send_push.py

  # Portraits envoyés depuis l'appli (★ Options › Uploader un portrait) : rangés dans portraits/,
  # liste du Panthéon à jour, site republié. Une seule lecture de la base s'il n'y a rien à faire.
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "google-auth>=2.29,<3" requests pillow==11.0.0
      - name: Ranger les portraits envoyés depuis l'appli
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/import_portraits.py
