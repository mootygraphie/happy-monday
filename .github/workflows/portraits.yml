# Des qu une photo est deposee dans portraits/, la reduit a 900 px de large (meme nom, meme
# format), la recommite, puis relance la publication du site.
name: Reduire les portraits

on:
  push:
    branches: [main]
    paths: ["portraits/**"]
  schedule:
    - cron: "0 0 * * *" # tous les jours vers 01:00 (heure de Paris, UTC+1 en hiver)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

# Plusieurs envois rapproches : les passages s enchainent au lieu de se doubler.
concurrency:
  group: portraits
  cancel-in-progress: false

jobs:
  resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # derniere version, pas celle du push qui a declenche
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - name: Reduire les portraits trop grands
        run: python .github/scripts/resize_portraits.py
      - name: Liste du Pantheon (photos Pantheon_<Prenom>)
        run: |
          python - <<'PY'
          import os, json
          L = sorted([{"n": os.path.splitext(f)[0][9:], "f": os.path.splitext(f)[0]} for f in os.listdir("portraits")
                      if f.lower().startswith("pantheon_") and not f.endswith(".json")], key=lambda x: x["n"].lower())
          json.dump(L, open("portraits/pantheon.json", "w"), ensure_ascii=False)
          PY
      - name: Enregistrer et republier
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A portraits
          if git diff --cached --quiet; then echo "Rien a enregistrer."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Portraits reduits a 900 px / liste du Pantheon (automatique)"
          # si quelqu un a pousse entre-temps : on se recale et on reessaie
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 5; done
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
