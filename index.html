  if (el) el.innerHTML = renderMhfMatrixHtml();
}

function openMhfAchievementDrawer(acid) {
  const a = _mhf.achs.find(x => x.id === acid);
  if (!a) return;
  const c = _mhf.completion[acid];
  const unlocked = _mhf.players.filter(p => _mhf.levels[p][acid].raw > 0)
    .sort((x,y) => _mhf.levels[y][acid].raw - _mhf.levels[x][acid].raw || _mhf.levels[y][acid].val - _mhf.levels[x][acid].val || x.localeCompare(y,'fr'));
  const locked = _mhf.players.filter(p => _mhf.levels[p][acid].raw === 0)
    .sort((x,y) => _mhf.levels[y][acid].val - _mhf.levels[x][acid].val || x.localeCompare(y,'fr'));

  let ladder = '';
  if (a.fixedTier) {
    ladder = `<span class="mhf-tier-pill${a.fixedTier===6?' mhf-t6-anim':''}" style="${_mhfTierStyleAttr(a.fixedTier)}"><span class="dot"></span>Déblocage en 1 fois — ${ACH_TIER_NAMES[a.fixedTier]}</span>`;
  } else {
    ladder = a.tiers.map((th,i) => {
      const dl = _mhfDisplayLevel(a, i+1);
      const tn = (a.tierNames && a.tierNames[i]) || ACH_TIER_NAMES[dl];
      return `<span class="mhf-tier-pill${dl===6?' mhf-t6-anim':''}" style="${_mhfTierStyleAttr(dl)}"><span class="dot"></span>${tn} &middot; ${th}</span>`;
    }).join('');
  }

  const rateColor = c.rate<=0.15 ? 'var(--bad)' : c.rate<=0.45 ? 'var(--gold)' : 'var(--good)';

  let body = `<div class="mhf-dr-about">${ACH_ABOUT[a.id] || ''}</div>`;
  body += `<div class="mhf-dr-ladder">${ladder}</div>`;
  body += `<div class="mhf-dr-completion">
    <div class="top"><span>Complétion roster</span><b>${c.unlocked}/${_mhf.players.length}</b></div>
    <div class="mhf-dr-bar-track"><div class="mhf-dr-bar-fill" style="width:${Math.round(c.rate*100)}%;background:${rateColor}"></div></div>
  </div>`;
  body += `<div class="mhf-dr-list">`;
  unlocked.forEach((p,i) => {
    const L = _mhf.levels[p][acid];
    const dl = _mhfDisplayLevel(a, L.raw);
    const tn = (a.tierNames && a.tierNames[L.raw-1]) || ACH_TIER_NAMES[dl];
    const rank = i+1;
    const rc = rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
    body += `<div class="mhf-dr-row">
      <span class="mhf-dr-rank ${rc}">${rank}</span>
      <button class="mhf-dr-pname player-link" data-player="${p}">${p}</button>
      <span class="mhf-dr-badge" style="${_mhfTierStyleAttr(dl)}">${tn}</span>
      <span class="mhf-dr-val">${a.desc(L.val)}</span>
    </div>`;
  });
  body += `</div>`;
  if (locked.length) {
    body += `<details class="mhf-dr-locked"><summary>${locked.length} joueur${locked.length>1?'s':''} non débloqué${locked.length>1?'s':''}</summary>`;
    locked.forEach(p => {
      const L = _mhf.levels[p][acid];
      body += `<div class="mhf-dr-locked-row">
        <button class="mhf-dr-pname player-link" data-player="${p}">${p}</button>
        <span class="mhf-dr-progress-hint">${L.val} / ${a.tiers[0]}</span>
      </div>`;
    });
    body += `</details>`;
  }

  document.getElementById('mhf-dr-icon').setAttribute('style', `font-size:24px;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;${_mhfTierStyleAttr(a.hidden?1:3)}`);
  document.getElementById('mhf-dr-icon').textContent = a.icon;
  document.getElementById('mhf-dr-title').innerHTML = `${a.name}${a.hidden?' <span class="mhf-rarity-secret" style="vertical-align:middle">SECRET</span>':''}`;
  document.getElementById('mhf-dr-cat').textContent = a.cat;
  document.getElementById('mhf-dr-body').innerHTML = body;
  document.getElementById('mhf-drawer').classList.add('open');
  document.getElementById('mhf-drawer-overlay').classList.add('open');

  _mhfState.selectedAch = acid;
  const rl = document.getElementById('mhf-rarity-list');
  if (rl) rl.innerHTML = _mhfRenderRarityHtml();
}

function closeMhfDrawer() {
  const d = document.getElementById('mhf-drawer'), o = document.getElementById('mhf-drawer-overlay');
  if (d) d.classList.remove('open');
  if (o) o.classList.remove('open');
}

/* ══════════════════════════════════════════════════════════
   RIVALITÉS
══════════════════════════════════════════════════════════ */

function computeRivalites(pA, pB, period) {
  let sessions = [...SESSIONS];
  const now = new Date();
  if (period === "year") {
    sessions = sessions.filter(s => _seasonStart(s.date) === _currentSeason());
  } else if (period === "month") {
    sessions = sessions.filter(s => {
      const d = new Date(s.date);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
  }

  // Garder seulement les sessions où pA ET pB sont présents
  sessions = sessions.filter(s => {
    const pa = s.presences[pA], pb = s.presences[pB];
    return pa && pa.statut === "Présent" && pb && pb.statut === "Présent";
  });

  const result = {
    total: sessions.length,
    matchs: sessions.reduce((acc, s) => acc + (s.matchs||[]).length, 0),
    matchsDirect: 0,
    together: { sessions: 0, wA: 0, dA: 0, lA: 0, gaA: 0, gaB: 0, gA: 0, aA: 0, gB: 0, aB: 0, best: [] },
    versus:   { sessions: 0, wA: 0, dA: 0, lA: 0, wB: 0, dB: 0, lB: 0, gaA: 0, gaB: 0, gA: 0, aA: 0, gB: 0, aB: 0, best: [] },
  };

  const togetherRaw = [];
  const versusRaw   = [];

  sessions.forEach(s => {
    const eqA = s.presences[pA].equipe;
    const eqB = s.presences[pB].equipe;
    const sameEq = eqA && eqB && eqA === eqB;
    const oppEq  = eqA && eqB && eqA !== eqB;

    // G/A individuels dans la session (tous matchs)
    let gA=0, aA=0, gB=0, aB=0;
    (s.matchs||[]).forEach(m => {
      ["A","B"].forEach(side => {
        const buts   = m[`buteurs${side}`]  || [];
        const passes = m[`passeurs${side}`] || [];
        buts.forEach((b,i) => {
          if (!b || b==="CSC") return;
          const p = passes[i];
          if (b === pA) gA++;
          if (p && p!=="CSC" && p === pA) aA++;
          if (b === pB) gB++;
          if (p && p!=="CSC" && p === pB) aB++;
        });
      });
    });

    if (sameEq) {
      result.together.sessions++;
      result.together.gaA += gA + aA; result.together.gA += gA; result.together.aA += aA;
      result.together.gaB += gB + aB; result.together.gB += gB; result.together.aB += aB;

      // W/D/L communs — par match de leur équipe
      let wMatch=0, lMatch=0;
      (s.matchs||[]).filter(m => m.eqA===eqA||m.eqB===eqA).forEach(m => {
        const w = m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;
        if (w===eqA) { result.together.wA++; wMatch++; }
        else if (w===null) { result.together.dA++; }
        else { result.together.lA++; lMatch++; }
      });

      const wdl = wMatch > lMatch ? 'W' : lMatch > wMatch ? 'L' : 'D';
      togetherRaw.push({ date: s.date, equipe: eqA, gaA: gA+aA, gaB: gB+aB, wdl });
    }

    if (oppEq) {
      result.versus.sessions++;
      result.versus.gaA += gA + aA; result.versus.gA += gA; result.versus.aA += aA;
      result.versus.gaB += gB + aB; result.versus.gB += gB; result.versus.aB += aB;

      // W/D/L uniquement sur les matchs directs eqA vs eqB
      (s.matchs||[]).filter(m => (m.eqA===eqA&&m.eqB===eqB)||(m.eqA===eqB&&m.eqB===eqA)).forEach(m => {
        const w = m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;
        if (w===eqA)      { result.versus.wA++; result.versus.lB++; }
        else if (w===eqB) { result.versus.wB++; result.versus.lA++; }
        else              { result.versus.dA++; result.versus.dB++; }
      });

      // Confrontations marquantes : un entry PAR MATCH direct eqA vs eqB
      (s.matchs||[]).forEach(m => {
        let scA, scB, swapped = false;
        if (m.eqA===eqA && m.eqB===eqB)      { scA=m.scoreA; scB=m.scoreB; }
        else if (m.eqA===eqB && m.eqB===eqA) { scA=m.scoreB; scB=m.scoreA; swapped=true; }
        else return;

        // G/A de pA et pB dans CE match uniquement
        let mgA=0, maA=0, mgB=0, maB=0;
        ["A","B"].forEach(side => {
          (m[`buteurs${side}`]||[]).forEach((b,i) => {
            if (!b||b==="CSC") return;
            const p=(m[`passeurs${side}`]||[])[i];
            if (b===pA) mgA++; if (p&&p!=="CSC"&&p===pA) maA++;
            if (b===pB) mgB++; if (p&&p!=="CSC"&&p===pB) maB++;
          });
        });

        versusRaw.push({ date: s.date, eqA, eqB, scoreA: scA, scoreB: scB, gA: mgA, aA: maA, gB: mgB, aB: maB });
      });
    }
  });

  result.matchsDirect = versusRaw.length;

  // Top 3 sessions ensemble (triées par gaA+gaB desc)
  result.together.best = togetherRaw
    .sort((a,b) => (b.gaA+b.gaB) - (a.gaA+a.gaB))
    .slice(0, 3);

  // Top 3 matchs directs (triés par G/A combinés desc, puis écart de score)
  result.versus.best = versusRaw
    .sort((a,b) => {
      const gaTotal = (b.gA+b.aA+b.gB+b.aB) - (a.gA+a.aA+a.gB+a.aB);
      if (gaTotal !== 0) return gaTotal;
      return Math.abs(b.scoreA-b.scoreB) - Math.abs(a.scoreA-a.scoreB);
    })
    .slice(0, 3);

  return result;
}

function renderRivBody(pA, pB, period) {
  if (pA === pB) {
    return `<p class="no-data">Sélectionne deux joueurs différents.</p>`;
  }
  const r = computeRivalites(pA, pB, period);
  if (r.total === 0) {
    return `<p class="no-data">Aucune session commune pour cette période.</p>`;
  }

  const wCol = "#34A853";
  const dCol = "var(--text3)";
  const lCol = "#ea4335";

  const hasTogether = r.together.sessions > 0;
  const hasVersus   = r.versus.sessions   > 0;

  // Header
  let h = `<div style="text-align:center;padding:10px 0 14px">
    <div style="font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px">
      <span>${pA}</span>
      <span style="font-size:11px;color:var(--text3);font-weight:500;letter-spacing:.1em">VS</span>
      <span>${pB}</span>
    </div>
  </div>`;

  if (!hasTogether && !hasVersus) {
    h += `<p class="no-data">Aucune session avec équipes attribuées.</p>`;
    return h;
  }

  // Stats : récap | face à face | ensemble — 3 colonnes sur la même ligne
  h += `<div class="riv-grid">`;

  // Récap (1re carte) — 2×2
  const matchsTogether = r.together.wA + r.together.dA + r.together.lA;
  const matchsTotal = matchsTogether + r.matchsDirect;
  h += `<div class="riv-col-card" style="border-color:var(--gold-border)">
    <div class="riv-col-title">Récap</div>
    <div class="riv-recap">
      <div><div class="n">${r.total}</div><div class="l">session${r.total>1?'s':''}</div></div>
      <div><div class="n">${matchsTotal}</div><div class="l">match${matchsTotal>1?'s':''}</div></div>
      <div><div class="n">${matchsTogether}</div><div class="l">ensemble</div></div>
      <div><div class="n">${r.matchsDirect}</div><div class="l">face à face</div></div>
    </div>
  </div>`;

  // Face à face (2e carte) — scoreboard pA vs pB
  if (hasVersus) {
    const v = r.versus;
    const colA = v.wA > v.wB ? wCol : v.wA < v.wB ? 'var(--text3)' : 'var(--text)';
    const colB = v.wB > v.wA ? wCol : v.wB < v.wA ? 'var(--text3)' : 'var(--text)';
    h += `<div class="riv-col-card">
      <div class="riv-col-title">⚔️ Face à face</div>
      <div class="riv-vsrow names"><span>${pA}</span><span style="font-size:9px;color:var(--text3);font-weight:600;letter-spacing:.12em;padding:0 6px;text-transform:uppercase">vs</span><span>${pB}</span></div>
      <div class="riv-score">
        <span class="num" style="color:${colA}">${v.wA}</span>
        <span class="draws">${v.dA}</span>
        <span class="num right" style="color:${colB}">${v.wB}</span>
      </div>
      <div class="riv-foot">
        <span><strong style="color:var(--text2)">${v.gA}</strong> but${v.gA>1?'s':''} · <strong style="color:var(--text2)">${v.aA}</strong> <span class="assist-full">assist${v.aA>1?'s':''}</span><span class="assist-short">ass.</span></span>
        <span><strong style="color:var(--text2)">${v.gB}</strong> but${v.gB>1?'s':''} · <strong style="color:var(--text2)">${v.aB}</strong> <span class="assist-full">assist${v.aB>1?'s':''}</span><span class="assist-short">ass.</span></span>
      </div>
    </div>`;
  } else {
    h += `<div class="riv-col-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="riv-col-title">⚔️ Face à face</div>
      <div class="riv-no-data-small">Pas de données</div>
    </div>`;
  }

  // Ensemble (3e carte) — pA × pB + V/N/D
  if (hasTogether) {
    const t = r.together;
    h += `<div class="riv-col-card">
      <div class="riv-col-title">🤝 Ensemble</div>
      <div class="riv-vsrow names"><span>${pA}</span><span style="font-size:14px;color:var(--text3);font-weight:700;padding:0 6px">×</span><span>${pB}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:2px;margin-bottom:3px">
        <span style="font-size:9px;color:${wCol};font-weight:700;text-transform:uppercase;letter-spacing:.06em">V</span>
        <span style="font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em">N</span>
        <span style="font-size:9px;color:${lCol};font-weight:700;text-transform:uppercase;letter-spacing:.06em">D</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;margin-bottom:12px">
        <span style="font-size:40px;font-weight:800;line-height:1;color:${wCol}">${t.wA}</span>
        <span style="font-size:40px;font-weight:800;line-height:1;color:var(--text3)">${t.dA}</span>
        <span style="font-size:40px;font-weight:800;line-height:1;color:${lCol}">${t.lA}</span>
      </div>
      <div class="riv-foot">
        <span><span style="font-weight:700;color:var(--text)">${pA}</span> : <strong style="color:var(--text2)">${t.gA}</strong> but${t.gA>1?'s':''} · <strong style="color:var(--text2)">${t.aA}</strong> <span class="assist-full">assist${t.aA>1?'s':''}</span><span class="assist-short">ass.</span></span>
        <span><span style="font-weight:700;color:var(--text)">${pB}</span> : <strong style="color:var(--text2)">${t.gB}</strong> but${t.gB>1?'s':''} · <strong style="color:var(--text2)">${t.aB}</strong> <span class="assist-full">assist${t.aB>1?'s':''}</span><span class="assist-short">ass.</span></span>
      </div>
    </div>`;
  } else {
    h += `<div class="riv-col-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="riv-col-title">🤝 Ensemble</div>
      <div class="riv-no-data-small">Pas de données</div>
    </div>`;
  }

  h += `</div>`;

  // Top soirées ensemble
  if (hasTogether && r.together.best.length > 0) {
    h += `<div class="riv-sessions-title">📅 Top soirées ensemble</div>`;
    r.together.best.forEach(sess => {
      const dateStr = new Date(sess.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
      const resStr  = sess.wdl === 'W' ? `<span style="color:#34A853;font-weight:700">✓</span>`
                    : sess.wdl === 'L' ? `<span style="color:#ea4335;font-weight:700">✗</span>`
                    : `<span style="color:var(--text3)">=</span>`;
      h += `<div class="riv-sess-row">
        <span class="riv-sess-date">${dateStr}</span>
        ${badge(sess.equipe)}
        <span class="riv-sess-ga">${pA}: <strong>${sess.gaA}G/A</strong> · ${pB}: <strong>${sess.gaB}G/A</strong></span>
        ${resStr}
      </div>`;
    });
  }

  // Confrontations marquantes — 3 cartes par ligne
  if (hasVersus && r.versus.best.length > 0) {
    h += `<div class="riv-sessions-title">⚔️ Confrontations marquantes</div>`;
    h += `<div class="riv-match-grid">`;
    r.versus.best.forEach(m => {
      const dateStr = new Date(m.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
      const gaStrA = `${m.gA}G · ${m.aA}A`;
      const gaStrB = `${m.gB}G · ${m.aB}A`;
      const hasGaA = m.gA + m.aA > 0;
      const hasGaB = m.gB + m.aB > 0;
      h += `<div class="riv-match-card">
        <div class="riv-match-date">${dateStr}</div>
        <div class="riv-match-score-row">
          ${badge(m.eqA)}
          <span class="riv-match-score">${m.scoreA} – ${m.scoreB}</span>
          ${badge(m.eqB)}
        </div>
        <div class="riv-match-players">
          <div class="riv-match-player">
            <div class="riv-match-player-name">${pA}</div>
            <div class="riv-match-player-ga${hasGaA?' active':''}">${gaStrA}</div>
          </div>
          <div class="riv-match-player">
            <div class="riv-match-player-name">${pB}</div>
            <div class="riv-match-player-ga${hasGaB?' active':''}">${gaStrB}</div>
          </div>
        </div>
      </div>`;
    });
    h += `</div>`;
  }

  return h;
}

/* ══════════════════════════════════════════════════════════
   DASHBOARD v2 (préfixe dbx-) — recopié du prototype approuvé.
   Agrégation étendue + rendu des sections (hero, comparatif,
   tendance, matchs marquants, classements, assiduité).
══════════════════════════════════════════════════════════ */

/* Étend computeStats() avec les données chronologiques nécessaires
   au nouveau design : buts contre par équipe, forme récente (W/N/L),
   et répartition des buts par session pour le graphique de tendance. */
function _dbxComputeAgg(sessions) {
  const st = computeStats(sessions);
  const sorted = [...sessions].sort((a,b) => new Date(a.date)-new Date(b.date));
  const allMatchsChrono = sorted.flatMap(s => (s.matchs||[]).map(m => ({...m, date:s.date})));
  const goalsAgainst = {Rouge:0, Vert:0, Bleue:0};
  const results = {Rouge:[], Vert:[], Bleue:[]};
  let draws = 0;
  allMatchsChrono.forEach(m => {
    goalsAgainst[m.eqA] = (goalsAgainst[m.eqA]||0) + m.scoreB;
    goalsAgainst[m.eqB] = (goalsAgainst[m.eqB]||0) + m.scoreA;
    let winner = null;
    if (m.scoreA > m.scoreB) winner = m.eqA;
    else if (m.scoreB > m.scoreA) winner = m.eqB;
    else draws++;
    results[m.eqA].push(winner===m.eqA ? "w" : winner ? "l" : "n");
    results[m.eqB].push(winner===m.eqB ? "w" : winner ? "l" : "n");
  });
  const totalGoals = allMatchsChrono.reduce((a,m) => a+m.scoreA+m.scoreB, 0);
  const maxWins = Math.max(0, st.colorWins.Rouge, st.colorWins.Vert, st.colorWins.Bleue);
  const leaders = ["Rouge","Vert","Bleue"].filter(t => st.colorWins[t]===maxWins && maxWins>0);
  const totalPres = sessions.reduce((a,s) => a + Object.values(s.presences).filter(p=>p.statut==="Présent").length, 0);
  const totalAbs  = sessions.reduce((a,s) => a + Object.values(s.presences).filter(p=>p.statut==="Absent").length, 0);
  const totalBles = sessions.reduce((a,s) => a + Object.values(s.presences).filter(p=>p.statut==="Blessé").length, 0);
  const byAlpha = (a,b) => a[0].localeCompare(b[0], "fr");
  const topScorers  = st.buteursRank.slice(0,5);
  const topAssists  = st.passeursRank.slice(0,5);
  const topCleanSheets = computeGardiensRanking(sessions)
    .filter(r => r.cleanSheets > 0)
    .sort((a,b) => b.cleanSheets-a.cleanSheets || a.name.localeCompare(b.name,"fr")).slice(0,5)
    .map(r => [r.name, { cleanSheets: r.cleanSheets }]);
  const goalsBySession = sorted.map(s => ({ date: s.date, goals: (s.matchs||[]).reduce((a,m) => a+m.scoreA+m.scoreB, 0) }));
  const assistsBySession = sorted.map(s => ({ date: s.date, assists: (s.matchs||[]).reduce((a,m) => a+_dbxCountAssists(m), 0) }));
  /* Clean sheets : une equipe garde sa cage inviolee des qu elle ne concede aucun
     but sur un match (un nul 0-0 compte pour les 2 equipes). */
  const totalCleanSheets = allMatchsChrono.reduce((a,m) => a + (m.scoreB===0?1:0) + (m.scoreA===0?1:0), 0);
  return {
    allMatchs: allMatchsChrono, ps: st.ps, colorWins: st.colorWins, draws,
    goalsFor: st.goalsPerTeam, goalsAgainst, totalGoals, leaders, maxWins,
    topScorers, topAssists, topCleanSheets, totalPres, totalAbs, totalBles, totalCleanSheets,
    mostGoals: st.mostGoals, biggestAmp: st.biggestAmp, results, goalsBySession, assistsBySession,
    sessionsCount: sessions.length
  };
}

/* Nombre de passes decisives valides (non-CSC) sur un match, tous cotes confondus —
   utilise par la tendance Globales (ligne passes) et par les agregations Equipes/Joueurs. */
function _dbxCountAssists(m) {
  let c = 0;
  ["A","B"].forEach(side => {
    const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
    buts.forEach((b,i) => {
      if (!b || b==="CSC") return;
      const p = passes[i];
      if (p && p!=="CSC") c++;
    });
  });
  return c;
}

function _dbxSparkSvg(values, color) {
  if (values.length < 2) return "";
  const w=110, h=32, pad=3;
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max-min)||1;
  const pts = values.map((v,i) => [pad+(i*(w-2*pad)/(values.length-1)), h-pad-((v-min)/range)*(h-2*pad)]);
  const line = pts.map(p=>p.join(",")).join(" ");
  const area = `${pad},${h-pad} ${line} ${w-pad},${h-pad}`;
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polygon points="${area}" fill="${color}" opacity=".14"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/>
  </svg>`;
}

function _dbxFmtDateShort(d) {
  const [,m,j] = d.split("-");
  return `${parseInt(j)} ${MONTH_NAMES[parseInt(m)-1].slice(0,3)}`;
}

function _dbxTag(t) {
  return `<span class="dbx-tag ${t.toLowerCase()}">${dot(t)}${TEAM_LABEL[t]||t}</span>`;
}

function _dbxRenderHero(agg, prevAgg) {
  const avgGoals = agg.allMatchs.length ? (agg.totalGoals/agg.allMatchs.length).toFixed(1) : "—";
  const leaderHtml = agg.leaders.length
    ? agg.leaders.map(t => `${dot(t)}<span class="dbx-txt ${t.toLowerCase()}">${TEAM_LABEL[t]}</span>`).join(" &amp; ")
    : "—";
  const sparkVals = agg.goalsBySession.slice(-10).map(g=>g.goals);
  return `<div class="dbx-hero-grid">

/* Equipe-type sur la periode selectionnee (Dashboard Globales) — meme logique que sur
   une session, mais les stats et la couleur d equipe sont agregees sur toute la periode
   (couleur = celle la plus frequente sur les sessions de la periode). */
function _dbxRenderEquipeType(sessions) {
  const colorTally = {};
  sessions.forEach(s => {
    Object.entries(s.presences || {}).forEach(([nm, info]) => {
      if (info.statut !== "Présent" || !info.equipe) return;
      colorTally[nm] = colorTally[nm] || {};
      colorTally[nm][info.equipe] = (colorTally[nm][info.equipe]||0) + 1;
    });
  });
  const teamOf = nm => {
    const t = colorTally[nm];
    return t ? Object.entries(t).sort((a,b)=>b[1]-a[1])[0][0] : "";
  };
  const ps = computeStats(sessions).ps;
  const outfield = computeTopDefendersStats(sessions, 1).map(d => ({
    name: d.name,
    team: teamOf(d.name),
    buts: (ps[d.name] && ps[d.name].buts) || 0,
    passes: (ps[d.name] && ps[d.name].passes) || 0,
    defAvg: d.avg,
    matchCount: d.matchCount
  }));
  const gks = computeGardiensRanking(sessions).map(g => ({ ...g, team: teamOf(g.name) }));
  const team = _pickEquipeType(outfield, gks, ttGkCriteria);
  return _ttPanelHtml("dbx", team, ttGkCriteria);
}

/* ══════════════════════════════════════════════════════════
   DASHBOARD XXL — graphiques SVG partagés (donut / radar / barres+ligne),
   portés quasi verbatim du prototype approuvé.
══════════════════════════════════════════════════════════ */
function _dbx2FormChipsHtml(form) {
  return `<div class="dbx2-hero-form">${form.map(r => `<span class="dbx-form-chip ${r}">${r==="w"?"V":r==="n"?"N":"D"}</span>`).join("")}</div>`;
}

function _dbx2DonutSvg(slices, size, unitLabel) {
  size = size || 150;
  unitLabel = unitLabel || "matchs";
  const r = size/2 - 16, cx = size/2, cy = size/2, circ = 2*Math.PI*r;
  const total = slices.reduce((a,s)=>a+s.value,0) || 1;
  let offset = 0;
  const rings = slices.map(s => {
    const frac = s.value/total, len = frac*circ;
    const dash = `${len} ${circ-len}`;
    const rot = (offset/total)*360 - 90;
    offset += s.value;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="16"
      stroke-dasharray="${dash}" transform="rotate(${rot} ${cx} ${cy})" stroke-linecap="butt"/>`;
  }).join("");
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="16"/>
    ${rings}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="21" font-weight="700" fill="var(--text)" font-family="inherit">${total}</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="9.5" fill="var(--text3)" font-family="inherit">${unitLabel}</text>
  </svg>`;
}

function _dbx2RadarSvg(axes, series, size) {
  size = size || 240;
  const labelMargin = 52;
  const w = size + labelMargin*2, h = size;
  const cx = w/2, cy = h/2 - 6, R = size/2 - 30, n = axes.length;
  const angle = i => -Math.PI/2 + i*(2*Math.PI/n);
  const pt = (i, frac) => [cx + Math.cos(angle(i))*R*frac, cy + Math.sin(angle(i))*R*frac];
  const rings = [.25,.5,.75,1].map(f => {
    const pts = axes.map((_,i) => pt(i,f).join(",")).join(" ");
    return `<polygon points="${pts}" fill="none" stroke="var(--border2)" stroke-width="1"/>`;
  }).join("");
  const spokes = axes.map((a,i) => {
    const [x,y] = pt(i,1);
    const [lx,ly] = pt(i,1.2);
    const anchor = Math.abs(Math.cos(angle(i)))<0.2 ? "middle" : (Math.cos(angle(i))>0?"start":"end");
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--border2)" stroke-width="1"/>
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" font-size="10" fill="var(--text2)" font-family="inherit" font-weight="600">${a.label}</text>`;
  }).join("");
  const polys = series.map(s => {
    const pts = axes.map((a,i) => pt(i, Math.max(0.03,s.values[a.key]||0)).join(",")).join(" ");
    const op = s.emphasized ? 1 : .9;
    const fillOp = s.emphasized ? .22 : .1;
    const dash = s.emphasized ? "" : ` stroke-dasharray="5,3"`;
    return `<polygon points="${pts}" fill="${s.color}" fill-opacity="${fillOp}" stroke="${s.color}" stroke-opacity="${op}" stroke-width="${s.emphasized?2.4:1}"${dash}/>`;
  }).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${rings}${spokes}${polys}</svg>`;
}

/* Buts (barres) + passes (ligne pointillee) superposes, meme echelle */
function _dbx2BarLineComboSvg(bars, line, barColor, lineColor, labels) {
  const w = Math.max(320, bars.length*32), h = 122, padB = 20, padT = 10;
  const max = Math.max(...bars, ...line, 1);
  const barW = Math.min(20, (w/bars.length)*0.55);
  const step = w/bars.length;
  const barsHtml = bars.map((v,i) => {
    const x = i*step + (step-barW)/2;
    const bh = Math.max(2, (v/max)*(h-padB-padT));
    const y = h-padB-bh;
    const lbl = labels ? `<text x="${x+barW/2}" y="${h-6}" text-anchor="middle" font-size="9" fill="var(--text3)" font-family="inherit">${labels[i]}</text>` : "";
    return `<g><rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="3.5" fill="${barColor}" opacity=".85"><title>${labels?labels[i]+' — ':''}${v} but${v>1?'s':''}</title></rect>${lbl}</g>`;
  }).join("");
  const pts = line.map((v,i) => {
    const x = i*step + step/2;
    const y = h-padB-(v/max)*(h-padB-padT);
    return [x,y];
  });
  const poly = pts.map(p=>p.join(",")).join(" ");
  const dots = pts.map(([x,y],i) => `<circle cx="${x}" cy="${y}" r="2.8" fill="var(--bg2)" stroke="${lineColor}" stroke-width="2"><title>${labels?labels[i]+' — ':''}${line[i]} passe${line[i]>1?'s':''}</title></circle>`).join("");
  return { svg: `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
      ${barsHtml}
      <polyline points="${poly}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-dasharray="5,3" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
    </svg>`,
    barAvg: bars.length ? (bars.reduce((a,v)=>a+v,0)/bars.length).toFixed(1) : "0.0",
    lineAvg: line.length ? (line.reduce((a,v)=>a+v,0)/line.length).toFixed(1) : "0.0",
    max, h, padB, padT };
}

/* Echelle verticale a gauche du graphique barres+ligne, hors de la zone qui scrolle */
function _dbx2TrendAxisHtml(max, h, padB, padT) {
  const steps = 4;
  const ticks = [];
  for (let i = 0; i <= steps; i++) {
    const v = Math.round(max*i/steps);
    const bottom = (v/max)*(h-padB-padT) + padB;
    ticks.push(`<span class="dbx2-trend-axis-tick" style="bottom:${bottom}px">${v}</span>`);
  }
  return `<div class="dbx2-trend-axis" style="height:${h}px">${ticks.join('')}</div>`;
}

/* Toggle "Par session / Par match" partage par les 3 cartes Tendance */
function _dbxTrendToggleHtml() {

/* Carte "Tendance" partagee (buts en barres + passes en ligne pointillee) — les 3 portees */
function _dbx2RenderTrendCard(subLbl, bars, line, labels, barColor, lineColor, withToggle) {
  const toggle = withToggle ? _dbxTrendToggleHtml() : "";
  if (!bars.length) return `<div class="dbx-card dbx-trend-card">${toggle}<p style="color:var(--text3);font-size:13px;font-style:italic;margin:0">Aucune donnée.</p></div>`;

      <span class="dbx-trend-top-val">Moy. <b style="color:${barColor}">${trend.barAvg}</b> buts &middot; <b style="color:${lineColor}">${trend.lineAvg}</b> passes</span>
    </div>
    <div class="dbx2-trend-layout">
      ${axis}
      <div class="dbx2-trend-scroll">${trend.svg}</div>
    </div>
    <div class="dbx2-viz-legend" style="margin-top:8px">
      <span class="dbx2-viz-legend-item"><span class="dbx2-viz-legend-dot" style="background:${barColor}"></span>Buts (barres)</span>
      <span class="dbx2-viz-legend-item"><span class="dbx2-viz-legend-dot" style="background:${lineColor}"></span>Passes (ligne)</span>

/* Tendance Globales : granularite pilotee par le toggle dbxTrendMode (session/match). */
function _dbxGlobalTrendChart(agg) {

}

/* ══════════════════════════════════════════════════════════
   DASHBOARD XXL — agrégations réelles Équipes / Joueurs
══════════════════════════════════════════════════════════ */
function _dbxComputeTeamAgg(sessions, color) {
  const sorted = [...sessions].sort((a,b) => new Date(a.date)-new Date(b.date));
  let w=0,n=0,l=0,gf=0,ga=0,cleanSheets=0;
  const results = [];
  const vs = {};
  const scorerTally = {}, assistTally = {};
  let biggestWin = null, worstLoss = null;
  const goalsBySession = [], assistsBySession = [];
  const goalsByMatch = [], assistsByMatch = [], matchLabels = [];
  sorted.forEach(s => {
    let sessGoals = 0, sessAssists = 0;
    (s.matchs||[]).forEach(m => {
      const isA = m.eqA === color, isB = m.eqB === color;
      if (!isA && !isB) return;
      const myScore = isA ? (m.scoreA||0) : (m.scoreB||0);
      const oppScore = isA ? (m.scoreB||0) : (m.scoreA||0);
      const oppColor = isA ? m.eqB : m.eqA;
      gf += myScore; ga += oppScore;
      if (oppScore === 0) cleanSheets++;
      let res;
      if (myScore > oppScore) { w++; res = "w"; }
      else if (myScore < oppScore) { l++; res = "l"; }
      else { n++; res = "n"; }
      results.push(res);
      if (!vs[oppColor]) vs[oppColor] = { played:0, w:0, n:0, l:0, gf:0, ga:0 };
      vs[oppColor].played++; vs[oppColor].gf += myScore; vs[oppColor].ga += oppScore;
      if (res === "w") vs[oppColor].w++; else if (res === "l") vs[oppColor].l++; else vs[oppColor].n++;
      const diff = myScore - oppScore;
      const rec = { score: `${myScore}–${oppScore}`, opp: oppColor, date: s.date, diff };
      if (diff > 0 && (!biggestWin || diff > biggestWin.diff)) biggestWin = rec;
      if (diff < 0 && (!worstLoss || diff < worstLoss.diff)) worstLoss = rec;
      const myButs = (isA ? m.buteursA : m.buteursB) || [];
      const myPasses = (isA ? m.passeursA : m.passeursB) || [];
      let matchGoals = 0, matchAssists = 0;
      myButs.forEach((b,i) => {
        if (!b || b === "CSC") return;
        scorerTally[b] = (scorerTally[b]||0) + 1; sessGoals++; matchGoals++;
        const p = myPasses[i];
        if (p && p !== "CSC") { assistTally[p] = (assistTally[p]||0) + 1; sessAssists++; matchAssists++; }
      });
      goalsByMatch.push(matchGoals); assistsByMatch.push(matchAssists);
      matchLabels.push(`${_dbxFmtDateShort(s.date)} vs ${(TEAM_LABEL[oppColor]||oppColor).slice(0,3)}`);
    });
    goalsBySession.push({ date: s.date, goals: sessGoals });
    assistsBySession.push({ date: s.date, assists: sessAssists });
  });
  const played = w + n + l;
  const byAlpha = (a,b) => a[0].localeCompare(b[0], "fr");
  // Liste complete (plus de top 5) : un joueur peut avoir marque/passe pour cette equipe
  // en depannage ("mercenaire") — on ne les compte pas dans les buteurs/passeurs de
  // cette equipe, seulement pour celle a laquelle ils appartiennent le plus souvent sur
  // la periode (une meme personne peut etre mercenaire ailleurs a differents moments).
  const colorTally = {};
  sessions.forEach(s => {
    Object.entries(s.presences || {}).forEach(([nm, info]) => {
      if (info.statut !== "Présent" || !info.equipe) return;
      colorTally[nm] = colorTally[nm] || {};
      colorTally[nm][info.equipe] = (colorTally[nm][info.equipe]||0) + 1;
    });
  });
  const isHome = nm => {
    const t = colorTally[nm];
    if (!t) return false;
    return Object.entries(t).sort((a,b) => b[1]-a[1])[0][0] === color;
  };
  const scorers = Object.entries(scorerTally).filter(([nm]) => isHome(nm)).sort((a,b) => b[1]-a[1] || byAlpha(a,b));
  const assists = Object.entries(assistTally).filter(([nm]) => isHome(nm)).sort((a,b) => b[1]-a[1] || byAlpha(a,b));
  let bestStreak = 0, cur = 0;
  results.forEach(r => { if (r === "w") { cur++; bestStreak = Math.max(bestStreak, cur); } else cur = 0; });
  const vsEntries = Object.entries(vs);
  const nemesis = vsEntries.length ? [...vsEntries].sort((a,b) => (a[1].w/a[1].played) - (b[1].w/b[1].played))[0] : null;
  const form = results.slice(-5);
  return { color, played, w, n, l, gf, ga, cleanSheets, scorers, assists, vs, biggestWin, worstLoss, bestStreak, nemesis, form, results, goalsBySession, assistsBySession, goalsByMatch, assistsByMatch, matchLabels };
}

/* Agregation match par match pour un joueur (reutilisee pour lui-meme ET pour
   la moyenne du groupe, sur les memes axes) */
function _dbxPlayerMatchAgg(sessions, player) {
  const sorted = [...sessions].sort((a,b) => new Date(a.date)-new Date(b.date));
  let w=0,n=0,l=0,buts=0,passes=0;
  const results = [];
  const colorMatches = {}, colorWinsGames = {};
  let bestMatch = null;
  const goalsBySession = [], assistsBySession = [];
  const goalsByMatch = [], assistsByMatch = [], matchLabels = [];
  sorted.forEach(s => {
    const info = s.presences[player];
    if (info && info.statut === "Présent" && info.equipe) {
      colorMatches[info.equipe] = (colorMatches[info.equipe]||0) + 1;
    }
    let sessGoals = 0, sessAssists = 0;
    (s.matchs||[]).forEach(m => {
      let myG = 0, myA = 0;
      ["A","B"].forEach(side => {
        const bts = m[`buteurs${side}`]||[], pss = m[`passeurs${side}`]||[];
        bts.forEach((b,i) => {
          if (!b || b === "CSC") return;
          if (b === player) { myG++; sessGoals++; buts++; }
          const psr = pss[i];
          if (psr && psr !== "CSC" && psr === player) { myA++; sessAssists++; passes++; }
        });
      });
      if (info && info.statut === "Présent" && info.equipe && (m.eqA === info.equipe || m.eqB === info.equipe)) {
        goalsByMatch.push(myG); assistsByMatch.push(myA);
        matchLabels.push(`${_dbxFmtDateShort(s.date)} (${(TEAM_LABEL[m.eqA]||m.eqA).slice(0,3)}-${(TEAM_LABEL[m.eqB]||m.eqB).slice(0,3)})`);
        const isA = m.eqA === info.equipe;
        const myScore = isA ? (m.scoreA||0) : (m.scoreB||0);
        const oppScore = isA ? (m.scoreB||0) : (m.scoreA||0);
        let res;
        if (myScore > oppScore) { w++; res = "w"; colorWinsGames[info.equipe] = (colorWinsGames[info.equipe]||0)+1; }
        else if (myScore < oppScore) { l++; res = "l"; }
        else { n++; res = "n"; }
        results.push(res);
        const oppColor = isA ? m.eqB : m.eqA;
        const ga = myG + myA;
        if (!bestMatch || ga > bestMatch.ga) {
          bestMatch = { score: `${myScore}–${oppScore}`, opp: oppColor, g: myG, a: myA, ga, date: s.date };
        }
      }
    });
    goalsBySession.push({ date: s.date, goals: sessGoals });
    assistsBySession.push({ date: s.date, assists: sessAssists });
  });
  const played = w + n + l;
  return { played, w, n, l, buts, passes, results, colorMatches, colorWinsGames, bestMatch, goalsBySession, assistsBySession, goalsByMatch, assistsByMatch, matchLabels };
}

/* MVP par session, sur une plage donnee (sessions deja filtrees) — replique le tally
   goals+assists de computeAchievementStats (qui lui est all-time uniquement) */
function _dbxComputeMvpCounts(sessions) {
  const counts = {};
  sessions.forEach(s => {
    const tally = {};
    (s.matchs||[]).forEach(m => {
      ["A","B"].forEach(side => {
        const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
        buts.forEach((b,i) => {
          if (b && b!=="CSC") tally[b] = (tally[b]||0) + 1;
          const p = passes[i];
          if (p && p!=="CSC") tally[p] = (tally[p]||0) + 1;
        });
      });
    });
    const vals = Object.values(tally);
    if (!vals.length) return;
    const maxVal = Math.max(...vals);
    if (maxVal <= 0) return;
    Object.entries(tally).forEach(([name,val]) => { if (val === maxVal) counts[name] = (counts[name]||0)+1; });
  });
  return counts;
}

function _dbxComputePlayerAgg(sessions, player) {
  const st = computeStats(sessions);
  const psStat = st.ps[player] || { presences:0, buts:0, passes:0 };
  const pa = _dbxPlayerMatchAgg(sessions, player);
  const presenceRate = sessions.length ? psStat.presences / sessions.length : 0;
  const winRate = pa.played ? pa.w / pa.played : 0;
  const form = pa.results.slice(-5);

  const colorEntries = Object.entries(pa.colorMatches).filter(([,v]) => v>0);
  const bestColor = colorEntries.length
    ? [...colorEntries].map(([c,v]) => [c, (pa.colorWinsGames[c]||0)/v]).sort((a,b)=>b[1]-a[1])[0]
    : null;

  const duos = computeLinkUpStats(sessions).filter(dd => dd.p1===player || dd.p2===player);
  const bestDuo = duos.length ? { name: duos[0].p1===player?duos[0].p2:duos[0].p1, n: duos[0].connexions } : null;

  const mvpCounts = _dbxComputeMvpCounts(sessions);
  const mvp = mvpCounts[player] || 0;

  /* Radar : chaque axe est relatif au max (ou min/max inverse pour def/gardien) observe parmi
     les joueurs actifs sur la periode choisie, plutot qu un plafond fixe — sinon une performance
     ponctuelle exceptionnelle (ex: meilleur buteur d une seule session) paraissait toute petite
     des qu on tombait sous le plafond arbitraire. Attaque/Passes/Victoires : total brut du joueur
     / total brut du meilleur de la periode. Defense/Gardien : bases sur les buts encaisses
     (computeTopDefendersStats / computeGardiensRanking, deja periode-scopes) — celui qui en a
     encaisse le moins obtient le max, celui qui en a encaisse le plus obtient le min. */
  const gkRanking = computeGardiensRanking(sessions);
  const defRanking = computeTopDefendersStats(sessions, 1);
  const activePlayers = Object.keys(st.ps).filter(nm => st.ps[nm] && st.ps[nm].presences > 0);
  const perPlayer = {};
  activePlayers.forEach(nm => {
    const npa = nm === player ? pa : _dbxPlayerMatchAgg(sessions, nm);
    if (!npa.played) return;
    const ngk = gkRanking.find(r => r.name === nm);
    const ndef = defRanking.find(dd => dd.name === nm);
    perPlayer[nm] = {
      buts: npa.buts, passes: npa.passes, wins: npa.w,
      gk: (ngk && ngk.matchs > 0) ? ngk.rate : null,
      def: ndef ? ndef.avg : null,
    };
  });
  const entries = Object.values(perPlayer);
  const maxButs   = Math.max(0, ...entries.map(e => e.buts));
  const maxPasses = Math.max(0, ...entries.map(e => e.passes));
  const maxWins   = Math.max(0, ...entries.map(e => e.wins));
  const defVals = entries.map(e => e.def).filter(v => v !== null);
  const minDef = defVals.length ? Math.min(...defVals) : null, maxDef = defVals.length ? Math.max(...defVals) : null;
  const gkVals = entries.map(e => e.gk).filter(v => v !== null);
  const minGk = gkVals.length ? Math.min(...gkVals) : null, maxGk = gkVals.length ? Math.max(...gkVals) : null;

  const _dbxRadarFracs = nm => {
    const e = perPlayer[nm];
    if (!e) return { atk:0, pass:0, gk:.5, win:0, def:.5 };
    return {
      atk:  maxButs   > 0 ? e.buts/maxButs     : 0,
      pass: maxPasses > 0 ? e.passes/maxPasses : 0,
      win:  maxWins   > 0 ? e.wins/maxWins     : 0,
      def:  e.def===null ? 0.5 : (maxDef===minDef ? 0.5 : (maxDef-e.def)/(maxDef-minDef)),
      gk:   e.gk===null  ? 0.5 : (maxGk===minGk  ? 0.5 : (maxGk-e.gk)/(maxGk-minGk)),
    };
  };

  const radar = _dbxRadarFracs(player);

  const avgAcc = { atk:0, pass:0, gk:0, win:0, def:0 };
  let avgCount = 0;
  Object.keys(perPlayer).forEach(nm => {
    const f = _dbxRadarFracs(nm);
    avgAcc.atk += f.atk; avgAcc.pass += f.pass; avgAcc.gk += f.gk; avgAcc.win += f.win; avgAcc.def += f.def;
    avgCount++;
  });
  const avgRadar = avgCount
    ? { atk: avgAcc.atk/avgCount, pass: avgAcc.pass/avgCount, gk: avgAcc.gk/avgCount, win: avgAcc.win/avgCount, def: avgAcc.def/avgCount }
    : { atk:.5, pass:.5, gk:.5, win:.5, def:.5 };

  // Points "a la Ligue" (3V/1N/0D) accumules par le joueur selon les resultats de son
  // equipe quand il jouait, + stats gardien/defense brutes (deja calculees ci-dessus
  // pour le radar, on relit juste l entree de ce joueur pour l affichage en clair).
  const points = pa.w * 3 + pa.n;
  const pointsPerMatch = pa.played ? points / pa.played : 0;
  const defEntry = defRanking.find(dd => dd.name === player) || null;
  const gkEntry  = gkRanking.find(r => r.name === player) || null;

  return {
    player, played: pa.played, w: pa.w, n: pa.n, l: pa.l, buts: pa.buts, passes: pa.passes,
    presenceRate, sessionsAttended: psStat.presences, winRate, points, pointsPerMatch, form,
    colorMatches: pa.colorMatches, colorWinsGames: pa.colorWinsGames,
    bestColor, bestMatch: pa.bestMatch, bestDuo, mvp, radar, avgRadar,
    defAvg: defEntry ? defEntry.avg : null, defMatches: defEntry ? defEntry.matchCount : 0, defTotal: defEntry ? defEntry.goalsAgainst : 0,
    gkCleanSheets: gkEntry ? (gkEntry.cleanSheets||0) : 0, gkMatches: gkEntry ? gkEntry.matchs : 0, gkConceded: gkEntry ? gkEntry.buts : 0,
    goalsBySession: pa.goalsBySession, assistsBySession: pa.assistsBySession,
    goalsByMatch: pa.goalsByMatch, assistsByMatch: pa.assistsByMatch, matchLabels: pa.matchLabels,
  };
}

    <div class="dbx-card dbx2-fun-card"><div class="dbx2-fun-ico">😈</div><div class="dbx2-fun-lbl">Bête noire</div><div class="dbx2-fun-val">${d.nemesis ? TEAM_LABEL[d.nemesis[0]] : "—"}</div><div class="dbx2-fun-sub">${d.nemesis ? `${Math.round(d.nemesis[1].w/d.nemesis[1].played*100)}% de victoires seulement` : ""}</div></div>
  </div>`;

  h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Face à face</span></div>`;

    return `<tr><td>${_dbxTag(opp)}</td><td>${r.played}</td><td style="color:var(--good)">${r.w}</td><td style="color:var(--neutral)">${r.n}</td><td style="color:var(--bad)">${r.l}</td><td>${r.gf}–${r.ga}</td><td><b>${wr}%</b></td></tr>`;
  }).join("");
  h += `<div class="dbx-card" style="padding:6px 16px;overflow-x:auto">
    <table class="dbx2-oppo-table"><thead><tr><th>Adversaire</th><th>MJ</th><th>V</th><th>N</th><th>D</th><th>Buts</th><th>%V</th></tr></thead><tbody>${oppRows || `<tr><td colspan="7" class="no-data">Aucune donnée</td></tr>`}</tbody></table>

  return h;
}

    <div class="dbx-hero-card">
      <div class="dbx-hero-lbl">Passeur</div>
      <div class="dbx-hero-num">${d.passes}${dbxCompare ? _dbxDeltaBadge(d.passes, prevD ? prevD.passes : null) : ""}</div>
      <div class="dbx-hero-sub">passe${d.passes>1?"s":""} décisive${d.passes>1?"s":""}</div>
    </div>
    <div class="dbx-hero-card">
      <div class="dbx-hero-lbl">Défenseur</div>
      <div class="dbx-hero-num">${d.defAvg!==null ? d.defAvg.toFixed(1) : "—"}${dbxCompare && d.defAvg!==null ? _dbxDeltaBadge(d.defAvg, prevD && prevD.defAvg!==null ? prevD.defAvg : null, {decimals:true, invert:true}) : ""}</div>
      <div class="dbx-hero-sub">Buts encaissés / match</div>
    </div>
    <div class="dbx-hero-card">
      <div class="dbx-hero-lbl">Gardien</div>
      <div class="dbx-hero-num">${d.gkMatches>0 ? d.gkCleanSheets : "—"}${dbxCompare && d.gkMatches>0 ? _dbxDeltaBadge(d.gkCleanSheets, prevD && prevD.gkMatches>0 ? prevD.gkCleanSheets : null) : ""}</div>
      <div class="dbx-hero-sub">${d.gkMatches>0 ? `Clean sheet${d.gkCleanSheets>1?"s":""}` : "Aucun match gardé"}</div>
    </div>
  </div>`;

  if (!d.played) {
    h += `<p class="no-data" style="margin-top:1.5rem">Aucune donnée de match pour ${player} sur cette période.</p>`;
  } else {
    h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Répartition &amp; profil</span><span class="dbx-sec-note">${player} vs moyenne du groupe</span></div>`;
    const colorEntries = Object.entries(d.colorMatches).filter(([,v])=>v>0);
    const donut = colorEntries.length ? _dbx2DonutSvg(colorEntries.map(([c,v]) => ({ value:v, color:`var(--${teamCls(c)})` })), 196, "sessions") : `<p class="no-data">Aucune donnée.</p>`;
    const legend = colorEntries.map(([c,v]) => `<span class="dbx2-viz-legend-item"><span class="dbx2-viz-legend-dot" style="background:var(--${teamCls(c)})"></span>${TEAM_LABEL[c]} ${v}</span>`).join("");

    const RAXES = [ {key:"atk",label:"Attaque"}, {key:"pass",label:"Passes"}, {key:"gk",label:"Gardien"}, {key:"win",label:"Victoires"}, {key:"def",label:"Défense"} ];
    const radarCandidates = _dbxRosterForPicker().all.filter(p => p !== player);
    dbxRadarCompare = dbxRadarCompare.filter(p => radarCandidates.includes(p)).slice(0,2);
    const RADAR_SLOT_COLORS = ["var(--rouge)","var(--bleu)"];
    const radarSeries = dbxRadarCompare.length
      ? [{ key:"player", color:"var(--gold)", emphasized:true, values:d.radar }].concat(
          dbxRadarCompare.map((p,i) => ({ key:p, color:RADAR_SLOT_COLORS[i], emphasized:true, values:_dbxComputePlayerAgg(sessions, p).radar }))
        )
      : [
          { key:"avg", color:"var(--text2)", emphasized:false, values:d.avgRadar },
          { key:"player", color:"var(--gold)", emphasized:true, values:d.radar },
        ];
    const radar = _dbx2RadarSvg(RAXES, radarSeries, 210);

    const wnlDonut = _dbx2DonutSvg([
      { value:d.w, color:"var(--good)" }, { value:d.n, color:"var(--neutral)" }, { value:d.l, color:"var(--bad)" },
    ], 196);

    h += `<div class="dbx2-viz-row">
      <div class="dbx-card dbx2-viz-card">
        <div class="dbx2-viz-title">Répartition par équipe</div><div class="dbx2-viz-note">Nombre de sessions jouées par couleur</div>
        ${donut}
        <div class="dbx2-viz-legend">${legend}</div>
      </div>
      <div class="dbx-card dbx2-viz-card">
        <div class="dbx2-viz-title">Profil joueur</div><div class="dbx2-viz-note">${dbxRadarCompare.length ? "Comparé à d'autres joueurs" : "Comparé à la moyenne du groupe"}</div>
        ${radar}
        <div class="dbx2-viz-legend">
          <span class="dbx2-viz-legend-item"><span class="dbx2-viz-legend-dot" style="background:var(--gold)"></span>${player}</span>
          ${dbxRadarCompare.length
            ? dbxRadarCompare.map((p,i) => `<span class="dbx2-viz-legend-item"><span class="dbx2-viz-legend-dot" style="background:${RADAR_SLOT_COLORS[i]}"></span>${p}</span>`).join("")
            : `<span class="dbx2-viz-legend-item"><span class="dbx2-viz-legend-dot" style="background:var(--text2)"></span>Moyenne du groupe</span>`}
        </div>
        <details class="dbx2-radar-cmp"${dbxRadarCompare.length?' open':''}>
          <summary>Comparer avec d'autres joueurs (max 2)</summary>
          <div class="radar-player-list" id="dbx2-radar-cmp-list">
            ${radarCandidates.map(p => {
              const checked = dbxRadarCompare.includes(p);
              const disabled = !checked && dbxRadarCompare.length >= 2;
              return `<label class="radar-player-row${checked?' selected':''}${disabled?' disabled':''}">
                <span>${p}</span>
                <input type="checkbox" data-name="${p}"${checked?' checked':''}${disabled?' disabled':''}>
              </label>`;
            }).join("")}
          </div>
        </details>
      </div>
      <div class="dbx-card dbx2-viz-card">
        <div class="dbx2-viz-title">Résultats</div><div class="dbx2-viz-note">Quand ${player} joue</div>
        ${wnlDonut}
        <div class="dbx2-viz-legend">
          <span class="dbx2-viz-legend-item"><span class="dbx2-viz-legend-dot" style="background:var(--good)"></span>V ${d.w}</span>
          <span class="dbx2-viz-legend-item"><span class="dbx2-viz-legend-dot" style="background:var(--neutral)"></span>N ${d.n}</span>
          <span class="dbx2-viz-legend-item"><span class="dbx2-viz-legend-dot" style="background:var(--bad)"></span>D ${d.l}</span>
        </div>
      </div>
    </div>`;

    h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Tendance</span><span class="dbx-sec-note">Évolution des buts et passes, session par session</span></div>`;
    h += dbxTrendMode === "match"
      ? _dbx2RenderTrendCard(`Buts et passes de ${player}, par match`, d.goalsByMatch, d.assistsByMatch, d.matchLabels, "var(--gold)", "var(--bleu)", true)
      : _dbx2RenderTrendCard(`Buts et passes de ${player}`, d.goalsBySession.map(x=>x.goals), d.assistsBySession.map(x=>x.assists), d.goalsBySession.map(x=>_dbxFmtDateShort(x.date)), "var(--gold)", "var(--bleu)", true);

    h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Moments forts</span></div>`;
    h += `<div class="dbx2-fun-grid">
      <div class="dbx-card dbx2-fun-card"><div class="dbx2-fun-ico">🌟</div><div class="dbx2-fun-lbl">Meilleur match</div><div class="dbx2-fun-val">${d.bestMatch ? `${d.bestMatch.score} vs ${TEAM_LABEL[d.bestMatch.opp]||d.bestMatch.opp}` : "—"}</div><div class="dbx2-fun-sub">${d.bestMatch ? `${d.bestMatch.g} but${d.bestMatch.g>1?"s":""}, ${d.bestMatch.a} passe${d.bestMatch.a>1?"s":""} &middot; ${fmtDate(d.bestMatch.date)}` : ""}</div></div>
      <div class="dbx-card dbx2-fun-card"><div class="dbx2-fun-ico">🤝</div><div class="dbx2-fun-lbl">Meilleur duo</div><div class="dbx2-fun-val">${d.bestDuo ? d.bestDuo.name : "—"}</div><div class="dbx2-fun-sub">${d.bestDuo ? `${d.bestDuo.n} connexion${d.bestDuo.n>1?"s":""} ensemble` : ""}</div></div>
      <div class="dbx-card dbx2-fun-card"><div class="dbx2-fun-ico">🍀</div><div class="dbx2-fun-lbl">Équipe fétiche</div><div class="dbx2-fun-val">${d.bestColor ? TEAM_LABEL[d.bestColor[0]] : "—"}</div><div class="dbx2-fun-sub">${d.bestColor ? `${Math.round(d.bestColor[1]*100)}% de victoires` : ""}</div></div>
      <div class="dbx-card dbx2-fun-card"><div class="dbx2-fun-ico">🏆</div><div class="dbx2-fun-lbl">Trophées MVP</div><div class="dbx2-fun-val">${d.mvp}</div><div class="dbx2-fun-sub">sur la période</div></div>
    </div>`;
  }

  h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Face à face</span><span class="dbx-sec-note">Repris de Récompenses</span></div>`;
  h += `<div class="dbx-card dbx2-h2h-card">
    <div class="riv-selects" style="justify-content:center">
      <select id="dbx2-h2h-a"></select>
      <select id="dbx2-h2h-b"></select>
      <select id="dbx2-h2h-period">
        <option value="all">All time</option>
        <option value="year">Cette saison</option>
        <option value="month">Ce mois</option>
      </select>
    </div>
    <div id="dbx2-h2h-body"></div>
  </div>`;

  return h;
}

/* ══════════════════════════════════════════════════════════
   DASHBOARD XXL — sélecteurs de portée / contexte / face à face
══════════════════════════════════════════════════════════ */
function _dbxRosterForPicker() {
  const roster  = ALL_PLAYERS.filter(p => !JOKERS.has(p) && !ABSENTS.has(p) && !INACTIFS.has(p)).sort((a,b) => a.localeCompare(b,'fr'));
  const jokers  = ALL_PLAYERS.filter(p => JOKERS.has(p) && !INACTIFS.has(p)).sort((a,b) => a.localeCompare(b,'fr'));
  const absents = ALL_PLAYERS.filter(p => ABSENTS.has(p) && !INACTIFS.has(p)).sort((a,b) => a.localeCompare(b,'fr'));
  return { roster, jokers, absents, all: [...roster, ...jokers, ...absents] };
}

/* Trie toujours par statut (reguliers / occasionnels / absents) via <optgroup> — plus de
   suffixe "[+1]" sur les occasionnels, le groupe suffit a les distinguer. */
function _dbxPlayerOptsHtml(selected) {
  const { roster, jokers, absents } = _dbxRosterForPicker();
  const grp = (label, list) => list.length
    ? `<optgroup label="${label}">${list.map(p => `<option value="${p}"${p===selected?' selected':''}>${p}</option>`).join("")}</optgroup>`
    : '';
  return grp("Réguliers", roster) + grp("Occasionnels", jokers) + grp("Absents", absents);
}

function _dbxRenderContext() {
  const el = document.getElementById("dbx2-context-row");
  if (!el) return;
  if (dbxScope === "team") {
    el.innerHTML = ["Rouge","Vert","Bleue"].map(t =>
      `<button type="button" class="dbx2-team-pill ${teamCls(t)}${t===dbxTeam?' active':''}" data-team="${t}"><span class="dbx2-pill-dot" style="background:var(--${teamCls(t)})"></span>${TEAM_LABEL[t]}</button>`
    ).join("");
    el.querySelectorAll(".dbx2-team-pill").forEach(btn => btn.addEventListener("click", () => {
      dbxTeam = btn.dataset.team;
      _dbxRenderContext();
      _dbxSyncHash();
      renderDashboard();
    }));
  } else if (dbxScope === "player") {
    const { all } = _dbxRosterForPicker();
    if (!dbxPlayer || !all.includes(dbxPlayer)) dbxPlayer = all[0] || null;
    if (!all.length) { el.innerHTML = ""; return; }
    el.innerHTML = `<select class="dbx2-player-select-main" id="dbx2-player-select">${_dbxPlayerOptsHtml(dbxPlayer)}</select>`;
    document.getElementById("dbx2-player-select").addEventListener("change", e => {
      dbxPlayer = e.target.value;
      dbxRadarCompare = [];
      _dbxSyncHash();
      renderDashboard();
    });
  } else {
    el.innerHTML = "";
  }
}

/* Persiste scope/equipe-ou-joueur/periode dans le hash pour survivre a un refresh
   (#dashboard/<scope>/<team-ou-player-ou-->/<periode>[/<from>,<to> si personnalise]). */
function _dbxSyncHash() {
  let h = "dashboard/" + dbxScope;
  h += "/" + (dbxScope === "team" && dbxTeam ? dbxTeam : dbxScope === "player" && dbxPlayer ? encodeURIComponent(dbxPlayer) : "-");
  h += "/" + currentPeriod;
  if (currentPeriod === "custom" && dbxCustomFrom && dbxCustomTo) h += "/" + dbxCustomFrom + "," + dbxCustomTo;
  history.replaceState(null, '', '#' + h);
}

/* Face à face joueur (reprend Rivalités de l'onglet Récompenses telle quelle :
   computeRivalites / renderRivBody, seule l'UI de sélection est réintégrée ici) */
function _dbxWireH2H(defaultPlayer) {
  const selA = document.getElementById("dbx2-h2h-a");
  const selB = document.getElementById("dbx2-h2h-b");
  const selP = document.getElementById("dbx2-h2h-period");
  if (!selA || !selB || !selP) return;
  const { all } = _dbxRosterForPicker();
  if (!all.length) return;
  selA.innerHTML = _dbxPlayerOptsHtml(null);
  selB.innerHTML = _dbxPlayerOptsHtml(null);
  selA.value = all.includes(defaultPlayer) ? defaultPlayer : all[0];
  const altB = all.find(p => p !== selA.value);
  selB.value = altB || all[0];
  const renderBody = () => {
    let a = selA.value, b = selB.value;
    if (a === b) { const alt = all.find(p => p !== a); if (alt) { b = alt; selB.value = b; } }
    document.getElementById("dbx2-h2h-body").innerHTML = renderRivBody(a, b, selP.value);
  };
  selA.addEventListener("change", renderBody);
  selB.addEventListener("change", renderBody);
  selP.addEventListener("change", renderBody);
  renderBody();
}

function _dbxWireRadarCompare() {
  const list = document.getElementById("dbx2-radar-cmp-list");
  if (!list) return;
  list.addEventListener("change", e => {
    const name = e.target.getAttribute("data-name");
    if (!name) return;
    const idx = dbxRadarCompare.indexOf(name);
    if (e.target.checked && idx === -1 && dbxRadarCompare.length < 2) dbxRadarCompare.push(name);
    else if (!e.target.checked && idx !== -1) dbxRadarCompare.splice(idx, 1);
    renderDashboard();
  });
}

function _dbxPlaceHi(hi, btn) {
  if (!hi || !btn) return;
  hi.style.left = btn.offsetLeft + "px";
  hi.style.width = btn.offsetWidth + "px";
}

(function _dbxInitScopeSeg() {
  const seg = document.getElementById("dbx2-scope-seg");
  if (!seg) return;
  const hi = document.getElementById("dbx2-scope-hi");
  seg.querySelectorAll(".dbx-seg-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      seg.querySelectorAll(".dbx-seg-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      _dbxPlaceHi(hi, btn);
      dbxScope = btn.dataset.scope;
      _dbxRenderContext();
      _dbxSyncHash();
      renderDashboard();
    });
  });
  requestAnimationFrame(() => _dbxPlaceHi(hi, seg.querySelector(".dbx-seg-btn.active")));
  window.addEventListener("resize", () => _dbxPlaceHi(hi, seg.querySelector(".dbx-seg-btn.active")));
})();

(function _dbxInitPeriodSelect() {
  const sel = document.getElementById("dbx2-period-select");
  if (!sel) return;
  sel.value = currentPeriod;
  sel.addEventListener("change", e => {
    currentPeriod = e.target.value;
    _dbxSyncHash();
    updateSubFilter(currentPeriod);
    renderDashboard();
  });
  const cmp = document.getElementById("dbx2-compare-check");
  if (cmp) {
    cmp.checked = dbxCompare;
    cmp.addEventListener("change", e => {
      dbxCompare = e.target.checked;
      renderDashboard();
    });
  }
})();

(function _dbxInitTrendModeToggle() {
  const panel = document.getElementById("panel-dashboard");
  if (!panel) return;
  panel.addEventListener("click", e => {
    const btn = e.target.closest('[data-act="dbx-trend-mode"]');
    if (!btn) return;
    dbxTrendMode = btn.dataset.mode;
    renderDashboard();
  });
})();

(function _ttInitGkToggle() {
  const sessBox = document.getElementById("session-results");
  if (sessBox) sessBox.addEventListener("change", e => {
    const sel = e.target.closest('[data-act="tt-gk-criteria"][data-target="sess"]');
    if (!sel) return;
    ttGkCriteria = sel.value;
    const dateSel = document.getElementById("session-date");
    if (dateSel && dateSel.value) renderSessionResults(dateSel.value);
  });
  const dashBox = document.getElementById("panel-dashboard");
  if (dashBox) dashBox.addEventListener("change", e => {
    const sel = e.target.closest('[data-act="tt-gk-criteria"][data-target="dbx"]');
    if (!sel) return;
    ttGkCriteria = sel.value;
    renderDashboard();
  });
})();

/* ══════════════════════════════════════════════════════════
   DASHBOARD XXL — dispatcher principal (Globales / Équipes / Joueurs)
══════════════════════════════════════════════════════════ */
function renderDashboard() {
  const dash = document.getElementById("dash");

  const latestDate = SESSIONS.length
    ? fmtDate([...SESSIONS].sort((a,b)=>new Date(b.date)-new Date(a.date))[0].date)
    : "—";
  document.getElementById("header-sub").textContent = `Dernière session : ${latestDate}`;

  _dbxRenderContext();

  const sessions = filterSessions(currentPeriod);
  if (!sessions.length) {
    dash.innerHTML = '<p class="no-data" style="margin-top:2rem">Aucune session pour cette période.</p>';
    return;
  }
  const prevSessions = dbxCompare ? _dbxPreviousPeriodSessions(currentPeriod) : null;

  let h = "";
  if (dbxScope === "team") {
    h = _dbxRenderTeamScope(sessions, dbxTeam, prevSessions);
  } else if (dbxScope === "player") {
    if (!dbxPlayer) {
      dash.innerHTML = '<p class="no-data" style="margin-top:2rem">Aucun joueur disponible.</p>';
      return;
    }
    h = _dbxRenderPlayerScope(sessions, dbxPlayer, prevSessions);
  } else {
    const agg = _dbxComputeAgg(sessions);
    const prevAgg = prevSessions ? _dbxComputeAgg(prevSessions) : null;
    h += `<div class="dbx-hero-tt-row">${_dbxRenderHero(agg, prevAgg)}${_dbxRenderEquipeType(sessions)}</div>`;
    h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Comparatif équipes</span><span class="dbx-sec-note">Victoires, forme et différentiel</span></div>`;
    h += _dbxRenderCompare(agg);
    h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Tendance</span></div>`;
    h += _dbxGlobalTrendChart(agg);
    h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Matchs marquants</span></div>`;
    h += _dbxHighlightCards(agg);
    h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Classements</span><span class="dbx-sec-note">Sur la période sélectionnée</span></div>`;
    h += `<div class="dbx-lead-grid">
      ${_dbxLeaderCol("Buteurs","⚽",agg.topScorers,"buts")}
      ${_dbxLeaderCol("Passeurs","🎯",agg.topAssists,"passes")}
      ${_dbxLeaderCol("Clean sheets","🧤",agg.topCleanSheets,"cleanSheets")}
    </div>`;
    h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Assiduité</span></div>`;
    h += _dbxRenderAssiduity(agg);
  }

  dash.innerHTML = h;
  animateView(dash);
  if (dbxScope === "player") { _dbxWireH2H(dbxPlayer); _dbxWireRadarCompare(); }
}

/* ══════════════════════════════════════════════════════════
   RÉSULTATS DE SESSION
══════════════════════════════════════════════════════════ */

function populateSessionSelect() {
  const sel = document.getElementById("session-date");
  const ddLabel = document.getElementById("sess-dd-label");
  const ddPanel = document.getElementById("sess-dd-panel");
  sel.innerHTML = "";
  if (!SESSIONS.length) {
    sel.innerHTML = `<option value="">Aucune session disponible</option>`;
    if (ddLabel) ddLabel.textContent = "Aucune session";
    if (ddPanel) ddPanel.innerHTML = "";
    return;
  }
  const sorted = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
  sorted.forEach((s, i) => {
    const opt = document.createElement("option");
    opt.value = s.date;
    opt.textContent = fmtDate(s.date);
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  });
  if (ddPanel) {
    ddPanel.innerHTML = sorted.map((s, i) =>
      `<button type="button" class="sess-dd-opt${i===0?" active":""}" data-date="${s.date}">${fmtDate(s.date)}</button>`
    ).join("");
  }
  _syncSessDd(sorted[0].date);
}

function _syncSessDd(date) {
  const ddLabel = document.getElementById("sess-dd-label");
  const btn = document.querySelector(`.sess-dd-opt[data-date="${date}"]`);
  if (ddLabel) ddLabel.textContent = btn ? btn.textContent : fmtDate(date);
  document.querySelectorAll(".sess-dd-opt").forEach(o => o.classList.toggle("active", o === btn));
}

document.getElementById("sess-dd-btn").addEventListener("click", () => {
  document.getElementById("sess-dd").classList.toggle("open");
});
document.getElementById("sess-dd-panel").addEventListener("click", e => {
  const btn = e.target.closest(".sess-dd-opt");
  if (!btn) return;
  const sel = document.getElementById("session-date");
  sel.value = btn.dataset.date;
  _syncSessDd(btn.dataset.date);
  document.getElementById("sess-dd").classList.remove("open");
  sel.dispatchEvent(new Event("change"));
});
document.addEventListener("click", e => {
  const dd = document.getElementById("sess-dd");
  if (dd.classList.contains("open") && !dd.contains(e.target)) dd.classList.remove("open");
});


function renderSessionResults(date) {
  const container = document.getElementById("session-results");
  const session = SESSIONS.find(s => s.date === date);
  if (!session) {
    container.innerHTML = `<p class="no-data" style="margin-top:1rem">Aucune donnée pour cette session.</p>`;
    return;
  }
  container.innerHTML = renderSessionDetailV2(session);
  animateView(container);
  _sfmBindTicker(container);
}

/* ══════════════════════════════════════════════════════════
   NAVIGATION
══════════════════════════════════════════════════════════ */

document.querySelectorAll(".main-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".main-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById(`panel-${tab.dataset.tab}`).classList.add("active");
    if (tab.dataset.tab === "joueurs") {
      history.replaceState(null, '', '#joueurs');
      renderJoueurs();
    } else if (tab.dataset.tab === "dashboard") {
      _dbxSyncHash();
      renderDashboard();
    } else if (tab.dataset.tab === "session") {
      history.replaceState(null, '', '#sessions');
      const date = document.getElementById("session-date").value;
      if (date) renderSessionResults(date);
    } else if (tab.dataset.tab === "stats") {
      history.replaceState(null, '', '#stats');
      renderStats();
    }
  });

let rosterSort = { col: "taux", dir: 1 };
let jokerSort  = { col: "taux", dir: 1 };

function computePlayerStats() {
  const ps = {};
  ALL_PLAYERS.forEach(p => {
    ps[p] = { presences:0, absences:0, blesses:0, pasRepondu:0, buts:0, passes:0, vR:0, vV:0, vB:0, sac:0, maillots:0 };
  });

  SESSIONS.forEach(s => {
    Object.entries(s.presences).forEach(([p, info]) => {
      if (!ps[p]) ps[p] = { presences:0, absences:0, blesses:0, pasRepondu:0, buts:0, passes:0, vR:0, vV:0, vB:0, sac:0, maillots:0 };
      if      (info.statut === "Présent")     ps[p].presences++;
      else if (info.statut === "Absent")      ps[p].absences++;
      else if (info.statut === "Blessé")      ps[p].blesses++;
      else if (info.statut === "Pas répondu") ps[p].pasRepondu++;
    });
    if (s.sac     && ps[s.sac])     ps[s.sac].sac++;
    if (s.maillots && ps[s.maillots]) ps[s.maillots].maillots++;
    if (s.matchs) {
      s.matchs.forEach(m => {
        ["A","B"].forEach(side => {
          const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
          buts.forEach((b,i) => {
            if (!b || b==="CSC") return;
            if (ps[b]) ps[b].buts++;
            const p = passes[i]; if (p && p!=="CSC" && ps[p]) ps[p].passes++;
          });
        });
        const winner = m.scoreA > m.scoreB ? m.eqA : m.scoreB > m.scoreA ? m.eqB : null;
        if (winner) {
          Object.entries(s.presences).forEach(([p, info]) => {
            if (info.statut === "Présent" && info.equipe === winner && ps[p]) {
              if (winner==="Rouge") ps[p].vR++; else if (winner==="Vert") ps[p].vV++; else ps[p].vB++;
            }
          });
        }
      });
    }
  });

  return Object.entries(ps).map(([name, d]) => {
    const best = Math.max(d.vR, d.vV, d.vB);
    const favTeam = best === 0 ? null : d.vR === best ? "Rouge" : d.vV === best ? "Vert" : "Bleue";
    return { name, ...d, favTeam };
  });
}


function renderJoueurs() {
  const container = document.getElementById("joueurs-content");
  const rows = computePlayerStats();
  const totalSessions = SESSIONS.length;
  const isAdmin = sessionStorage.getItem("hmft_role") === "admin";

  const colDef = [
    { key:"name",       label:"Joueur"         },
    { key:"taux",       label:"%"              },
    { key:"absences",   label:"❌"             },
    { key:"blesses",    label:"🤕"             },
    { key:"pasRepondu", label:"⁉️"             },
    { key:"sac",        label:"🎒"             },
    { key:"maillots",   label:"👕"             },
  ];
  const rowsWithTaux = rows.map(r => ({
    ...r,
    taux: totalSessions > 0 ? Math.round(r.presences / totalSessions * 100) : 0
  }));

  const rosterRows = rowsWithTaux.filter(r => !JOKERS.has(r.name) && !ABSENTS.has(r.name) && !INACTIFS.has(r.name));
  const jokerRows  = rowsWithTaux.filter(r =>  JOKERS.has(r.name) && !INACTIFS.has(r.name));

  const _initialsMap = computeAllInitials([...new Set([...ALL_PLAYERS, ...rowsWithTaux.map(r => r.name), ...ABSENTS, ...INACTIFS])]);

  function sortArr(arr, s) {
    return [...arr].sort((a, b) => {
      const av = a[s.col] ?? ""; const bv = b[s.col] ?? "";
      if (typeof av === "number" && typeof bv === "number") {
        const diff = (bv - av) * s.dir;
        return diff !== 0 ? diff : a.name.localeCompare(b.name, "fr");
      }
      const diff = String(av).localeCompare(String(bv), "fr") * s.dir;
      return diff !== 0 ? diff : a.name.localeCompare(b.name, "fr");
    });
  }

  function initials(n) { return _initialsMap[n] || n.slice(0,2).toUpperCase(); }

  function buildSortRow(id, cols, state) {
    return `<div class="roster-sort-row" id="${id}">${cols.map(c => {
      const active = state.col === c.key;
      const arrow  = active ? (state.dir === 1 ? "↑" : "↓") : "↕";
      return `<button class="roster-sort-pill${active ? " active" : ""}" data-col="${c.key}">${c.label}<span class="arrow">${arrow}</span></button>`;
    }).join("")}</div>`;
  }

  function bindSortRow(id, state) {
    document.getElementById(id)?.querySelectorAll("[data-col]").forEach(btn => {
      btn.addEventListener("click", () => {
        const col = btn.dataset.col;
        if (state.col === col) state.dir *= -1;
        else { state.col = col; state.dir = col === "name" ? 1 : -1; }
        renderJoueurs();
      });
    });
  }

  function chip(icon, val, cls) {
    if (!val) return "";
    return `<span class="roster-chip ${cls || ""}"><span class="roster-chip-ico">${icon}</span> ${val}</span>`;
  }

  /* Rangee de boutons de statut, identique sur toutes les cartes (meme principe que les
     boutons Present/Blesse/Non convoque de la Saisie) — on clique directement le statut
     cible au lieu de suivre des fleches contextuelles, plus simple pour reassigner. */
  const _EFF_STATUSES = [
    { status: "roster",  action: "to-roster",  icon: "👤", title: "Régulier" },
    { status: "joker",   action: "to-joker",   icon: "🔄", title: "Occasionnel" },
    { status: "absent",  action: "to-absent",  icon: "💤", title: "Absent pour la saison" },
    { status: "inactif", action: "to-inactif", icon: "🚫", title: "Inactif" },
  ];
  function _effActionsHtml(name, current) {
    if (!isAdmin) return "";
    const btns = _EFF_STATUSES.map(o =>
      `<button data-action="${o.action}" data-player="${name}" title="${o.title}"${o.status===current?' class="current"':''}>${o.icon}</button>`
    ).join("");
    return `<div class="roster-actions">${btns}</div>`;
  }

  function buildRosterCard(r) {
    const tCls = r.taux >= 75 ? "high" : r.taux >= 40 ? "mid" : "low";
    const chips = chip("❌", r.absences, "danger") + chip("🤕", r.blesses, "warn") + chip("⁉️", r.pasRepondu, "warn") + chip("🎒", r.sac) + chip("👕", r.maillots);
    return `<div class="roster-card">
      <div class="roster-avatar">${initials(r.name)}</div>
      <div class="roster-main">
        <button class="roster-name player-link" data-player="${r.name}">${r.name}</button>
        <div class="roster-taux">
          <div class="roster-taux-track"><div class="roster-taux-fill ${tCls}" style="width:${r.taux}%"></div></div>
          <span class="roster-taux-val ${tCls}">${r.taux}%</span>
        </div>
      </div>
      <div class="roster-chips">${chips}</div>
      ${_effActionsHtml(r.name, "roster")}
    </div>`;
  }

  function buildJokerCard(r) {
    const tCls = r.taux >= 75 ? "high" : r.taux >= 40 ? "mid" : "low";
    const chips = chip("❌", r.absences, "danger") + chip("🤕", r.blesses, "warn") + chip("⁉️", r.pasRepondu, "warn") + chip("🎒", r.sac) + chip("👕", r.maillots);
    return `<div class="roster-card">
      <div class="roster-avatar dim">${initials(r.name)}</div>
      <div class="roster-main">
        <button class="roster-name player-link" data-player="${r.name}">${r.name}</button>
        <div class="roster-taux">
          <div class="roster-taux-track"><div class="roster-taux-fill ${tCls}" style="width:${r.taux}%"></div></div>
          <span class="roster-taux-val ${tCls}">${r.taux}%</span>
        </div>
      </div>
      <div class="roster-chips">${chips}</div>
      ${_effActionsHtml(r.name, "joker")}
    </div>`;
  }

  function buildAbsentCard(name) {
    return `<div class="roster-card">
      <div class="roster-avatar dim">${initials(name)}</div>
      <div class="roster-main">
        <button class="roster-name player-link" data-player="${name}">${name}</button>
        <div class="roster-sub">Absent pour la saison</div>
      </div>
      ${_effActionsHtml(name, "absent")}
    </div>`;
  }

  function buildInactifCard(name) {
    return `<div class="roster-card">
      <div class="roster-avatar dim">${initials(name)}</div>
      <div class="roster-main">
        <button class="roster-name player-link" data-player="${name}">${name}</button>
        <div class="roster-sub">Inactif</div>
      </div>
      ${_effActionsHtml(name, "inactif")}
    </div>`;
  }

  const rosterCards = sortArr(rosterRows, rosterSort).map(buildRosterCard).join("");
  const jokerCards  = sortArr(jokerRows, jokerSort).map(buildJokerCard).join("");
  const absentNames = [...ABSENTS].filter(n => !INACTIFS.has(n)).sort((a,b) => a.localeCompare(b,'fr'));
  const absentCards = absentNames.map(buildAbsentCard).join("");
  const inactifNames = [...INACTIFS].sort((a,b) => a.localeCompare(b,'fr'));
  const inactifCards = inactifNames.map(buildInactifCard).join("");

  const jokerSection = jokerRows.length > 0 ? `
    <div class="joueurs-section-label" style="margin-top:2rem">Occasionnels (${jokerRows.length})</div>
    ${buildSortRow("jokers-sort", colDef, jokerSort)}
    <div class="roster-list">${jokerCards}</div>` : '';

  const absentSection = absentNames.length > 0 ? `
    <div class="joueurs-section-label" style="margin-top:2rem">Absents pour la saison (${absentNames.length})</div>
    <div class="roster-list">${absentCards}</div>` : '';

  // Inactifs : reserve aux admins, invisible du reste des utilisateurs.
  const inactifSection = (isAdmin && inactifNames.length > 0) ? `
    <div class="joueurs-section-label" style="margin-top:2rem">Inactifs (${inactifNames.length})</div>
    <div class="roster-list">${inactifCards}</div>` : '';

  container.innerHTML = `
    <div class="joueurs-section-label">Réguliers (${rosterRows.length})</div>
    ${buildSortRow("roster-sort", colDef, rosterSort)}
    <div class="roster-list">${rosterCards}</div>
    ${jokerSection}${absentSection}${inactifSection}`;

  bindSortRow("roster-sort", rosterSort);
  bindSortRow("jokers-sort", jokerSort);
}

document.getElementById("joueurs-content").addEventListener("click", e => {
  const btn = e.target.closest('[data-action]');
  if (!btn || !['to-roster','to-joker','to-absent','to-inactif'].includes(btn.dataset.action)) return;
  e.stopPropagation();
  const player = btn.dataset.player;
  const action = btn.dataset.action;
  if (action === 'to-roster')  { JOKERS.delete(player); ABSENTS.delete(player); INACTIFS.delete(player); _saveJokers(); _saveAbsents(); _saveInactifs(); }
  if (action === 'to-joker')   { ABSENTS.delete(player); INACTIFS.delete(player); JOKERS.add(player);    _saveAbsents(); _saveInactifs(); _saveJokers(); }
  if (action === 'to-absent')  { JOKERS.delete(player); INACTIFS.delete(player); ABSENTS.add(player);    _saveJokers(); _saveInactifs(); _saveAbsents(); }
  if (action === 'to-inactif') { JOKERS.delete(player); ABSENTS.delete(player); INACTIFS.add(player);    _saveJokers(); _saveAbsents(); _saveInactifs(); }
  renderJoueurs();
});
