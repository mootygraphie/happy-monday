function computeAchievementStats(playerName) {
  const _ss = [...SESSIONS].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let buts=0,passes=0,presences=0,absences=0,injuries=0,sessionsBlesses=0,sac=0,maillots=0;
  let hattricks=0,doubleDouble=0,cleanSheets=0,mvp=0,soireeParfaite=0,invincible=0,csc=0,zeroVict=0,toutNul=0;
  let gardiensCleanSheets=0,gardiensButsEncaisses=0,gardiensMatchs=0,remontadas=0,gardienAssist=0,mercenaireCount=0;
  const chelemColors=new Set(), duoMap={};
  let inEp=false, bestStreak=0, curStreak=0, fantomeStreak=0, sessionsAvecGA=0;
  const yearMap={};

  _ss.forEach(s => {
    const info=s.presences[playerName]; if(!info){inEp=false;return;}
    const yr=new Date(s.date).getFullYear();
    if(!yearMap[yr]) yearMap[yr]={present:0,total:0};
    if(info.statut==="Présent"||info.statut==="Absent") yearMap[yr].total++;

    if(info.statut==="Présent") {
      presences++; yearMap[yr].present++; inEp=false;
      if(s.sac===playerName) sac++;
      if(s.maillots===playerName) maillots++;
      const myEq=info.equipe;

      let sessGA=0,sessPlayed=0,sessWithGA=0,sessInvic=true,sessWins=0;
      const allGA={};

      (s.matchs||[]).forEach(m => {
        const inMatch=myEq&&(m.eqA===myEq||m.eqB===myEq);
        let g=0,a=0;
        ["A","B"].forEach(side=>{
          (m[`buteurs${side}`]||[]).forEach((b,i)=>{
            const p=(m[`passeurs${side}`]||[])[i];
            if(b==="CSC"){if(p===playerName)csc++;return;}
            if(!b)return;
            if(!allGA[b])allGA[b]=0; allGA[b]++;
            if(p&&p!=="CSC"){if(!allGA[p])allGA[p]=0; allGA[p]++;}
            if(b===playerName){
              g++;
              const sideEq = side==="A" ? m.eqA : m.eqB;
              if(myEq && sideEq && sideEq!==myEq) mercenaireCount++;
            }
            if(p&&p!=="CSC"&&p===playerName)a++;
            if(p&&p!=="CSC"){
              if(b===playerName)duoMap[p]=(duoMap[p]||0)+1;
              else if(p===playerName)duoMap[b]=(duoMap[b]||0)+1;
            }
          });
        });
        buts+=g; passes+=a; sessGA+=g+a;
        // Gardien assist : indépendant des données mi-temps
        if(a>0){const _gAr=m.gardiensA||[],_gBr=m.gardiensB||[];if(_gAr.includes(playerName)||_gBr.includes(playerName))gardienAssist+=a;}
        // Gardien stats clean sheets / buts encaissés : nécessite les données mi-temps
        if(m.mt1A!==undefined && m.mt1B!==undefined){
          const gA=m.gardiensA||[], gB=m.gardiensB||[];
          const mt1Ac=m.mt1B||0, mt2Ac=Math.max(0,(m.scoreB||0)-(m.mt1B||0));
          const mt1Bc=m.mt1A||0, mt2Bc=Math.max(0,(m.scoreA||0)-(m.mt1A||0));
          let _wasOwnGK=false,_gkConc=0;
          if(gA[0]===playerName){_wasOwnGK=true;gardiensButsEncaisses+=mt1Ac;_gkConc+=mt1Ac;}
          if(gA[1]===playerName){_wasOwnGK=true;gardiensButsEncaisses+=mt2Ac;_gkConc+=mt2Ac;}
          if(gB[0]===playerName){_wasOwnGK=true;gardiensButsEncaisses+=mt1Bc;_gkConc+=mt1Bc;}
          if(gB[1]===playerName){_wasOwnGK=true;gardiensButsEncaisses+=mt2Bc;_gkConc+=mt2Bc;}
          if(_wasOwnGK){gardiensMatchs++;if(_gkConc===0)gardiensCleanSheets++;}
        }
        if(inMatch){
          sessPlayed++;
          if(g+a>0){sessWithGA++;curStreak++;if(curStreak>bestStreak)bestStreak=curStreak;}
          else curStreak=0;
          const conceded=m.eqA===myEq?m.scoreB:m.scoreA; if(conceded===0)cleanSheets++;
          // Remontadas : équipe du joueur menait pas à la mi-temps mais gagne
          if(m.mt1A!==undefined && m.mt1B!==undefined){
            const isA=m.eqA===myEq;
            const mt1gf=isA?m.mt1A:m.mt1B, mt1ga=isA?m.mt1B:m.mt1A;
            const fgf=isA?m.scoreA:m.scoreB, fga=isA?m.scoreB:m.scoreA;
            if((mt1ga-mt1gf)>=2&&fgf>fga)remontadas++;
          }
          const w=m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;
          if(w&&w!==myEq)sessInvic=false;
          if(w&&w===myEq)sessWins++;
          if(g>=3)hattricks++;
          if(g>=1&&a>=1)doubleDouble++;
        }
      });

      if(sessPlayed>0&&sessWins===sessPlayed)soireeParfaite++;
      if(myEq&&sessInvic)invincible++;
      if(sessPlayed>0&&sessWins===0)zeroVict++;
      const teamMatchs=(s.matchs||[]).filter(m=>myEq&&(m.eqA===myEq||m.eqB===myEq));
      const allDraw=teamMatchs.length>0&&teamMatchs.every(m=>m.scoreA===m.scoreB);
      if(allDraw)toutNul++;
      if(myEq&&sessPlayed>0){
        const _tw={};
        (s.matchs||[]).forEach(m=>{const w=m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;if(w)_tw[w]=(_tw[w]||0)+1;});
        const _mx=Math.max(0,...Object.values(_tw));
        if(_mx>0&&(_tw[myEq]||0)===_mx)chelemColors.add(myEq);
      }
      const pGA=allGA[playerName]||0;
      if(pGA>0&&!Object.values(allGA).some(v=>v>pGA))mvp++;
      if(sessGA===0) fantomeStreak++;
      if(sessGA>0) sessionsAvecGA++;

    } else if(info.statut==="Absent"){
      absences++; inEp=false;
    } else if(info.statut==="Blessé"){
      sessionsBlesses++;
      if(!inEp){injuries++;inEp=true;}
    } else { inEp=false; }
  });

  const bestDuo=Math.max(0,...Object.values(duoMap));
  const grandChelem=(chelemColors.has("Rouge")&&chelemColors.has("Vert")&&chelemColors.has("Bleue"))?1:0;
  const assiduAnnes=(()=>{
    const ys=Object.values(yearMap).filter(y=>y.total>=10);
    if(ys.some(y=>y.present/y.total>=0.9))return 4;
    if(ys.some(y=>y.present/y.total>=0.8))return 3;
    if(ys.some(y=>y.present/y.total>=0.7))return 2;
    if(ys.some(y=>y.present/y.total>=0.6))return 1;
    return 0;
  })();
  const cometeAnnes=(()=>{
    const ys=Object.values(yearMap).filter(y=>y.total>=10);
    if(ys.some(y=>y.present/y.total<=0.10))return 4;
    if(ys.some(y=>y.present/y.total<=0.20))return 3;
    if(ys.some(y=>y.present/y.total<=0.30))return 2;
    if(ys.some(y=>y.present/y.total<=0.40))return 1;
    return 0;
  })();

  // Note gardien : taux de clean sheets, à partir de 3 matchs gardés (sinon pas assez de données)
  const gardienRate = gardiensMatchs>=3 ? Math.round(gardiensCleanSheets/gardiensMatchs*100) : 0;

  return { buts, passes, gaTotal:buts+passes, presences, absences, injuries, sessionsBlesses,
           sac, maillots, hattricks, bestStreak, soireeParfaite, doubleDouble,
           invincible, cleanSheets, bestDuo, mvp, csc, grandChelem,
           fantomeStreak, assiduAnnes, cometeAnnes, zeroVict, toutNul, sessionsAvecGA,
           gardiensCleanSheets, gardiensButsEncaisses, gardiensMatchs, gardienRate, remontadas, gardienAssist, mercenaireCount };
}

function renderAchievementsGrid(achSt) {
  let legendeCount=0;
  ACH_DEFS.filter(a=>a.id!=='legende').forEach(a=>{ legendeCount+=_achLevel(achSt[a.key]||0,a.tiers); });
  achSt.legendeCount=legendeCount;

  let unlockedCount=0;
  let html=`<div class="ach-grid">`;
  ACH_DEFS.forEach(ach=>{
    const val=achSt[ach.key]||0;
    const rawLv=_achLevel(val,ach.tiers);
    if(rawLv===0)return;
    const lv=ach.fixedTier?ach.fixedTier:Math.min(6,rawLv+(ach.tierOffset||0));
    const maxT=ach.tiers.length;

    const iconHtml=`<span class="ach-icon">${ach.icon}</span>`;
    const nameHtml=`<span class="ach-label">${ach.name}</span>`;

    const dots=(maxT>1)?`<div class="ach-dots">${Array.from({length:maxT},(_,i)=>`<div class="ach-dot${i<rawLv?' on':''}"></div>`).join('')}</div>`:'';
    const countHtml=(ach.fixedTier&&ach.tiers.length===1&&ach.id!=='chelem'&&val>0)
      ?`<span style="font-size:12px;font-weight:800;opacity:.8;line-height:1;letter-spacing:-.01em">${val}</span>`:'';

    const tn=(ach.tierNames?ach.tierNames[rawLv-1]:null)||ACH_TIER_NAMES[lv]||`Niveau ${lv}`;
    const tip=`${ach.name} — ${tn}\n${ach.desc(val)}${!ach.fixedTier&&rawLv<maxT?`\nProchain seuil : ${ach.tiers[rawLv]}`:''}`;

    const _achCls=ach.id==='comete'?' ach-comete':ach.id==='bonnet'?' ach-bonnet':ach.id==='passoire'?' ach-passoire':ach.id==='chelem'?' ach-chelem':ach.id==='soiree'?' ach-soiree':ach.id==='remontada'?' ach-remontada':ach.id==='gardienAssist'?' ach-neuer':ach.id==='zerovic'?' ach-zerovic':'';
    html+=`<div class="ach-cell t${lv}${_achCls}" data-tip="${tip.replace(/"/g,'&quot;')}">${iconHtml}${nameHtml}${dots}${countHtml}</div>`;
    unlockedCount++;
  });
  html+=`</div>`;
  if (!unlockedCount) return `<p class="no-data" style="margin-top:4px">Aucun haut fait débloqué pour l'instant.</p>`;
  return html;
}

function openPlayerPanel(playerName) {
  const st = computePlayerDetailStats(playerName);
  const isJoker = JOKERS.has(playerName);
  const medals  = ["🥇","🥈","🥉"];
  const nd = `<p class="no-data" style="margin-top:4px">—</p>`;
  const _achSt = computeAchievementStats(playerName);
  let h = "";

  /* Hero : avatar + prénom, teinté par la couleur préférée (celle avec laquelle il gagne le plus) */
  {
    const _prefColor = st.prefWinColor;
    const _colorVar = _prefColor === "Bleue" ? "bleu" : _prefColor ? _prefColor.toLowerCase() : null;
    const _heroBg = _colorVar ? `linear-gradient(150deg, var(--${_colorVar}-bg), transparent 70%)` : "var(--bg3)";
    const _avatarBg = _colorVar ? `var(--${_colorVar})` : "var(--text3)";
    const _avatarFg = _colorVar === "vert" ? "#111" : "#fff";
    const _initials = computeAllInitials([...new Set([...ALL_PLAYERS, playerName])])[playerName];
    const _totalExpected = st.presences + st.absences;
    let _freqLabel = null;
    if (_totalExpected >= 3) {
      const _rate = st.presences / _totalExpected;
      _freqLabel = _rate >= 0.75 ? "Régulier" : _rate >= 0.4 ? "Occasionnel" : "Rare";
    }
    h += `<div class="pph-hero" style="background:${_heroBg}">
      <div class="pph-avatar" style="background:${_avatarBg};color:${_avatarFg}">${_initials}</div>
      <div class="pph-hero-name">${playerName}</div>
      ${_freqLabel ? `<span class="pph-freq-pill">${_freqLabel}</span>` : ""}
    </div>`;
  }

  /* Hero : chiffres clés visibles sans scroller */
  h += `<div class="pph-top-grid">
    <div class="pph-top-cell"><div class="pph-top-num" style="color:#66bb6a">${st.presences}</div><div class="pph-top-lbl">Présences</div></div>
    <div class="pph-top-cell"><div class="pph-top-num">${st.matchsJoues}</div><div class="pph-top-lbl">Matchs</div></div>
    <div class="pph-top-cell"><div class="pph-top-num" style="color:var(--bleu)">${st.buts}</div><div class="pph-top-lbl">Buts</div></div>
    <div class="pph-top-cell"><div class="pph-top-num" style="color:var(--bleu)">${st.passesDecisives}</div><div class="pph-top-lbl">Assists</div></div>
  </div>`;

  /* Forme récente (5 dernières sessions où le joueur était Présent) */
  {
    const _sortedSess = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
    const _recent = _sortedSess.filter(s => {
      const info = s.presences[playerName];
      return info && info.statut === "Présent";
    }).slice(0, 5);

    h += `<div><div class="pp-section-title">Forme récente</div>`;
    if (_recent.length === 0) {
      h += `<p class="no-data" style="margin-top:4px">—</p>`;
    } else {
      h += `<div class="pph-forme-row">`;
      _recent.forEach(s => {
        const info = s.presences[playerName];
        const myEq = info.equipe || null;
        const dateStr = new Date(s.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
        // G/A de la session
        let gSess=0, aSess=0;
        (s.matchs||[]).forEach(m => {
          ["A","B"].forEach(side => {
            const buts   = m[`buteurs${side}`]  || [];
            const passes = m[`passeurs${side}`] || [];
            buts.forEach((b,i) => {
              if (!b || b==="CSC") return;
              if (b === playerName) gSess++;
              const p = passes[i];
              if (p && p!=="CSC" && p === playerName) aSess++;
            });
          });
        });
        // Résultat : majorité V/D/N de la soirée (plusieurs matchs possibles à 3 équipes)
        let wins=0, losses=0, draws=0;
        if (myEq) {
          (s.matchs||[]).filter(m => m.eqA===myEq||m.eqB===myEq).forEach(m => {
            const w = m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;
            if (w===myEq) wins++; else if (w===null) draws++; else losses++;
          });
        }
        const maxVdn = Math.max(wins, losses, draws);
        let resultCls, resultChar;
        if (!myEq || maxVdn === 0) { resultCls = 'd'; resultChar = '='; }
        else if (wins === maxVdn) { resultCls = 'w'; resultChar = '✓'; }
        else if (losses === maxVdn) { resultCls = 'l'; resultChar = '✗'; }
        else { resultCls = 'd'; resultChar = '='; }
        const gaStr = gSess+aSess > 0 ? `${gSess}G ${aSess}A` : `0 G/A`;
        h += `<div class="pph-forme-pill">
          <span class="pph-forme-date">${dateStr}</span>
          <span class="pph-forme-result ${resultCls}">${resultChar}</span>
          <span class="pph-forme-vdn">${wins}V ${losses}D ${draws}N</span>
          <span class="pph-forme-ga">${gaStr}</span>
        </div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
  }

  /* Statistiques */
  h += `<div>
    <div class="pp-section-title">Statistiques</div>
    <div class="pph-stat-scroller">
      <div class="pph-stat-tile">
        <div class="pp-stat-val ${st.buts>0?"blue":"muted"}">${st.buts}</div>
        <div class="pp-stat-lbl">Buts</div>
        ${st.matchsJoues>0?`<div class="pp-stat-sub">moy. ${(st.buts/st.matchsJoues).toFixed(2).replace(".",",")} / m</div>`:""}
      </div>
      <div class="pph-stat-tile">
        <div class="pp-stat-val ${st.passesDecisives>0?"blue":"muted"}">${st.passesDecisives}</div>
        <div class="pp-stat-lbl">Assists</div>
        ${st.matchsJoues>0?`<div class="pp-stat-sub">moy. ${(st.passesDecisives/st.matchsJoues).toFixed(2).replace(".",",")} / m</div>`:""}
      </div>
      <div class="pph-stat-tile">
        <div class="pp-stat-val ${st.victoires>0?"green":"muted"}">${st.victoires}</div>
        <div class="pp-stat-lbl">Victoires</div>
      </div>
      <div class="pph-stat-tile">
        <div class="pp-stat-val ${st.defaites>0?"red":"muted"}">${st.defaites}</div>
        <div class="pp-stat-lbl">Défaites</div>
      </div>
    </div>
    <div class="pph-stat-list">
      <div class="pph-stat-row"><span class="lbl">Absences · Pas répondu</span><span class="val ${st.absences>0?"red":""}">${st.absences} · ${st.pasRepondu}</span></div>
      <div class="pph-stat-row"><span class="lbl">Blessures</span><span class="val ${st.episodesBlessures>0?"amber":""}">${st.episodesBlessures} / ${st.blesses} séance${st.blesses>1?"s":""}</span></div>
      <div class="pph-stat-row"><span class="lbl">Sac 🎒 · Maillots 👕</span><span class="val">${st.sac} · ${st.maillots}</span></div>
      <div class="pph-stat-row"><span class="lbl">Clean sheets 🧱 · Buts encaissés 🪣</span><span class="val ${_achSt.gardiensCleanSheets>0?"green":_achSt.gardiensButsEncaisses>0?"red":""}">${_achSt.gardiensCleanSheets} · ${_achSt.gardiensButsEncaisses}</span></div>
    </div>
  </div>`;

  /* Radar de profil */
  {
    // Axes (sens horaire depuis le haut) : Buteur · Défenseur · Gardien · Intendant · Présence · Passeur
    const _radarAxes = [
      { label: 'Buteur',    val: _achSt.buts },
      { label: 'Défenseur', val: _achSt.cleanSheets },
      { label: 'Gardien',   val: _achSt.gardienRate },
      { label: 'Intendant', val: _achSt.sac + _achSt.maillots },
      { label: 'Présence',  val: _achSt.presences },
      { label: 'Passeur',   val: _achSt.passes },
    ];
    // Normalisation 0-100 relative au max de tous les joueurs
    const _radarMaxes = _radarAxes.map((ax, i) => {
      return Math.max(1, ...ALL_PLAYERS.map(p => {
        const s = computeAchievementStats(p);
        const vals = [s.buts, s.cleanSheets, s.gardienRate, s.sac+s.maillots, s.presences, s.passes];
        return vals[i];
      }));
    });
    const _scores = _radarAxes.map((ax, i) => Math.round((ax.val / _radarMaxes[i]) * 100));

    // SVG radar
    const cx=110, cy=110, R=80, N=6;
    const pts = (r) => Array.from({length:N}, (_,i) => {
      const ang = (Math.PI*2*i/N) - Math.PI/2;
      return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)];
    });
    const ptsStr = (arr) => arr.map(p=>p.join(',')).join(' ');
    // Grille
    let svgG = '';
    [25,50,75,100].forEach(pct => {
      const r = R*pct/100;
      svgG += `<polygon points="${ptsStr(pts(r))}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
    });
    // Axes
    const outerPts = pts(R);
    outerPts.forEach(([x,y]) => {
      svgG += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    });
    // Polygon de données
    const dataPts = Array.from({length:N}, (_,i) => {
      const ang = (Math.PI*2*i/N) - Math.PI/2;
      const r = R * _scores[i] / 100;
      return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)];
    });
    svgG += `<polygon points="${ptsStr(dataPts)}" fill="rgba(254,219,0,.18)" stroke="#FEDB00" stroke-width="1.5"/>`;
    // Dots
    dataPts.forEach(([x,y]) => {
      svgG += `<circle cx="${x}" cy="${y}" r="3" fill="#FEDB00"/>`;
    });
    // Labels
    outerPts.forEach(([x,y], i) => {
      const lx = cx + (R+22)*Math.cos((Math.PI*2*i/N)-Math.PI/2);
      const ly = cy + (R+22)*Math.sin((Math.PI*2*i/N)-Math.PI/2);
      const score = _scores[i];
      const anchor = lx < cx-4 ? 'end' : lx > cx+4 ? 'start' : 'middle';
      svgG += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" font-size="8" fill="rgba(200,200,215,0.65)" font-family="inherit" letter-spacing="0.06em">${_radarAxes[i].label.toUpperCase()}</text>`;
    });

    h += `<div>
      <div class="pp-section-title">Profil</div>
      <div class="pph-radar-card">
        <svg viewBox="0 0 220 220" width="220" height="220" style="overflow:visible">${svgG}</svg>
      </div>
    </div>`;
  }

  /* Meilleurs moments : carrousel (meilleur match, link-up, meilleure série) */
  {
    const _moments = [];

    if (st.bestMatch && (st.bestMatchGoals > 0 || st.bestMatchAssists > 0)) {
      const bmParts = [];
      if (st.bestMatchGoals > 0) bmParts.push(`${st.bestMatchGoals} but${st.bestMatchGoals>1?"s":""}`);
      if (st.bestMatchAssists > 0) bmParts.push(`${st.bestMatchAssists} assist${st.bestMatchAssists>1?"s":""}`);
      _moments.push(`<div class="pp-match-card">
        <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)">⚽️ Meilleur match</div>
        <div style="font-size:13px;color:var(--text2);margin-top:6px">${fmtDate(st.bestMatch.date)}</div>
        <div style="font-size:22px;font-weight:700;margin:6px 0;color:var(--gold)">${bmParts.join(" · ")}</div>
        <div class="pp-match-score">
          ${badge(st.bestMatch.eqA)}<span style="font-size:15px;font-weight:700">${st.bestMatch.scoreA}–${st.bestMatch.scoreB}</span>${badge(st.bestMatch.eqB)}
        </div>
      </div>`);
    }

    const _luAll = computeLinkUpStats(SESSIONS).filter(d => d.p1 === playerName || d.p2 === playerName);
    if (_luAll.length) {
      const _luBest = _luAll[0];
      const _luPartner = _luBest.p1 === playerName ? _luBest.p2 : _luBest.p1;
      _moments.push(`<div class="pp-match-card">
        <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)">⚡ Meilleur Link-Up</div>
        <div style="font-size:20px;font-weight:700;margin:8px 0 2px">
          <button class="player-link" data-player="${_luPartner}" style="font-size:inherit">${_luPartner}</button>
        </div>
        <div style="display:flex;align-items:baseline;gap:5px">
          <span style="font-size:20px;font-weight:700;color:var(--gold)">${_luBest.connexions}</span>
          <span style="font-size:13px;color:var(--text2)">but${_luBest.connexions>1?"s":""}</span>
        </div>
        ${(()=>{const _ip1=_luBest.p1===playerName;const _mG=_ip1?_luBest.p1Goals:_luBest.p2Goals;const _mA=_ip1?_luBest.p2Goals:_luBest.p1Goals;const _pG=_ip1?_luBest.p2Goals:_luBest.p1Goals;const _pA=_ip1?_luBest.p1Goals:_luBest.p2Goals;return`<div style="display:flex;gap:10px;margin-top:8px;font-size:11px;color:var(--text3);flex-wrap:wrap"><span><strong style="color:var(--text2)">${playerName}</strong> ${_mG}G · ${_mA}A</span><span><strong style="color:var(--text2)">${_luPartner}</strong> ${_pG}G · ${_pA}A</span></div>`;})()}
      </div>`);
    }

    {
      const _cur  = st.currentStreak;
      const _best = st.bestHistoricalStreak;
      const _curBetter = (c, b) => c.count > b.count || (c.count === b.count && (c.g+c.a) >= (b.g+b.a));
      if (_cur || _best) {
        const primary  = (_cur && (!_best || _curBetter(_cur, _best))) ? _cur : _best;
        const isActive = primary === _cur;
        const ga = primary.g + primary.a;
        const dateStr = isActive
          ? `Depuis le ${fmtDate(primary.start)}`
          : `${fmtDate(primary.start)} — ${fmtDate(primary.end)}`;
        let card = `<div class="pp-match-card">
          <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)">🔥 Meilleure série</div>
          <div style="font-size:13px;color:var(--text2);margin-top:6px">${dateStr}</div>
          <div style="margin:8px 0 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
            <span style="font-size:24px;font-weight:700;color:var(--text);line-height:1">${ga} G/A</span>
            <span style="font-size:12px;color:var(--text2)">(${primary.g}G + ${primary.a}A)</span>
          </div>
          <div style="font-size:12px;color:var(--text2)">· ${primary.count} match${primary.count>1?"s":""}</div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:6px;color:${isActive?"#34A853":"var(--text3)"}">${isActive?"En cours":"Terminée"}</div>
        </div>`;
        if (!isActive && _cur) {
          const cga = _cur.g + _cur.a;
          card += `<div style="margin-top:8px;padding:8px 14px;background:rgba(52,168,83,.08);border:1px solid rgba(52,168,83,.2);border-radius:var(--radius);font-size:11px;color:var(--text2)">
            <strong style="color:#34A853;text-transform:uppercase;letter-spacing:.06em;font-size:10px">En cours</strong><br>
            ${cga} G/A (${_cur.g}G + ${_cur.a}A) · ${_cur.count} match${_cur.count>1?"s":""}
          </div>`;
        }
        _moments.push(card);
      }
    }

    h += `<div><div class="pp-section-title">Meilleurs moments</div>${
      _moments.length ? `<div class="pph-moments-scroller">${_moments.join("")}</div>` : nd
    }</div>`;
  }

  /* Couleur récurrente */
  h += `<div><div class="pp-section-title">Couleur récurrente</div>`;
  if (st.recurringColor) {
    const c = st.recurringColor, cls = c.toLowerCase(), n = st.teamCount[c];
    h += `<div style="display:flex;align-items:center;gap:10px">
      <span class="pp-color-pill ${cls}" style="white-space:nowrap">${dot(c)}${TEAM_LABEL[c]||c}</span>
      <span style="font-size:12px;color:var(--text3)">${n} session${n>1?"s":""}</span>
    </div>`;
  } else { h += nd; }
  h += `</div>`;

  /* Top 3 coéquipiers récurrents */
  h += `<div><div class="pp-section-title">Top 3 coéquipiers récurrents</div>`;
  if (st.top3Teammates.length) {
    h += `<div class="pp-teammate-list">`;
    st.top3Teammates.forEach(([name, n], i) => {
      h += `<div class="pp-teammate-row">
        <span class="pp-teammate-rank">${medals[i]}</span>
        <span class="pp-teammate-name">${name}</span>
        <span class="pp-teammate-val">${n}</span><span class="pp-teammate-unit">session${n>1?"s":""}</span>
      </div>`;
    });
    h += `</div>`;
  } else { h += nd; }
  h += `</div>`;

  /* Couleur préférée (victoires) */
  h += `<div><div class="pp-section-title">Couleur préférée</div>`;
  if (st.prefWinColor) {
    const c = st.prefWinColor, cls = c.toLowerCase(), n = st.maxWins;
    h += `<div style="display:flex;align-items:center;gap:10px">
      <span class="pp-color-pill ${cls}" style="white-space:nowrap">${dot(c)}${TEAM_LABEL[c]||c}</span>
      <span style="font-size:12px;color:var(--text3)">${n} victoire${n>1?"s":""}</span>
    </div>`;
  } else { h += `<p class="no-data" style="margin-top:4px">Aucune victoire enregistrée</p>`; }
  h += `</div>`;

  /* Top 3 coéquipiers préférés */
  h += `<div><div class="pp-section-title">Top 3 coéquipiers préférés</div>`;
  if (st.top3WinTeammates.length) {
    h += `<div class="pp-teammate-list">`;
    st.top3WinTeammates.forEach(([name, n], i) => {
      h += `<div class="pp-teammate-row">
        <span class="pp-teammate-rank">${medals[i]}</span>
        <span class="pp-teammate-name">${name}</span>
        <span class="pp-teammate-val">${n}</span><span class="pp-teammate-unit">victoire${n>1?"s":""}</span>
      </div>`;
    });
    h += `</div>`;
  } else { h += `<p class="no-data" style="margin-top:4px">Aucune victoire enregistrée</p>`; }
  h += `</div>`;

  /* Hauts faits */
  h += `<div><div class="pp-section-title">Hauts faits</div>${renderAchievementsGrid(computeAchievementStats(playerName))}</div>`;

  document.getElementById("pp-name").textContent = playerName;
  const _ppBadgeEl = document.getElementById("pp-statut-badge");
  if (_ppBadgeEl) {
    const _ppStatut = ABSENTS.has(playerName) ? 'quitte' : JOKERS.has(playerName) ? 'plus1' : 'actif';
    const _ppS = REGL_STATUTS[_ppStatut];
    _ppBadgeEl.innerHTML = `<span class="regl-badge ${_ppS.badge}">${_ppS.label}</span>`;
  }
  const ppBody = document.getElementById("pp-body");
  ppBody.innerHTML = h;
  ppBody.style.opacity   = '0';
  ppBody.style.transition = 'none';
  setTimeout(() => { ppBody.style.opacity = ''; animateView(ppBody); }, 290);
  document.getElementById("player-panel-overlay").classList.add("open");
  document.getElementById("player-panel").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closePlayerPanel() {
  document.getElementById("player-panel-overlay").classList.remove("open");
  document.getElementById("player-panel").classList.remove("open");
  document.body.style.overflow = "";
}

/* ─────────────────────────────────────────────────────
   SAISIE — onglet de saisie des sessions
───────────────────────────────────────────────────── */

let _draft = null;
let _draftSavedAt = null;
let _editMode = false;

const _STATUTS_REG  = ["Présent", "Absent", "Blessé", "Pas répondu"];
const _STATUT_CLS   = { "Présent":"active-present", "Absent":"active-absent", "Blessé":"active-blesse", "Pas répondu":"active-nr" };
const _JOKER_NC = "Non convoqué";

let _saisieStep = "presences";      // "presences" | "matchs" | "logistique"
let _saisieFocusedMatch = undefined; // index dans _draft.matchs actuellement en édition ; null = réduit explicitement, undefined = pas encore décidé
let _saisiePicker = null;            // { key } — sélecteur (gardien/buteur/passeur) ouvert
let _saisieTeamSwap = null;          // "{idx}-{side}" — sélecteur d'équipe ouvert
let _saisieMtOpen = {};              // { [matchIdx]: true } — mi-temps dépliée
const _SAISIE_STEPS = [
  { key: "presences",  label: "Présences",  icon: "👥" },
  { key: "matchs",     label: "Matchs",     icon: "⚽" },
  { key: "logistique", label: "Logistique", icon: "🎒" },
];

function _newDraft() {
  const presences = {};
  ALL_PLAYERS.forEach(p => {
    presences[p] = { statut: JOKERS.has(p) ? _JOKER_NC : "Pas répondu", equipe: "" };
  });
  return { date: "", sac: "", maillots: "", presences, matchs: [], tempJokers: [] };
}

function _resetSaisieUiState() {
  _saisieStep = "presences";
  _saisieFocusedMatch = undefined;
  _saisiePicker = null;
  _saisieTeamSwap = null;
  _saisieMtOpen = {};
}

function _loadDraft() {
  try {
    const s = localStorage.getItem("hmft_draft");
    if (s) { _draft = JSON.parse(s); return; }
  } catch(e) {}
  _draft = _newDraft();
}

function _loadSessionIntoDraft(session) {
  const presences = {};
  ALL_PLAYERS.forEach(p => {
    presences[p] = { statut: JOKERS.has(p) ? _JOKER_NC : "Pas répondu", equipe: "" };
  });
  const tempJokers = [];
  Object.entries(session.presences).forEach(([p, info]) => {
    if (!ALL_PLAYERS.includes(p)) {
      tempJokers.push(p);
      presences[p] = { statut: info.statut === "Présent" ? "Présent" : _JOKER_NC, equipe: info.equipe || "", joker: true, temp: true };
    } else if (JOKERS.has(p)) {
      presences[p] = { statut: info.statut === "Présent" ? "Présent" : _JOKER_NC, equipe: info.equipe || "" };
    } else {
      presences[p] = { statut: info.statut, equipe: info.equipe || "" };
    }
  });
  return {
    date: session.date,
    sac: session.sac || "",
    maillots: session.maillots || "",
    presences,
    matchs: (session.matchs || []).map(m => ({
      eqA: m.eqA, eqB: m.eqB,
      scoreA: m.scoreA, scoreB: m.scoreB,
      buteursA:  [...(m.buteursA  || [])],
      buteursB:  [...(m.buteursB  || [])],
      passeursA: [...(m.passeursA || [])],
      passeursB: [...(m.passeursB || [])],
      mt1A: m.mt1A ?? 0, mt1B: m.mt1B ?? 0,
      gardiensA: [...(m.gardiensA || ["",""])],
      gardiensB: [...(m.gardiensB || ["",""])]
    })),
    tempJokers
  };
}

function _saveDraft() {
  localStorage.setItem("hmft_draft", JSON.stringify(_draft));
  _draftSavedAt = new Date().toLocaleTimeString("fr", { hour: "2-digit", minute: "2-digit" });
  const el = document.getElementById("saisie-status");
  if (el) el.innerHTML = `<span style="color:#2ecc71;font-size:12px">✓ Sauvegardé à ${_draftSavedAt}</span>`;
  if (_db) _db.ref('config/draft').set(_draft).catch(e => console.error('FB draft save:', e));
}

function _presentList() {
  return Object.entries(_draft.presences).filter(([,v]) => v.statut === "Présent").map(([k]) => k).sort((a, b) => a.localeCompare(b, "fr"));
}

function _activeTeams() {
  const t = new Set();
  Object.values(_draft.presences).forEach(v => { if (v.statut === "Présent" && v.equipe) t.add(v.equipe); });
  return ["Rouge","Vert","Bleue"].filter(c => t.has(c));
}

function _playersOfTeam(color) {
  return Object.entries(_draft.presences)
    .filter(([,v]) => v.statut === "Présent" && v.equipe === color).map(([k]) => k).sort((a, b) => a.localeCompare(b, "fr"));
}

// Buteurs/passeurs : équipe sur le terrain d'abord, équipe de dépanne ensuite
function _teamPoolOrdered(eq, benchEq) {
  return [..._playersOfTeam(eq), ...(benchEq ? _playersOfTeam(benchEq) : [])];
}
// Gardien : à 5+ joueurs présents l'équipe garde ses buts elle-même ; à 4, le banc dépanne en priorité
function _gardienPoolOrdered(eq, benchEq) {
  const own = _playersOfTeam(eq);
  if (own.length >= 5 || !benchEq) return own;
  return [..._playersOfTeam(benchEq), ...own];
}
function _saisieBenchTeam(eqA, eqB, teams) {
  return teams.length >= 3 ? (teams.find(t => t !== eqA && t !== eqB) || "") : "";
}

/* ── Présences : chips groupées par statut ── */
function _saisieTeamDotsHTML(p, eq) {
  return `<span class="saisie-team-dots">${["Rouge","Vert","Bleue"].map(t =>
    `<button class="saisie-team-dot ${t.toLowerCase()}${eq===t?" active":""}" data-act="saisie-team" data-player="${p}" data-equipe="${t}" title="${TEAM_LABEL[t]}"></button>`
  ).join("")}</span>`;
}
function _saisieRegChipHTML(p) {
  const statut = _draft.presences[p]?.statut || "Pas répondu";
  const eq = _draft.presences[p]?.equipe || "";
  const stCls = statut === "Présent" ? "st-present" : statut === "Absent" ? "st-absent" : statut === "Blessé" ? "st-blesse" : "st-nr";
  const teamCls = statut === "Présent" && eq ? ` team-${eq.toLowerCase()}` : "";
  const btns = _STATUTS_REG.map(s => `<button class="saisie-chip-btn" data-act="saisie-status" data-player="${p}" data-statut="${s}" title="${s}">${{"Présent":"✅","Absent":"❌","Blessé":"🤕","Pas répondu":"❓"}[s]}</button>`).join("");
  const dots = statut === "Présent" ? _saisieTeamDotsHTML(p, eq) : "";
  return `<span class="saisie-chip ${stCls}${teamCls}">
    <span class="saisie-chip-name">${p}</span>
    ${dots}
    <span class="saisie-chip-btns">${btns}</span>
  </span>`;
}
function _saisieJokerChipHTML(p, removable) {
  const statut = _draft.presences[p]?.statut || _JOKER_NC;
  const eq = _draft.presences[p]?.equipe || "";
  const stCls = statut === "Présent" ? "st-present" : statut === "Blessé" ? "st-blesse" : "st-nr";
  const teamCls = statut === "Présent" && eq ? ` team-${eq.toLowerCase()}` : "";
  const dots = statut === "Présent" ? _saisieTeamDotsHTML(p, eq) : "";
  const btns = `
    <button class="saisie-chip-btn" data-act="saisie-status" data-player="${p}" data-statut="Présent" title="Présent">✅</button>
    <button class="saisie-chip-btn" data-act="saisie-status" data-player="${p}" data-statut="Blessé" title="Blessé">🤕</button>
    <button class="saisie-chip-btn" data-act="saisie-status" data-player="${p}" data-statut="${_JOKER_NC}" title="Non convoqué">🫥</button>
    ${removable ? `<button class="saisie-chip-btn" data-act="saisie-remove-temp-joker" data-player="${p}" title="Retirer">✕</button>` : ""}
  `;
  return `<span class="saisie-chip ${stCls}${teamCls}">
    <span class="saisie-chip-name">${p} <span class="saisie-chip-badge">+1</span></span>
    ${dots}
    <span class="saisie-chip-btns">${btns}</span>
  </span>`;
}
function _sortPresentFirst(list) {
  const order = ["Rouge","Vert","Bleue"];
  return [...list].sort((a, b) => {
    const ea = _draft.presences[a]?.equipe || "", eb = _draft.presences[b]?.equipe || "";
    const ia = order.indexOf(ea), ib = order.indexOf(eb);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || a.localeCompare(b, "fr");
  });
}
function _buildPresencesScreenHTML() {
  const regularPlayers = ALL_PLAYERS.filter(p => !JOKERS.has(p) && !ABSENTS.has(p)).sort((a, b) => a.localeCompare(b, "fr"));
  const jokerPlayers = ALL_PLAYERS.filter(p => JOKERS.has(p)).sort((a, b) => a.localeCompare(b, "fr"));
  const tempJokers = _draft.tempJokers || [];
  const byStatut = (list, s) => list.filter(p => (_draft.presences[p]?.statut || "Pas répondu") === s);

  const countPresents = Object.values(_draft.presences).filter(v => v.statut === "Présent").length;
  const countAbsents  = Object.entries(_draft.presences).filter(([k, v]) => !JOKERS.has(k) && !tempJokers.includes(k) && v.statut === "Absent").length;
  const countBlesses  = Object.entries(_draft.presences).filter(([, v]) => v.statut === "Blessé").length;
  const countNR       = Object.entries(_draft.presences).filter(([k, v]) => !JOKERS.has(k) && !tempJokers.includes(k) && v.statut === "Pas répondu").length;

  const group = (label, icon, list) => !list.length ? "" : `<div class="saisie-pres-block">
      <div class="saisie-pres-label">${icon} ${label} <span class="n">(${list.length})</span></div>
      <div class="saisie-chip-row">${list.map(_saisieRegChipHTML).join("")}</div>
    </div>`;
  const jokerGroup = (label, icon, list) => !list.length ? "" : `<div class="saisie-pres-block">
      <div class="saisie-pres-label">${icon} ${label} <span class="n">(${list.length})</span></div>
      <div class="saisie-chip-row">${list.map(p => _saisieJokerChipHTML(p, tempJokers.includes(p))).join("")}</div>
    </div>`;

  const allJokers = [...jokerPlayers, ...tempJokers];
  const jkPresents = _sortPresentFirst(allJokers.filter(p => (_draft.presences[p]?.statut || _JOKER_NC) === "Présent"));
  const jkBlesses  = allJokers.filter(p => _draft.presences[p]?.statut === "Blessé");
  const jkNC       = allJokers.filter(p => (_draft.presences[p]?.statut || _JOKER_NC) === _JOKER_NC);

  return `<div class="saisie-section">
    <div class="saisie-section-title">👥 Présences</div>
    <div class="saisie-pres-summary">
      <span>✅ ${countPresents} présent${countPresents>1?"s":""}</span>
      <span>❌ ${countAbsents} absent${countAbsents>1?"s":""}</span>
      <span>🤕 ${countBlesses} blessé${countBlesses>1?"s":""}</span>
      <span>❓ ${countNR} n'${countNR>1?"ont":"a"} pas répondu</span>
    </div>
    ${group("Présents", "✅", _sortPresentFirst(byStatut(regularPlayers, "Présent")))}
    ${group("Absents", "❌", byStatut(regularPlayers, "Absent"))}
    ${group("Blessés", "🤕", byStatut(regularPlayers, "Blessé"))}
    ${group("Pas répondu", "❓", byStatut(regularPlayers, "Pas répondu"))}
    <div class="saisie-jokers-title">Joueurs +1</div>
    ${jokerGroup("Présents", "✅", jkPresents)}
    ${jokerGroup("Blessés", "🤕", jkBlesses)}
    ${jokerGroup("Non convoqués", "🫥", jkNC)}
    <div class="saisie-joker-add">
      <input type="text" id="saisie-new-joker-input" placeholder="Nom du +1" class="saisie-date-input">
      <button class="saisie-btn secondary" data-act="saisie-add-temp-joker">+ Ajouter</button>
    </div>
  </div>`;
}

/* ── Matchs : éditeur focalisé + récap ── */
function _saisieFieldBtnHTML(value, placeholder, key, emptyWarn) {
  const info = value === "CSC" ? { name: "CSC (c.s.c.)", team: null } : (value ? { name: value, team: _draft.presences[value]?.equipe || null } : null);
  const isOpen = _saisiePicker && _saisiePicker.key === key;
  const cls = ["saisie-field-btn", info ? "filled" : "", isOpen ? "open" : "", (!info && emptyWarn) ? "empty" : ""].filter(Boolean).join(" ");
  const dotEl = info && info.team ? `<span class="fdot ${info.team.toLowerCase()}"></span>` : "";
  return `<button class="${cls}" data-act="saisie-open-picker" data-key="${key}">${dotEl}<span>${info ? info.name : placeholder}</span><span class="chev2">▾</span></button>`;
}
function _saisiePickerHTML(key, title, options, includeCSC, allowNone) {
  if (!_saisiePicker || _saisiePicker.key !== key) return "";
  const chips = [];
  if (includeCSC) chips.push(`<button class="saisie-pchip muted" data-act="saisie-pick" data-key="${key}" data-val="CSC">CSC (c.s.c.)</button>`);
  if (allowNone !== false) chips.push(`<button class="saisie-pchip muted" data-act="saisie-pick" data-key="${key}" data-val="">— aucun —</button>`);
  options.forEach(p => {
    const eq = (_draft.presences[p]?.equipe || "").toLowerCase();
    chips.push(`<button class="saisie-pchip ${eq}" data-act="saisie-pick" data-key="${key}" data-val="${p}"><span class="pdot"></span>${p}</button>`);
  });
  return `<div class="saisie-picker">
    <div class="saisie-picker-hdr"><span>${title}</span><button data-act="saisie-close-picker">✕</button></div>
    <div class="saisie-picker-grid">${chips.join("")}</div>
  </div>`;
}
function _saisieGoalRowsHTML(idx, side, eq, otherEq, benchTeam) {
  const m = _draft.matchs[idx];
  const score = side === "A" ? m.scoreA : m.scoreB;
  const buteurs = side === "A" ? m.buteursA : m.buteursB;
  const passeurs = side === "A" ? m.passeursA : m.passeursB;
  const pool = _teamPoolOrdered(eq, benchTeam);
  const otherPool = _teamPoolOrdered(otherEq, benchTeam);
  let rows = "";
  for (let j = 0; j < score; j++) {
    const bKey = `but-${idx}-${side}-${j}`, pKey = `pas-${idx}-${side}-${j}`;
    const bv = buteurs[j] || "", pv = passeurs[j] || "";
    const isCSC = bv === "CSC";
    rows += `<div class="saisie-goal-row">
        <span class="saisie-goal-num">${j+1}</span>
        ${_saisieFieldBtnHTML(bv, "— Buteur —", bKey, true)}
        ${_saisieFieldBtnHTML(pv, isCSC ? "— Auteur du CSC —" : "— Passeur —", pKey, false)}
      </div>
      ${_saisiePickerHTML(bKey, `But n°${j+1} — Buteur`, pool.filter(p => p !== pv), true, true)}
      ${isCSC
        ? _saisiePickerHTML(pKey, `But n°${j+1} — Auteur du CSC (équipe adverse)`, otherPool, false, true)
        : _saisiePickerHTML(pKey, `But n°${j+1} — Passeur`, pool.filter(p => p !== bv), false, true)}`;
  }
  return rows || `<div class="saisie-empty">Aucun but pour l'instant.</div>`;
}
function _saisieTeamPickHTML(idx, side, eq, otherEq, teams) {
  const swapKey = `${idx}-${side}`;
  const isOpen = _saisieTeamSwap === swapKey;
  const opts = teams.filter(t => t !== otherEq);
  return `<button class="saisie-team-pick ${eq.toLowerCase()}" data-act="saisie-team-swap" data-swapkey="${swapKey}">${TEAM_LABEL[eq]||eq}<span class="chev">▾</span></button>
    ${isOpen ? `<div class="saisie-team-swap-picker"><div class="saisie-picker-grid">
      ${opts.map(t => `<button class="saisie-pchip ${t.toLowerCase()}" data-act="saisie-pick-team" data-match="${idx}" data-side="${side}" data-val="${t}"><span class="pdot"></span>${TEAM_LABEL[t]||t}</button>`).join("")}
    </div></div>` : ""}`;
}
function _saisieGkColHTML(idx, side, eq, gardienPool) {
  const m = _draft.matchs[idx];
  const g = side === "A" ? m.gardiensA : m.gardiensB;
  const k0 = `gk-${idx}-${side}-0`, k1 = `gk-${idx}-${side}-1`;
  return `<div class="saisie-gk-col">
    <div class="saisie-gk-col-label">Gardien · ${TEAM_LABEL[eq]||eq}</div>
    <div class="saisie-gk-mt"><span class="saisie-gk-mt-tag">MT1</span>${_saisieFieldBtnHTML(g[0]||"", "— Gardien —", k0, false)}</div>
    ${_saisiePickerHTML(k0, `Gardien MT1 — ${TEAM_LABEL[eq]||eq}`, gardienPool, false, false)}
    <div class="saisie-gk-mt"><span class="saisie-gk-mt-tag">MT2</span>${_saisieFieldBtnHTML(g[1]||"", "— Gardien —", k1, false)}</div>
    ${_saisiePickerHTML(k1, `Gardien MT2 — ${TEAM_LABEL[eq]||eq}`, gardienPool, false, false)}
  </div>`;
}
function _saisieMatchEditorHTML(idx) {
  const m = _draft.matchs[idx];
  const teams = _activeTeams();
  const eqA = m.eqA, eqB = m.eqB;
  const benchTeam = _saisieBenchTeam(eqA, eqB, teams);
  const gardienPoolA = _gardienPoolOrdered(eqA, benchTeam);
  const gardienPoolB = _gardienPoolOrdered(eqB, benchTeam);

  // Un gardien doit toujours être renseigné : on pré-remplit avec le premier joueur du pool si vide
  if (!m.gardiensA) m.gardiensA = ["",""];
  if (!m.gardiensB) m.gardiensB = ["",""];
  [0,1].forEach(mt => {
    if (!m.gardiensA[mt] && gardienPoolA.length) m.gardiensA[mt] = gardienPoolA[0];
    if (!m.gardiensB[mt] && gardienPoolB.length) m.gardiensB[mt] = gardienPoolB[0];
  });

  const mtOpen = !!_saisieMtOpen[idx] || (m.mt1A > 0 || m.mt1B > 0);
  const eqAVar = eqA === "Bleue" ? "bleu" : eqA.toLowerCase();
  const eqBVar = eqB === "Bleue" ? "bleu" : eqB.toLowerCase();

  return `<div class="saisie-match-editor">
    <div class="saisie-me-teams">
      ${_saisieTeamPickHTML(idx, "A", eqA, eqB, teams)}
      <div class="saisie-vs">VS${benchTeam ? `<div class="bench-note">${TEAM_LABEL[benchTeam]||benchTeam} dépanne</div>` : ""}</div>
      ${_saisieTeamPickHTML(idx, "B", eqB, eqA, teams)}
    </div>

    <div class="saisie-score-row">
      <div class="saisie-score-side">
        <button class="saisie-stepper-btn" data-act="saisie-score" data-match="${idx}" data-side="A" data-delta="-1">–</button>
        <span class="saisie-score-num">${m.scoreA}</span>
        <button class="saisie-stepper-btn" data-act="saisie-score" data-match="${idx}" data-side="A" data-delta="1">+</button>
      </div>
      <span class="saisie-score-dash">–</span>
      <div class="saisie-score-side">
        <button class="saisie-stepper-btn" data-act="saisie-score" data-match="${idx}" data-side="B" data-delta="-1">–</button>
        <span class="saisie-score-num">${m.scoreB}</span>
        <button class="saisie-stepper-btn" data-act="saisie-score" data-match="${idx}" data-side="B" data-delta="1">+</button>
      </div>
    </div>
    <div class="saisie-mt-row">
      ${mtOpen
        ? `<button data-act="saisie-toggle-mt" data-match="${idx}">− masquer la mi-temps</button>
           <div class="saisie-mt-inputs">

        : `<button data-act="saisie-toggle-mt" data-match="${idx}">+ renseigner la mi-temps</button>`}

function _buildMatchsScreenHTML() {
  const teams = _activeTeams();
  if (teams.length < 2) {
    return `<div class="saisie-section">
      <div class="saisie-section-title">⚽ Matchs</div>
      <p class="saisie-empty">Assignez au moins 2 équipes pour ajouter des matchs.</p>

  }
  if (!Array.isArray(_draft.matchs)) _draft.matchs = [];
  if (_saisieFocusedMatch === undefined && _draft.matchs.length) _saisieFocusedMatch = _draft.matchs.length - 1;
  if (_saisieFocusedMatch !== undefined && _saisieFocusedMatch !== null && !_draft.matchs[_saisieFocusedMatch]) _saisieFocusedMatch = _draft.matchs.length ? _draft.matchs.length - 1 : null;

  const editorHTML = _saisieFocusedMatch != null ? _saisieMatchEditorHTML(_saisieFocusedMatch) : "";
  const recapRows = _draft.matchs.map((m, i) => {
    if (i === _saisieFocusedMatch) return "";
    return `<button class="match-recap-row clickable" data-act="saisie-focus-match" data-match="${i}">
      <span class="mrr-num">#${i+1}</span>
      <span class="mrr-teams">${dot(m.eqA)}<span class="mrr-score">${m.scoreA}–${m.scoreB}</span>${dot(m.eqB)}</span>
      <span class="mrr-sep"></span>
      <span class="mrr-goals">${[_recapSideSummary(m,"A"), _recapSideSummary(m,"B")].filter(Boolean).join(' <span style="color:var(--border2)">|</span> ') || "—"}</span>

  return `<div class="saisie-section">

          <div class="saisie-logistique-row"><label>👕 Maillots</label><select class="saisie-select" id="saisie-maillots">${mailOpts}</select></div>

}

async function _commitSession() {
  if (!_draft.date) { alert("Veuillez saisir une date pour la session."); return; }
  if (!_editMode && SESSIONS.find(s => s.date === _draft.date)) {
    alert(`Une session du ${fmtDate(_draft.date)} existe déjà.`); return;
  }
  const emptyButeurs = _draft.matchs.some(m =>
    (m.buteursA || []).some(b => !b) || (m.buteursB || []).some(b => !b)
  );
  if (emptyButeurs) {
    alert("Certains buteurs ne sont pas renseignés.\nVeuillez sélectionner un joueur ou « CSC » pour chaque but."); return;
  }
  if (!confirm(_editMode
    ? `Mettre à jour la session du ${fmtDate(_draft.date)} ?`
    : `Valider la session du ${fmtDate(_draft.date)} ?\n\nCette action est définitive.`)) return;

  const finalPresences = {};
  Object.entries(_draft.presences).forEach(([p, info]) => {
    if (info.statut === _JOKER_NC) return;
    finalPresences[p] = { statut: info.statut, equipe: info.equipe || "" };
    if ((JOKERS.has(p) || (_draft.tempJokers||[]).includes(p)) && info.statut === "Présent") finalPresences[p].joker = true;
  });

  const finalSession = {
    date: _draft.date,
    ...(_draft.sac      ? { sac:      _draft.sac      } : {}),
    ...(_draft.maillots ? { maillots: _draft.maillots } : {}),
    presences: finalPresences,
    matchs: _draft.matchs.map(m => ({
      eqA: m.eqA, eqB: m.eqB, scoreA: m.scoreA, scoreB: m.scoreB,
      buteursA:  (m.buteursA  || []).filter(b => b),
      buteursB:  (m.buteursB  || []).filter(b => b),
      passeursA: (m.passeursA || []).slice(0, m.scoreA),
      passeursB: (m.passeursB || []).slice(0, m.scoreB),
      mt1A: m.mt1A || 0, mt1B: m.mt1B || 0,
      gardiensA: (m.gardiensA || ["",""]).map(g => g || ""),
      gardiensB: (m.gardiensB || ["",""]).map(g => g || "")
    }))
  };

  const overlay = document.getElementById("fb-saving-overlay");
  if (overlay) overlay.style.display = "flex";
  window.onbeforeunload = () => "La session est en cours de sauvegarde. Quitter maintenant perdra vos données.";

  if (_editMode) {
    const idx = SESSIONS.findIndex(s => s.date === finalSession.date);
    if (idx !== -1) SESSIONS[idx] = finalSession; else SESSIONS.push(finalSession);
  } else {
    SESSIONS.push(finalSession);
  }

  try {
    await _fbSaveSession(finalSession);
  } catch(err) {
    if (overlay) overlay.style.display = "none";
    window.onbeforeunload = null;
    alert('⚠️ Firebase — erreur de synchronisation :\n' + (err?.message || err?.code || String(err)));
    return;
  }

  if (overlay) overlay.style.display = "none";
  window.onbeforeunload = null;

  /* Persister les nouveaux temp jokers dans ALL_PLAYERS + JOKERS */
  const _newJokers = (_draft.tempJokers || []).filter(n => !ALL_PLAYERS.includes(n));
  if (_newJokers.length) {
    _newJokers.forEach(n => { ALL_PLAYERS.push(n); JOKERS.add(n); });
    _saveJokers();
    _saveExtraPlayers();
  }

  _draft = null;
  _draftSavedAt = null;
  _editMode = false;
  _resetSaisieUiState();
  localStorage.removeItem("hmft_draft");
  if (_db) _db.ref('config/draft').remove().catch(() => {});

  // Naviguer vers la session validée
  const dateNav = finalSession.date;
  document.querySelectorAll(".main-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.querySelector(".main-tab[data-tab='session']").classList.add("active");
  document.getElementById("panel-session").classList.add("active");
  populateSessionSelect();
  document.getElementById("session-date").value = dateNav;
  renderSessionResults(dateNav);
}

/* ── Événements saisie (attachés une seule fois) ── */
document.getElementById("saisie-content").addEventListener("click", e => {
  if (!_draft) return;

  const stepBtn = e.target.closest('[data-act="saisie-go-step"]');
  if (stepBtn) {
    _saisieStep = stepBtn.dataset.step; _saisiePicker = null; _saisieTeamSwap = null;
    renderSaisie(); window.scrollTo({top:0, behavior:"smooth"}); return;
  }

  const statusBtn = e.target.closest('[data-act="saisie-status"]');
  if (statusBtn) {
    const p = statusBtn.dataset.player; const s = statusBtn.dataset.statut;
    if (!_draft.presences[p]) _draft.presences[p] = { statut: s, equipe: "" };
    _draft.presences[p].statut = s;
    if (s !== "Présent") _draft.presences[p].equipe = "";
    renderSaisie(); return;
  }
  const teamBtn = e.target.closest('[data-act="saisie-team"]');
  if (teamBtn) {
    const p = teamBtn.dataset.player; const eq = teamBtn.dataset.equipe;
    if (_draft.presences[p]) _draft.presences[p].equipe = _draft.presences[p].equipe === eq ? "" : eq;
    renderSaisie(); return;
  }

  if (e.target.id === "saisie-save")   { _saveDraft(); return; }
  if (e.target.id === "saisie-cancel-edit") {
    _editMode = false;
    _draft = null;
    _resetSaisieUiState();
    document.querySelectorAll(".main-tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    document.querySelector(".main-tab[data-tab='session']").classList.add("active");
    document.getElementById("panel-session").classList.add("active");
    return;
  }
  if (e.target.id === "saisie-clear") {
    if (confirm("Effacer le brouillon en cours ?")) {
      _draft = _newDraft(); _draftSavedAt = null;
      _resetSaisieUiState();
      localStorage.removeItem("hmft_draft");
      if (_db) _db.ref('config/draft').remove().catch(() => {});
      renderSaisie();
    }
    return;
  }
  if (e.target.id === "saisie-commit") { _commitSession(); return; }

  if (e.target.closest('[data-act="saisie-add-match"]')) {
    const teams = _activeTeams();
    if (!Array.isArray(_draft.matchs)) _draft.matchs = [];
    _draft.matchs.push({ eqA: teams[0]||"", eqB: teams[1]||"", scoreA: 0, scoreB: 0, buteursA: [], buteursB: [], passeursA: [], passeursB: [], mt1A: 0, mt1B: 0, gardiensA: ["",""], gardiensB: ["",""] });
    _saisieFocusedMatch = _draft.matchs.length - 1;
    _saisiePicker = null; _saisieTeamSwap = null;
    renderSaisie(); return;
  }
  const rmBtn = e.target.closest('[data-act="saisie-remove-match"]');
  if (rmBtn) {
    const idx = Number(rmBtn.dataset.match);
    if (confirm("Supprimer ce match ?")) {
      _draft.matchs.splice(idx, 1);
      _saisieFocusedMatch = _draft.matchs.length ? Math.min(idx, _draft.matchs.length - 1) : null;
      renderSaisie();
    }
    return;
  }
  if (e.target.closest('[data-act="saisie-collapse-match"]')) { _saisieFocusedMatch = null; renderSaisie(); return; }
  const focusBtn = e.target.closest('[data-act="saisie-focus-match"]');
  if (focusBtn) {
    _saisieFocusedMatch = Number(focusBtn.dataset.match);
    _saisiePicker = null; _saisieTeamSwap = null;
    renderSaisie(); return;
  }

  const scoreBtn = e.target.closest('[data-act="saisie-score"]');
  if (scoreBtn) {
    const idx = Number(scoreBtn.dataset.match); const side = scoreBtn.dataset.side; const delta = Number(scoreBtn.dataset.delta);
    const field  = side === "A" ? "scoreA"    : "scoreB";
    const bfield = side === "A" ? "buteursA"  : "buteursB";
    const pfield = side === "A" ? "passeursA" : "passeursB";
    const val = Math.max(0, (_draft.matchs[idx][field]||0) + delta);
    _draft.matchs[idx][field]  = val;
    _draft.matchs[idx][bfield] = (_draft.matchs[idx][bfield] || []).slice(0, val);
    while (_draft.matchs[idx][bfield].length < val) _draft.matchs[idx][bfield].push("");
    _draft.matchs[idx][pfield] = (_draft.matchs[idx][pfield] || []).slice(0, val);
    while (_draft.matchs[idx][pfield].length < val) _draft.matchs[idx][pfield].push("");
    renderSaisie(); return;
  }
  const mtToggle = e.target.closest('[data-act="saisie-toggle-mt"]');
  if (mtToggle) { _saisieMtOpen[Number(mtToggle.dataset.match)] = !_saisieMtOpen[Number(mtToggle.dataset.match)]; renderSaisie(); return; }

  const teamSwapBtn = e.target.closest('[data-act="saisie-team-swap"]');
  if (teamSwapBtn) {
    const key = teamSwapBtn.dataset.swapkey;
    _saisieTeamSwap = _saisieTeamSwap === key ? null : key;
    renderSaisie(); return;
  }
  const pickTeamBtn = e.target.closest('[data-act="saisie-pick-team"]');
  if (pickTeamBtn) {
    const idx = Number(pickTeamBtn.dataset.match); const side = pickTeamBtn.dataset.side; const val = pickTeamBtn.dataset.val;
    const thisField = side === "A" ? "eqA" : "eqB"; const otherField = side === "A" ? "eqB" : "eqA";
    const oldThis = _draft.matchs[idx][thisField]; const oldOther = _draft.matchs[idx][otherField];
    _draft.matchs[idx][thisField] = val;
    if (val === oldOther) _draft.matchs[idx][otherField] = oldThis;
    _saisieTeamSwap = null;
    renderSaisie(); return;
  }

  const pickerOpenBtn = e.target.closest('[data-act="saisie-open-picker"]');
  if (pickerOpenBtn) {
    const key = pickerOpenBtn.dataset.key;
    _saisiePicker = (_saisiePicker && _saisiePicker.key === key) ? null : { key };
    renderSaisie(); return;
  }
  if (e.target.closest('[data-act="saisie-close-picker"]')) { _saisiePicker = null; renderSaisie(); return; }
  const pickBtn = e.target.closest('[data-act="saisie-pick"]');
  if (pickBtn) {
    const key = pickBtn.dataset.key; const val = pickBtn.dataset.val;
    const parts = key.split("-");
    const kind = parts[0]; const idx = Number(parts[1]); const side = parts[2]; const n = Number(parts[3]);
    if (kind === "but") {
      const bField = side === "A" ? "buteursA" : "buteursB"; const pField = side === "A" ? "passeursA" : "passeursB";
      const prevVal = _draft.matchs[idx][bField][n];
      _draft.matchs[idx][bField][n] = val;
      const curPasseur = _draft.matchs[idx][pField][n];
      if (val === "CSC" || prevVal === "CSC" || (val && val === curPasseur)) _draft.matchs[idx][pField][n] = "";
    } else if (kind === "pas") {
      _draft.matchs[idx][side === "A" ? "passeursA" : "passeursB"][n] = val;
    } else if (kind === "gk") {
      const field = side === "A" ? "gardiensA" : "gardiensB";
      if (!_draft.matchs[idx][field]) _draft.matchs[idx][field] = ["",""];
      _draft.matchs[idx][field][n] = val;
    }
    _saisiePicker = null;
    renderSaisie(); return;
  }

  if (e.target.id === "saisie-add-temp-joker") {
    const input = document.getElementById("saisie-new-joker-input");
    const name = (input?.value || "").trim();
    if (!name) return;
    if (ALL_PLAYERS.includes(name) || (_draft.tempJokers||[]).includes(name)) {
      alert(`"${name}" est déjà dans la liste.`); return;
    }
    if (/[.#$\/\[\]]/.test(name)) {
      alert(`Le nom "${name}" contient un caractère interdit ( . # $ / [ ] ).\nVeuillez le modifier.`); return;
    }
    if (!_draft.tempJokers) _draft.tempJokers = [];
    _draft.tempJokers.push(name);
    _draft.presences[name] = { statut: "Présent", equipe: "", joker: true, temp: true };
    renderSaisie(); return;
  }

  const rmTempBtn = e.target.closest('[data-act="saisie-remove-temp-joker"]');
  if (rmTempBtn) {
    const name = rmTempBtn.dataset.player;
    _draft.tempJokers = (_draft.tempJokers||[]).filter(p => p !== name);
    delete _draft.presences[name];
    renderSaisie(); return;
  }
});

document.getElementById("saisie-content").addEventListener("change", e => {
  if (!_draft) return;
  if (e.target.id === "saisie-date")     { _draft.date = e.target.value; return; }
  if (e.target.id === "saisie-sac")      { _draft.sac = e.target.value; return; }
  if (e.target.id === "saisie-maillots") { _draft.maillots = e.target.value; return; }
  const mtInput = e.target.closest('[data-act="saisie-mt-input"]');
  if (mtInput) {
    const idx = Number(mtInput.dataset.match); const side = mtInput.dataset.side;
    _draft.matchs[idx][side === "A" ? "mt1A" : "mt1B"] = Math.max(0, parseInt(e.target.value) || 0);
    return;
  }
});

function _reglValidate() {
  const statut = document.querySelector('input[name="regl-statut"]:checked')?.value;
  const finalChk = document.getElementById('regl-chk-final');
  const finalChecked = finalChk?.checked;
  const declRow = document.getElementById('regl-final-decl');
  const name = document.getElementById('regl-name-sel')?.value;
  const btn = document.getElementById('regl-submit-btn');

  // Déclaration: rouge si obligatoire+non cochée, verte si cochée, neutre si quitte
  if (declRow) {
    if (statut === 'quitte') {
      declRow.style.borderColor = 'rgba(107,114,128,.3)';
      declRow.style.background  = 'rgba(107,114,128,.05)';
      declRow.style.opacity     = '0.55';
      if (finalChk) finalChk.disabled = true;
    } else {
      if (finalChk) finalChk.disabled = false;
      declRow.style.opacity = '1';
      if (finalChecked) {
        declRow.style.borderColor = 'rgba(16,185,129,.5)';
        declRow.style.background  = 'rgba(16,185,129,.07)';
      } else {
        declRow.style.borderColor = 'rgba(239,68,68,.5)';
        declRow.style.background  = 'rgba(239,68,68,.05)';
      }
    }
  }

  if (!btn) return;
  const checkOk = statut === 'quitte' || finalChecked;
  btn.disabled = !(checkOk && statut && name);
  btn.textContent = (_reglData && name && _reglData[name]) ? 'Mettre à jour' : 'Valider';
}

function _reglPrefill(existing) {
  const chk = document.getElementById('regl-chk-final');
  if (chk) chk.checked = !!existing.check;
  const cmnt = document.getElementById('regl-comment');
  if (cmnt) cmnt.value = existing.commentaire || '';
  ['actif','plus1','quitte'].forEach(v => {
    const radio = document.getElementById(`regl-radio-${v}`);
    const row   = document.getElementById(`regl-radio-row-${v}`);
    if (radio) { radio.checked = existing.statut === v; row?.classList.toggle('selected', radio.checked); }
  });
}

function _reglClearForm() {
  const chk = document.getElementById('regl-chk-final');
  if (chk) chk.checked = false;
  const cmnt = document.getElementById('regl-comment');
  if (cmnt) cmnt.value = '';
  ['actif','plus1','quitte'].forEach(v => {
    const radio = document.getElementById(`regl-radio-${v}`);
    if (radio) { radio.checked = false; document.getElementById(`regl-radio-row-${v}`)?.classList.remove('selected'); }
  });
}

function _reglShowThanks(name) {
  // Griser la section statut
  ['regl-statut-title','regl-radio-group'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.opacity = '0.35'; el.style.pointerEvents = 'none'; }
  });
  // Masquer déclaration, commentaire et bouton
  ['regl-comment-wrap','regl-final-decl','regl-submit-zone'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
  // Message de confirmation
  const msg = document.getElementById('regl-msg');
  if (msg) { msg.className = 'regl-msg ok'; msg.textContent = 'Merci d\'avoir répondu et à la saison prochaine ! ⚽'; }
  // Retirer le nom du sélecteur
  const nameSel = document.getElementById('regl-name-sel');
  if (nameSel && name) {
    const opt = nameSel.querySelector(`option[value="${CSS.escape(name)}"]`) || [...nameSel.options].find(o => o.value === name);
    if (opt) opt.remove();
    nameSel.value = '';
  }
}

async function _initReglForm() {
  await _loadReglData();
  const isAdmin = sessionStorage.getItem('hmft_role') === 'admin';

  // Populate name selector: exclude already-responded players (admins see everyone)
  const responded = new Set(Object.keys(_reglData || {}));
  const available = [...ALL_PLAYERS]
    .sort((a,b) => a.localeCompare(b,'fr'))
    .filter(p => isAdmin || !responded.has(p));
  const nameSel = document.getElementById('regl-name-sel');
  if (nameSel) {
    nameSel.innerHTML = `<option value="">— Sélectionne ton prénom —</option>` +
      available.map(p => `<option value="${p}">${p}</option>`).join('');
  }

  // Show admin section only for admins
  const adminWrap = document.getElementById('regl-admin-wrap');
  if (adminWrap) adminWrap.style.display = isAdmin ? 'block' : 'none';

  // Checkbox déclaration finale
  document.getElementById('regl-chk-final')?.addEventListener('change', _reglValidate);

  // Radios
  ['actif','plus1','quitte'].forEach(v => {
    const radio = document.getElementById(`regl-radio-${v}`);
    const row   = document.getElementById(`regl-radio-row-${v}`);
    if (!radio || !row) return;
    radio.addEventListener('change', () => {
      document.querySelectorAll('.regl-radio-row').forEach(r => r.classList.remove('selected'));
      row.classList.add('selected');
      _reglValidate();
    });
  });

  // Name selector — admins voient tout le monde et peuvent pré-remplir
  nameSel?.addEventListener('change', () => {
    const name = nameSel.value;
    const existing = (_reglData || {})[name];
    const msg = document.getElementById('regl-msg');
    if (msg) { msg.className = 'regl-msg'; msg.textContent = ''; }
    if (existing) { _reglPrefill(existing); } else { _reglClearForm(); }
    _reglValidate();
  });

  // Submit
  document.getElementById('regl-submit-btn')?.addEventListener('click', async () => {
    const name = document.getElementById('regl-name-sel')?.value;
    const statut = document.querySelector('input[name="regl-statut"]:checked')?.value;
    if (!name || !statut) return;
    const commentVal = (document.getElementById('regl-comment')?.value || '').trim();
    const payload = {
      nom: name, statut,
      check: !!document.getElementById('regl-chk-final')?.checked,
      commentaire: commentVal || null,
      timestamp: new Date().toISOString(),
    };
    const msg = document.getElementById('regl-msg');
    const btn = document.getElementById('regl-submit-btn');
    btn.disabled = true; btn.textContent = '…';
    try {
      await _saveReglResponse(name, payload);
      if (!isAdmin) {
        _reglShowThanks(name);
      } else {
        msg.className = 'regl-msg ok';
        msg.textContent = `✓ Réponse de ${name} enregistrée avec succès !`;
        _reglValidate();
      }
      _renderReglAdmin();
    } catch(e) {
      msg.className = 'regl-msg err';
      msg.textContent = 'Erreur lors de la sauvegarde. Vérifie ta connexion.';
      btn.disabled = false;
      _reglValidate();
    }
  });

  // Tabs admin
  document.getElementById('regl-pill-individuel')?.addEventListener('click', () => {
    document.getElementById('regl-pill-individuel').classList.add('active');
    document.getElementById('regl-pill-recap').classList.remove('active');
    _renderReglAdmin('individuel');
  });
  document.getElementById('regl-pill-recap')?.addEventListener('click', () => {
    document.getElementById('regl-pill-recap').classList.add('active');
    document.getElementById('regl-pill-individuel').classList.remove('active');
    _renderReglAdmin('recap');
  });

  if (isAdmin) _renderReglAdmin('individuel');
}

function _renderReglAdmin(view = 'individuel') {
  const data = _reglData || {};
  const STATUT_ORDER = { actif: 0, plus1: 1, quitte: 2 };
  const entries = Object.values(data).sort((a,b) => {
    const sa = STATUT_ORDER[a.statut] ?? 99, sb = STATUT_ORDER[b.statut] ?? 99;
    if (sa !== sb) return sa - sb;
    return (a.nom||'').localeCompare(b.nom||'','fr');
  });
  const container = document.getElementById('regl-admin-content');
  if (!container) return;

  if (entries.length === 0) {
    container.classList.remove('two-col');
    container.innerHTML = `<div style="color:var(--text3);font-size:13px;padding:1rem 0">Aucune réponse pour l'instant.</div>`;
    return;
  }

  if (view === 'individuel') {
    container.classList.add('two-col');
    const total = ALL_PLAYERS.length;
    const count = entries.length;
    let html = `<div style="font-size:13px;color:var(--text3);margin-bottom:1rem;grid-column:1/-1">${count} réponse${count>1?'s':''} sur ${total} joueur${total>1?'s':''}</div>`;
    entries.forEach(r => {
      const declOk = r.check || r.statut === 'quitte';
      const declLabel = r.statut === 'quitte'
        ? 'Déclaration non requise (absent pour la saison)'
        : 'Déclaration finale lue et acceptée';
      html += `<div class="regl-respondent-card">
        <div class="regl-respondent-hd" onclick="this.parentElement.querySelector('.regl-respondent-bd').classList.toggle('open')">
          <span class="regl-respondent-name">${r.nom}</span>
          <div class="regl-respondent-meta">
            ${_reglBadgeHtml(r.statut)}
            ${declOk ? '<span style="font-size:13px">✅</span>' : '<span style="font-size:13px">⚠️</span>'}
            <span style="font-size:11px;color:var(--text3)">${r.timestamp ? new Date(r.timestamp).toLocaleDateString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}) : ''}</span>
          </div>
        </div>
        <div class="regl-respondent-bd">
          <div class="regl-check-line"><span>${declOk?'✅':'❌'}</span><span style="color:var(--text2)">${declLabel}</span></div>
          ${r.commentaire ? `<div style="margin-top:10px;padding:10px 12px;background:var(--bg3);border-radius:8px;font-size:12.5px;color:var(--text2);font-style:italic;border-left:3px solid rgba(96,165,250,.4)">💬 ${r.commentaire}</div>` : ''}
          <div style="display:flex;gap:8px;margin-top:12px">
            <button class="regl-admin-btn regl-admin-edit" onclick="_reglAdminEdit('${r.nom}')">✏️ Modifier</button>
            <button class="regl-admin-btn regl-admin-del" onclick="_reglAdminDelete('${r.nom}')">🗑 Supprimer</button>
          </div>
        </div>
      </div>`;
    });
    container.innerHTML = html;
  } else {
    container.classList.remove('two-col');
    const groups = { actif: [], plus1: [], quitte: [] };
    entries.forEach(r => { if (groups[r.statut]) groups[r.statut].push(r.nom); });
    const repondus = new Set(entries.map(r => r.nom));
    const nonRepondus = ALL_PLAYERS.filter(p => !repondus.has(p)).sort((a,b) => a.localeCompare(b,'fr'));
    const groupDefs = [
      { key: 'actif',  label: 'Réguliers',             cls: 'regl-badge-actif',  count: groups.actif.length },
      { key: 'plus1',  label: 'Occasionnels',          cls: 'regl-badge-plus1',  count: groups.plus1.length },
      { key: 'quitte', label: 'Absents pour la saison', cls: 'regl-badge-quitte', count: groups.quitte.length },
      { key: 'nonRepondu', label: "N'a pas répondu", cls: 'regl-badge-nc', count: nonRepondus.length, list: nonRepondus },
    ];
    container.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">` +
      groupDefs.map(g => `<div class="regl-sum-card">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <div class="regl-sum-title" style="margin:0">${g.label}</div>
          <span class="regl-badge ${g.cls}">${g.count}</span>
        </div>
        ${(g.list || groups[g.key]).length
          ? `<div style="display:flex;flex-wrap:wrap;gap:6px">${(g.list || groups[g.key]).map(n => `<span style="font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:20px;background:var(--bg3);color:var(--text)">${n}</span>`).join('')}</div>`
          : `<div style="font-size:12px;color:var(--text3)">Aucun</div>`
        }
      </div>`).join('') +
    `</div>`;
  }
}

function _reglAdminEdit(name) {
  const r = (_reglData || {})[name];
  if (!r) return;
  const nameSel = document.getElementById('regl-name-sel');
  if (nameSel) { nameSel.value = name; }
  _reglHideMerci();
  _reglPrefill(r);
  _reglValidate();
  document.getElementById('regl-submit-zone')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function _reglAdminDelete(name) {
  if (!confirm(`Supprimer la réponse de ${name} ?`)) return;
  if (!_db) return;
  await _db.ref('reglement_2026_2027/' + name).remove();
  if (_reglData) delete _reglData[name];
  const pill = document.querySelector('.regl-view-pill.active');
  _renderReglAdmin(pill && pill.id === 'regl-pill-recap' ? 'recap' : 'individuel');
}

function _easeOut(t) { return 1 - Math.pow(1 - t, 3); }

function animateCounters(root) {
  const sel = '.kpi-num, .pe-count, .rc-num, .ts-num, .pp-stat-val';
  (root || document).querySelectorAll(sel).forEach(el => {
    if (el.childElementCount > 0) return;
    const raw = el.textContent.trim();
    const m = raw.match(/^([+\-]?)(\d+(?:[,\.]\d+)?)(.*)$/);
    if (!m) return;
    const sign = m[1], num = m[2], suffix = m[3] || '';
    const target = parseFloat(num.replace(',', '.'));
    if (isNaN(target) || target === 0) return;
    const isFloat = num.includes(',') || num.includes('.');
    const t0 = performance.now();
    const fmt = v => sign + (isFloat ? v.toFixed(1).replace('.', ',') : String(Math.round(v))) + suffix;
    (function tick(ts) {
      const p = Math.min((ts - t0) / 650, 1);
      el.textContent = fmt(target * _easeOut(p));
      if (p < 1) requestAnimationFrame(tick);
    })(performance.now());
  });
}

function animateCards(root) {
  const sel = '.kpi-card, .match-recap-row, .record-card, .top-scorer-hero, .team-card, .buts-row, .pph-stat-tile, .pp-match-card';
  [...(root || document).querySelectorAll(sel)].forEach((el, i) => {
    el.style.opacity    = '0';
    el.style.transform  = 'translateY(8px)';
    el.style.transition = 'none';
    setTimeout(() => {
      el.style.transition = 'opacity 0.28s ease, transform 0.28s ease';
      el.style.opacity    = '';
      el.style.transform  = '';
    }, i * 40 + 20);
  });
}

function animateRows(root) {
  const sel = '.podium-entry, .palmares-row, .pp-teammate-row';
  [...(root || document).querySelectorAll(sel)].forEach((el, i) => {
    el.style.opacity    = '0';
    el.style.transform  = 'translateX(-8px)';
    el.style.transition = 'none';
    setTimeout(() => {
      el.style.transition = 'opacity 0.22s ease, transform 0.22s ease';
      el.style.opacity    = '';
      el.style.transform  = '';
    }, i * 48 + 50);
  });
}

function animateView(root) {
  animateCards(root);
  animateRows(root);
  animateCounters(root);
}

  const _pp = document.getElementById('player-panel');
  _pp.addEventListener('pointermove', e => {

    if (!cell) { _tip.classList.remove('show'); _tipCell=null; return; }
    if (cell !== _tipCell) {
      _tipCell = cell;

      _tip.innerHTML = `<div class="atn">${l0}</div>${lines.map((l,i)=>`<div class="${i===0?'atv':'atn2'}">${l}</div>`).join('')}`;
    }
    const tw=_tip.offsetWidth||180, th=_tip.offsetHeight||55;
    _tip.style.left=Math.min(e.clientX+14, window.innerWidth-tw-8)+'px';
    _tip.style.top=Math.max(e.clientY-th-10, 8)+'px';

/* ── Init async ── */
(async function() {
  await _fbLoad();

  const _hash = location.hash.slice(1);
  let _loadSaisie = false;
  if (_hash === "saisie") {
    if (sessionStorage.getItem("hmft_role") === "admin") {
      document.querySelectorAll(".main-tab").forEach(t => t.classList.remove("active"));
      document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
      document.getElementById("panel-saisie").classList.add("active");
      _loadSaisie = true;
    } else {
      history.replaceState(null, '', '#last');
    }
  } else if (_hash === "joueurs" || _hash === "sessions" || _hash === "stats" || _hash === "reglement") {
    const _tabKey = _hash === "sessions" ? "session" : _hash;
    document.querySelectorAll(".main-tab").forEach(t => t.classList.toggle("active", t.dataset.tab === _tabKey));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.toggle("active", p.id === `panel-${_tabKey}`));
  } else if (["last","month","year","all"].includes(_hash)) {
    currentPeriod = _hash;
    document.querySelectorAll(".pill").forEach(p => p.classList.toggle("active", p.dataset.period === currentPeriod));
  }
  updateSubFilter(currentPeriod);
  renderDashboard();
  populateSessionSelect();
  renderJoueurs();
  if (_hash === "stats") renderStats();
  if (_hash === "reglement") renderReglement();
  if (_loadSaisie) renderSaisie();
  if (SESSIONS.length) {
    const sorted = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
    renderSessionResults(sorted[0].date);
  } else {
    document.getElementById("session-results").innerHTML =
      `<p class="no-data" style="margin-top:1rem">Aucune session enregistrée.</p>`;
  }

  applyRole(sessionStorage.getItem("hmft_role") === "admin" ? "admin" : "user");
  updateAdminBtn();
  document.getElementById("loading-screen").style.display = "none";
})();
