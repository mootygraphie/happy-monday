      });
    }

    const _mhfSearch = container.querySelector('#mhf-search-input');
    if (_mhfSearch) {
      _mhfSearch.addEventListener('input', e => { _mhfState.search = e.target.value; _mhfRerenderMatrix(); });
    }

    const _mhfChips = container.querySelector('#mhf-cat-chips');
    if (_mhfChips) {
      _mhfChips.addEventListener('click', e => {
        const chip = e.target.closest('.pill');
        if (!chip) return;
        const cat = chip.dataset.cat;
        if (cat === '__all') { _mhfState.activeCats = new Set(MHF_CATS); }
        else if (_mhfState.activeCats.size === MHF_CATS.length) { _mhfState.activeCats = new Set([cat]); }
        else if (_mhfState.activeCats.has(cat)) { _mhfState.activeCats.delete(cat); if (!_mhfState.activeCats.size) _mhfState.activeCats = new Set(MHF_CATS); }
        else { _mhfState.activeCats.add(cat); }
        _mhfChips.innerHTML = _mhfRenderChipsHtml();
        _mhfRerenderMatrix();
      });
    }

    const _mhfHiddenToggle = container.querySelector('#mhf-hidden-toggle');
    if (_mhfHiddenToggle) {
      _mhfHiddenToggle.addEventListener('click', () => {
        _mhfState.showHidden = !_mhfState.showHidden;
        _mhfHiddenToggle.classList.toggle('on', _mhfState.showHidden);
        _mhfRerenderMatrix();
      });
    }
  }
}

/* ══════════════════════════════════════════════════════════
   DASHBOARD v2 (préfixe dbx-) — recopié du prototype approuvé.
   Agrégation étendue + rendu des sections (hero, comparatif,
   tendance, matchs marquants, classements, assiduité).
══════════════════════════════════════════════════════════ */

/* Étend computeStats() avec les données chronologiques nécessaires
   au nouveau design : buts contre par équipe, forme récente (W/N/L),
   et répartition des buts par session pour le graphique de tendance. */
function _dbxComputeAgg(sessions) {
  const st = computeStats(sessions);
  const sorted = [...sessions].sort((a,b) => new Date(a.date)-new Date(b.date));
  const allMatchsChrono = sorted.flatMap(s => (s.matchs||[]).map(m => ({...m, date:s.date})));
  const goalsAgainst = {Rouge:0, Vert:0, Bleue:0};
  const results = {Rouge:[], Vert:[], Bleue:[]};
  let draws = 0;
  allMatchsChrono.forEach(m => {
    goalsAgainst[m.eqA] = (goalsAgainst[m.eqA]||0) + m.scoreB;
    goalsAgainst[m.eqB] = (goalsAgainst[m.eqB]||0) + m.scoreA;
    let winner = null;
    if (m.scoreA > m.scoreB) winner = m.eqA;
    else if (m.scoreB > m.scoreA) winner = m.eqB;
    else draws++;
    results[m.eqA].push(winner===m.eqA ? "w" : winner ? "l" : "n");
    results[m.eqB].push(winner===m.eqB ? "w" : winner ? "l" : "n");
  });
  const totalGoals = allMatchsChrono.reduce((a,m) => a+m.scoreA+m.scoreB, 0);
  const maxWins = Math.max(0, st.colorWins.Rouge, st.colorWins.Vert, st.colorWins.Bleue);
  const leaders = ["Rouge","Vert","Bleue"].filter(t => st.colorWins[t]===maxWins && maxWins>0);
  const totalPres = sessions.reduce((a,s) => a + Object.values(s.presences).filter(p=>p.statut==="Présent").length, 0);
  const totalAbs  = sessions.reduce((a,s) => a + Object.values(s.presences).filter(p=>p.statut==="Absent").length, 0);
  const totalBles = sessions.reduce((a,s) => a + Object.values(s.presences).filter(p=>p.statut==="Blessé").length, 0);
  const byAlpha = (a,b) => a[0].localeCompare(b[0], "fr");
  const topScorers  = st.buteursRank.slice(0,5);
  const topAssists  = st.passeursRank.slice(0,5);
  const topPresence = Object.entries(st.ps)
    .filter(([n,p]) => p.presences>0 && !JOKERS.has(n))
    .sort((a,b) => b[1].presences-a[1].presences || byAlpha(a,b)).slice(0,5);
  const goalsBySession = sorted.map(s => ({ date: s.date, goals: (s.matchs||[]).reduce((a,m) => a+m.scoreA+m.scoreB, 0) }));
  /* Clean sheets : une equipe garde sa cage inviolee des qu elle ne concede aucun
     but sur un match (un nul 0-0 compte pour les 2 equipes). */
  const totalCleanSheets = allMatchsChrono.reduce((a,m) => a + (m.scoreB===0?1:0) + (m.scoreA===0?1:0), 0);
  return {
    allMatchs: allMatchsChrono, ps: st.ps, colorWins: st.colorWins, draws,
    goalsFor: st.goalsPerTeam, goalsAgainst, totalGoals, leaders, maxWins,
    topScorers, topAssists, topPresence, totalPres, totalAbs, totalBles, totalCleanSheets,
    mostGoals: st.mostGoals, biggestAmp: st.biggestAmp, results, goalsBySession,
    sessionsCount: sessions.length
  };
}

function _dbxSparkSvg(values, color) {
  if (values.length < 2) return "";
  const w=110, h=32, pad=3;
  const max = Math.max(...values), min = Math.min(...values);
  const range = (max-min)||1;
  const pts = values.map((v,i) => [pad+(i*(w-2*pad)/(values.length-1)), h-pad-((v-min)/range)*(h-2*pad)]);
  const line = pts.map(p=>p.join(",")).join(" ");
  const area = `${pad},${h-pad} ${line} ${w-pad},${h-pad}`;
  const last = pts[pts.length-1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polygon points="${area}" fill="${color}" opacity=".14"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/>
  </svg>`;
}

function _dbxFmtDateShort(d) {
  const [,m,j] = d.split("-");
  return `${parseInt(j)} ${MONTH_NAMES[parseInt(m)-1].slice(0,3)}`;
}

function _dbxTag(t) {
  return `<span class="dbx-tag ${t.toLowerCase()}">${dot(t)}${TEAM_LABEL[t]||t}</span>`;
}

function _dbxRenderHero(agg) {
  const avgGoals = agg.allMatchs.length ? (agg.totalGoals/agg.allMatchs.length).toFixed(1) : "—";
  const leaderHtml = agg.leaders.length
    ? agg.leaders.map(t => `${dot(t)}<span class="dbx-txt ${t.toLowerCase()}">${TEAM_LABEL[t]}</span>`).join(" &amp; ")
    : "—";
  const sparkVals = agg.goalsBySession.slice(-10).map(g=>g.goals);
  return `<div class="dbx-hero-grid">
    <div class="dbx-hero-card">
      <div class="dbx-hero-lbl">Matchs joués</div>
      <div class="dbx-hero-num">${agg.allMatchs.length}</div>
      <div class="dbx-hero-sub">${agg.sessionsCount} session${agg.sessionsCount>1?"s":""}</div>
    </div>
    <div class="dbx-hero-card">
      <div class="dbx-hero-lbl">Buts marqués</div>
      <div class="dbx-hero-num">${agg.totalGoals}</div>
      <div class="dbx-hero-sub">${avgGoals} buts / match en moy.</div>
      ${sparkVals.length>1?`<div class="dbx-hero-spark">${_dbxSparkSvg(sparkVals,'#f5c842')}</div>`:""}
    </div>
    <div class="dbx-hero-card">
      <div class="dbx-hero-lbl">Équipe en tête</div>
      <div class="dbx-hero-num dbx-team">${leaderHtml}</div>
      <div class="dbx-hero-sub">${agg.maxWins} victoire${agg.maxWins!==1?"s":""}</div>
    </div>
    <div class="dbx-hero-card">
      <div class="dbx-hero-lbl">Clean sheets</div>
      <div class="dbx-hero-num">${agg.totalCleanSheets}</div>
      <div class="dbx-hero-sub">${agg.totalCleanSheets} / ${agg.allMatchs.length} match${agg.allMatchs.length>1?"s":""}</div>
    </div>
  </div>`;
}

function _dbxRenderCompare(agg) {
  const T3 = ["Rouge","Vert","Bleue"];
  const maxW = Math.max(1, ...T3.map(t=>agg.colorWins[t]||0));
  const bars = T3.map(t => `
    <div class="dbx-cmp-row">
      <div class="dbx-cmp-label">${dot(t)}${TEAM_LABEL[t]}</div>
      <div class="dbx-cmp-track"><div class="dbx-cmp-fill" style="width:${(agg.colorWins[t]||0)/maxW*100}%;background:var(--${teamCls(t)})"></div></div>
      <div class="dbx-cmp-val">${agg.colorWins[t]||0}</div>
    </div>`).join("");

  const teamCards = T3.map(t => {
    const w = agg.colorWins[t]||0, gf = agg.goalsFor[t]||0, ga = agg.goalsAgainst[t]||0, diff = gf-ga;
    const played = agg.results[t].length;
    const losses = agg.results[t].filter(r=>r==="l").length;
    const nuls = agg.results[t].filter(r=>r==="n").length;
    const isLeader = agg.leaders.includes(t) && agg.maxWins>0;
    const cls = t.toLowerCase();
    const form = agg.results[t].slice(-5).map(r => `<span class="dbx-form-chip ${r}">${r==="w"?"V":r==="n"?"N":"D"}</span>`).join("");
    return `<div class="dbx-card dbx-team-card">
      <div class="dbx-team-accent ${cls}"></div>
      <div class="dbx-team-top">
        <span class="dbx-team-name dbx-txt ${cls}">${dot(t)}${TEAM_LABEL[t]}</span>
        ${isLeader?'<span class="dbx-team-crown">👑</span>':""}
        <span class="dbx-team-wins">${played} match${played>1?"s":""}</span>
      </div>
      <div class="dbx-team-body">
        <div class="dbx-wdl"><span class="w">${w} V</span><span class="n">${nuls} N</span><span class="l">${losses} D</span></div>
        <div class="dbx-team-gf"><span>${gf} pour &middot; ${ga} contre</span><span class="diff ${diff>=0?"pos":"neg"}">${diff>0?"+":""}${diff}</span></div>
        ${played?`<div class="dbx-form-lbl">Forme</div><div class="dbx-form-row">${form}</div>`:""}
      </div>
    </div>`;
  }).join("");

  return `<div class="dbx-card dbx-cmp-card">${bars}</div><div class="dbx-team-grid">${teamCards}</div>`;
}

function _dbxTrendChart(agg) {
  const data = agg.goalsBySession;
  const single = data.length <= 1;
  const points = single
    ? agg.allMatchs.map(m => ({ label: `${(TEAM_LABEL[m.eqA]||m.eqA).slice(0,3)}-${(TEAM_LABEL[m.eqB]||m.eqB).slice(0,3)}`, goals: m.scoreA+m.scoreB }))
    : data.map(d => ({ label: _dbxFmtDateShort(d.date), goals: d.goals }));
  if (!points.length) return `<div class="dbx-card dbx-trend-card"><p style="color:var(--text3);font-size:13px;font-style:italic;margin:0">Aucune donnée.</p></div>`;

  const w = Math.max(360, points.length*46), h = 130, padB = 22, padT = 10;
  const max = Math.max(...points.map(p=>p.goals), 1);
  const barW = Math.min(28, (w/points.length)*0.55);
  const step = w/points.length;
  const avg = points.reduce((a,p)=>a+p.goals,0)/points.length;

  const bars = points.map((p,i) => {
    const x = i*step + (step-barW)/2;
    const bh = Math.max(2, (p.goals/max)*(h-padB-padT));
    const y = h-padB-bh;
    return `<g class="dbx-trend-bar">
      <rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="var(--gold)" opacity=".82"/>
      <text x="${x+barW/2}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="var(--text3)" font-family="inherit">${p.label}</text>
      <title>${p.label} — ${p.goals} but${p.goals>1?"s":""}</title>
    </g>`;
  }).join("");

  const avgY = h-padB-(avg/max)*(h-padB-padT);
  const avgLine = points.length>1 ? `<line x1="0" y1="${avgY}" x2="${w}" y2="${avgY}" stroke="var(--text3)" stroke-width="1" stroke-dasharray="3,3" opacity=".6"/>` : "";

  return `<div class="dbx-card dbx-trend-card">
    <div class="dbx-trend-top">
      <span class="dbx-trend-top-lbl">${single?"Répartition par match":"Buts marqués par session"}</span>
      <span class="dbx-trend-top-val">Moyenne <b>${avg.toFixed(1)}</b> buts</span>
    </div>
    <div class="dbx-trend-svg-wrap">
      <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${avgLine}${bars}</svg>
    </div>
  </div>`;
}

function _dbxHighlightCards(agg) {
  function card(lbl, m) {
    if (!m) return `<div class="dbx-card dbx-hl-card"><div class="dbx-hl-lbl">${lbl}</div><p style="color:var(--text3);font-size:12.5px;font-style:italic;margin:0">—</p></div>`;
    const goalsA = _matchGoalsRecapHTML(m.buteursA, m.passeursA);
    const goalsB = _matchGoalsRecapHTML(m.buteursB, m.passeursB);
    return `<div class="dbx-card dbx-hl-card">
      <div class="dbx-hl-lbl">${lbl}</div>
      <div class="dbx-hl-score">
        <div class="dbx-hl-side"><div class="n">${m.scoreA}</div><div class="t">${_dbxTag(m.eqA)}</div></div>
        <div class="dbx-hl-dash">–</div>
        <div class="dbx-hl-side"><div class="n">${m.scoreB}</div><div class="t">${_dbxTag(m.eqB)}</div></div>
      </div>
      <div class="dbx-hl-goals"><div>${goalsA?`⚽ ${goalsA}`:""}</div><div class="r">${goalsB?`⚽ ${goalsB}`:""}</div></div>
      <div class="dbx-hl-date">${fmtDate(m.date)}</div>
    </div>`;
  }
  return `<div class="dbx-hl-grid">${card("Plus gros score", agg.mostGoals)}${card("Plus grand écart", agg.biggestAmp)}</div>`;
}

function _dbxLeaderCol(title, icon, entries, unit) {
  if (!entries.length) return `<div class="dbx-card dbx-lead-card"><div class="dbx-lead-head">${icon} ${title}</div><div class="dbx-lead-empty">Aucune donnée</div></div>`;
  const max = entries[0][1][unit];
  const rows = entries.map(([name,p],i) => `
    <div class="dbx-lead-row r${i+1}">
      <div class="dbx-lead-rank">${i+1}</div>
      <div class="dbx-lead-name">${pLink(name)}</div>
      <div class="dbx-lead-bar-wrap"><div class="dbx-lead-bar" style="width:${max?p[unit]/max*100:0}%"></div></div>
      <div class="dbx-lead-val">${p[unit]}</div>
    </div>`).join("");
  return `<div class="dbx-card dbx-lead-card"><div class="dbx-lead-head">${icon} ${title}</div>${rows}</div>`;
}

function _dbxRenderAssiduity(agg) {
  const avgPres = agg.sessionsCount ? (agg.totalPres/agg.sessionsCount).toFixed(1) : "—";
  return `<div class="dbx-assid-grid">
    <div class="dbx-card dbx-assid-card"><div class="dbx-assid-num">${agg.sessionsCount}</div><div class="dbx-assid-lbl">Sessions</div></div>
    <div class="dbx-card dbx-assid-card"><div class="dbx-assid-num">${avgPres}</div><div class="dbx-assid-lbl">Moy. présents / session</div></div>
    <div class="dbx-card dbx-assid-card"><div class="dbx-assid-num">${agg.totalAbs}</div><div class="dbx-assid-lbl">Absences</div></div>
    <div class="dbx-card dbx-assid-card"><div class="dbx-assid-num">${agg.totalBles}</div><div class="dbx-assid-lbl">Blessures</div></div>
  </div>`;
}

function renderDashboard() {
  const sessions = filterSessions(currentPeriod);
  const dash = document.getElementById("dash");

  const latestDate = SESSIONS.length
    ? fmtDate([...SESSIONS].sort((a,b)=>new Date(b.date)-new Date(a.date))[0].date)
    : "—";
  document.getElementById("header-sub").textContent = `Dernière session : ${latestDate}`;

  if (!sessions.length) {
    dash.innerHTML = '<p class="no-data" style="margin-top:2rem">Aucune session pour cette période.</p>';
    return;
  }

  const agg = _dbxComputeAgg(sessions);
  let h = "";

  h += _dbxRenderHero(agg);

  h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Comparatif équipes</span><span class="dbx-sec-note">Victoires, forme et différentiel</span></div>`;
  h += _dbxRenderCompare(agg);

  h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Tendance</span></div>`;
  h += _dbxTrendChart(agg);

  h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Matchs marquants</span></div>`;
  h += _dbxHighlightCards(agg);

  h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Classements</span><span class="dbx-sec-note">Sur la période sélectionnée</span></div>`;
  h += `<div class="dbx-lead-grid">
    ${_dbxLeaderCol("Buteurs","⚽",agg.topScorers,"buts")}
    ${_dbxLeaderCol("Passeurs","🎯",agg.topAssists,"passes")}
    ${_dbxLeaderCol("Présences","✅",agg.topPresence,"presences")}
  </div>`;

  h += `<div class="dbx-sec-head"><span class="dbx-sec-title">Assiduité</span></div>`;
  h += _dbxRenderAssiduity(agg);

  dash.innerHTML = h;
  animateView(dash);
}

function populateSessionSelect() {
  const sel = document.getElementById("session-date");
  const ddLabel = document.getElementById("sess-dd-label");
  const ddPanel = document.getElementById("sess-dd-panel");
  sel.innerHTML = "";
  if (!SESSIONS.length) {
    sel.innerHTML = `<option value="">Aucune session disponible</option>`;
    if (ddLabel) ddLabel.textContent = "Aucune session";
    if (ddPanel) ddPanel.innerHTML = "";
    return;
  }
  const sorted = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
  sorted.forEach((s, i) => {
    const opt = document.createElement("option");
    opt.value = s.date;
    opt.textContent = fmtDate(s.date);
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  });
  if (ddPanel) {
    ddPanel.innerHTML = sorted.map((s, i) =>
      `<button type="button" class="sess-dd-opt${i===0?" active":""}" data-date="${s.date}">${fmtDate(s.date)}</button>`
    ).join("");
  }
  _syncSessDd(sorted[0].date);
}

function _syncSessDd(date) {
  const ddLabel = document.getElementById("sess-dd-label");
  const btn = document.querySelector(`.sess-dd-opt[data-date="${date}"]`);
  if (ddLabel) ddLabel.textContent = btn ? btn.textContent : fmtDate(date);
  document.querySelectorAll(".sess-dd-opt").forEach(o => o.classList.toggle("active", o === btn));
}

document.getElementById("sess-dd-btn").addEventListener("click", () => {
  document.getElementById("sess-dd").classList.toggle("open");
});
document.getElementById("sess-dd-panel").addEventListener("click", e => {
  const btn = e.target.closest(".sess-dd-opt");
  if (!btn) return;
  const sel = document.getElementById("session-date");
  sel.value = btn.dataset.date;
  _syncSessDd(btn.dataset.date);
  document.getElementById("sess-dd").classList.remove("open");
  sel.dispatchEvent(new Event("change"));
});
document.addEventListener("click", e => {
  const dd = document.getElementById("sess-dd");
  if (dd.classList.contains("open") && !dd.contains(e.target)) dd.classList.remove("open");
});


function renderSessionResults(date) {
  const container = document.getElementById("session-results");
  const session = SESSIONS.find(s => s.date === date);
  if (!session) {
    container.innerHTML = `<p class="no-data" style="margin-top:1rem">Aucune donnée pour cette session.</p>`;
    return;
  }
  container.innerHTML = renderSessionDetailV2(session);
  animateView(container);
  _sfmBindTicker(container);
}

/* Segment « Session / Mois / Saison / All-time » — highlight glissant.
   Mesure uniquement la position/largeur de son propre bouton actif
   (pas de couplage avec un autre élément indépendant). */
function _dbxPlaceSegHi(btn) {
  const hi = document.getElementById("dbx-seg-hi");
  if (!hi || !btn) return;
  hi.style.left = btn.offsetLeft + "px";
  hi.style.width = btn.offsetWidth + "px";
}
(function _dbxInitSeg() {
  const seg = document.getElementById("dbx-seg");
  if (!seg) return;
  seg.querySelectorAll(".dbx-seg-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.period === currentPeriod);
    btn.addEventListener("click", () => {
      seg.querySelectorAll(".dbx-seg-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      _dbxPlaceSegHi(btn);
      currentPeriod = btn.dataset.period;
      history.replaceState(null, '', '#' + currentPeriod);
      updateSubFilter(currentPeriod);
      renderDashboard();
    });
  });
  requestAnimationFrame(() => _dbxPlaceSegHi(seg.querySelector(".dbx-seg-btn.active")));
  window.addEventListener("resize", () => _dbxPlaceSegHi(seg.querySelector(".dbx-seg-btn.active")));
})();

   (motif sess-dd existant, espace de noms dbx- dédié). */

  if (dd && dd.classList.contains("open") && !dd.contains(e.target)) dd.classList.remove("open");
});

document.getElementById("delete-session-btn").addEventListener("click", () => {
  const sel = document.getElementById("session-date");
  const date = sel.value;
  if (!date) return;

  if (!confirm(`Supprimer la session du ${fmtDate(date)} ?\n\nCette action est définitive.`)) return;

  // Retirer du tableau en mémoire
  const idx = SESSIONS.findIndex(s => s.date === date);
  if (idx !== -1) SESSIONS.splice(idx, 1);

  // Supprimer dans Firebase
  _fbDeleteSession(date).catch(() => {
    alert('⚠️ Suppression locale effectuée mais la synchronisation Firebase a échoué.\nVérifiez votre connexion.');
  });

  // Rafraîchir l'UI
  populateSessionSelect();
  renderDashboard();
  const newSel = document.getElementById("session-date");
  if (newSel.value) {
    renderSessionResults(newSel.value);
  } else {
    document.getElementById("session-results").innerHTML =
      `<p class="no-data" style="margin-top:1rem">Aucune session enregistrée.</p>`;
  }
});

document.getElementById("edit-session-btn").addEventListener("click", () => {
  const sel = document.getElementById("session-date");

  if (!date) return;
  const session = SESSIONS.find(s => s.date === date);
  if (!session) return;
  _editMode = true;
  _draft = _loadSessionIntoDraft(session);

  _resetSaisieUiState();
  document.querySelectorAll(".main-tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel-saisie").classList.add("active");
  history.replaceState(null, '', '#saisie');
  renderSaisie();
});

let rosterSort = { col: "taux",      dir: 1 };
let jokerSort  = { col: "presences", dir: 1 };

function computePlayerStats() {
  const ps = {};
  ALL_PLAYERS.forEach(p => {
    ps[p] = { presences:0, absences:0, blesses:0, pasRepondu:0, buts:0, passes:0, vR:0, vV:0, vB:0, sac:0, maillots:0 };
  });

  SESSIONS.forEach(s => {
    Object.entries(s.presences).forEach(([p, info]) => {
      if (!ps[p]) ps[p] = { presences:0, absences:0, blesses:0, pasRepondu:0, buts:0, passes:0, vR:0, vV:0, vB:0, sac:0, maillots:0 };
      if      (info.statut === "Présent")     ps[p].presences++;
      else if (info.statut === "Absent")      ps[p].absences++;
      else if (info.statut === "Blessé")      ps[p].blesses++;
      else if (info.statut === "Pas répondu") ps[p].pasRepondu++;
    });
    if (s.sac     && ps[s.sac])     ps[s.sac].sac++;
    if (s.maillots && ps[s.maillots]) ps[s.maillots].maillots++;
    if (s.matchs) {
      s.matchs.forEach(m => {
        ["A","B"].forEach(side => {
          const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
          buts.forEach((b,i) => {
            if (!b || b==="CSC") return;
            if (ps[b]) ps[b].buts++;
            const p = passes[i]; if (p && p!=="CSC" && ps[p]) ps[p].passes++;
          });
        });
        const winner = m.scoreA > m.scoreB ? m.eqA : m.scoreB > m.scoreA ? m.eqB : null;
        if (winner) {
          Object.entries(s.presences).forEach(([p, info]) => {
            if (info.statut === "Présent" && info.equipe === winner && ps[p]) {
              if (winner==="Rouge") ps[p].vR++; else if (winner==="Vert") ps[p].vV++; else ps[p].vB++;
            }
          });
        }
      });
    }
  });

  return Object.entries(ps).map(([name, d]) => {
    const best = Math.max(d.vR, d.vV, d.vB);
    const favTeam = best === 0 ? null : d.vR === best ? "Rouge" : d.vV === best ? "Vert" : "Bleue";
    return { name, ...d, favTeam };
  });
}


function renderJoueurs() {
  const container = document.getElementById("joueurs-content");
  const rows = computePlayerStats();
  const totalSessions = SESSIONS.length;
  const isAdmin = sessionStorage.getItem("hmft_role") === "admin";

  const colDef = [
    { key:"name",       label:"Joueur"         },
    { key:"taux",       label:"%"              },
    { key:"absences",   label:"❌"             },
    { key:"blesses",    label:"🤕"             },
    { key:"pasRepondu", label:"⁉️"             },
    { key:"sac",        label:"🎒"             },
    { key:"maillots",   label:"👕"             },
  ];
  const jokerColDef = [
    { key:"name",       label:"Joueur"         },
    { key:"presences",  label:"✅"             },
  ];

  const rowsWithTaux = rows.map(r => ({
    ...r,
    taux: totalSessions > 0 ? Math.round(r.presences / totalSessions * 100) : 0
  }));

  const rosterRows = rowsWithTaux.filter(r => !JOKERS.has(r.name) && !ABSENTS.has(r.name));
  const jokerRows  = rowsWithTaux.filter(r =>  JOKERS.has(r.name));

  const _initialsMap = computeAllInitials([...new Set([...ALL_PLAYERS, ...rowsWithTaux.map(r => r.name), ...ABSENTS])]);

  function sortArr(arr, s) {
    return [...arr].sort((a, b) => {
      const av = a[s.col] ?? ""; const bv = b[s.col] ?? "";
      if (typeof av === "number" && typeof bv === "number") {
        const diff = (bv - av) * s.dir;
        return diff !== 0 ? diff : a.name.localeCompare(b.name, "fr");
      }
      const diff = String(av).localeCompare(String(bv), "fr") * s.dir;
      return diff !== 0 ? diff : a.name.localeCompare(b.name, "fr");
    });
  }

  function initials(n) { return _initialsMap[n] || n.slice(0,2).toUpperCase(); }

  function buildSortRow(id, cols, state) {
    return `<div class="roster-sort-row" id="${id}">${cols.map(c => {
      const active = state.col === c.key;
      const arrow  = active ? (state.dir === 1 ? "↑" : "↓") : "↕";
      return `<button class="roster-sort-pill${active ? " active" : ""}" data-col="${c.key}">${c.label}<span class="arrow">${arrow}</span></button>`;
    }).join("")}</div>`;
  }

  function bindSortRow(id, state) {
    document.getElementById(id)?.querySelectorAll("[data-col]").forEach(btn => {
      btn.addEventListener("click", () => {
        const col = btn.dataset.col;
        if (state.col === col) state.dir *= -1;
        else { state.col = col; state.dir = col === "name" ? 1 : -1; }
        renderJoueurs();
      });
    });
  }

  function chip(icon, val, cls) {
    if (!val) return "";
    return `<span class="roster-chip ${cls || ""}"><span class="roster-chip-ico">${icon}</span> ${val}</span>`;
  }

  function buildRosterCard(r) {
    const tCls = r.taux >= 75 ? "high" : r.taux >= 40 ? "mid" : "low";
    const chips = chip("❌", r.absences, "danger") + chip("🤕", r.blesses, "warn") + chip("⁉️", r.pasRepondu, "warn") + chip("🎒", r.sac) + chip("👕", r.maillots);
    const action = isAdmin ? `<div class="roster-actions"><button data-action="to-joker" data-player="${r.name}" title="Passer en occasionnel">🔽</button></div>` : "";
    return `<div class="roster-card">
      <div class="roster-avatar">${initials(r.name)}</div>
      <div class="roster-main">
        <button class="roster-name player-link" data-player="${r.name}">${r.name}</button>
        <div class="roster-taux">
          <div class="roster-taux-track"><div class="roster-taux-fill ${tCls}" style="width:${r.taux}%"></div></div>
          <span class="roster-taux-val ${tCls}">${r.taux}%</span>
        </div>
      </div>
      <div class="roster-chips">${chips}</div>
      ${action}
    </div>`;
  }

  function buildJokerCard(r) {
    const action = isAdmin ? `<div class="roster-actions">
      <button data-action="to-roster" data-player="${r.name}" title="Passer en régulier">🔼</button>
      <button data-action="to-absent" data-player="${r.name}" title="Marquer absent pour la saison">🔽</button>
    </div>` : "";
    return `<div class="roster-card">
      <div class="roster-avatar dim">${initials(r.name)}</div>
      <div class="roster-main">
        <button class="roster-name player-link" data-player="${r.name}">${r.name}</button>
        <div class="roster-sub"><b>${r.presences}</b> venue${r.presences > 1 ? "s" : ""} cette saison</div>
      </div>
      ${action}
    </div>`;
  }

  function buildAbsentCard(name) {
    const action = isAdmin ? `<div class="roster-actions"><button data-action="to-joker" data-player="${name}" title="Passer en occasionnel">🔼</button></div>` : "";
    return `<div class="roster-card">
      <div class="roster-avatar dim">${initials(name)}</div>
      <div class="roster-main">
        <button class="roster-name player-link" data-player="${name}">${name}</button>
        <div class="roster-sub">Absent pour la saison</div>
      </div>
      ${action}
    </div>`;
  }

  const rosterCards = sortArr(rosterRows, rosterSort).map(buildRosterCard).join("");
  const jokerCards  = sortArr(jokerRows, jokerSort).map(buildJokerCard).join("");
  const absentNames = [...ABSENTS].sort((a,b) => a.localeCompare(b,'fr'));
  const absentCards = absentNames.map(buildAbsentCard).join("");

  const jokerSection = jokerRows.length > 0 ? `
    <div class="joueurs-section-label" style="margin-top:2rem">Occasionnels (${jokerRows.length})</div>
    ${buildSortRow("jokers-sort", jokerColDef, jokerSort)}
    <div class="roster-list">${jokerCards}</div>` : '';

  const absentSection = absentNames.length > 0 ? `
    <div class="joueurs-section-label" style="margin-top:2rem">Absents pour la saison (${absentNames.length})</div>
    <div class="roster-list">${absentCards}</div>` : '';

  container.innerHTML = `
    <div class="joueurs-section-label">Réguliers (${rosterRows.length})</div>
    ${buildSortRow("roster-sort", colDef, rosterSort)}
    <div class="roster-list">${rosterCards}</div>
    ${jokerSection}${absentSection}`;

  bindSortRow("roster-sort", rosterSort);
  bindSortRow("jokers-sort", jokerSort);
}

document.getElementById("joueurs-content").addEventListener("click", e => {
  const btn = e.target.closest('[data-action]');
  if (!btn || !['to-roster','to-joker','to-absent'].includes(btn.dataset.action)) return;
  e.stopPropagation();
  const player = btn.dataset.player;
  const action = btn.dataset.action;
  if (action === 'to-roster')  { JOKERS.delete(player); ABSENTS.delete(player); _saveJokers(); _saveAbsents(); }
  if (action === 'to-joker')   { ABSENTS.delete(player); JOKERS.add(player);    _saveAbsents(); _saveJokers(); }
  if (action === 'to-absent')  { JOKERS.delete(player); ABSENTS.add(player);    _saveJokers(); _saveAbsents(); }
  renderJoueurs();
});

function computePlayerDetailStats(playerName) {
  const sessionsByDate = [...SESSIONS].sort((a,b) => new Date(a.date)-new Date(b.date));
  let presences = 0, absences = 0, blesses = 0, buts = 0, episodesBlessures = 0, pasRepondu = 0, inEpisode = false;
  let matchsJoues = 0, victoires = 0, defaites = 0, sac = 0, maillots = 0, passesDecisives = 0;
  const teamCount = {}, winsByColor = {}, teammateCount = {}, winTeammateCount = {};
  let bestMatch = null, bestMatchGoals = 0, bestMatchAssists = 0, bestMatchGA = 0;

  sessionsByDate.forEach(s => {
    const info = s.presences[playerName];
    if (!info) { inEpisode = false; return; }
    if (info.statut === "Présent") {
      presences++; inEpisode = false;
      if (s.sac === playerName) sac++;
      if (s.maillots === playerName) maillots++;
      const myEquipe = info.equipe || null;
      if (myEquipe) {
        teamCount[myEquipe] = (teamCount[myEquipe] || 0) + 1;
        Object.entries(s.presences).forEach(([other, oi]) => {
          if (other === playerName || oi.statut !== "Présent" || oi.equipe !== myEquipe) return;
          teammateCount[other] = (teammateCount[other] || 0) + 1;
        });
      }
      (s.matchs || []).forEach(m => {
        let g = 0, a = 0;
        ["A","B"].forEach(side => {
          const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
          buts.forEach((b,i) => {
            if (!b || b==="CSC") return;
            if (b === playerName) g++;
            const p = passes[i]; if (p && p!=="CSC" && p === playerName) a++;
          });
        });
        buts += g;
        passesDecisives += a;
        const ga = g + a;
        if (ga > bestMatchGA) { bestMatchGA = ga; bestMatchGoals = g; bestMatchAssists = a; bestMatch = {...m, date: s.date}; }
        if (!myEquipe || (m.eqA !== myEquipe && m.eqB !== myEquipe)) return;
        matchsJoues++;
        const winner = m.scoreA > m.scoreB ? m.eqA : m.scoreB > m.scoreA ? m.eqB : null;
        if (winner === myEquipe) {
          victoires++;
          winsByColor[myEquipe] = (winsByColor[myEquipe] || 0) + 1;
          Object.entries(s.presences).forEach(([other, oi]) => {
            if (other === playerName || oi.statut !== "Présent" || oi.equipe !== myEquipe) return;
            winTeammateCount[other] = (winTeammateCount[other] || 0) + 1;
          });
        } else if (winner !== null) {
          defaites++;
        }
      });
    } else if (info.statut === "Absent") {
      absences++; inEpisode = false;
    } else if (info.statut === "Blessé") {
      blesses++;
      if (!inEpisode) { episodesBlessures++; inEpisode = true; }
    } else if (info.statut === "Pas répondu") {
      pasRepondu++; inEpisode = false;
    } else {
      inEpisode = false;
    }
  });

  const top3T  = Object.entries(teammateCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const top3WT = Object.entries(winTeammateCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const maxTeam = Math.max(0, ...Object.values(teamCount));
  const recurringColor = maxTeam > 0 ? Object.entries(teamCount).sort((a,b)=>b[1]-a[1])[0][0] : null;
  const maxWins = Math.max(0, ...Object.values(winsByColor));
  const prefWinColor = maxWins > 0 ? Object.entries(winsByColor).sort((a,b)=>b[1]-a[1])[0][0] : null;

  /* Meilleure série G/A — par MATCH joué (présent + équipe jouait).
     Seul un match joué à 0 G/A coupe la série ; les absences ne la cassent pas. */
  const participatedMatches = [];
  sessionsByDate.forEach(s => {
    const info = s.presences[playerName];
    if (!info || info.statut !== "Présent") return;
    const myEquipe = info.equipe;
    if (!myEquipe) return;
    (s.matchs || []).forEach(m => {
      if (m.eqA !== myEquipe && m.eqB !== myEquipe) return;
      let g = 0, a = 0;
      ["A","B"].forEach(side => {
        const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
        buts.forEach((b,i) => {
          if (!b || b==="CSC") return;
          if (b === playerName) g++;
          const p = passes[i]; if (p && p!=="CSC" && p === playerName) a++;
        });
      });
      participatedMatches.push({ date: s.date, g, a });
    });
  });

  let bestHistoricalStreak = null;
  let currentStreak       = null;
  let _scur = null;

  const _finalizeStreak = (active) => {
    if (!_scur) return;
    const s = { start: _scur.start, end: _scur.end, count: _scur.count, g: _scur.g, a: _scur.a };
    _scur = null;
    if (active) {
      currentStreak = s;
    } else if (!bestHistoricalStreak || s.count > bestHistoricalStreak.count ||
               (s.count === bestHistoricalStreak.count && (s.g+s.a) > (bestHistoricalStreak.g+bestHistoricalStreak.a))) {
      bestHistoricalStreak = s;
    }
  };

  for (const pm of participatedMatches) {
    if (pm.g + pm.a > 0) {
      if (!_scur) _scur = { start: pm.date, end: pm.date, count: 0, g: 0, a: 0 };
      _scur.end = pm.date;
      _scur.count++;
      _scur.g += pm.g;
      _scur.a += pm.a;
    } else {
      _finalizeStreak(false);
    }
  }
  _finalizeStreak(true);

  return { presences, absences, blesses, episodesBlessures, pasRepondu, buts, passesDecisives,
           matchsJoues, victoires, defaites, sac, maillots,
           bestMatch, bestMatchGoals, bestMatchAssists, recurringColor, teamCount,
           top3Teammates: top3T, top3WinTeammates: top3WT, prefWinColor, maxWins,
           bestHistoricalStreak, currentStreak };
}

  soiree:     'Soirées terminées avec 100 % de victoires',
  dbl:        'Matchs avec 1 but et 1 passe dans le même match',
  invic:      'Soirées sans la moindre défaite',
  defenseFer: 'Matchs joués sans encaisser de but',
  mur:          'Clean sheets en tant que gardien (1 par match)',
  passoire:     'Buts encaissés en gardant les buts',
  gardienAssist:'Passe décisive en tant que gardien',
  willgrigg:  'Au moins 3 buts dans un même match',
  mesutozil:  'Au moins 3 passes décisives dans un même match',
  patron:     'Implique (but ou passe) sur 100% des buts de son équipe, minimum 4 buts',
  mercenaire: 'Buts marqués pour l\'équipe dépannée plutôt que la sienne',
  remontada:  'Remontadas — perdant d\'au moins 2 buts à la mi-temps, vainqueur à la fin',
  duo:        'But + passe répétés avec le même partenaire',
  mvp:        'Nommé MVP de la soirée',
  pois:       'Buts contre son camp',
  chelem:     'Avoir été meilleure équipe de la soirée dans les 3 couleurs',
  fantome:    'Sessions consécutives sans aucun G/A',
  legende:    'Total de niveaux débloqués (tous hauts faits confondus)',
  assidu:     'Taux de présence annuel élevé (≥ seuil sur une année complète)',
  comete:     'Taux de présence annuel très faible (≤ seuil sur une année complète)',
  zerovic:    'Soirées sans aucune victoire',
  toutnul:    'Soirées où tous les matchs sont nuls',
};

function _achLevel(val, tiers) {
  let lv=0; for(let i=0;i<tiers.length;i++){if(val>=tiers[i])lv=i+1;else break;} return lv;
}

function computeAchievementStats(playerName) {
  const _ss = [...SESSIONS].sort((a,b)=>new Date(a.date)-new Date(b.date));
  let buts=0,passes=0,presences=0,absences=0,injuries=0,sessionsBlesses=0,sac=0,maillots=0;
  let hattricks=0,assistHattricks=0,patronCount=0,doubleDouble=0,cleanSheets=0,mvp=0,soireeParfaite=0,invincible=0,csc=0,zeroVict=0,toutNul=0;
  let gardiensCleanSheets=0,gardiensButsEncaisses=0,gardiensMatchs=0,remontadas=0,gardienAssist=0,mercenaireCount=0;
  const chelemColors=new Set(), duoMap={};
  let inEp=false, bestStreak=0, curStreak=0, fantomeStreak=0, sessionsAvecGA=0;
  const yearMap={};

  _ss.forEach(s => {
    const info=s.presences[playerName]; if(!info){inEp=false;return;}
    const yr=new Date(s.date).getFullYear();
    if(!yearMap[yr]) yearMap[yr]={present:0,total:0};
    if(info.statut==="Présent"||info.statut==="Absent") yearMap[yr].total++;

    if(info.statut==="Présent") {
      presences++; yearMap[yr].present++; inEp=false;
      if(s.sac===playerName) sac++;
      if(s.maillots===playerName) maillots++;
      const myEq=info.equipe;

      let sessGA=0,sessPlayed=0,sessWithGA=0,sessInvic=true,sessWins=0;
      const allGA={};

      (s.matchs||[]).forEach(m => {
        const inMatch=myEq&&(m.eqA===myEq||m.eqB===myEq);
        let g=0,a=0;
        ["A","B"].forEach(side=>{
          (m[`buteurs${side}`]||[]).forEach((b,i)=>{
            const p=(m[`passeurs${side}`]||[])[i];
            if(b==="CSC"){if(p===playerName)csc++;return;}
            if(!b)return;
            if(!allGA[b])allGA[b]=0; allGA[b]++;
            if(p&&p!=="CSC"){if(!allGA[p])allGA[p]=0; allGA[p]++;}
            if(b===playerName){
              g++;
              const sideEq = side==="A" ? m.eqA : m.eqB;
              if(myEq && sideEq && sideEq!==myEq) mercenaireCount++;
            }
            if(p&&p!=="CSC"&&p===playerName)a++;
            if(p&&p!=="CSC"){
              if(b===playerName)duoMap[p]=(duoMap[p]||0)+1;
              else if(p===playerName)duoMap[b]=(duoMap[b]||0)+1;
            }
          });
        });
        buts+=g; passes+=a; sessGA+=g+a;
        // Gardien assist : indépendant des données mi-temps
        if(a>0){const _gAr=m.gardiensA||[],_gBr=m.gardiensB||[];if(_gAr.includes(playerName)||_gBr.includes(playerName))gardienAssist+=a;}
        // Gardien stats clean sheets / buts encaissés : nécessite les données mi-temps
        if(m.mt1A!==undefined && m.mt1B!==undefined){
          const gA=m.gardiensA||[], gB=m.gardiensB||[];
          const mt1Ac=m.mt1B||0, mt2Ac=Math.max(0,(m.scoreB||0)-(m.mt1B||0));
          const mt1Bc=m.mt1A||0, mt2Bc=Math.max(0,(m.scoreA||0)-(m.mt1A||0));
          let _wasOwnGK=false,_gkConc=0;
          if(gA[0]===playerName){_wasOwnGK=true;gardiensButsEncaisses+=mt1Ac;_gkConc+=mt1Ac;}
          if(gA[1]===playerName){_wasOwnGK=true;gardiensButsEncaisses+=mt2Ac;_gkConc+=mt2Ac;}
          if(gB[0]===playerName){_wasOwnGK=true;gardiensButsEncaisses+=mt1Bc;_gkConc+=mt1Bc;}
          if(gB[1]===playerName){_wasOwnGK=true;gardiensButsEncaisses+=mt2Bc;_gkConc+=mt2Bc;}
          if(_wasOwnGK){gardiensMatchs++;if(_gkConc===0)gardiensCleanSheets++;}
        }
        if(inMatch){
          sessPlayed++;
          if(g+a>0){sessWithGA++;curStreak++;if(curStreak>bestStreak)bestStreak=curStreak;}
          else curStreak=0;
          const conceded=m.eqA===myEq?m.scoreB:m.scoreA; if(conceded===0)cleanSheets++;
          // Remontadas : équipe du joueur menait pas à la mi-temps mais gagne
          if(m.mt1A!==undefined && m.mt1B!==undefined){
            const isA=m.eqA===myEq;
            const mt1gf=isA?m.mt1A:m.mt1B, mt1ga=isA?m.mt1B:m.mt1A;
            const fgf=isA?m.scoreA:m.scoreB, fga=isA?m.scoreB:m.scoreA;
            if((mt1ga-mt1gf)>=2&&fgf>fga)remontadas++;
          }
          const w=m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;
          if(w&&w!==myEq)sessInvic=false;
          if(w&&w===myEq)sessWins++;
          if(g>=3)hattricks++;
          if(a>=3)assistHattricks++;
          if(g>=1&&a>=1)doubleDouble++;
          // Patron : implique (but ou passe) sur 100% des buts de son equipe, min. 4 buts.
          // Un CSC ne peut etre credite a personne, donc invalide l implication totale.
          {
            const mySide = m.eqA===myEq ? "A" : "B";
            const myButeurs = m[`buteurs${mySide}`]||[];
            const myPasseurs = m[`passeurs${mySide}`]||[];
            const involvedAll = myButeurs.length>0 && myButeurs.every((b,i) => {
              if(b==="CSC") return false;
              const p = myPasseurs[i];
              return b===playerName || (p && p!=="CSC" && p===playerName);
            });
            if(myButeurs.length>=4 && involvedAll) patronCount++;
          }
        }
      });

      if(sessPlayed>0&&sessWins===sessPlayed)soireeParfaite++;
      if(myEq&&sessInvic)invincible++;
      if(sessPlayed>0&&sessWins===0)zeroVict++;
      const teamMatchs=(s.matchs||[]).filter(m=>myEq&&(m.eqA===myEq||m.eqB===myEq));
      const allDraw=teamMatchs.length>0&&teamMatchs.every(m=>m.scoreA===m.scoreB);
      if(allDraw)toutNul++;
      if(myEq&&sessPlayed>0){
        const _tw={};
        (s.matchs||[]).forEach(m=>{const w=m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;if(w)_tw[w]=(_tw[w]||0)+1;});
        const _mx=Math.max(0,...Object.values(_tw));
        if(_mx>0&&(_tw[myEq]||0)===_mx)chelemColors.add(myEq);
      }
      const pGA=allGA[playerName]||0;
      if(pGA>0&&!Object.values(allGA).some(v=>v>pGA))mvp++;
      if(sessGA===0) fantomeStreak++;
      if(sessGA>0) sessionsAvecGA++;

    } else if(info.statut==="Absent"){
      absences++; inEp=false;
    } else if(info.statut==="Blessé"){
      sessionsBlesses++;
      if(!inEp){injuries++;inEp=true;}
    } else { inEp=false; }
  });

  const bestDuo=Math.max(0,...Object.values(duoMap));
  const grandChelem=(chelemColors.has("Rouge")&&chelemColors.has("Vert")&&chelemColors.has("Bleue"))?1:0;
  const assiduAnnes=(()=>{
    const ys=Object.values(yearMap).filter(y=>y.total>=10);
    if(ys.some(y=>y.present/y.total>=0.9))return 4;
    if(ys.some(y=>y.present/y.total>=0.8))return 3;
    if(ys.some(y=>y.present/y.total>=0.7))return 2;
    if(ys.some(y=>y.present/y.total>=0.6))return 1;
    return 0;
  })();
  const cometeAnnes=(()=>{
    const ys=Object.values(yearMap).filter(y=>y.total>=10);
    if(ys.some(y=>y.present/y.total<=0.10))return 4;
    if(ys.some(y=>y.present/y.total<=0.20))return 3;
    if(ys.some(y=>y.present/y.total<=0.30))return 2;
    if(ys.some(y=>y.present/y.total<=0.40))return 1;
    return 0;
  })();

  // Note gardien : taux de clean sheets, à partir de 3 matchs gardés (sinon pas assez de données)
  const gardienRate = gardiensMatchs>=3 ? Math.round(gardiensCleanSheets/gardiensMatchs*100) : 0;

  return { buts, passes, gaTotal:buts+passes, presences, absences, injuries, sessionsBlesses,
           sac, maillots, hattricks, assistHattricks, patronCount, bestStreak, soireeParfaite, doubleDouble,
           invincible, cleanSheets, bestDuo, mvp, csc, grandChelem,
           fantomeStreak, assiduAnnes, cometeAnnes, zeroVict, toutNul, sessionsAvecGA,
           gardiensCleanSheets, gardiensButsEncaisses, gardiensMatchs, gardienRate, remontadas, gardienAssist, mercenaireCount };
}

function renderAchievementsGrid(achSt) {
  let legendeCount=0;
  ACH_DEFS.filter(a=>a.id!=='legende').forEach(a=>{ legendeCount+=_achLevel(achSt[a.key]||0,a.tiers); });
  achSt.legendeCount=legendeCount;

  let unlockedCount=0;
  let html=`<div class="ach-grid">`;
  ACH_DEFS.forEach(ach=>{
    const val=achSt[ach.key]||0;
    const rawLv=_achLevel(val,ach.tiers);
    if(rawLv===0)return;
    const lv=ach.fixedTier?ach.fixedTier:Math.min(6,rawLv+(ach.tierOffset||0));
    const maxT=ach.tiers.length;

    const iconHtml=`<span class="ach-icon">${ach.icon}</span>`;
    const nameHtml=`<span class="ach-label">${ach.name}</span>`;

    const dots=(maxT>1)?`<div class="ach-dots">${Array.from({length:maxT},(_,i)=>`<div class="ach-dot${i<rawLv?' on':''}"></div>`).join('')}</div>`:'';
    const countHtml=(ach.fixedTier&&ach.tiers.length===1&&ach.id!=='chelem'&&val>0)
      ?`<span style="font-size:12px;font-weight:800;opacity:.8;line-height:1;letter-spacing:-.01em">${val}</span>`:'';

    const tn=(ach.tierNames?ach.tierNames[rawLv-1]:null)||ACH_TIER_NAMES[lv]||`Niveau ${lv}`;
    const tip=`${ach.name} — ${tn}\n${ach.desc(val)}${!ach.fixedTier&&rawLv<maxT?`\nProchain seuil : ${ach.tiers[rawLv]}`:''}`;

    const _achCls=ach.id==='comete'?' ach-comete':ach.id==='bonnet'?' ach-bonnet':ach.id==='passoire'?' ach-passoire':ach.id==='chelem'?' ach-chelem':ach.id==='soiree'?' ach-soiree':ach.id==='remontada'?' ach-remontada':ach.id==='gardienAssist'?' ach-neuer':ach.id==='zerovic'?' ach-zerovic':'';
    html+=`<div class="ach-cell t${lv}${_achCls}" data-tip="${tip.replace(/"/g,'&quot;')}">${iconHtml}${nameHtml}${dots}${countHtml}</div>`;
    unlockedCount++;
  });
  html+=`</div>`;
  if (!unlockedCount) return `<p class="no-data" style="margin-top:4px">Aucun haut fait débloqué pour l'instant.</p>`;
  return html;
}

function openPlayerPanel(playerName) {
  const st = computePlayerDetailStats(playerName);
  const isJoker = JOKERS.has(playerName);
  const medals  = ["🥇","🥈","🥉"];
  const nd = `<p class="no-data" style="margin-top:4px">—</p>`;
  const _achSt = computeAchievementStats(playerName);
  let h = "";

  /* Hero : avatar + prénom, teinté par la couleur préférée (celle avec laquelle il gagne le plus) */
  {
    const _prefColor = st.prefWinColor;
    const _colorVar = _prefColor === "Bleue" ? "bleu" : _prefColor ? _prefColor.toLowerCase() : null;
    const _heroBg = _colorVar ? `linear-gradient(150deg, var(--${_colorVar}-bg), transparent 70%)` : "var(--bg3)";
    const _avatarBg = _colorVar ? `var(--${_colorVar})` : "var(--text3)";
    const _avatarFg = _colorVar === "vert" ? "#111" : "#fff";
    const _initials = computeAllInitials([...new Set([...ALL_PLAYERS, playerName])])[playerName];
    const _totalExpected = st.presences + st.absences;
    let _freqLabel = null;
    if (_totalExpected >= 3) {
      const _rate = st.presences / _totalExpected;
      _freqLabel = _rate >= 0.75 ? "Régulier" : _rate >= 0.4 ? "Occasionnel" : "Rare";
    }
    h += `<div class="pph-hero" style="background:${_heroBg}">
      <div class="pph-avatar" style="background:${_avatarBg};color:${_avatarFg}">${_initials}</div>
      <div class="pph-hero-name">${playerName}</div>
      ${_freqLabel ? `<span class="pph-freq-pill">${_freqLabel}</span>` : ""}
    </div>`;
  }

  /* Hero : chiffres clés visibles sans scroller */
  h += `<div class="pph-top-grid">
    <div class="pph-top-cell"><div class="pph-top-num" style="color:#66bb6a">${st.presences}</div><div class="pph-top-lbl">Présences</div></div>
    <div class="pph-top-cell"><div class="pph-top-num">${st.matchsJoues}</div><div class="pph-top-lbl">Matchs</div></div>
    <div class="pph-top-cell"><div class="pph-top-num" style="color:var(--bleu)">${st.buts}</div><div class="pph-top-lbl">Buts</div></div>
    <div class="pph-top-cell"><div class="pph-top-num" style="color:var(--bleu)">${st.passesDecisives}</div><div class="pph-top-lbl">Assists</div></div>
  </div>`;

  /* Forme récente (5 dernières sessions où le joueur était Présent) */
  {
    const _sortedSess = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
    const _recent = _sortedSess.filter(s => {
      const info = s.presences[playerName];
      return info && info.statut === "Présent";
    }).slice(0, 5);

    h += `<div><div class="pp-section-title">Forme récente</div>`;
    if (_recent.length === 0) {
      h += `<p class="no-data" style="margin-top:4px">—</p>`;
    } else {
      h += `<div class="pph-forme-row">`;
      _recent.forEach(s => {
        const info = s.presences[playerName];
        const myEq = info.equipe || null;
        const dateStr = new Date(s.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
        // G/A de la session
        let gSess=0, aSess=0;
        (s.matchs||[]).forEach(m => {
          ["A","B"].forEach(side => {
            const buts   = m[`buteurs${side}`]  || [];
            const passes = m[`passeurs${side}`] || [];
            buts.forEach((b,i) => {
              if (!b || b==="CSC") return;
              if (b === playerName) gSess++;
              const p = passes[i];
              if (p && p!=="CSC" && p === playerName) aSess++;
            });
          });
        });
        // Résultat : majorité V/D/N de la soirée (plusieurs matchs possibles à 3 équipes)
        let wins=0, losses=0, draws=0;
        if (myEq) {
          (s.matchs||[]).filter(m => m.eqA===myEq||m.eqB===myEq).forEach(m => {
            const w = m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;
            if (w===myEq) wins++; else if (w===null) draws++; else losses++;
          });
        }
        const maxVdn = Math.max(wins, losses, draws);
        let resultCls, resultChar;
        if (!myEq || maxVdn === 0) { resultCls = 'd'; resultChar = '='; }
        else if (wins === maxVdn) { resultCls = 'w'; resultChar = '✓'; }
        else if (losses === maxVdn) { resultCls = 'l'; resultChar = '✗'; }
        else { resultCls = 'd'; resultChar = '='; }
        const gaStr = gSess+aSess > 0 ? `${gSess}G ${aSess}A` : `0 G/A`;
        h += `<div class="pph-forme-pill">
          <span class="pph-forme-date">${dateStr}</span>
          <span class="pph-forme-result ${resultCls}">${resultChar}</span>
          <span class="pph-forme-vdn">${wins}V ${losses}D ${draws}N</span>
          <span class="pph-forme-ga">${gaStr}</span>
        </div>`;
      });
      h += `</div>`;
    }
    h += `</div>`;
  }

  /* Statistiques */
  h += `<div>
    <div class="pp-section-title">Statistiques</div>
    <div class="pph-stat-scroller">
      <div class="pph-stat-tile">
        <div class="pp-stat-val ${st.buts>0?"blue":"muted"}">${st.buts}</div>
        <div class="pp-stat-lbl">Buts</div>
        ${st.matchsJoues>0?`<div class="pp-stat-sub">moy. ${(st.buts/st.matchsJoues).toFixed(2).replace(".",",")} / m</div>`:""}
      </div>
      <div class="pph-stat-tile">
        <div class="pp-stat-val ${st.passesDecisives>0?"blue":"muted"}">${st.passesDecisives}</div>
        <div class="pp-stat-lbl">Assists</div>
        ${st.matchsJoues>0?`<div class="pp-stat-sub">moy. ${(st.passesDecisives/st.matchsJoues).toFixed(2).replace(".",",")} / m</div>`:""}
      </div>
      <div class="pph-stat-tile">
        <div class="pp-stat-val ${st.victoires>0?"green":"muted"}">${st.victoires}</div>
        <div class="pp-stat-lbl">Victoires</div>
      </div>
      <div class="pph-stat-tile">
        <div class="pp-stat-val ${st.defaites>0?"red":"muted"}">${st.defaites}</div>
        <div class="pp-stat-lbl">Défaites</div>
      </div>
    </div>
    <div class="pph-stat-list">
      <div class="pph-stat-row"><span class="lbl">Absences · Pas répondu</span><span class="val ${st.absences>0?"red":""}">${st.absences} · ${st.pasRepondu}</span></div>
      <div class="pph-stat-row"><span class="lbl">Blessures</span><span class="val ${st.episodesBlessures>0?"amber":""}">${st.episodesBlessures} / ${st.blesses} séance${st.blesses>1?"s":""}</span></div>
      <div class="pph-stat-row"><span class="lbl">Sac 🎒 · Maillots 👕</span><span class="val">${st.sac} · ${st.maillots}</span></div>
      <div class="pph-stat-row"><span class="lbl">Clean sheets 🧱 · Buts encaissés 🪣</span><span class="val ${_achSt.gardiensCleanSheets>0?"green":_achSt.gardiensButsEncaisses>0?"red":""}">${_achSt.gardiensCleanSheets} · ${_achSt.gardiensButsEncaisses}</span></div>
    </div>
  </div>`;

  /* Radar de profil */
  {
    // Axes (sens horaire depuis le haut) : Buteur · Défenseur · Gardien · Intendant · Présence · Passeur
    const _radarAxes = [
      { label: 'Buteur',    val: _achSt.buts },
      { label: 'Défenseur', val: _achSt.cleanSheets },
      { label: 'Gardien',   val: _achSt.gardienRate },
      { label: 'Intendant', val: _achSt.sac + _achSt.maillots },
      { label: 'Présence',  val: _achSt.presences },
      { label: 'Passeur',   val: _achSt.passes },
    ];
    // Normalisation 0-100 relative au max de tous les joueurs
    const _radarMaxes = _radarAxes.map((ax, i) => {
      return Math.max(1, ...ALL_PLAYERS.map(p => {
        const s = computeAchievementStats(p);
        const vals = [s.buts, s.cleanSheets, s.gardienRate, s.sac+s.maillots, s.presences, s.passes];
        return vals[i];
      }));
    });
    const _scores = _radarAxes.map((ax, i) => Math.round((ax.val / _radarMaxes[i]) * 100));

    // SVG radar
    const cx=110, cy=110, R=80, N=6;
    const pts = (r) => Array.from({length:N}, (_,i) => {
      const ang = (Math.PI*2*i/N) - Math.PI/2;
      return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)];
    });
    const ptsStr = (arr) => arr.map(p=>p.join(',')).join(' ');
    // Grille
    let svgG = '';
    [25,50,75,100].forEach(pct => {
      const r = R*pct/100;
      svgG += `<polygon points="${ptsStr(pts(r))}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1"/>`;
    });
    // Axes
    const outerPts = pts(R);
    outerPts.forEach(([x,y]) => {
      svgG += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.06)" stroke-width="1"/>`;
    });
    // Polygon de données
    const dataPts = Array.from({length:N}, (_,i) => {
      const ang = (Math.PI*2*i/N) - Math.PI/2;
      const r = R * _scores[i] / 100;
      return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)];
    });
    svgG += `<polygon points="${ptsStr(dataPts)}" fill="rgba(254,219,0,.18)" stroke="#FEDB00" stroke-width="1.5"/>`;
    // Dots
    dataPts.forEach(([x,y]) => {
      svgG += `<circle cx="${x}" cy="${y}" r="3" fill="#FEDB00"/>`;
    });
    // Labels
    outerPts.forEach(([x,y], i) => {
      const lx = cx + (R+22)*Math.cos((Math.PI*2*i/N)-Math.PI/2);
      const ly = cy + (R+22)*Math.sin((Math.PI*2*i/N)-Math.PI/2);
      const score = _scores[i];
      const anchor = lx < cx-4 ? 'end' : lx > cx+4 ? 'start' : 'middle';
      svgG += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" dominant-baseline="middle" font-size="8" fill="rgba(200,200,215,0.65)" font-family="inherit" letter-spacing="0.06em">${_radarAxes[i].label.toUpperCase()}</text>`;
    });

    h += `<div>
      <div class="pp-section-title">Profil</div>
      <div class="pph-radar-card">
        <svg viewBox="0 0 220 220" width="220" height="220" style="overflow:visible">${svgG}</svg>
      </div>
    </div>`;
  }

  /* Meilleurs moments : carrousel (meilleur match, link-up, meilleure série) */
  {
    const _moments = [];

    if (st.bestMatch && (st.bestMatchGoals > 0 || st.bestMatchAssists > 0)) {
      const bmParts = [];
      if (st.bestMatchGoals > 0) bmParts.push(`${st.bestMatchGoals} but${st.bestMatchGoals>1?"s":""}`);
      if (st.bestMatchAssists > 0) bmParts.push(`${st.bestMatchAssists} assist${st.bestMatchAssists>1?"s":""}`);
      _moments.push(`<div class="pp-match-card">
        <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)">⚽️ Meilleur match</div>
        <div style="font-size:13px;color:var(--text2);margin-top:6px">${fmtDate(st.bestMatch.date)}</div>
        <div style="font-size:22px;font-weight:700;margin:6px 0;color:var(--gold)">${bmParts.join(" · ")}</div>
        <div class="pp-match-score">
          ${badge(st.bestMatch.eqA)}<span style="font-size:15px;font-weight:700">${st.bestMatch.scoreA}–${st.bestMatch.scoreB}</span>${badge(st.bestMatch.eqB)}
        </div>
      </div>`);
    }

    const _luAll = computeLinkUpStats(SESSIONS).filter(d => d.p1 === playerName || d.p2 === playerName);
    if (_luAll.length) {
      const _luBest = _luAll[0];
      const _luPartner = _luBest.p1 === playerName ? _luBest.p2 : _luBest.p1;
      _moments.push(`<div class="pp-match-card">
        <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)">⚡ Meilleur Link-Up</div>
        <div style="font-size:20px;font-weight:700;margin:8px 0 2px">
          <button class="player-link" data-player="${_luPartner}" style="font-size:inherit">${_luPartner}</button>
        </div>
        <div style="display:flex;align-items:baseline;gap:5px">
          <span style="font-size:20px;font-weight:700;color:var(--gold)">${_luBest.connexions}</span>
          <span style="font-size:13px;color:var(--text2)">but${_luBest.connexions>1?"s":""}</span>
        </div>
        ${(()=>{const _ip1=_luBest.p1===playerName;const _mG=_ip1?_luBest.p1Goals:_luBest.p2Goals;const _mA=_ip1?_luBest.p2Goals:_luBest.p1Goals;const _pG=_ip1?_luBest.p2Goals:_luBest.p1Goals;const _pA=_ip1?_luBest.p1Goals:_luBest.p2Goals;return`<div style="display:flex;gap:10px;margin-top:8px;font-size:11px;color:var(--text3);flex-wrap:wrap"><span><strong style="color:var(--text2)">${playerName}</strong> ${_mG}G · ${_mA}A</span><span><strong style="color:var(--text2)">${_luPartner}</strong> ${_pG}G · ${_pA}A</span></div>`;})()}
      </div>`);
    }

    {
      const _cur  = st.currentStreak;
      const _best = st.bestHistoricalStreak;
      const _curBetter = (c, b) => c.count > b.count || (c.count === b.count && (c.g+c.a) >= (b.g+b.a));
      if (_cur || _best) {
        const primary  = (_cur && (!_best || _curBetter(_cur, _best))) ? _cur : _best;
        const isActive = primary === _cur;
        const ga = primary.g + primary.a;
        const dateStr = isActive
          ? `Depuis le ${fmtDate(primary.start)}`
          : `${fmtDate(primary.start)} — ${fmtDate(primary.end)}`;
        let card = `<div class="pp-match-card">
          <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)">🔥 Meilleure série</div>
          <div style="font-size:13px;color:var(--text2);margin-top:6px">${dateStr}</div>
          <div style="margin:8px 0 4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
            <span style="font-size:24px;font-weight:700;color:var(--text);line-height:1">${ga} G/A</span>
            <span style="font-size:12px;color:var(--text2)">(${primary.g}G + ${primary.a}A)</span>
          </div>
          <div style="font-size:12px;color:var(--text2)">· ${primary.count} match${primary.count>1?"s":""}</div>
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:6px;color:${isActive?"#34A853":"var(--text3)"}">${isActive?"En cours":"Terminée"}</div>
        </div>`;
        if (!isActive && _cur) {
          const cga = _cur.g + _cur.a;
          card += `<div style="margin-top:8px;padding:8px 14px;background:rgba(52,168,83,.08);border:1px solid rgba(52,168,83,.2);border-radius:var(--radius);font-size:11px;color:var(--text2)">
            <strong style="color:#34A853;text-transform:uppercase;letter-spacing:.06em;font-size:10px">En cours</strong><br>
            ${cga} G/A (${_cur.g}G + ${_cur.a}A) · ${_cur.count} match${_cur.count>1?"s":""}
          </div>`;
        }
        _moments.push(card);
      }
    }

    h += `<div><div class="pp-section-title">Meilleurs moments</div>${
      _moments.length ? `<div class="pph-moments-scroller">${_moments.join("")}</div>` : nd
    }</div>`;
  }

  /* Couleur récurrente */
  h += `<div><div class="pp-section-title">Couleur récurrente</div>`;
  if (st.recurringColor) {
    const c = st.recurringColor, cls = c.toLowerCase(), n = st.teamCount[c];
    h += `<div style="display:flex;align-items:center;gap:10px">
      <span class="pp-color-pill ${cls}" style="white-space:nowrap">${dot(c)}${TEAM_LABEL[c]||c}</span>
      <span style="font-size:12px;font-weight:600;color:var(--text2)">${n} session${n>1?"s":""}</span>
    </div>`;
  } else { h += nd; }
  h += `</div>`;

  /* Top 3 coéquipiers récurrents */
  h += `<div><div class="pp-section-title">Top 3 coéquipiers récurrents</div>`;
  if (st.top3Teammates.length) {
    h += `<div class="pp-teammate-list">`;
    st.top3Teammates.forEach(([name, n], i) => {
      h += `<div class="pp-teammate-row">
        <span class="pp-teammate-rank">${medals[i]}</span>
        <span class="pp-teammate-name">${name}</span>
        <span class="pp-teammate-val">${n}</span><span class="pp-teammate-unit">session${n>1?"s":""}</span>
      </div>`;
    });
    h += `</div>`;
  } else { h += nd; }
  h += `</div>`;

  /* Couleur préférée (victoires) */
  h += `<div><div class="pp-section-title">Couleur préférée</div>`;
  if (st.prefWinColor) {
    const c = st.prefWinColor, cls = c.toLowerCase(), n = st.maxWins;
    h += `<div style="display:flex;align-items:center;gap:10px">
      <span class="pp-color-pill ${cls}" style="white-space:nowrap">${dot(c)}${TEAM_LABEL[c]||c}</span>
      <span style="font-size:12px;font-weight:600;color:var(--text2)">${n} victoire${n>1?"s":""}</span>
    </div>`;
  } else { h += `<p class="no-data" style="margin-top:4px">Aucune victoire enregistrée</p>`; }
  h += `</div>`;

  /* Top 3 coéquipiers préférés */
  h += `<div><div class="pp-section-title">Top 3 coéquipiers préférés</div>`;
  if (st.top3WinTeammates.length) {
    h += `<div class="pp-teammate-list">`;
    st.top3WinTeammates.forEach(([name, n], i) => {
      h += `<div class="pp-teammate-row">
        <span class="pp-teammate-rank">${medals[i]}</span>
        <span class="pp-teammate-name">${name}</span>
        <span class="pp-teammate-val">${n}</span><span class="pp-teammate-unit">victoire${n>1?"s":""}</span>
      </div>`;
    });
    h += `</div>`;
  } else { h += `<p class="no-data" style="margin-top:4px">Aucune victoire enregistrée</p>`; }
  h += `</div>`;

  /* Hauts faits */
  h += `<div><div class="pp-section-title">Hauts faits</div>${renderAchievementsGrid(computeAchievementStats(playerName))}</div>`;

  document.getElementById("pp-name").textContent = playerName;
  const _ppBadgeEl = document.getElementById("pp-statut-badge");
  if (_ppBadgeEl) {
    const _ppStatut = ABSENTS.has(playerName) ? 'quitte' : JOKERS.has(playerName) ? 'plus1' : 'actif';
    const _ppS = REGL_STATUTS[_ppStatut];
    _ppBadgeEl.innerHTML = `<span class="regl-badge ${_ppS.badge}">${_ppS.label}</span>`;
  }
  const ppBody = document.getElementById("pp-body");
  ppBody.innerHTML = h;
  ppBody.style.opacity   = '0';
  ppBody.style.transition = 'none';
  setTimeout(() => { ppBody.style.opacity = ''; animateView(ppBody); }, 290);
  document.getElementById("player-panel-overlay").classList.add("open");
  document.getElementById("player-panel").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closePlayerPanel() {
  document.getElementById("player-panel-overlay").classList.remove("open");
  document.getElementById("player-panel").classList.remove("open");
  document.body.style.overflow = "";
}

/* ─────────────────────────────────────────────────────
   SAISIE — onglet de saisie des sessions
───────────────────────────────────────────────────── */

let _draft = null;
let _draftSavedAt = null;
let _editMode = false;

const _STATUTS_REG  = ["Présent", "Absent", "Blessé", "Pas répondu"];
const _JOKER_NC = "Non convoqué";

let _saisieStep = "presences";      // "presences" | "matchs" | "logistique"
let _saisieFocusedMatch = undefined; // index dans _draft.matchs actuellement en édition ; null = réduit explicitement, undefined = pas encore décidé
let _saisiePicker = null;            // { key } — sélecteur (gardien/buteur/passeur) ouvert
let _saisieTeamSwap = null;          // "{idx}-{side}" — sélecteur d'équipe ouvert
let _saisieMtOpen = {};              // { [matchIdx]: true } — mi-temps dépliée
const _SAISIE_STEPS = [
  { key: "presences",  label: "Présences",  icon: "👥" },
  { key: "matchs",     label: "Matchs",     icon: "⚽" },
  { key: "logistique", label: "Logistique", icon: "🎒" },
];

function _newDraft() {
  const presences = {};
  ALL_PLAYERS.forEach(p => {
    presences[p] = { statut: JOKERS.has(p) ? _JOKER_NC : "Pas répondu", equipe: "" };
  });
  return { date: "", sac: "", maillots: "", presences, matchs: [], tempJokers: [] };
}

function _resetSaisieUiState() {
  _saisieStep = "presences";
  _saisieFocusedMatch = undefined;
  _saisiePicker = null;
  _saisieTeamSwap = null;
  _saisieMtOpen = {};
}

function _loadDraft() {
  try {
    const s = localStorage.getItem("hmft_draft");
    if (s) { _draft = JSON.parse(s); return; }
  } catch(e) {}
  _draft = _newDraft();
}

function _loadSessionIntoDraft(session) {
  const presences = {};
  ALL_PLAYERS.forEach(p => {
    presences[p] = { statut: JOKERS.has(p) ? _JOKER_NC : "Pas répondu", equipe: "" };
  });
  const tempJokers = [];
  Object.entries(session.presences).forEach(([p, info]) => {
    if (!ALL_PLAYERS.includes(p)) {
      tempJokers.push(p);
      presences[p] = { statut: info.statut === "Présent" ? "Présent" : _JOKER_NC, equipe: info.equipe || "", joker: true, temp: true };
    } else if (JOKERS.has(p)) {
      presences[p] = { statut: info.statut === "Présent" ? "Présent" : _JOKER_NC, equipe: info.equipe || "" };
    } else {
      presences[p] = { statut: info.statut, equipe: info.equipe || "" };
    }
  });
  return {
    date: session.date,
    sac: session.sac || "",
    maillots: session.maillots || "",
    presences,
    matchs: (session.matchs || []).map(m => ({
      eqA: m.eqA, eqB: m.eqB,
      scoreA: m.scoreA, scoreB: m.scoreB,
      buteursA:  [...(m.buteursA  || [])],
      buteursB:  [...(m.buteursB  || [])],
      passeursA: [...(m.passeursA || [])],
      passeursB: [...(m.passeursB || [])],
      mt1A: m.mt1A ?? 0, mt1B: m.mt1B ?? 0,
      gardiensA: [...(m.gardiensA || ["",""])],
      gardiensB: [...(m.gardiensB || ["",""])]
    })),
    tempJokers
  };
}

function _saveDraft() {
  localStorage.setItem("hmft_draft", JSON.stringify(_draft));
  _draftSavedAt = new Date().toLocaleTimeString("fr", { hour: "2-digit", minute: "2-digit" });
  const el = document.getElementById("saisie-status");
  if (el) el.innerHTML = `<span style="color:#2ecc71;font-size:12px">✓ Sauvegardé à ${_draftSavedAt}</span>`;
  if (_db) _db.ref('config/draft').set(_draft).catch(e => console.error('FB draft save:', e));
}

function _presentList() {
  return Object.entries(_draft.presences).filter(([,v]) => v.statut === "Présent").map(([k]) => k).sort((a, b) => a.localeCompare(b, "fr"));
}

function _activeTeams() {
  const t = new Set();
  Object.values(_draft.presences).forEach(v => { if (v.statut === "Présent" && v.equipe) t.add(v.equipe); });
  return ["Rouge","Vert","Bleue"].filter(c => t.has(c));
}

function _playersOfTeam(color) {
  return Object.entries(_draft.presences)
    .filter(([,v]) => v.statut === "Présent" && v.equipe === color).map(([k]) => k).sort((a, b) => a.localeCompare(b, "fr"));
}

// Buteurs/passeurs : équipe sur le terrain d'abord, équipe de dépanne ensuite
function _teamPoolOrdered(eq, benchEq) {
  return [..._playersOfTeam(eq), ...(benchEq ? _playersOfTeam(benchEq) : [])];
}
// Gardien : à 5+ joueurs présents l'équipe garde ses buts elle-même ; à 4, le banc dépanne en priorité
function _gardienPoolOrdered(eq, benchEq) {
  const own = _playersOfTeam(eq);
  if (own.length >= 5 || !benchEq) return own;
  return [..._playersOfTeam(benchEq), ...own];
}
function _saisieBenchTeam(eqA, eqB, teams) {
  return teams.length >= 3 ? (teams.find(t => t !== eqA && t !== eqB) || "") : "";
}

/* ── Présences : chips groupées par statut ── */
function _saisieTeamDotsHTML(p, eq) {
  return `<span class="saisie-team-dots">${["Rouge","Vert","Bleue"].map(t =>
    `<button class="saisie-team-dot ${t.toLowerCase()}${eq===t?" active":""}" data-act="saisie-team" data-player="${p}" data-equipe="${t}" title="${TEAM_LABEL[t]}"></button>`
  ).join("")}</span>`;
}
function _saisieRegChipHTML(p) {
  const statut = _draft.presences[p]?.statut || "Pas répondu";
  const eq = _draft.presences[p]?.equipe || "";
  const stCls = statut === "Présent" ? "st-present" : statut === "Absent" ? "st-absent" : statut === "Blessé" ? "st-blesse" : "st-nr";
  const teamCls = statut === "Présent" && eq ? ` team-${eq.toLowerCase()}` : "";
  const btns = _STATUTS_REG.map(s => `<button class="saisie-chip-btn" data-act="saisie-status" data-player="${p}" data-statut="${s}" title="${s}">${{"Présent":"✅","Absent":"❌","Blessé":"🤕","Pas répondu":"❓"}[s]}</button>`).join("");
  const dots = statut === "Présent" ? _saisieTeamDotsHTML(p, eq) : "";
  return `<span class="saisie-chip ${stCls}${teamCls}">
    <span class="saisie-chip-name">${p}</span>
    ${dots}
    <span class="saisie-chip-btns">${btns}</span>
  </span>`;
}
function _saisieJokerChipHTML(p, removable) {
  const statut = _draft.presences[p]?.statut || _JOKER_NC;
  const eq = _draft.presences[p]?.equipe || "";
  const stCls = statut === "Présent" ? "st-present" : statut === "Blessé" ? "st-blesse" : "st-nr";
  const teamCls = statut === "Présent" && eq ? ` team-${eq.toLowerCase()}` : "";
  const dots = statut === "Présent" ? _saisieTeamDotsHTML(p, eq) : "";
  const btns = `
    <button class="saisie-chip-btn" data-act="saisie-status" data-player="${p}" data-statut="Présent" title="Présent">✅</button>
    <button class="saisie-chip-btn" data-act="saisie-status" data-player="${p}" data-statut="Blessé" title="Blessé">🤕</button>
    <button class="saisie-chip-btn" data-act="saisie-status" data-player="${p}" data-statut="${_JOKER_NC}" title="Non convoqué">🫥</button>
    ${removable ? `<button class="saisie-chip-btn" data-act="saisie-remove-temp-joker" data-player="${p}" title="Retirer">✕</button>` : ""}
  `;
  return `<span class="saisie-chip ${stCls}${teamCls}">
    <span class="saisie-chip-name">${p} <span class="saisie-chip-badge">+1</span></span>
    ${dots}
    <span class="saisie-chip-btns">${btns}</span>
  </span>`;
}
function _sortPresentFirst(list) {
  const order = ["Rouge","Vert","Bleue"];
  return [...list].sort((a, b) => {
    const ea = _draft.presences[a]?.equipe || "", eb = _draft.presences[b]?.equipe || "";
    const ia = order.indexOf(ea), ib = order.indexOf(eb);
    return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib) || a.localeCompare(b, "fr");
  });
}
function _buildPresencesScreenHTML() {
  const regularPlayers = ALL_PLAYERS.filter(p => !JOKERS.has(p) && !ABSENTS.has(p)).sort((a, b) => a.localeCompare(b, "fr"));
  const jokerPlayers = ALL_PLAYERS.filter(p => JOKERS.has(p)).sort((a, b) => a.localeCompare(b, "fr"));
  const tempJokers = _draft.tempJokers || [];
  const byStatut = (list, s) => list.filter(p => (_draft.presences[p]?.statut || "Pas répondu") === s);

  const countPresents = Object.values(_draft.presences).filter(v => v.statut === "Présent").length;
  const countAbsents  = Object.entries(_draft.presences).filter(([k, v]) => !JOKERS.has(k) && !tempJokers.includes(k) && v.statut === "Absent").length;
  const countBlesses  = Object.entries(_draft.presences).filter(([, v]) => v.statut === "Blessé").length;
  const countNR       = Object.entries(_draft.presences).filter(([k, v]) => !JOKERS.has(k) && !tempJokers.includes(k) && v.statut === "Pas répondu").length;

  const group = (label, icon, list) => !list.length ? "" : `<div class="saisie-pres-block">
      <div class="saisie-pres-label">${icon} ${label} <span class="n">(${list.length})</span></div>
      <div class="saisie-chip-row">${list.map(_saisieRegChipHTML).join("")}</div>
    </div>`;
  const jokerGroup = (label, icon, list) => !list.length ? "" : `<div class="saisie-pres-block">
      <div class="saisie-pres-label">${icon} ${label} <span class="n">(${list.length})</span></div>
      <div class="saisie-chip-row">${list.map(p => _saisieJokerChipHTML(p, tempJokers.includes(p))).join("")}</div>
    </div>`;

  const allJokers = [...jokerPlayers, ...tempJokers];
  const jkPresents = _sortPresentFirst(allJokers.filter(p => (_draft.presences[p]?.statut || _JOKER_NC) === "Présent"));
  const jkBlesses  = allJokers.filter(p => _draft.presences[p]?.statut === "Blessé");
  const jkNC       = allJokers.filter(p => (_draft.presences[p]?.statut || _JOKER_NC) === _JOKER_NC);

  return `<div class="saisie-section">
    <div class="saisie-section-title">👥 Présences</div>
    <div class="saisie-pres-summary">
      <span>✅ ${countPresents} présent${countPresents>1?"s":""}</span>
      <span>❌ ${countAbsents} absent${countAbsents>1?"s":""}</span>
      <span>🤕 ${countBlesses} blessé${countBlesses>1?"s":""}</span>
      <span>❓ ${countNR} n'${countNR>1?"ont":"a"} pas répondu</span>
    </div>
    ${group("Présents", "✅", _sortPresentFirst(byStatut(regularPlayers, "Présent")))}
    ${group("Absents", "❌", byStatut(regularPlayers, "Absent"))}
    ${group("Blessés", "🤕", byStatut(regularPlayers, "Blessé"))}
    ${group("Pas répondu", "❓", byStatut(regularPlayers, "Pas répondu"))}
    <div class="saisie-jokers-title">Joueurs +1</div>
    ${jokerGroup("Présents", "✅", jkPresents)}
    ${jokerGroup("Blessés", "🤕", jkBlesses)}
    ${jokerGroup("Non convoqués", "🫥", jkNC)}
    <div class="saisie-joker-add">
      <input type="text" id="saisie-new-joker-input" placeholder="Nom du +1" class="saisie-date-input">
      <button class="saisie-btn secondary" data-act="saisie-add-temp-joker">+ Ajouter</button>
    </div>
  </div>`;
}

/* ── Matchs : éditeur focalisé + récap ── */
function _saisieFieldBtnHTML(value, placeholder, key, emptyWarn) {
  const info = value === "CSC" ? { name: "CSC (c.s.c.)", team: null } : (value ? { name: value, team: _draft.presences[value]?.equipe || null } : null);
  const isOpen = _saisiePicker && _saisiePicker.key === key;
  const cls = ["saisie-field-btn", info ? "filled" : "", isOpen ? "open" : "", (!info && emptyWarn) ? "empty" : ""].filter(Boolean).join(" ");
  const dotEl = info && info.team ? `<span class="fdot ${info.team.toLowerCase()}"></span>` : "";
  return `<button class="${cls}" data-act="saisie-open-picker" data-key="${key}">${dotEl}<span>${info ? info.name : placeholder}</span><span class="chev2">▾</span></button>`;
}
function _saisiePickerHTML(key, title, options, includeCSC, allowNone) {
  if (!_saisiePicker || _saisiePicker.key !== key) return "";
  const chips = [];
  if (includeCSC) chips.push(`<button class="saisie-pchip muted" data-act="saisie-pick" data-key="${key}" data-val="CSC">CSC (c.s.c.)</button>`);
