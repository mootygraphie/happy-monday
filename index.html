  .dbx-hero-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
  @media (min-width: 720px) { .dbx-hero-grid { grid-template-columns: repeat(4,1fr); } }
  .dbx2-hero-grid-3 { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }

  @media (min-width: 640px) { .dbx2-hero-grid-3 { grid-template-columns: repeat(3,1fr); } }
  .dbx-hero-card {

    padding: 18px 19px; position: relative; overflow: hidden; min-height: 118px;
    display: flex; flex-direction: column; justify-content: space-between;

  .dbx-hero-num { font-size: 38px; font-weight: 700; letter-spacing: -.03em; line-height: 1; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .dbx-hero-num.dbx-team { font-size: 21px; display: flex; align-items: center; gap: 8px; margin-top: 12px; }

    .dbx-hero-tt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; }
    .dbx-hero-tt-row .dbx-hero-grid { grid-template-columns: repeat(2,1fr); grid-template-rows: repeat(2,1fr); height: 100%; }
  }

  /* ── Cartes partagées ── */
  .dbx-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); }

  .dbx-txt.rouge { color: var(--rouge); } .dbx-txt.vert { color: var(--vert); } .dbx-txt.bleue { color: var(--bleu); }

  .dbx-team-accent { height: 4px; }

  .dbx-team-accent.vert  { background: linear-gradient(90deg,var(--vert),#EAFF80); }
  .dbx-team-accent.bleue { background: linear-gradient(90deg,var(--bleu),#80DEFF); }
  .dbx-team-name { font-size: 15px; font-weight: 700; flex: 1; }

  .dbx-form-chip.w { background: var(--good); color: #08240f; }
  html.light .dbx-form-chip.w { color: #fff; }
  .dbx-form-chip.n { background: var(--bg3); color: var(--text2); }
  .dbx-form-chip.l { background: var(--bad-bg); color: var(--bad); }

  /* ── Graphique de tendance ── */
  .dbx-trend-card { padding: 20px 22px 14px; }
  .dbx-trend-mode-seg { display: inline-flex; gap: 4px; margin-bottom: 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
  .dbx-trend-mode-btn { border: none; background: transparent; color: var(--text3); font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
  .dbx-trend-mode-btn.active { background: var(--bg2); color: var(--text); }
  .dbx-trend-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
  .dbx-trend-top-lbl { font-size: 13px; font-weight: 700; }

  .dbx-trend-top-val b { color: var(--text); font-variant-numeric: tabular-nums; }
  /* ── Cartes matchs marquants ── */
  .dbx-hl-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
  @media (min-width: 640px) { .dbx-hl-grid { grid-template-columns: 1fr 1fr; } }

  .dbx-lead-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }

<script>

/* ── Authentification ── */
function applyRole(role) {
  const isAdmin  = role === "admin";
  const isSaisie = role === "saisie";
  document.getElementById("saisie-nav-btn").style.display     = (isAdmin || isSaisie) ? "flex" : "none";
  document.getElementById("delete-session-btn").style.display = isAdmin ? "inline-flex" : "none";
  document.getElementById("edit-session-btn").style.display   = isAdmin ? "inline-flex" : "none";
  document.querySelector(".main-tabs").style.display = isSaisie ? "none" : "";
  const hnavSaisieRow = document.getElementById("hnav-saisie-row");
  if (hnavSaisieRow) hnavSaisieRow.style.display = (isAdmin || isSaisie) ? "flex" : "none";
  /* Mode saisie : le tiroir mobile ne doit donner acces qu'au theme, a l'actualisation
     et a la sortie du mode — pas aux autres onglets (Sessions/Dashboard/Effectif/Recompenses). */
  const hnavDrawerTabs = document.getElementById("hnav-drawer-tabs");
  if (hnavDrawerTabs) hnavDrawerTabs.style.display = isSaisie ? "none" : "";
}

const HASH_ADMIN  = "cea45f18ea39c9ece6711634075f9402f52b3727a59e08927043c8cca10182c8";
/* Compte "saisie" : accede uniquement a l ecran de saisie (creation d une
   nouvelle session), pour une utilisation sans risque le lundi soir. */
const HASH_SAISIE = "af7fbef617fad5abac74887f303c51a22a65f54f7b6961a4b6959b7169a9bfbd";

async function _sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function updateAdminBtn() {
  const btn = document.getElementById("admin-btn");
  if (!btn) return;
  const role = sessionStorage.getItem("hmft_role");
  const loggedIn = role === "admin" || role === "saisie";
  const LOCK   = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6.5" width="10" height="6.5" rx="1.5"/><path d="M4.5 6.5V5a2.5 2.5 0 0 1 5 0v1.5"/></svg>`;
  const UNLOCK = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6.5" width="10" height="6.5" rx="1.5"/><path d="M4.5 6.5V5A2.5 2.5 0 0 1 9.5 5"/></svg>`;
  btn.innerHTML = loggedIn ? UNLOCK : LOCK;
  btn.title = role === "admin" ? "Quitter le mode admin" : role === "saisie" ? "Quitter le mode saisie" : "Connexion admin";
  btn.style.color = loggedIn ? "var(--gold)" : "";
}

async function tryAdminUnlock() {
  const val = document.getElementById("pwd-input").value;
  const hash = await _sha256(val);
  const role = hash === HASH_ADMIN ? "admin" : hash === HASH_SAISIE ? "saisie" : null;
  if (role) {
    sessionStorage.setItem("hmft_role", role);
    document.getElementById("lock-screen").style.display = "none";
    document.getElementById("pwd-input").value = "";
    document.getElementById("pwd-err").textContent = "";
    applyRole(role);
    updateAdminBtn();
    if (role === "saisie") _goToSaisie();
  } else {
    const inp = document.getElementById("pwd-input");
    const err = document.getElementById("pwd-err");
    inp.classList.add("error");
    err.textContent = "Mot de passe incorrect.";
    inp.value = "";
    setTimeout(() => inp.classList.remove("error"), 400);
  }
}

document.getElementById("pwd-btn").addEventListener("click", tryAdminUnlock);
document.getElementById("pwd-input").addEventListener("keydown", e => {
  if (e.key === "Enter") tryAdminUnlock();
});

/* ── Thème clair / sombre ── */
(function() {
  const SUN  = `<svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7.5" cy="7.5" r="2.5"/><path d="M7.5 1v1.5M7.5 12.5V14M1 7.5h1.5M12.5 7.5H14M3.04 3.04l1.06 1.06M10.9 10.9l1.06 1.06M10.9 4.1l1.06-1.06M3.04 11.96l1.06-1.06"/></svg>`;
  const MOON = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 9.5A5.5 5.5 0 0 1 4.5 2a5.5 5.5 0 1 0 7.5 7.5z"/></svg>`;
  function updateThemeBtn() {
    const btn = document.getElementById('theme-btn');
    if (!btn) return;
    const isLight = document.documentElement.classList.contains('light');
    btn.title = isLight ? 'Mode sombre' : 'Mode clair';
    btn.innerHTML = isLight ? MOON : SUN;
  }
  updateThemeBtn();
  document.getElementById('theme-btn').addEventListener('click', () => {
    document.documentElement.classList.toggle('light');
    localStorage.setItem('hmft_theme', document.documentElement.classList.contains('light') ? 'light' : 'dark');
    updateThemeBtn();
  });
})();

/* ── Menu mobile (burger + tiroir) : les onglets et boutons du tiroir
   delèguent aux vrais boutons (.main-tab / #refresh-btn / #saisie-nav-btn /
   #theme-btn / #admin-btn) via .click() — le tiroir ne réimplémente aucune
   logique, il se contente de refléter leur état à chaque ouverture. ── */
(function() {
  const burgerBtn = document.getElementById("hnav-burger-btn");
  const drawer     = document.getElementById("hnav-drawer");
  const overlay    = document.getElementById("hnav-overlay");
  const closeBtn   = document.getElementById("hnav-drawer-close");
  if (!burgerBtn || !drawer || !overlay) return;

  function mirrorRow(srcId, dstId, iconOnly) {
    const src = document.getElementById(srcId);
    const dst = document.getElementById(dstId);
    if (!src || !dst) return;
    dst.innerHTML = iconOnly ? (src.innerHTML + `<span>${src.title}</span>`) : src.innerHTML;
    dst.style.display = src.style.display === "none" ? "none" : "";
  }

  function renderDrawer() {
    const activeTab = document.querySelector(".main-tab.active");
    const activeKey = activeTab ? activeTab.dataset.tab : null;
    document.querySelectorAll(".hnav-tab").forEach(t => {
      t.classList.toggle("active", t.dataset.tab === activeKey);
    });
    mirrorRow("refresh-btn", "hnav-refresh-row", false);
    mirrorRow("saisie-nav-btn", "hnav-saisie-row", false);

async function _fbSaveSession(session) {
  // localStorage en premier — données sauvées même si Firebase échoue
  try {
    const local = JSON.parse(localStorage.getItem('hmft_sessions') || '[]');
    const idx = local.findIndex(s => s.date === session.date);
    if (idx !== -1) local[idx] = session; else local.push(session);
    localStorage.setItem('hmft_sessions', JSON.stringify(local));
  } catch(e) {}

  if (!_db) { throw new Error('Firebase non initialisé (_db est null)'); }
  // Timeout : si le réseau est absent au moment de valider, on ne bloque pas
  // l'utilisateur indéfiniment — la session est déjà sauvée en local ci-dessus,
  // et l'écriture Firebase, déjà lancée, se synchronisera d'elle-même à la reconnexion.
  await Promise.race([
    _db.ref('sessions/' + session.date).set(session),
    new Promise((_, reject) => setTimeout(() => reject(new Error('OFFLINE_TIMEOUT')), 6000))
  ]);
}

async function _fbDeleteSession(date) {
  try {
    const local = JSON.parse(localStorage.getItem('hmft_sessions') || '[]');
    localStorage.setItem('hmft_sessions', JSON.stringify(local.filter(s => s.date !== date)));
  } catch(e) {}

  if (!_db) return;
  await _db.ref('sessions/' + date).remove();
}

/* Bornes de saisons avec dates précises (sy = année de début) */
const SEASON_DEFS = [
  { sy: 2026, start: '2026-08-24', end: '2027-07-19' },
  // Ajouter ici les prochaines saisons au fil du temps
];

function _seasonStart(date) {
  const d = new Date(date);
  const ds = d.toISOString().slice(0, 10);
  // Chercher dans les bornes explicites d'abord
  for (const s of SEASON_DEFS) {
    if (ds >= s.start && ds <= s.end) return s.sy;
  }
  // Fallback : règle du 15 août
  const m = d.getMonth();
  return (m > 7 || (m === 7 && d.getDate() >= 15)) ? d.getFullYear() : d.getFullYear() - 1;
}
function _seasonLabel(sy) { return `${sy}/${sy + 1}`; }

/* Saison affichée : si on est en off-season avant une saison définie, on affiche déjà cette saison */
function _currentSeason() {
  const today = new Date().toISOString().slice(0, 10);
  // Dans une saison définie ?
  for (const s of SEASON_DEFS) {
    if (today >= s.start && today <= s.end) return s.sy;
  }
  // Off-season avant une prochaine saison définie → afficher cette prochaine saison
  const next = [...SEASON_DEFS].sort((a, b) => a.start.localeCompare(b.start)).find(s => today < s.start);
  if (next) return next.sy;
  // Fallback
  return _seasonStart(today);
}

const MONTH_NAMES = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function filterSessions(period) {
  if (!SESSIONS.length) return [];
  const sorted = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
  if (period === "session") {
    const found = SESSIONS.find(s => s.date === filterSessionDate);
    return found ? [found] : [sorted[0]];
  }
  if (period === "month") return SESSIONS.filter(s => {
    const d = new Date(s.date);
    return d.getMonth() === filterMonth && _seasonStart(d) === filterYear;
  });
  if (period === "year")  return SESSIONS.filter(s => _seasonStart(s.date) === filterYear);
  if (period === "custom") {
    const bounds = _dbxSessionDateBounds();
    const from = dbxCustomFrom || (bounds ? bounds.min : null);
    const to   = dbxCustomTo   || (bounds ? bounds.max : null);
    if (!from || !to) return SESSIONS;
    return SESSIONS.filter(s => s.date >= from && s.date <= to);
  }
  return SESSIONS;
}

/* Résout les sessions de la "période précédente équivalente" pour un mode donné :
   session -> session juste avant ; mois -> mois précédent ; saison -> saison précédente ;
   personnalisé -> même durée juste avant la plage en cours. Retourne null si non calculable
   (pas de session antérieure trouvée) — sert de base au mode "Comparer avec la période précédente". */
function _dbxPreviousPeriodSessions(period) {
  if (period === "session") {
    const sorted = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
    const curDate = filterSessionDate || (sorted[0] && sorted[0].date);
    const idx = sorted.findIndex(s => s.date === curDate);
    if (idx === -1 || idx + 1 >= sorted.length) return null;
    return [sorted[idx + 1]];
  }
  if (period === "month") {
    if (filterYear == null || filterMonth == null) return null;
    /* filterYear est le label de SAISON (sy), pas l'annee calendaire : au sein d'une
       saison, les mois s'enchainent aout(7)->...->decembre(11)->janvier(0)->...->juillet(6).
       Le label de saison ne change qu'a la frontiere aout/juillet, jamais a decembre/janvier. */
    let py = filterYear, pm = filterMonth - 1;
    if (pm < 0) pm = 11;
    else if (filterMonth === 7) py = filterYear - 1;
    const prev = SESSIONS.filter(s => { const d = new Date(s.date); return d.getMonth() === pm && _seasonStart(d) === py; });
    return prev.length ? prev : null;
  }
  if (period === "year") {
    if (filterYear == null) return null;
    const prev = SESSIONS.filter(s => _seasonStart(s.date) === filterYear - 1);
    return prev.length ? prev : null;
  }
  if (period === "custom") {
    const bounds = _dbxSessionDateBounds();
    const from = dbxCustomFrom || (bounds ? bounds.min : null);
    const to   = dbxCustomTo   || (bounds ? bounds.max : null);
    if (!from || !to) return null;
    const days = Math.round((new Date(to) - new Date(from)) / 86400000) + 1;
    const prevTo = new Date(new Date(from).getTime() - 86400000).toISOString().slice(0,10);
    const prevFrom = new Date(new Date(prevTo).getTime() - (days-1) * 86400000).toISOString().slice(0,10);
    const prev = SESSIONS.filter(s => s.date >= prevFrom && s.date <= prevTo);
    return prev.length ? prev : null;
  }
  return null; // "all" n'a pas de période antérieure
}

/* Petit badge de variation à injecter juste après .dbx-hero-num. prev=null/undefined -> "N/A"
   grisé (pas de période de comparaison disponible). opts.invert : les baisses sont "bonnes"
   (ex. buts encaissés/match). opts.decimals : arrondi à 1 décimale plutôt qu'à l'entier. */
function _dbxDeltaBadge(cur, prev, opts) {
  opts = opts || {};
  if (prev === null || prev === undefined || isNaN(prev)) return `<span class="dbx-hero-delta na">N/A</span>`;
  const mult = opts.decimals ? 10 : 1;
  const diff = Math.round((cur - prev) * mult) / mult;
  const suffix = opts.suffix || "";
  if (diff === 0) return `<span class="dbx-hero-delta flat">= période précédente</span>`;
  const good = opts.invert ? diff < 0 : diff > 0;
  const arrow = diff > 0 ? "▲" : "▼";
  const sign = diff > 0 ? "+" : "";
  return `<span class="dbx-hero-delta ${good ? "up" : "down"}">${arrow} ${sign}${diff}${suffix}</span>`;
}

/* Bornes (min/max) des dates de session — pour les bornes de l'input date personnalisé */
function _dbxSessionDateBounds() {
  if (!SESSIONS.length) return null;
  const sorted = [...SESSIONS].sort((a,b) => new Date(a.date)-new Date(b.date));
  return { min: sorted[0].date, max: sorted[sorted.length-1].date };
}

/* Saisons disponibles (triées desc) — logique de scoping partagée */
function _dbxSeasonsAvailable() {
  return [...new Set(SESSIONS.map(s => _seasonStart(s.date)))].sort((a,b)=>b-a);
}
/* Mois disponibles pour une saison donnée (mode mois) */
function _dbxMonthsForSeason(sy) {
  return [...new Set(
    SESSIONS
      .filter(s => _seasonStart(s.date) === sy)
      .map(s => new Date(s.date).getMonth())
  )].sort((a,b)=>b-a);
}

/* Reconstruit le sous-filtre contextuel (droite du segment) selon le mode actif :
   session → sélecteur de session (motif sess-dd existant) ; mois → saison + mois ;
   saison → saison seule ; all-time → rien. Pilote toujours currentPeriod/filterYear/
   filterMonth/filterSessionDate et déclenche renderDashboard(), comme l'ancien filtre. */
function updateSubFilter(period) {
  const sub = document.getElementById("dbx-fb-sub");
  if (!sub) return;

  if (period === "session") {
    const sorted = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
    if (!sorted.length) { sub.innerHTML = ""; return; }
    if (filterSessionDate === null || !sorted.some(s => s.date === filterSessionDate)) filterSessionDate = sorted[0].date;
    sub.innerHTML = `
      <div class="sess-dd" id="dbx-sess-dd">
        <button type="button" class="sess-dd-btn" id="dbx-sess-dd-btn">
          <span id="dbx-sess-dd-label">${fmtDate(filterSessionDate)}</span>
          <svg width="11" height="7" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        </button>
        <div class="sess-dd-panel" id="dbx-sess-dd-panel">${sorted.map(s =>
          `<button type="button" class="sess-dd-opt${s.date===filterSessionDate?" active":""}" data-date="${s.date}">${fmtDate(s.date)}</button>`
        ).join("")}</div>
      </div>`;
    document.getElementById("dbx-sess-dd-btn").addEventListener("click", e => {
      e.stopPropagation();
      document.getElementById("dbx-sess-dd").classList.toggle("open");
    });
    document.getElementById("dbx-sess-dd-panel").addEventListener("click", e => {
      const btn = e.target.closest(".sess-dd-opt");
      if (!btn) return;
      filterSessionDate = btn.dataset.date;
      document.getElementById("dbx-sess-dd").classList.remove("open");
      renderDashboard();
    });

  } else if (period === "month") {
    const seasons = _dbxSeasonsAvailable();
    if (filterYear === null || !seasons.includes(filterYear)) filterYear = seasons[0] ?? null;
    const months = _dbxMonthsForSeason(filterYear);
    if (filterMonth === null || !months.includes(filterMonth)) filterMonth = months[0] ?? null;
    sub.innerHTML = `
      <select class="dbx-fb-select" id="dbx-sel-year">${seasons.map(sy => `<option value="${sy}" ${sy===filterYear?"selected":""}>${_seasonLabel(sy)}</option>`).join("")}</select>
      <select class="dbx-fb-select" id="dbx-sel-month">${months.map(m => `<option value="${m}" ${m===filterMonth?"selected":""}>${MONTH_NAMES[m][0].toUpperCase()+MONTH_NAMES[m].slice(1)}</option>`).join("")}</select>`;
    document.getElementById("dbx-sel-year").addEventListener("change", e => {
      filterYear = Number(e.target.value);
      const ms = _dbxMonthsForSeason(filterYear);
      filterMonth = ms[0] ?? null;
      updateSubFilter("month");
      renderDashboard();
    });
    document.getElementById("dbx-sel-month").addEventListener("change", e => {
      filterMonth = Number(e.target.value);
      renderDashboard();
    });

  } else if (period === "year") {
    const seasons = _dbxSeasonsAvailable();
    if (filterYear === null || !seasons.includes(filterYear)) filterYear = seasons[0] ?? null;
    sub.innerHTML = `<select class="dbx-fb-select" id="dbx-sel-year2">${seasons.map(sy => `<option value="${sy}" ${sy===filterYear?"selected":""}>Saison ${_seasonLabel(sy)}</option>`).join("")}</select>`;
    document.getElementById("dbx-sel-year2").addEventListener("change", e => {
      filterYear = Number(e.target.value);
      renderDashboard();
    });

  } else if (period === "custom") {
    const sortedDates = [...new Set(SESSIONS.map(s => s.date))].sort();
    if (!sortedDates.length) { sub.innerHTML = ""; }
    else {
      if (!dbxCustomFrom || !sortedDates.includes(dbxCustomFrom)) dbxCustomFrom = sortedDates[0];
      if (!dbxCustomTo   || !sortedDates.includes(dbxCustomTo))   dbxCustomTo   = sortedDates[sortedDates.length-1];
      const fromOpts = sortedDates.filter(d => d <= dbxCustomTo);
      const toOpts   = sortedDates.filter(d => d >= dbxCustomFrom);
      sub.innerHTML = `
        <select class="dbx-fb-select" id="dbx-custom-from">${fromOpts.map(d => `<option value="${d}" ${d===dbxCustomFrom?"selected":""}>${fmtDate(d)}</option>`).join("")}</select>
        <span class="dbx2-date-sep">→</span>
        <select class="dbx-fb-select" id="dbx-custom-to">${toOpts.map(d => `<option value="${d}" ${d===dbxCustomTo?"selected":""}>${fmtDate(d)}</option>`).join("")}</select>`;
      document.getElementById("dbx-custom-from").addEventListener("change", e => {
        dbxCustomFrom = e.target.value;
        updateSubFilter("custom");
        _dbxSyncHash();
        renderDashboard();
      });
      document.getElementById("dbx-custom-to").addEventListener("change", e => {
        dbxCustomTo = e.target.value;
        updateSubFilter("custom");
        _dbxSyncHash();
        renderDashboard();
      });
    }

  } else {
    sub.innerHTML = "";
  }

  document.getElementById("dbx-fb-meta").innerHTML =
    `${SESSIONS.length} session${SESSIONS.length>1?"s":""} au total &middot; ${_dbxSeasonsAvailable().length} saison${_dbxSeasonsAvailable().length>1?"s":""}`;
}

function computeStats(sessions) {
  const allMatchs = sessions.flatMap(s => (s.matchs||[]).map(m => ({...m, date:s.date})));
  const ps = {};
  ALL_PLAYERS.forEach(p => { ps[p] = {presences:0,absences:0,blesses:0,pasRepondu:0,buts:0,passes:0,vR:0,vV:0,vB:0}; });

  sessions.forEach(s => {
    Object.entries(s.presences).forEach(([p, info]) => {
      if (!ps[p]) ps[p] = {presences:0,absences:0,blesses:0,pasRepondu:0,buts:0,passes:0,vR:0,vV:0,vB:0};
      if      (info.statut==="Présent")     ps[p].presences++;
      else if (info.statut==="Absent")      ps[p].absences++;
      else if (info.statut==="Blessé")      ps[p].blesses++;
      else if (info.statut==="Pas répondu") ps[p].pasRepondu++;
    });
    (s.matchs||[]).forEach(m => {
      ["A","B"].forEach(side => {
        const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
        buts.forEach((b,i) => {
          if (!b || b==="CSC") return;
          if (ps[b]) ps[b].buts++;
          const p = passes[i]; if (p && p!=="CSC" && ps[p]) ps[p].passes++;
        });
      });
      const winner = m.scoreA > m.scoreB ? m.eqA : m.scoreB > m.scoreA ? m.eqB : null;
      if (winner) {
        Object.entries(s.presences).forEach(([p, info]) => {
          if (info.statut==="Présent" && info.equipe===winner && ps[p]) {
            if (winner==="Rouge") ps[p].vR++; else if (winner==="Vert") ps[p].vV++; else ps[p].vB++;
          }
        });
      }
    });
  });

  Object.values(ps).forEach(p => {
    p.totalVic = p.vR + p.vV + p.vB;
    const best = Math.max(p.vR, p.vV, p.vB);
    p.bestColor = best===0 ? null : p.vR===best ? "Rouge" : p.vV===best ? "Vert" : "Bleue";
  });

  /* Episode detection: séquences consécutives de "Blessé" = 1 épisode */
  const sessionsByDate = [...sessions].sort((a,b) => new Date(a.date)-new Date(b.date));
  const inEpisode = {};
  Object.keys(ps).forEach(p => { ps[p].episodesBlessures = 0; ps[p].matchsBlessures = 0; inEpisode[p] = false; });
  sessionsByDate.forEach(s => {
    Object.keys(ps).forEach(p => {
      const info = s.presences[p];
      if (!info) { inEpisode[p] = false; return; }
      if (info.statut === "Blessé") {
        ps[p].matchsBlessures++;
        if (!inEpisode[p]) { ps[p].episodesBlessures++; inEpisode[p] = true; }
      } else {
        inEpisode[p] = false;
      }
    });
  });

  const mostGoals   = allMatchs.reduce((b,m) => { const t=m.scoreA+m.scoreB; return (!b||t>b.total)?{...m,total:t}:b; }, null);
  const biggestAmp  = allMatchs.reduce((b,m) => { const a=Math.abs(m.scoreA-m.scoreB); return (!b||a>b.amp)?{...m,amp:a}:b; }, null);
  const bestAttack  = allMatchs.reduce((b,m) => { const mx=Math.max(m.scoreA,m.scoreB); return (!b||mx>b.mx)?{...m,mx,topTeam:m.scoreA>=m.scoreB?m.eqA:m.eqB}:b; }, null);
  const topButeur   = Object.entries(ps).filter(([,p])=>p.buts>0).sort((a,b)=>b[1].buts-a[1].buts)[0]||null;
  const colorWins   = {Rouge:0,Vert:0,Bleue:0};
  allMatchs.forEach(m => { if(m.scoreA>m.scoreB) colorWins[m.eqA]++; else if(m.scoreB>m.scoreA) colorWins[m.eqB]++; });
  const bestColor   = Object.entries(colorWins).sort((a,b)=>b[1]-a[1])[0]||null;

  const goalsPerTeam = {Rouge:0, Vert:0, Bleue:0};
  allMatchs.forEach(m => { goalsPerTeam[m.eqA] = (goalsPerTeam[m.eqA]||0) + m.scoreA; goalsPerTeam[m.eqB] = (goalsPerTeam[m.eqB]||0) + m.scoreB; });

  const byAlpha = (a,b) => a[0].localeCompare(b[0], "fr");
  const top3Pres    = Object.entries(ps).filter(([n,p])=>p.presences>0&&!JOKERS.has(n)).sort((a,b)=>b[1].presences-a[1].presences||byAlpha(a,b)).slice(0,3);
  const top3Abs     = Object.entries(ps).filter(([n,p])=>p.absences>0&&!JOKERS.has(n))
    .sort((a,b)=>b[1].absences-a[1].absences||byAlpha(a,b)).slice(0,3);
  const top3Bles    = Object.entries(ps).filter(([,p])=>p.episodesBlessures>0)
    .sort((a,b)=>b[1].episodesBlessures-a[1].episodesBlessures||b[1].matchsBlessures-a[1].matchsBlessures||byAlpha(a,b)).slice(0,3);
  const buteursRank  = Object.entries(ps).filter(([,p])=>p.buts>0).sort((a,b)=>b[1].buts-a[1].buts||byAlpha(a,b));
  const passeursRank = Object.entries(ps).filter(([,p])=>p.passes>0).sort((a,b)=>b[1].passes-a[1].passes||byAlpha(a,b));

  return {ps, mostGoals, biggestAmp, bestAttack, topButeur, bestColor, colorWins, goalsPerTeam, top3Pres, top3Abs, top3Bles, buteursRank, passeursRank, allMatchs};
}

/* ══════════════════════════════════════════════════════════
   VUE PARTAGÉE : DÉTAIL D'UNE SESSION
   Utilisée dans Dashboard "Dernière session" ET onglet Sessions
══════════════════════════════════════════════════════════ */
function computeLinkUpStats(sessions) {
  const duoMap = {};
  sessions.forEach(session => {
    (session.matchs || []).forEach(m => {
      const processSide = (buteurs, passeurs) => {
        (buteurs || []).forEach((buteur, j) => {
          const passeur = passeurs && passeurs[j] ? passeurs[j] : null;
          if (!buteur || buteur === "CSC" || !passeur || passeur === "CSC") return;
          const [a, b] = [buteur, passeur].sort();
          const key = `${a}|||${b}`;
          if (!duoMap[key]) duoMap[key] = {p1: a, p2: b, connexions: 0, p1Goals: 0, p2Goals: 0};
          duoMap[key].connexions++;
          if (buteur === a) duoMap[key].p1Goals++; else duoMap[key].p2Goals++;
        });
      };
      processSide(m.buteursA, m.passeursA);
      processSide(m.buteursB, m.passeursB);
    });
  });
  return Object.values(duoMap).filter(d => d.connexions > 0).sort((a,b) => b.connexions - a.connexions);
}

function computeTopDefendersStats(sessions, minMatches) {
  const defMap = {};
  const add = (player, goals) => {
    if (!defMap[player]) defMap[player] = {goalsAgainst:0, matchCount:0};
    defMap[player].goalsAgainst += goals;
    defMap[player].matchCount++;
  };
  sessions.forEach(session => {
    const presences = session.presences || {};
    (session.matchs || []).forEach(m => {
      // Equipe a 6 : le joueur au Banc un mi-temps ne doit ni etre credite ni penalise
      // pour ce mi-temps-la (il n etait pas sur le terrain). Necessite le detail par
      // mi-temps ; les sessions plus anciennes sans ce detail gardent l ancien calcul
      // (1 unite = le match entier) pour ne pas perdre leur historique.
      const hasHalves = m.mt1A !== undefined && m.mt1B !== undefined;
      const bancA = m.bancA || ["",""], bancB = m.bancB || ["",""];
      Object.entries(presences).forEach(([player, info]) => {
        if (info.statut !== "Présent" || !info.equipe) return;
        const isA = m.eqA === info.equipe, isB = m.eqB === info.equipe;
        if (!isA && !isB) return;
        if (!hasHalves) { add(player, isA ? m.scoreB : m.scoreA); return; }
        const banc = isA ? bancA : bancB;
        const mt1c = isA ? (m.mt1B||0) : (m.mt1A||0);
        const mt2c = isA ? Math.max(0,(m.scoreB||0)-(m.mt1B||0)) : Math.max(0,(m.scoreA||0)-(m.mt1A||0));
        if (banc[0] !== player) add(player, mt1c);
        if (banc[1] !== player) add(player, mt2c);
      });
    });
  });
  const min = minMatches || 1;
  return Object.entries(defMap)
    .filter(([,d]) => d.matchCount >= min)
    .map(([name,d]) => ({name, ...d, avg: d.goalsAgainst/d.matchCount}))
    .sort((a,b) => a.avg - b.avg || b.matchCount - a.matchCount);
}

// Podium gradient des Récompenses (buteurs / passeurs / défenseurs / gardien).
function buildPodiumVizSlotsV2(slots, valueFn, nameFn, pctClass) {
  const order = [1, 0, 2];
  const cfgs  = [
    { cls: 'silver', emoji: '🥈' },
    { cls: 'gold',   emoji: '🥇' },
    { cls: 'bronze', emoji: '🥉' },
  ];
  return `<div class="rp-podium">` + order.map((si, pos) => {
    const cfg  = cfgs[pos];
    const slot = slots[si];
    if (!slot) return `<div class="rp-pod-slot ${cfg.cls} rp-pod-empty"><span class="rp-pod-name"></span><span class="rp-pod-val"></span><div class="rp-pod-plat"><span class="rp-pod-medal">${cfg.emoji}</span></div></div>`;
    return `<div class="rp-pod-slot ${cfg.cls}">
      <span class="rp-pod-name">${nameFn(slot)}</span>
      <span class="rp-pod-val${pctClass?' pct':''}">${valueFn(slot)}</span>
      <div class="rp-pod-plat"><span class="rp-pod-medal">${cfg.emoji}</span></div>
    </div>`;
  }).join('') + `</div>`;
}

// Regroupe les entrées ex-æquo dans les 3 premiers slots (podium), reste = liste ordonnée
function buildTop10Slots(items, sameValue) {
  const slots = []; let rem = [...items];
  while (rem.length && slots.length < 3) {
    const top = rem[0].value;
    const tied = rem.filter(it => sameValue(it.value, top));
    slots.push({ rank: slots.length, players: tied.map(it => it.name), value: top });
    rem = rem.filter(it => !sameValue(it.value, top));
  }
  return { slots, rest: rem };
}

// items : [{name, value}], déjà triés du meilleur au moins bon
function buildTop10HTMLv2(items, valueFmt, sameValue) {
  if (!items.length) return `<span class="no-data">—</span>`;
  const cmp = sameValue || ((a,b) => a === b);
  const { slots, rest } = buildTop10Slots(items, cmp);
  const podiumHtml = buildPodiumVizSlotsV2(slots, s => valueFmt(s.value), s => s.players.map(n => pLink(n)).join(", "));
  const shownCount = slots.reduce((sum,s) => sum + s.players.length, 0);
  const restRows = rest.slice(0, Math.max(0, 10 - shownCount));
  const listHtml = restRows.length ? `<div class="top10-list">${restRows.map((it, i) => `
    <div class="top10-row"><span class="top10-rank">${shownCount + i + 1}</span><span class="top10-name">${pLink(it.name)}</span><span class="top10-val">${valueFmt(it.value)}</span></div>
  `).join('')}</div>` : '';
  return podiumHtml + listHtml;
}

function buildTopDefCardHTMLv2(sessions, minMatches) {
  const defs = computeTopDefendersStats(sessions, minMatches);
  if (!defs.length) return `<div class="kpi-card" data-card="top-defenseurs">
    <div class="kpi-lbl" style="margin-top:0;margin-bottom:10px">Top 10 Défenseurs 🔒</div>
    <span style="color:var(--text3)">—</span>
  </div>`;
  const items = defs.map(d => ({ name: d.name, value: d.avg }));
  const body = buildTop10HTMLv2(items, v => `${v.toFixed(1).replace(".",",")} b.c./m`, (a,b) => Math.abs(a-b) < 1e-9);
  return `<div class="kpi-card" data-card="top-defenseurs">
    <div class="kpi-lbl" style="margin-top:0;margin-bottom:10px">Top 10 Défenseurs 🔒</div>
    ${body}
  </div>`;
}

// Top 10 gardien : taux de clean sheets (%), minimum 3 matchs gardés
function buildGardienTop10HTML() {

  }).filter(r => r.matchs >= 3).sort((a,b) => b.rate - a.rate || b.matchs - a.matchs || a.name.localeCompare(b.name,'fr'));

function computeGardiensRanking(sessions) {
  const stats = {};
  sessions.forEach(s => {
    (s.matchs || []).forEach(m => {
      if (m.mt1A === undefined || m.mt1B === undefined) return;
      const gA = m.gardiensA || [], gB = m.gardiensB || [];
      const mt1Ac = m.mt1B || 0, mt2Ac = Math.max(0, (m.scoreB||0) - (m.mt1B||0));
      const mt1Bc = m.mt1A || 0, mt2Bc = Math.max(0, (m.scoreA||0) - (m.mt1A||0));
      // Chaque mi-temps gardee compte comme une unite a part entiere (meme si le meme
      // gardien tient les deux mi-temps) : sinon un 0-0 en 1ere mi-temps suivi d un 0-2
      // en 2e se noierait en une seule "presence" a la moyenne, sans clean sheet compte.
      [[gA[0],mt1Ac],[gA[1],mt2Ac],[gB[0],mt1Bc],[gB[1],mt2Bc]].forEach(([p,c]) => {
        if (!p || !p.trim()) return;
        if (!stats[p]) stats[p] = { matchs: 0, buts: 0, cleanSheets: 0 };
        stats[p].matchs++;
        stats[p].buts += c;
        if (c === 0) stats[p].cleanSheets++;
      });
    });
  });
  return Object.entries(stats)
    .filter(([,s]) => s.matchs > 0)
    .map(([name, s]) => ({ name, matchs: s.matchs, buts: s.buts, cleanSheets: s.cleanSheets, rate: s.buts / s.matchs }));
}

/* Équipe-type scopée à UNE couleur (Dashboard Équipes) : ne retient que les joueurs ayant
   porté cette couleur sur la période, et base leurs stats (buts/passes/défense/gardien)
   UNIQUEMENT sur les matchs/mi-temps joués sous cette couleur précise — pas leurs stats
   globales, qui mélangeraient plusieurs couleurs si le joueur a tourné. Un même joueur
   peut donc apparaître dans l'équipe-type de 2, voire 3 couleurs différentes. */
function _dbxTeamScopedEquipeType(sessions, color) {
  const buteursCount = {}, passeursCount = {};
  const defMap = {}, gkMap = {};

  sessions.forEach(s => {
    const presences = s.presences || {};
    (s.matchs || []).forEach(m => {
      const isA = m.eqA === color, isB = m.eqB === color;
      if (!isA && !isB) return;
      const myButs = isA ? (m.buteursA||[]) : (m.buteursB||[]);
      const myPasses = isA ? (m.passeursA||[]) : (m.passeursB||[]);
      myButs.forEach((b,i) => {
        if (!b || b==="CSC" || (presences[b]||{}).equipe !== color) return;
        buteursCount[b] = (buteursCount[b]||0)+1;
        const p = myPasses[i];
        if (p && p!=="CSC" && (presences[p]||{}).equipe === color) passeursCount[p] = (passeursCount[p]||0)+1;
      });

      const hasHalves = m.mt1A !== undefined && m.mt1B !== undefined;
      const banc = isA ? (m.bancA||["",""]) : (m.bancB||["",""]);
      const mt1c = isA ? (m.mt1B||0) : (m.mt1A||0);
      const mt2c = isA ? Math.max(0,(m.scoreB||0)-(m.mt1B||0)) : Math.max(0,(m.scoreA||0)-(m.mt1A||0));
      Object.entries(presences).forEach(([player, info]) => {
        if (info.statut !== "Présent" || info.equipe !== color) return;
        defMap[player] = defMap[player] || {goalsAgainst:0, matchCount:0};
        if (!hasHalves) {
          defMap[player].goalsAgainst += isA ? (m.scoreB||0) : (m.scoreA||0);
          defMap[player].matchCount++;
          return;
        }
        if (banc[0] !== player) { defMap[player].goalsAgainst += mt1c; defMap[player].matchCount++; }
        if (banc[1] !== player) { defMap[player].goalsAgainst += mt2c; defMap[player].matchCount++; }
      });

      if (hasHalves) {
        // Un gardien "mercenaire" (venu depanner une autre couleur, ex : equipes a
        // 4 sur une soiree a 3 equipes) ne fait pas partie de cette couleur — on ne
        // le compte pas ici, meme s il a garde les buts ce soir-la sous cette couleur.
        const gs = isA ? (m.gardiensA||[]) : (m.gardiensB||[]);
        [[gs[0],mt1c],[gs[1],mt2c]].forEach(([p,c]) => {
          if (!p || !p.trim() || (presences[p]||{}).equipe !== color) return;
          gkMap[p] = gkMap[p] || { matchs:0, buts:0, cleanSheets:0 };
          gkMap[p].matchs++; gkMap[p].buts += c; if (c===0) gkMap[p].cleanSheets++;
        });
      }
    });
  });

  const outfield = Object.keys(defMap).filter(name => defMap[name].matchCount > 0).map(name => ({
    name, team: color,
    buts: buteursCount[name] || 0,
    passes: passeursCount[name] || 0,
    defAvg: defMap[name].goalsAgainst / defMap[name].matchCount,
    matchCount: defMap[name].matchCount
  }));
  const gks = Object.entries(gkMap).map(([name,g]) => ({
    name, team: color, matchs: g.matchs, buts: g.buts, cleanSheets: g.cleanSheets, rate: g.buts / g.matchs
  }));
  // Aucun gardien legitime (propre a cette couleur) sur la periode, mais des joueurs de
  // champ existent bien : on affiche quand meme l equipe-type, avec un gardien "vide"
  // (Ø / N/A) plutot que de masquer toute la section ou de retomber sur un mercenaire.
  if (!gks.length && outfield.length) {
    const team = _pickEquipeType(outfield, [{ name:"␀_no_gk_", team:color, matchs:0, buts:0, cleanSheets:0, rate:0 }], ttGkCriteria);
    if (team) team.gk = null;
    return team;
  }
  return _pickEquipeType(outfield, gks, ttGkCriteria);
}

/* Équipe-type (soirée ou période) : 1 gardien + jusqu'à 4 joueurs de champ répartis en
   attaquant/milieu/défenseur — 0 à 2 par poste, total 4. Aucun poste n'est stocké nulle
   part : tout est déduit des stats (buteur/passeur/moins de buts encaissés en jouant),
   sans minimum par poste (ex: 2 attaquants + 2 défenseurs sans milieu est valide si les
   stats de la période penchent nettement de ce côté). outfield/gks doivent deja porter
   un champ .team (couleur d'équipe) resolu par l'appelant (session ou periode). */
function _pickEquipeType(outfield, gks, gkCriteria) {
  if (!gks.length) return null;
  const gk = gks.slice().sort((a,b) => gkCriteria === "cs"
    ? (b.cleanSheets - a.cleanSheets) || (a.rate - b.rate)
    : (a.rate - b.rate) || (b.cleanSheets - a.cleanSheets)
  )[0];
  const candidates = outfield.filter(p => p.name !== gk.name);
  if (!candidates.length) return { gk, attaquants: [], milieux: [], defenseurs: [], shape: "0-0-0" };

  const maxButs = Math.max(1, ...candidates.map(p => p.buts));
  const maxPasses = Math.max(1, ...candidates.map(p => p.passes));
  const minDef = Math.min(...candidates.map(p => p.defAvg));
  const maxDef = Math.max(...candidates.map(p => p.defAvg));
  const defRange = (maxDef - minDef) || 1;
  // Un "leader" avec seulement 1 but/passe ne doit pas peser autant qu'un leader avec 3+.
  // Meme logique cote defense : sur un tout petit echantillon (peu de mi-temps jouees),
  // le meilleur def relatif du lot decrochait un score plein de 1 par simple normalisation
  // min/max, ecrasant a tort un profil offensif clair (ex: 3 passes decisives) qui, lui,
  // doit deja justifier son score par un volume reel. On applique le meme plancher de
  // volume (3 mi-temps) a la defense pour ne pas favoriser un ecart minime sur peu de matchs.
  const scoreFor = (p, role) => role === "attaquant" ? (p.buts / maxButs) * Math.min(1, p.buts / 3)
    : role === "milieu" ? (p.passes / maxPasses) * Math.min(1, p.passes / 3)
    : (1 - (p.defAvg - minDef) / defRange) * Math.min(1, (p.matchCount || 3) / 3);

  const ROLE_PRIORITY = { attaquant: 0, milieu: 1, defenseur: 2 };
  const roles = ["attaquant", "milieu", "defenseur"];
  const counts = { attaquant: 0, milieu: 0, defenseur: 0 };
  const usedNames = new Set();
  const picks = [];
  const slotsToFill = Math.min(4, candidates.length);

  for (let slot = 0; slot < slotsToFill; slot++) {
    let best = null;
    candidates.forEach(p => {
      if (usedNames.has(p.name)) return;
      roles.forEach(role => {
        if (counts[role] >= 2) return;
        const s = scoreFor(p, role);
        const better = !best || s > best.s + 1e-9 ||
          (Math.abs(s - best.s) < 1e-9 && (ROLE_PRIORITY[role] < ROLE_PRIORITY[best.role] ||
            (ROLE_PRIORITY[role] === ROLE_PRIORITY[best.role] && p.name.localeCompare(best.p.name, "fr") < 0)));
        if (better) best = { p, role, s };
      });
    });
    if (!best) break;
    counts[best.role]++;
    usedNames.add(best.p.name);
    picks.push({ ...best.p, role: best.role });
  }

  const attaquants = picks.filter(p => p.role === "attaquant");
  const milieux = picks.filter(p => p.role === "milieu");
  const defenseurs = picks.filter(p => p.role === "defenseur");
  return { gk, attaquants, milieux, defenseurs, shape: `${attaquants.length}-${milieux.length}-${defenseurs.length}` };
}

// Regroupe les buts (et passes décisives) d'un même joueur au sein d'un match,
// même si un but d'un autre joueur s'intercale entre deux de ses buts.
// Ex : buteur1 (passeur1), buteur1 (passeur1) → buteur1 ×2 (passeur1 ×2)
//      buteur1 (passeur1), buteur1 (passeur2) → buteur1 ×2 (passeur1, passeur2)
//      buteur1 (—), buteur1 (passeur1)        → buteur1 ×2 (ø, passeur1)
// À partir de 3 occurrences groupées, le fragment est mis en avant (gras + effet diamant).
function _matchGoalsRecapHTML(buteurs, passeurs) {
  if (!buteurs || !buteurs.length) return "";
  passeurs = passeurs || [];
  const order = [];
  const groups = {};
  buteurs.forEach((b, j) => {
    if (!b) return;
    if (!groups[b]) { groups[b] = { count: 0, passeurs: [] }; order.push(b); }
    groups[b].count++;
    groups[b].passeurs.push(passeurs[j] || null);
  });
  return order.map(name => {
    const g = groups[name];
    const isCsc = name === "CSC";
    const nameHtml = isCsc ? `<em style="color:var(--text2)">CSC</em>` : `<span style="color:var(--text2)">${name}</span>`;
    let scorerHtml = g.count > 1 ? `${nameHtml} ×${g.count}` : nameHtml;
    if (g.count >= 3) scorerHtml = `<span class="mgr-highlight">${scorerHtml}</span>`;
    // Pour un CSC, le champ "passeur" sert a noter le malheureux buteur (Saisie) —
    // on l affiche entre parentheses comme un assist normal.
    let assistHtml = "";
    if (g.passeurs.some(p => p)) {
      const aOrder = [], aCounts = {};
      g.passeurs.forEach(p => {
        const key = p || "ø";
        if (!aCounts[key]) { aCounts[key] = 0; aOrder.push(key); }
        aCounts[key]++;
      });
      const aParts = aOrder.map(key => {
        const n = aCounts[key];
        const disp = key === "ø" ? "ø" : `<span style="color:var(--text2)">${key}</span>`;
        let part = n > 1 ? `${disp} ×${n}` : disp;
        if (n >= 3) part = `<span class="mgr-highlight">${part}</span>`;
        return part;
      });
      assistHtml = ` <span style="color:var(--text2)">(${aParts.join(", ")})</span>`;
    }
    return scorerHtml + assistHtml;
  }).join(", ");
}

function _recapSideSummary(m, side) {
  const eq = side === "A" ? m.eqA : m.eqB;
  const buteurs = (side === "A" ? m.buteursA : m.buteursB) || [];
  const passeurs = (side === "A" ? m.passeursA : m.passeursB) || [];
  if (!buteurs.length) return "";
  return `${dot(eq)} : ⚽️ ${_matchGoalsRecapHTML(buteurs, passeurs)}`;
}

function _recapSideGkName(m, side) {
  const raw = (side === "A" ? m.gardiensA : m.gardiensB) || [];
  const names = [...new Set(raw.filter(Boolean))];
  return names.join("/");
}

function buildMatchRecapRowHTML(m, idx) {

/* ══════════════════════════════════════════════════════════
   SESSIONS V2 — « Feuille de match »
   Nouvelle mise en page utilisée par renderSessionResults() (onglet
   Sessions). Le Dashboard (préfixe dbx-) a son propre rendu agrégé
   et n'utilise pas ces fonctions.
══════════════════════════════════════════════════════════ */

function _sfmGkLineHTML(gardiens) {
  const names = [...new Set((gardiens || []).filter(Boolean))];
  if (!names.length) return "";
  return `<span class="sfm-spot-gk">🧤 ${names.map(n => pLink(n)).join(" / ")}</span>`;
}
function _sfmGoalsPhrase(n) {
  if (n === 1) return "1 but";
  if (n === 2) return "un doublé";
  if (n === 3) return "un triplé";
  if (n === 4) return "un quadruplé";
  if (n === 5) return "un quintuplé";
  return `${n} buts`;
}

function _sfmHeroDate(dateStr) {
  const days = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
  const dt = new Date(dateStr + "T12:00:00");
  const day = isNaN(dt.getTime()) ? "" : days[dt.getDay()];
  return `${day ? day + " " : ""}${fmtDate(dateStr)}`;
}

function _sfmStandings(matchs) {
  const goalsFor = {}, goalsAgainst = {}, wins = {}, drawsPerTeam = {}, matchesPerTeam = {};
  matchs.forEach(m => {
    goalsFor[m.eqA]     = (goalsFor[m.eqA]||0)     + m.scoreA;
    goalsFor[m.eqB]     = (goalsFor[m.eqB]||0)     + m.scoreB;
    goalsAgainst[m.eqA] = (goalsAgainst[m.eqA]||0) + m.scoreB;
    goalsAgainst[m.eqB] = (goalsAgainst[m.eqB]||0) + m.scoreA;
    matchesPerTeam[m.eqA] = (matchesPerTeam[m.eqA]||0) + 1;
    matchesPerTeam[m.eqB] = (matchesPerTeam[m.eqB]||0) + 1;
    if (m.scoreA > m.scoreB) wins[m.eqA] = (wins[m.eqA]||0) + 1;
    else if (m.scoreB > m.scoreA) wins[m.eqB] = (wins[m.eqB]||0) + 1;
    else { drawsPerTeam[m.eqA] = (drawsPerTeam[m.eqA]||0) + 1; drawsPerTeam[m.eqB] = (drawsPerTeam[m.eqB]||0) + 1; }
  });
  const teamsPlayed = [...new Set(matchs.flatMap(m => [m.eqA, m.eqB]))];
  return teamsPlayed.map(t => {
    const pj = matchesPerTeam[t]||0, v = wins[t]||0, n = drawsPerTeam[t]||0, d = pj-v-n;
    return { team: t, pj, v, n, d, pts: v*3+n, gf: goalsFor[t]||0, ga: goalsAgainst[t]||0, diff: (goalsFor[t]||0)-(goalsAgainst[t]||0) };
  }).sort((a,b) => b.pts-a.pts || b.diff-a.diff || b.gf-a.gf);
}

function _sfmTopScorerInMatch(m) {
  const c = {};
  (m.buteursA||[]).forEach(b => { if (b && b !== "CSC") c[b] = (c[b]||0)+1; });
  (m.buteursB||[]).forEach(b => { if (b && b !== "CSC") c[b] = (c[b]||0)+1; });
  const ranked = Object.entries(c).sort((a,b) => b[1]-a[1]);
  return ranked.length ? { name: ranked[0][0], count: ranked[0][1] } : null;
}
function _sfmTopAssisterInMatch(m) {
  const c = {};
  (m.passeursA||[]).forEach(p => { if (p && p !== "CSC") c[p] = (c[p]||0)+1; });
  (m.passeursB||[]).forEach(p => { if (p && p !== "CSC") c[p] = (c[p]||0)+1; });
  const ranked = Object.entries(c).sort((a,b) => b[1]-a[1]);
  return ranked.length ? { name: ranked[0][0], count: ranked[0][1] } : null;
}
function _sfmMatchHasCsc(m) {
  return (m.buteursA||[]).includes("CSC") || (m.buteursB||[]).includes("CSC");
}
/* Buts + passes d'un joueur dans UN match precis — pour credier une implication
   complete (ex: "un doublé et une passe décisive") plutôt que le seul total de buts. */
function _sfmPlayerStatsInMatch(m, name) {
  const goals   = [...(m.buteursA||[]),  ...(m.buteursB||[])].filter(b => b === name).length;
  const assists = [...(m.passeursA||[]), ...(m.passeursB||[])].filter(p => p === name).length;
  return { goals, assists };
}
function _sfmGoalsAssistsPhrase(goals, assists) {
  const gp = _sfmGoalsPhrase(goals);
  if (!assists) return gp;
  const ap = assists === 1 ? "une passe décisive" : `${assists} passes décisives`;
  return `${gp} et ${ap}`;
}

/* Choisit jusqu'à 3 matchs « temps forts » distincts, parmi 5 types de scénarios
   possibles (gros match individuel en buts, gros match en passes, CSC, gros score,
   gros écart) plutôt qu'un gabarit fixe ouverture/écart/tendu — chaque match est noté
   sur chacun des scénarios qu'il remplit, puis on garde les meilleurs, en essayant de
   varier les joueurs mis en avant d'une carte à l'autre. */
function _sfmPickSpotlights(matchs) {
  if (!matchs.length) return [];
  const candidates = [];
  matchs.forEach((m, i) => {
    const total = m.scoreA + m.scoreB;
    const margin = Math.abs(m.scoreA - m.scoreB);
    const topScorer = _sfmTopScorerInMatch(m);
    const topAssist = _sfmTopAssisterInMatch(m);
    if (topScorer && topScorer.count >= 3) candidates.push({ i, kind: "scorer", score: 100 + topScorer.count, player: topScorer.name });
    if (topAssist && topAssist.count >= 2) candidates.push({ i, kind: "assist", score: 70 + topAssist.count * 10, player: topAssist.name });
    if (_sfmMatchHasCsc(m)) candidates.push({ i, kind: "csc", score: 60, player: null });
    if (total >= 6) candidates.push({ i, kind: "highscore", score: 40 + total * 3, player: null });
    if (margin >= 3) candidates.push({ i, kind: "blowout", score: 30 + margin * 6, player: topScorer && topScorer.count >= 2 ? topScorer.name : null });
  });
  candidates.sort((a,b) => b.score - a.score);

  const picks = [], usedMatch = new Set(), usedPlayer = new Set();
  candidates.forEach(c => {
    if (picks.length >= 3 || usedMatch.has(c.i)) return;
    if (c.player && usedPlayer.has(c.player)) return;
    picks.push(c); usedMatch.add(c.i); if (c.player) usedPlayer.add(c.player);
  });
  // Peu de scénarios diversifiés (matchs/joueurs distincts) : complète jusqu'à 3 en
  // relâchant la contrainte de diversité, pour toujours remplir la 3e case si possible.
  if (picks.length < 3) {
    candidates.forEach(c => {
      if (picks.length >= Math.min(3, candidates.length || 1) || usedMatch.has(c.i)) return;
      picks.push(c); usedMatch.add(c.i);
    });
  }
  // Filet de sécurité : aucun scénario ne ressort (petite soirée très plate) — on ne
  // laisse jamais la section vide, on prend le match au score le plus généreux.
  if (!picks.length) {
    let best = 0;
    matchs.forEach((m,i) => { if ((m.scoreA+m.scoreB) > (matchs[best].scoreA+matchs[best].scoreB)) best = i; });
    picks.push({ i: best, kind: "highscore", score: 0, player: null });
  }
  return picks.sort((a,b) => a.i - b.i);
}

/* Choix "aleatoire" mais fige par session : _sfmRng est re-seede a partir de la date de
   la session a chaque rendu (voir renderSessionDetailV2), donc la meme session tire
   toujours la meme sequence de variantes de texte — plus de reformulation a chaque
   refresh — tout en gardant des sessions differentes entre elles. */
function _sfmSeedRng(seedStr) {
  let h = 0;
  for (let i = 0; i < seedStr.length; i++) h = (Math.imul(31, h) + seedStr.charCodeAt(i)) | 0;
  return function() {
    h = (Math.imul(h, 1103515245) + 12345) | 0;
    return ((h >>> 0) % 1000000) / 1000000;
  };
}
let _sfmRng = Math.random;
function _sfmPick(arr) { return arr[Math.floor(_sfmRng() * arr.length)]; }

/* Ne credite un gardien de "cage inviolee" que s il a garde SEUL tout le
   match (pas de rotation a la mi-temps) et n a rien encaisse. Un gardien
   qui n a joue qu une mi-temps sans encaisser ne compte pas comme clean
   sheet de match, meme si son propre compteur "buts" affiche 0. */
function _sfmFindFullCleanSheet(matchs) {
  const names = [];
  matchs.forEach(m => {
    const checkSide = (gardiens, conceded) => {
      const uniq = [...new Set((gardiens || []).filter(Boolean))];
      if (uniq.length === 1 && conceded === 0) names.push(uniq[0]);
    };
    checkSide(m.gardiensA, m.scoreB);
    checkSide(m.gardiensB, m.scoreA);
  });
  if (!names.length) return null;
  const count = {};
  names.forEach(n => { count[n] = (count[n]||0) + 1; });
  const [name, times] = Object.entries(count).sort((a,b) => b[1]-a[1])[0];
  return { name, times };
}

function _sfmSpotlightMeta(m, kind) {
  const eyebrows = {
    scorer: "🔥 Festival perso", assist: "🎯 Chef d'orchestre", csc: "😅 Petit cadeau",
    highscore: "🎆 Feu d'artifice", blowout: "💥 Correction en règle",
  };
  const top  = _sfmTopScorerInMatch(m);
  const topA = _sfmTopAssisterInMatch(m);
  let caption = "";
  if (kind === "scorer" && top) {
    const ph = _sfmGoalsAssistsPhrase(top.count, _sfmPlayerStatsInMatch(m, top.name).assists);
    caption = _sfmPick([
      `${top.name} n'a pas fait dans la dentelle : ${ph} rien que dans ce match.`,
      `${top.name} a décidé que ce match était plié à lui tout seul — ${ph}.`,
      `Quand ${top.name} s'y met (${ph}), la défense d'en face ferait mieux de checker les horaires du dernier bus.`,
    ]);
  } else if (kind === "assist" && topA) {
    caption = _sfmPick([
      `${topA.name} a passé le match à distribuer les caviars : ${topA.count} passes décisives rien que là-dedans.`,
      `${topA.name} en chef d'orchestre : ${topA.count} passes décisives pour lancer les autres.`,
      `${topA.name} n'a pas marqué, mais tout le monde marquait grâce à lui : ${topA.count} passes décisives.`,
    ]);
  } else if (kind === "csc") {
    caption = _sfmPick([
      `Un but contre son camp est venu pimenter la soirée — ça arrive aux meilleurs.`,
      `Petit cadeau involontaire dans ce match : un CSC est venu corser l'addition.`,
      `Un but contre son camp au menu de ce match — la défense adverse dit merci.`,
    ]);
  } else if (kind === "highscore") {
    const total = m.scoreA + m.scoreB;
    caption = _sfmPick([
      `${total} buts dans ce seul match — les défenses ont pris la soirée off.`,
      `Un vrai feu d'artifice offensif : ${total} buts inscrits à eux deux.`,
      `${total} buts au compteur pour ce match, difficile de faire plus spectaculaire ce soir-là.`,
    ]);
  } else if (kind === "blowout" && top && top.count >= 2) {
    const ph = _sfmGoalsAssistsPhrase(top.count, _sfmPlayerStatsInMatch(m, top.name).assists);
    caption = _sfmPick([
      `${top.name} n'a pas fait dans la dentelle : ${ph}, et l'adversaire n'a rien vu venir.`,
      `${top.name} a décidé que le match était plié — ${ph}, sans même forcer le ton.`,
      `Quand ${top.name} s'y met (${ph}), la défense d'en face ferait mieux de checker les horaires du dernier bus.`,
    ]);
  } else if (kind === "blowout") {
    const ecart = Math.abs(m.scoreA - m.scoreB);
    const ep = `${ecart} but${ecart>1?"s":""} d'écart`;
    caption = _sfmPick([
      `Une correction en règle : ${ep}, sans discussion possible.`,
      `${ep} — le genre de score qui se commente tout seul.`,
    ]);
  }
  return { eyebrow: eyebrows[kind] || "⭐ Temps fort", caption };
}

function _sfmRecapSentence(session, matchs, totalButs, buteursRanked, passeursRanked, gkRanking) {
  if (!matchs.length) return "";
  const parts = [];
  const avgButs = totalButs / matchs.length;
  if (avgButs >= 3) {
    parts.push(_sfmPick([
      `Une soirée à ${totalButs} buts en ${matchs.length} match${matchs.length>1?"s":""} — les défenses ont visiblement pris congé.`,
      `${totalButs} buts en ${matchs.length} match${matchs.length>1?"s":""} : on a plus vu de célébrations que de tacles ce soir-là.`,
    ]));
  } else if (avgButs <= 1.2) {
    parts.push(_sfmPick([
      `${totalButs} but${totalButs>1?"s":""} en ${matchs.length} match${matchs.length>1?"s":""} : soirée cadenassée, les gardiens ont fait le plus dur.`,
      `${matchs.length} match${matchs.length>1?"s":""}, ${totalButs} but${totalButs>1?"s":""} au compteur — plus de tacles que de caviars ce soir.`,
    ]));
  } else {
    parts.push(`${matchs.length} match${matchs.length>1?"s":""}, ${totalButs} but${totalButs>1?"s":""} inscrit${totalButs>1?"s":""} sous les projecteurs.`);
  }

  const topScorerName = buteursRanked.length ? buteursRanked[0][0] : null;
  if (buteursRanked.length) {
    const [name, count] = buteursRanked[0];
    const eq = (session.presences && session.presences[name]) ? session.presences[name].equipe : "";
    const cls = eq ? teamCls(eq) : "";
    const nameHtml = cls ? `<b style="color:var(--${cls})">${name}</b>` : `<b>${name}</b>`;
    const teamHtml = cls ? ` pour les <b style="color:var(--${cls})">${TEAM_LABEL[eq]||eq}</b>` : "";
    const assistEntry = passeursRanked.find(([n]) => n === name);
    const ph = _sfmGoalsAssistsPhrase(count, assistEntry ? assistEntry[1] : 0);
    parts.push(_sfmPick([
      `${nameHtml} s'est chargé du service après-vente offensif avec ${ph}${teamHtml} — pas franchement discret.`,
      `${nameHtml} régale avec ${ph}${teamHtml}, les autres n'avaient plus qu'à applaudir.`,
      `Ce soir-là, ${nameHtml} a fait le travail tout seul ou presque : ${ph}${teamHtml}.`,
    ]));
  }

  const fullCleanSheet = _sfmFindFullCleanSheet(matchs);
  if (fullCleanSheet) {
    parts.push(_sfmPick([
      `${fullCleanSheet.name} a verrouillé sa cage sur tout le match${fullCleanSheet.times>1?`, à ${fullCleanSheet.times} reprises`:""} — porte blindée, code changé.`,
      `Derrière, ${fullCleanSheet.name} n'a rien laissé filtrer sur l'intégralité d'un match : soirée tranquille dans ses buts.`,
    ]));
  } else if (gkRanking && gkRanking.length) {
    const best = [...gkRanking].filter(g => g.matchs >= 2).sort((a,b) => a.rate - b.rate)[0];
    if (best && best.buts > 0) {
      parts.push(_sfmPick([
        `${best.name} n'a craqué que ${best.buts} fois sur ses ${best.matchs} passages dans les buts — pas parfait, mais solide.`,
        `Dans les cages, ${best.name} affiche le meilleur bilan de la soirée (${best.buts} encaissé${best.buts>1?"s":""} en ${best.matchs} passages).`,
      ]));
    }
  }

  if (passeursRanked.length) {
    const [name, count] = passeursRanked[0];
    if (name !== topScorerName) {
      parts.push(_sfmPick([
        `${name} a plus donné de ballons que le facteur : ${count} passe${count>1?"s":""} décisive${count>1?"s":""} au compteur.`,
        `${name} s'est chargé de la distribution avec ${count} passe${count>1?"s":""} décisive${count>1?"s":""} — service cinq étoiles.`,
      ]));
    }
  }

  return parts.join(" ");
}

function _sfmScoreboardHTML(standings) {

  const ranks = ["1re place","2e place","3e place","4e place","5e place"];

  const cards = standings.map((row, i) => {
    const cls = teamCls(row.team);
    const diffSign = row.diff > 0 ? "+" : "";
    const diffCls  = row.diff > 0 ? "pos" : row.diff < 0 ? "neg" : "";
    const medal = medals[i] ? `<div class="sfm-sb-medal">${medals[i]}</div>` : "";
    return `<div class="sfm-sb-card sfm-fade-up${i===0?" sfm-sb-lead":""}" style="animation-delay:${(i*0.05).toFixed(2)}s">
      <div class="sfm-sb-accent ${cls}"></div>
      <div class="sfm-sb-body">
        <div class="sfm-sb-head">
          ${medal}
          <div style="flex:1;min-width:0"><div class="sfm-sb-rank${i===0?" first":""}">${ranks[i]||(i+1)+"e place"}</div><div class="sfm-sb-name ${cls}">${dot(row.team)}${TEAM_LABEL[row.team]||row.team}</div></div>
          <div class="sfm-sb-pts"><div class="v">${row.pts}</div><div class="l">Pts</div></div>
        </div>
        <div class="sfm-sb-sep"></div>
        <div class="sfm-sb-wdl"><span class="v">${row.v}V</span><span class="n">${row.n}N</span><span class="d">${row.d}D</span></div>
        <div class="sfm-sb-gf"><span>${row.gf} pour · ${row.ga} contre</span><span class="diff ${diffCls}">${diffSign}${row.diff}</span></div>
      </div>

  }).join("");
  const hasTie = standings.some((s,i) => i>0 && s.pts === standings[i-1].pts);
  const tieNote = hasTie ? `<p style="font-size:11.5px;color:var(--text3);margin-top:9px;font-style:italic">Égalité de points — départagée à la différence de buts, puis aux buts marqués.</p>` : "";
  return `<div class="section-label">Classement de la soirée</div><div class="sfm-sb-grid">${cards}</div>${tieNote}`;

function _sfmBuildPerformers(session, matchs, buteursCount, passeursCount, gkRanking) {
  const cards = [];
  let delay = 0;
  const featured = new Set();
  const teamOf = name => (session.presences && session.presences[name]) ? (session.presences[name].equipe||"") : "";

  const buteursRanked  = Object.entries(buteursCount).sort((a,b) => b[1]-a[1]);
  const passeursRanked = Object.entries(passeursCount).sort((a,b) => b[1]-a[1]);

  if (buteursRanked.length) {
    const [name, count] = buteursRanked[0];
    cards.push(_sfmPerfCard("Étoile de la soirée", name, teamCls(teamOf(name)),
      `${count} but${count>1?"s":""} inscrit${count>1?"s":""} durant la soirée`, (delay+=0.05).toFixed(2)));
    featured.add(name);
  }
  // Passeur en chef : privilégie quelqu'un d'autre que l'Étoile de la soirée si l'écart
  // avec le passeur suivant reste raisonnable — sinon la même personne trusterait
  // systématiquement toutes les cartes.
  if (passeursRanked.length) {
    let pick = passeursRanked[0];
    if (featured.has(pick[0])) {
      const alt = passeursRanked.find(([n]) => !featured.has(n));
      if (alt && pick[1] - alt[1] <= 2) pick = alt;
    }
    const [name, count] = pick;
    cards.push(_sfmPerfCard("Passeur en chef", name, teamCls(teamOf(name)),
      `${count} passe${count>1?"s":""} décisive${count>1?"s":""}`, (delay+=0.05).toFixed(2)));
    featured.add(name);
  }
  // Mur infranchissable : exige au moins 2 mi-temps gardées pour éviter de valoriser un
  // échantillon trop faible (ex : 0 encaissé sur une seule mi-temps, pas convaincant).
  if (gkRanking && gkRanking.length) {
    const eligible = gkRanking.filter(g => g.matchs >= 2);
    const best = [...eligible].sort((a,b) => a.rate-b.rate || b.matchs-a.matchs || a.name.localeCompare(b.name,"fr"))[0];
    if (best) {
      const stat = best.buts === 0
        ? `0 but encaissé dans les buts (${best.matchs} mi-temps${best.matchs>1?"s":""})`
        : `${best.buts} but${best.buts>1?"s":""} encaissé${best.buts>1?"s":""} en ${best.matchs} mi-temps${best.matchs>1?"s":""}`;
      cards.push(_sfmPerfCard("Mur infranchissable", best.name, teamCls(teamOf(best.name)), stat, (delay+=0.05).toFixed(2)));
      featured.add(best.name);
    }
  }

  // Festival offensif : meilleure perf sur un seul match — si c'est déjà la même
  // personne qu'une autre carte, on regarde s'il y a un autre joueur presque aussi
  // fort ce soir-là pour diversifier qui est mis en avant.
  const singleMatchBest = {};
  matchs.forEach((m, i) => {
    const c = {};
    (m.buteursA||[]).forEach(b => { if (b && b!=="CSC") c[b]=(c[b]||0)+1; });
    (m.buteursB||[]).forEach(b => { if (b && b!=="CSC") c[b]=(c[b]||0)+1; });
    Object.entries(c).forEach(([name, count]) => {
      if (!singleMatchBest[name] || count > singleMatchBest[name].count) singleMatchBest[name] = { name, count, idx: i, m };
    });
  });
  const singleRanked = Object.values(singleMatchBest).filter(s => s.count >= 2).sort((a,b) => b.count - a.count);
  if (singleRanked.length) {
    const bestSingle = singleRanked.find(s => !featured.has(s.name)) || singleRanked[0];
    cards.push(_sfmPerfCard("Festival offensif", bestSingle.name, teamCls(teamOf(bestSingle.name)),
      `${_sfmGoalsPhrase(bestSingle.count)} lors du match #${bestSingle.idx+1} (${bestSingle.m.scoreA}-${bestSingle.m.scoreB})`, (delay+=0.05).toFixed(2)));
    featured.add(bestSingle.name);
  }

  return cards;
}

function _sfmLogisticsHTML(session) {
  const parts = [];
  if (session.sac)      parts.push(`<span>🎒 Sac : <b>${pLink(session.sac)}</b></span>`);
  if (session.maillots) parts.push(`<span>👕 Maillots : <b>${pLink(session.maillots)}</b></span>`);
  const byStatut = statut => Object.entries(session.presences||{})
    .filter(([,i]) => i.statut === statut).map(([n]) => n).sort((a,b)=>a.localeCompare(b,"fr"));
  const blesses    = byStatut("Blessé");
  const absents    = byStatut("Absent");
  const pasRepondu = byStatut("Pas répondu");
  if (blesses.length)    parts.push(`<span>🩹 Blessé${blesses.length>1?"s":""} : <b>${blesses.map(n=>pLink(n)).join(", ")}</b></span>`);
  if (absents.length)    parts.push(`<span>❌ Absent${absents.length>1?"s":""} : <b>${absents.map(n=>pLink(n)).join(", ")}</b></span>`);
  if (pasRepondu.length) parts.push(`<span>❓ Pas répondu : <b>${pasRepondu.map(n=>pLink(n)).join(", ")}</b></span>`);
  if (!parts.length) return "";
  return `<div class="sfm-logistics sfm-fade-up">${parts.join(`<span class="sfm-sep">·</span>`)}</div>`;
}

function renderSessionDetailV2(session) {
  _sfmRng = _sfmSeedRng(session.date || "");
  const matchs = session.matchs || [];

  const presentsAll = Object.entries(session.presences || {})
    .filter(([, info]) => info.statut === "Présent")
    .map(([name, info]) => ({ name, equipe: info.equipe || "" }))
    .sort((a, b) => a.name.localeCompare(b.name, "fr"));
  const presentsCount = presentsAll.length;

  let totalButs = 0;
  const buteursCount = {}, passeursCount = {};
  matchs.forEach(m => {
    totalButs += m.scoreA + m.scoreB;
    ["A","B"].forEach(side => {
      const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
      buts.forEach((b,i) => {
        if (!b || b==="CSC") return;
        buteursCount[b] = (buteursCount[b]||0)+1;
        const p = passes[i]; if (p && p!=="CSC") passeursCount[p] = (passeursCount[p]||0)+1;
      });
    });
  });

  const heroHtml = _sfmHeroHTML(session, matchs, presentsCount, standings.map(s => s.team), recapSentence, tickerHtml, statStripHtml);
  let h = ttTeam
    ? `<div class="sfm-hero-tt-row">${heroHtml}${_ttPanelHtml("sess", ttTeam, ttGkCriteria)}</div>`

  if (!matchs.length) {
    h += `<div class="sfm-no-data-card sfm-fade-up">
      <div class="big">🌒</div>

  } else {
    h += _sfmScoreboardHTML(standings);

    const spotCards = spotlights.map((s,i) => _sfmSpotlightCardHTML(matchs[s.i], s.kind, (i*0.05).toFixed(2)));

    if (spotCards.length) {

    if (perfCards.length) {
      h += `<div class="section-label">Performances individuelles</div><div class="sfm-perf-grid">${perfCards.join("")}</div>`;

  /* ── Compositions & coulisses ── */
  const teamMap = { Rouge: [], Vert: [], Bleue: [] };
  const noTeam = [];
  presentsAll.forEach(p => { teamMap[p.equipe] !== undefined ? teamMap[p.equipe].push(p) : noTeam.push(p); });
  const activeColors = ["Rouge","Vert","Bleue"].filter(c => teamMap[c].length > 0);

  if (activeColors.length) {

    h += activeColors.map((c,i) => _sfmLineupCardHTML(c, teamMap[c], (i*0.05).toFixed(2))).join("");

function _sfmBindTicker(container) {
  container.querySelectorAll('[data-sfm-goto]').forEach(btn => {
    btn.addEventListener('click', () => {
      const wrap = container.querySelector(`#${btn.dataset.sfmGoto}`);
      if (!wrap) return;
      const row = wrap.querySelector('.match-recap-row') || wrap;
      wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });
      row.classList.add('sfm-flash');
      setTimeout(() => row.classList.remove('sfm-flash'), 1200);
    });
  });
}

function computeBestAllTimeStreak() {
  let best = null;
  ALL_PLAYERS.filter(p => !JOKERS.has(p)).forEach(player => {
    const st = computePlayerDetailStats(player);
    const cs = st.currentStreak;
    const hs = st.bestHistoricalStreak;
    let candidate = null;
    if (cs && hs) {
      if (cs.count > hs.count || (cs.count === hs.count && (cs.g + cs.a) >= (hs.g + hs.a))) {
        candidate = { player, ...cs, isActive: true };
      } else {
        candidate = { player, ...hs, isActive: false };
      }
    } else if (cs) {
      candidate = { player, ...cs, isActive: true };
    } else if (hs) {
      candidate = { player, ...hs, isActive: false };
    }
    if (!candidate) return;
    if (!best || candidate.count > best.count ||
        (candidate.count === best.count && (candidate.g + candidate.a) > (best.g + best.a))) {
      best = candidate;
    }
  });
  return best;
}

function computeBestTeamAllTime() {
  let best = null;
  SESSIONS.forEach(session => {
    const matchs = session.matchs || [];
    if (!matchs.length) return;
    ["Rouge", "Vert", "Bleue"].forEach(team => {
      const tmMatchs = matchs.filter(m => m.eqA === team || m.eqB === team);
      if (!tmMatchs.length) return;
      let wins = 0, goalsFor = 0, goalsAgainst = 0;
      const scorers = {}, assisters = {};
      tmMatchs.forEach(m => {
        const isA = m.eqA === team;
        const gf = isA ? m.scoreA : m.scoreB;
        const ga = isA ? m.scoreB : m.scoreA;
        goalsFor += gf; goalsAgainst += ga;
        if (gf > ga) wins++;
        (isA ? (m.buteursA||[])  : (m.buteursB||[])).forEach(p  => { if (p && p !== "CSC") scorers[p]   = (scorers[p]   || 0) + 1; });
        (isA ? (m.passeursA||[]) : (m.passeursB||[])).forEach(p => { if (p)                assisters[p] = (assisters[p] || 0) + 1; });
      });
      const goalDiff = goalsFor - goalsAgainst;
      const players = Object.entries(session.presences)
        .filter(([, info]) => info.statut === "Présent" && info.equipe === team)
        .map(([name]) => name).sort((a, b) => a.localeCompare(b, "fr"));
      const topSc = Object.entries(scorers).sort((a,b)=>b[1]-a[1])[0];
      const topAs = Object.entries(assisters).sort((a,b)=>b[1]-a[1])[0];
      const c = { session, team, wins, goalsFor, goalsAgainst, goalDiff, players,
        topScorer:   topSc ? { name: topSc[0], count: topSc[1] } : null,
        topAssister: topAs ? { name: topAs[0], count: topAs[1] } : null };
      if (!best || wins > best.wins || (wins === best.wins && goalDiff > best.goalDiff)) best = c;
    });
  });
  return best;
}

let _mhf = null;

function _mhfDisplayLevel(ach, rawLv) { return ach.fixedTier ? ach.fixedTier : Math.min(6, rawLv + (ach.tierOffset||0)); }
function _mhfTierName(ach, rawLv) { const dl = _mhfDisplayLevel(ach, rawLv); return (ach.tierNames && ach.tierNames[rawLv-1]) || ACH_TIER_NAMES[dl] || `Niveau ${dl}`; }
// Pilules (légende / tiroir) : couleur pleine, copiée telle quelle depuis .ach-cell.tN.
function _mhfTierStyleAttr(dl) { return dl>0 ? `background:var(--mhf-t${dl}-bg);border:1px solid var(--mhf-t${dl}-b);color:var(--mhf-t${dl}-c);` : ''; }
// Cases de la matrice : ne redéfinit que fond + couleur de bordure, la largeur/épaisseur vient de .mhf-tier-box(.filled).
function _mhfCellStyleAttr(dl) { return dl>0 ? `background:var(--mhf-t${dl}-bg);border-color:var(--mhf-t${dl}-b);` : ''; }

function computeMhfData() {
  const players = ALL_PLAYERS.slice();
  const achs = ACH_DEFS.map(a => ({ ...a, cat: MHF_CAT_BY_ID[a.id] || 'Distinctions' }));
  const statsByPlayer = {};
  players.forEach(p => {
    const s = computeAchievementStats(p);
    let lc = 0;
    ACH_DEFS.filter(a => a.id !== 'legende').forEach(a => { lc += _achLevel(s[a.key]||0, a.tiers); });
    s.legendeCount = lc;
    statsByPlayer[p] = s;
  });
  const levels = {};
  players.forEach(p => {
    levels[p] = {};
    achs.forEach(a => { const val = statsByPlayer[p][a.key] || 0; levels[p][a.id] = { raw: _achLevel(val, a.tiers), val }; });
  });
  const completion = {};
  achs.forEach(a => {
    let unlocked = 0;
    players.forEach(p => { if (levels[p][a.id].raw > 0) unlocked++; });
    completion[a.id] = { unlocked, rate: players.length ? unlocked/players.length : 0 };
  });
  const summary = {};
  players.forEach(p => {
    let niveaux = 0, hautsFaits = 0;
    achs.forEach(a => { const raw = levels[p][a.id].raw; niveaux += raw; if (raw>0) hautsFaits++; });
    summary[p] = { niveaux, hautsFaits };
  });
  return { players, achs, statsByPlayer, levels, completion, summary };
}

function _mhfVisibleAch() {
  return _mhf.achs.filter(a => _mhfState.activeCats.has(a.cat) && (_mhfState.showHidden || !a.hidden));
}
function _mhfVisiblePlayers() {
  const q = _mhfState.search.trim().toLowerCase();
  let list = q ? _mhf.players.filter(p => p.toLowerCase().includes(q)) : _mhf.players.slice();
  list = list.filter(p => _mhf.summary[p].hautsFaits > 0);
  list.sort((a,b) => {
    if (_mhfState.sortKey === 'name') return _mhfState.sortDir * a.localeCompare(b,'fr');
    const va = _mhfState.sortKey === 'hautsFaits' ? _mhf.summary[a].hautsFaits : _mhf.summary[a].niveaux;
    const vb = _mhfState.sortKey === 'hautsFaits' ? _mhf.summary[b].hautsFaits : _mhf.summary[b].niveaux;
    if (va === vb) return a.localeCompare(b,'fr');
    return _mhfState.sortDir * (va - vb);
  });
  return list;
}

function _mhfLevelDotsHTML(a) {
  const levels = a.fixedTier
    ? [a.fixedTier]
    : a.tiers.map((_, i) => Math.min(6, i + 1 + (a.tierOffset || 0)));
  return `<span class="mhf-rarity-levels">${levels.map(lv =>
    `<span class="dot" style="background:var(--mhf-t${lv}-c)"></span>`
  ).join('')}</span>`;
}

function _mhfRenderRarityHtml() {
  const RARITY_PAGE = 10;
  const rows = [..._mhf.achs].sort((a,b) => _mhf.completion[b.id].rate - _mhf.completion[a.id].rate);
  const rowHtml = a => {
    const c = _mhf.completion[a.id];
    const pct = Math.round(c.rate*100);
    const color = pct<=15 ? 'var(--bad)' : pct<=45 ? 'var(--gold)' : 'var(--good)';
    return `<div class="mhf-rarity-row${_mhfState.selectedAch===a.id?' selected':''}" data-acid="${a.id}">
      <span class="mhf-rarity-ic">${a.icon}</span>
      <span class="mhf-rarity-name"><span class="n">${a.name}</span>${_mhfLevelDotsHTML(a)}${a.hidden?'<span class="mhf-rarity-secret">SECRET</span>':''}</span>
      <span class="mhf-rarity-track"><span class="mhf-rarity-fill" style="width:${pct}%;background:${color}"></span></span>
      <span class="mhf-rarity-stat"><b>${c.unlocked}</b>/${_mhf.players.length} &middot; ${pct}%</span>
    </div>`;
  };
  const visible = rows.slice(0, RARITY_PAGE).map(rowHtml).join('');
  const rest = rows.slice(RARITY_PAGE);
  const restHtml = rest.length
    ? `<div class="mhf-rarity-more" id="mhf-rarity-more">${rest.map(rowHtml).join('')}</div>
       <button class="mhf-rarity-toggle" id="mhf-rarity-toggle" data-label="Voir tout (${rows.length}) ›">Voir tout (${rows.length}) ›</button>`
    : '';
  return visible + restHtml;
}

function _mhfRenderChipsHtml() {
  let h = `<button class="pill${_mhfState.activeCats.size===MHF_CATS.length?' active':''}" data-cat="__all">Tous</button>`;
  h += MHF_CATS.map(c => `<button class="pill${_mhfState.activeCats.has(c)&&_mhfState.activeCats.size<MHF_CATS.length?' active':''}" data-cat="${c}">${c}</button>`).join('');
  return h;
}

function renderMhfMatrixHtml() {
  const achs = _mhfVisibleAch();
  const players = _mhfVisiblePlayers();
  if (!achs.length) return `<div class="mhf-matrix" id="mhf-matrix"><div class="mhf-mcell" style="padding:16px;color:var(--text3)">Aucun haut fait visible avec ces filtres.</div></div>`;
  if (!players.length) return `<div class="mhf-matrix" id="mhf-matrix"><div class="mhf-mcell" style="padding:16px;color:var(--text3)">Aucun joueur ne correspond à la recherche.</div></div>`;

  const firstOfCat = {};
  achs.forEach(a => { if (!(a.cat in firstOfCat)) firstOfCat[a.cat] = a.id; });

  let h = `<div class="mhf-matrix" id="mhf-matrix" style="grid-template-columns:176px 60px 60px repeat(${achs.length},34px)">`;
  h += `<div class="mhf-mcell mhf-mh-corner mhf-mh-txt${_mhfState.sortKey==='name'?' sorted':''}" data-sort="name" title="Trier par nom" style="justify-content:flex-start;padding-left:10px">Joueur</div>`;
  h += `<div class="mhf-mcell mhf-msum mhf-mh-txt${_mhfState.sortKey==='hautsFaits'?' sorted':''}" data-sort="hautsFaits" title="Trier par nombre de hauts faits débloqués">HF</div>`;
  h += `<div class="mhf-mcell mhf-msum mhf-mh-txt${_mhfState.sortKey==='niveaux'?' sorted':''}" data-sort="niveaux" title="Trier par total de niveaux cumulés">NIV</div>`;
  achs.forEach(a => {
    const grp = firstOfCat[a.cat]===a.id ? ' grp-start' : '';
    const c = _mhf.completion[a.id];
    const tip = `${a.icon} ${a.name}\n${c.unlocked}/${_mhf.players.length} joueurs &middot; ${Math.round(c.rate*100)}%\n${ACH_ABOUT[a.id]||''}`.replace(/"/g,'&quot;');
    h += `<div class="mhf-mcell mhf-mh${grp}" data-ach="${a.id}" data-tip="${tip}">
      <span class="ic">${a.icon}</span>${a.hidden?'<span class="lock">&#9679;</span>':''}
    </div>`;
  });

  const _mhfInitials = computeAllInitials([...new Set([...ALL_PLAYERS, ...players])]);
  players.forEach((p,i) => {
    const rowCls = i%2===0 ? 'mhf-mrow-odd' : 'mhf-mrow-even';
    const rank = i+1;
    const rankCls = _mhfState.sortKey!=='name' && rank<=3 ? (rank===1?'gold':rank===2?'silver':'bronze') : '';
    h += `<div class="mhf-mcell mhf-mname player-link ${rowCls}" data-player="${p}">
      <span class="mhf-mrank ${rankCls}">${rank}</span>
      <span class="mhf-mavatar">${_mhfInitials[p] || p.slice(0,2).toUpperCase()}</span>
      <span class="mhf-mname-txt">${p}</span>
    </div>`;
    h += `<div class="mhf-mcell mhf-msum ${rowCls}${_mhfState.sortKey==='hautsFaits'?' sorted':''}">${_mhf.summary[p].hautsFaits}</div>`;
    h += `<div class="mhf-mcell mhf-msum ${rowCls}${_mhfState.sortKey==='niveaux'?' sorted':''}">${_mhf.summary[p].niveaux}</div>`;
    achs.forEach(a => {
      const grp = firstOfCat[a.cat]===a.id ? ' grp-start' : '';
      const L = _mhf.levels[p][a.id];
      const dl = L.raw>0 ? _mhfDisplayLevel(a,L.raw) : 0;
      const anim = dl===6 ? ' mhf-t6-anim' : '';
      let line1, line2 = '';
      if (L.raw>0) {
        line1 = `${_mhfTierName(a,L.raw)} &middot; ${a.desc(L.val)}`;
        if (!a.fixedTier && L.raw < a.tiers.length) line2 = `Prochain seuil : ${a.tiers[L.raw]}`;
      } else {
        line1 = `Non débloqué &middot; ${a.desc(L.val)}`;
        line2 = `Seuil requis : ${a.tiers[0]}`;
      }
      const tip = `${a.icon} ${a.name} — ${p}\n${line1}\n${line2}`.replace(/"/g,'&quot;');
      h += `<div class="mhf-mcell mval ${rowCls}${grp}" data-tip="${tip}">
        <div class="mhf-tier-box${dl>0?' filled':''}${anim}" style="${_mhfCellStyleAttr(dl)}"></div>
      </div>`;
    });
  });

  h += `</div>`;
  return h;
}

// Section publique (4 cases KPI) : accessible hors admin. Les hauts faits secrets ne
// doivent jamais y être nommés (rare/commun), même si leur taux les qualifierait.
function _mhfKpiSectionHtml() {
  _mhf = computeMhfData();

  let kpiHtml = '';
  if (_mhf.players.length) {
    const totalCells = _mhf.players.length * _mhf.achs.length;
    let filledCells = 0;
    _mhf.players.forEach(p => _mhf.achs.forEach(a => { if (_mhf.levels[p][a.id].raw > 0) filledCells++; }));
    const avgRate = totalCells ? filledCells/totalCells : 0;
    const publicAchs = _mhf.achs.filter(a => !a.hidden);
    const sortedByRate = [...publicAchs].sort((a,b) => _mhf.completion[a.id].rate - _mhf.completion[b.id].rate);
    const rarest = sortedByRate[0], common = sortedByRate[sortedByRate.length-1];
    const topCollector = [..._mhf.players].sort((a,b) => _mhf.summary[b].niveaux - _mhf.summary[a].niveaux)[0];
    const cards = [
      { ico:'📊', lbl:'Complétion Hauts Faits', num: Math.round(avgRate*100)+'%',
        sub:`${filledCells} / ${totalCells} cases débloquées` },
      { ico: rarest.icon, lbl:'Haut fait le plus rare', num: rarest.name,
        sub:`${_mhf.completion[rarest.id].unlocked}/${_mhf.players.length} joueurs (${Math.round(_mhf.completion[rarest.id].rate*100)}%)` },
      { ico: common.icon, lbl:'Haut fait le plus commun', num: common.name,
        sub:`${_mhf.completion[common.id].unlocked}/${_mhf.players.length} joueurs (${Math.round(_mhf.completion[common.id].rate*100)}%)` },
      { ico:'👑', lbl:'Meilleur collectionneur', num: topCollector,
        sub:`${_mhf.summary[topCollector].niveaux} niveaux &middot; ${_mhf.summary[topCollector].hautsFaits} HF` },
    ];
    kpiHtml = `<div class="kpi-grid mhf-kpi-grid">` + cards.map(c => `
      <div class="kpi-card mhf-kpi-card">
        <div class="mhf-kpi-head"><span class="mhf-kpi-ico">${c.ico}</span><span class="kpi-lbl" style="margin-top:0">${c.lbl}</span></div>
        <div class="kpi-num mhf-kpi-num">${c.num}</div>
        <div class="kpi-sub">${c.sub}</div>
      </div>`).join('') + `</div>`;
  }

  return `<div class="section-label" style="margin-top:2rem">Hauts faits — Matrice</div>` + kpiHtml;
}

function renderAchievementsMatrix() {
  let h = _mhfKpiSectionHtml();

  let legendHtml = `<span class="lbl">Niveaux</span>`;
  for (let i=1;i<=6;i++) legendHtml += `<span class="mhf-tier-pill${i===6?' mhf-t6-anim':''}" style="${_mhfTierStyleAttr(i)}"><span class="dot"></span>${ACH_TIER_NAMES[i]}</span>`;

  h += `<div class="section-label" style="margin-top:2.4rem">Rareté des hauts faits (${_mhf.achs.length})</div>`;
  h += `<div class="mhf-rarity-list" id="mhf-rarity-list">${_mhfRenderRarityHtml()}</div>`;
  h += `<div class="section-label" style="margin-top:2.4rem">Roster &times; Hauts faits</div>`;
  h += `<div class="mhf-tier-legend" id="mhf-tier-legend">${legendHtml}</div>`;
  h += `<div class="mhf-toolbar">
    <div class="mhf-search"><span class="ic">&#128269;</span><input type="text" id="mhf-search-input" placeholder="Chercher un joueur…" value="${_mhfState.search}"></div>
    <div class="mhf-chip-row" id="mhf-cat-chips">${_mhfRenderChipsHtml()}</div>
    <label class="mhf-toggle-hidden${_mhfState.showHidden?' on':''}" id="mhf-hidden-toggle">
      <span class="mhf-toggle-track"><span class="mhf-toggle-dot"></span></span>
      Hauts faits secrets
    </label>
  </div>`;
