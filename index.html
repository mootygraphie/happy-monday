let currentPeriod = "session"; // "session" | "month" | "year" | "all"
let filterYear  = null; // stocke le début de saison (ex: 2024 pour 2024/2025)
let filterMonth = null;
let filterSessionDate = null; // date de la session choisie en mode "session"

/* Bornes de saisons avec dates précises (sy = année de début) */
const SEASON_DEFS = [
  { sy: 2026, start: '2026-08-24', end: '2027-07-19' },
  // Ajouter ici les prochaines saisons au fil du temps
];

function _seasonStart(date) {
  const d = new Date(date);
  const ds = d.toISOString().slice(0, 10);
  // Chercher dans les bornes explicites d'abord
  for (const s of SEASON_DEFS) {
    if (ds >= s.start && ds <= s.end) return s.sy;
  }
  // Fallback : règle du 15 août
  const m = d.getMonth();
  return (m > 7 || (m === 7 && d.getDate() >= 15)) ? d.getFullYear() : d.getFullYear() - 1;
}
function _seasonLabel(sy) { return `${sy}/${sy + 1}`; }

/* Saison affichée : si on est en off-season avant une saison définie, on affiche déjà cette saison */
function _currentSeason() {
  const today = new Date().toISOString().slice(0, 10);
  // Dans une saison définie ?
  for (const s of SEASON_DEFS) {
    if (today >= s.start && today <= s.end) return s.sy;
  }
  // Off-season avant une prochaine saison définie → afficher cette prochaine saison
  const next = [...SEASON_DEFS].sort((a, b) => a.start.localeCompare(b.start)).find(s => today < s.start);
  if (next) return next.sy;
  // Fallback
  return _seasonStart(today);
}

const MONTH_NAMES = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function filterSessions(period) {
  if (!SESSIONS.length) return [];
  const sorted = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
  if (period === "session") {
    const found = SESSIONS.find(s => s.date === filterSessionDate);
    return found ? [found] : [sorted[0]];
  }
  if (period === "month") return SESSIONS.filter(s => {
    const d = new Date(s.date);
    return d.getMonth() === filterMonth && _seasonStart(d) === filterYear;
  });
  if (period === "year")  return SESSIONS.filter(s => _seasonStart(s.date) === filterYear);
  return SESSIONS;
}

/* Saisons disponibles (triées desc) — logique de scoping partagée */
function _dbxSeasonsAvailable() {
  return [...new Set(SESSIONS.map(s => _seasonStart(s.date)))].sort((a,b)=>b-a);
}
/* Mois disponibles pour une saison donnée (mode mois) */
function _dbxMonthsForSeason(sy) {
  return [...new Set(
    SESSIONS
      .filter(s => _seasonStart(s.date) === sy)
      .map(s => new Date(s.date).getMonth())
  )].sort((a,b)=>b-a);
}

/* Reconstruit le sous-filtre contextuel (droite du segment) selon le mode actif :
   session → sélecteur de session (motif sess-dd existant) ; mois → saison + mois ;
   saison → saison seule ; all-time → rien. Pilote toujours currentPeriod/filterYear/
   filterMonth/filterSessionDate et déclenche renderDashboard(), comme l'ancien filtre. */
function updateSubFilter(period) {

    if (filterSessionDate === null || !sorted.some(s => s.date === filterSessionDate)) filterSessionDate = sorted[0].date;
    sub.innerHTML = `
      <div class="sess-dd" id="dbx-sess-dd">

          <span id="dbx-sess-dd-label">${fmtDate(filterSessionDate)}</span>
          <svg width="11" height="7" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
        </button>

          `<button type="button" class="sess-dd-opt${s.date===filterSessionDate?" active":""}" data-date="${s.date}">${fmtDate(s.date)}</button>`
        ).join("")}</div>
      </div>`;
    document.getElementById("dbx-sess-dd-btn").addEventListener("click", e => {
      e.stopPropagation();
      document.getElementById("dbx-sess-dd").classList.toggle("open");
    });
    document.getElementById("dbx-sess-dd-panel").addEventListener("click", e => {
      const btn = e.target.closest(".sess-dd-opt");
      if (!btn) return;
      filterSessionDate = btn.dataset.date;
      document.getElementById("dbx-sess-dd").classList.remove("open");
      renderDashboard();
    });

  } else if (period === "month") {
    const seasons = _dbxSeasonsAvailable();
    if (filterYear === null || !seasons.includes(filterYear)) filterYear = seasons[0] ?? null;
    const months = _dbxMonthsForSeason(filterYear);
    if (filterMonth === null || !months.includes(filterMonth)) filterMonth = months[0] ?? null;

function computeStats(sessions) {
  const allMatchs = sessions.flatMap(s => (s.matchs||[]).map(m => ({...m, date:s.date})));
  const ps = {};
  ALL_PLAYERS.forEach(p => { ps[p] = {presences:0,absences:0,blesses:0,pasRepondu:0,buts:0,passes:0,vR:0,vV:0,vB:0}; });

  sessions.forEach(s => {
    Object.entries(s.presences).forEach(([p, info]) => {
      if (!ps[p]) ps[p] = {presences:0,absences:0,blesses:0,pasRepondu:0,buts:0,passes:0,vR:0,vV:0,vB:0};
      if      (info.statut==="Présent")     ps[p].presences++;
      else if (info.statut==="Absent")      ps[p].absences++;
      else if (info.statut==="Blessé")      ps[p].blesses++;
      else if (info.statut==="Pas répondu") ps[p].pasRepondu++;
    });
    (s.matchs||[]).forEach(m => {
      ["A","B"].forEach(side => {
        const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
        buts.forEach((b,i) => {
          if (!b || b==="CSC") return;
          if (ps[b]) ps[b].buts++;
          const p = passes[i]; if (p && p!=="CSC" && ps[p]) ps[p].passes++;
        });
      });
      const winner = m.scoreA > m.scoreB ? m.eqA : m.scoreB > m.scoreA ? m.eqB : null;
      if (winner) {
        Object.entries(s.presences).forEach(([p, info]) => {
          if (info.statut==="Présent" && info.equipe===winner && ps[p]) {
            if (winner==="Rouge") ps[p].vR++; else if (winner==="Vert") ps[p].vV++; else ps[p].vB++;
          }
        });
      }
    });
  });

  Object.values(ps).forEach(p => {
    p.totalVic = p.vR + p.vV + p.vB;
    const best = Math.max(p.vR, p.vV, p.vB);
    p.bestColor = best===0 ? null : p.vR===best ? "Rouge" : p.vV===best ? "Vert" : "Bleue";
  });

  /* Episode detection: séquences consécutives de "Blessé" = 1 épisode */
  const sessionsByDate = [...sessions].sort((a,b) => new Date(a.date)-new Date(b.date));
  const inEpisode = {};
  Object.keys(ps).forEach(p => { ps[p].episodesBlessures = 0; ps[p].matchsBlessures = 0; inEpisode[p] = false; });
  sessionsByDate.forEach(s => {
    Object.keys(ps).forEach(p => {
      const info = s.presences[p];
      if (!info) { inEpisode[p] = false; return; }
      if (info.statut === "Blessé") {
        ps[p].matchsBlessures++;
        if (!inEpisode[p]) { ps[p].episodesBlessures++; inEpisode[p] = true; }
      } else {
        inEpisode[p] = false;
      }
    });
  });

  const mostGoals   = allMatchs.reduce((b,m) => { const t=m.scoreA+m.scoreB; return (!b||t>b.total)?{...m,total:t}:b; }, null);
  const biggestAmp  = allMatchs.reduce((b,m) => { const a=Math.abs(m.scoreA-m.scoreB); return (!b||a>b.amp)?{...m,amp:a}:b; }, null);
  const bestAttack  = allMatchs.reduce((b,m) => { const mx=Math.max(m.scoreA,m.scoreB); return (!b||mx>b.mx)?{...m,mx,topTeam:m.scoreA>=m.scoreB?m.eqA:m.eqB}:b; }, null);
  const topButeur   = Object.entries(ps).filter(([,p])=>p.buts>0).sort((a,b)=>b[1].buts-a[1].buts)[0]||null;
  const colorWins   = {Rouge:0,Vert:0,Bleue:0};
  allMatchs.forEach(m => { if(m.scoreA>m.scoreB) colorWins[m.eqA]++; else if(m.scoreB>m.scoreA) colorWins[m.eqB]++; });
  const bestColor   = Object.entries(colorWins).sort((a,b)=>b[1]-a[1])[0]||null;

  const goalsPerTeam = {Rouge:0, Vert:0, Bleue:0};
  allMatchs.forEach(m => { goalsPerTeam[m.eqA] = (goalsPerTeam[m.eqA]||0) + m.scoreA; goalsPerTeam[m.eqB] = (goalsPerTeam[m.eqB]||0) + m.scoreB; });

  const byAlpha = (a,b) => a[0].localeCompare(b[0], "fr");
  const top3Pres    = Object.entries(ps).filter(([n,p])=>p.presences>0&&!JOKERS.has(n)).sort((a,b)=>b[1].presences-a[1].presences||byAlpha(a,b)).slice(0,3);
  const top3Abs     = Object.entries(ps).filter(([n,p])=>p.absences>0&&!JOKERS.has(n))
    .sort((a,b)=>b[1].absences-a[1].absences||byAlpha(a,b)).slice(0,3);
  const top3Bles    = Object.entries(ps).filter(([,p])=>p.episodesBlessures>0)
    .sort((a,b)=>b[1].episodesBlessures-a[1].episodesBlessures||b[1].matchsBlessures-a[1].matchsBlessures||byAlpha(a,b)).slice(0,3);
  const buteursRank  = Object.entries(ps).filter(([,p])=>p.buts>0).sort((a,b)=>b[1].buts-a[1].buts||byAlpha(a,b));
  const passeursRank = Object.entries(ps).filter(([,p])=>p.passes>0).sort((a,b)=>b[1].passes-a[1].passes||byAlpha(a,b));

  return {ps, mostGoals, biggestAmp, bestAttack, topButeur, bestColor, colorWins, goalsPerTeam, top3Pres, top3Abs, top3Bles, buteursRank, passeursRank, allMatchs};
}

/* ══════════════════════════════════════════════════════════
   VUE PARTAGÉE : DÉTAIL D'UNE SESSION
   Utilisée dans Dashboard "Dernière session" ET onglet Sessions
══════════════════════════════════════════════════════════ */
function computeLinkUpStats(sessions) {
  const duoMap = {};
  sessions.forEach(session => {
    (session.matchs || []).forEach(m => {
      const processSide = (buteurs, passeurs) => {
        (buteurs || []).forEach((buteur, j) => {
          const passeur = passeurs && passeurs[j] ? passeurs[j] : null;
          if (!buteur || buteur === "CSC" || !passeur || passeur === "CSC") return;
          const [a, b] = [buteur, passeur].sort();
          const key = `${a}|||${b}`;
          if (!duoMap[key]) duoMap[key] = {p1: a, p2: b, connexions: 0, p1Goals: 0, p2Goals: 0};
          duoMap[key].connexions++;
          if (buteur === a) duoMap[key].p1Goals++; else duoMap[key].p2Goals++;
        });
      };
      processSide(m.buteursA, m.passeursA);
      processSide(m.buteursB, m.passeursB);
    });
  });
  return Object.values(duoMap).filter(d => d.connexions > 0).sort((a,b) => b.connexions - a.connexions);
}

function computeTopDefendersStats(sessions, minMatches) {
  const defMap = {};
  sessions.forEach(session => {
    const presences = session.presences || {};
    (session.matchs || []).forEach(m => {
      Object.entries(presences).forEach(([player, info]) => {
        if (info.statut !== "Présent" || !info.equipe) return;
        let gc = null;
        if (m.eqA === info.equipe) gc = m.scoreB;
        else if (m.eqB === info.equipe) gc = m.scoreA;
        if (gc === null) return;
        if (!defMap[player]) defMap[player] = {goalsAgainst:0, matchCount:0};
        defMap[player].goalsAgainst += gc;
        defMap[player].matchCount++;
      });
    });
  });
  const min = minMatches || 1;
  return Object.entries(defMap)
    .filter(([,d]) => d.matchCount >= min)
    .map(([name,d]) => ({name, ...d, avg: d.goalsAgainst/d.matchCount}))
    .sort((a,b) => a.avg - b.avg || b.matchCount - a.matchCount);
}

// Regroupe les entrées ex-æquo dans les 3 premiers slots (podium), reste = liste ordonnée
function buildTop10Slots(items, sameValue) {
  const slots = []; let rem = [...items];
  while (rem.length && slots.length < 3) {
    const top = rem[0].value;
    const tied = rem.filter(it => sameValue(it.value, top));
    slots.push({ rank: slots.length, players: tied.map(it => it.name), value: top });
    rem = rem.filter(it => !sameValue(it.value, top));
  }
  return { slots, rest: rem };
}

// items : [{name, value}], déjà triés du meilleur au moins bon
function buildTop10HTMLv2(items, valueFmt, sameValue) {
  if (!items.length) return `<span class="no-data">—</span>`;
  const cmp = sameValue || ((a,b) => a === b);
  const { slots, rest } = buildTop10Slots(items, cmp);
  const podiumHtml = buildPodiumVizSlotsV2(slots, s => valueFmt(s.value), s => s.players.map(n => pLink(n)).join(", "));
  const shownCount = slots.reduce((sum,s) => sum + s.players.length, 0);
  const restRows = rest.slice(0, Math.max(0, 10 - shownCount));
  const listHtml = restRows.length ? `<div class="top10-list">${restRows.map((it, i) => `
    <div class="top10-row"><span class="top10-rank">${shownCount + i + 1}</span><span class="top10-name">${pLink(it.name)}</span><span class="top10-val">${valueFmt(it.value)}</span></div>
  `).join('')}</div>` : '';
  return podiumHtml + listHtml;
}

function computeGardiensRanking(sessions) {
  const stats = {};
  sessions.forEach(s => {
    (s.matchs || []).forEach(m => {
      if (m.mt1A === undefined || m.mt1B === undefined) return;
      const gA = m.gardiensA || [], gB = m.gardiensB || [];
      const mt1Ac = m.mt1B || 0, mt2Ac = Math.max(0, (m.scoreB||0) - (m.mt1B||0));
      const mt1Bc = m.mt1A || 0, mt2Bc = Math.max(0, (m.scoreA||0) - (m.mt1A||0));
      const matchMap = {};
      [[gA[0],mt1Ac],[gA[1],mt2Ac],[gB[0],mt1Bc],[gB[1],mt2Bc]].forEach(([p,c]) => {
        if (!p || !p.trim()) return;
        matchMap[p] = (matchMap[p] || 0) + c;
      });
      Object.entries(matchMap).forEach(([p, c]) => {
        if (!stats[p]) stats[p] = { matchs: 0, buts: 0 };
        stats[p].matchs++;
        stats[p].buts += c;
      });
    });
  });
  return Object.entries(stats)
    .filter(([,s]) => s.matchs > 0)
    .map(([name, s]) => ({ name, matchs: s.matchs, buts: s.buts, rate: s.buts / s.matchs }));
}

// Regroupe les buts (et passes décisives) d'un même joueur au sein d'un match,
// même si un but d'un autre joueur s'intercale entre deux de ses buts.
// Ex : buteur1 (passeur1), buteur1 (passeur1) → buteur1 ×2 (passeur1 ×2)
//      buteur1 (passeur1), buteur1 (passeur2) → buteur1 ×2 (passeur1, passeur2)
//      buteur1 (—), buteur1 (passeur1)        → buteur1 ×2 (ø, passeur1)
// À partir de 3 occurrences groupées, le fragment est mis en avant (gras + effet diamant).
function _matchGoalsRecapHTML(buteurs, passeurs) {
  if (!buteurs || !buteurs.length) return "";
  passeurs = passeurs || [];
  const order = [];
  const groups = {};
  buteurs.forEach((b, j) => {
    if (!b) return;
    if (!groups[b]) { groups[b] = { count: 0, passeurs: [] }; order.push(b); }
    groups[b].count++;
    if (b !== "CSC") groups[b].passeurs.push(passeurs[j] || null);
  });
  return order.map(name => {
    const g = groups[name];
    const isCsc = name === "CSC";
    const nameHtml = isCsc ? `<em>CSC</em>` : `<span style="color:var(--text2)">${name}</span>`;
    let scorerHtml = g.count > 1 ? `${nameHtml} ×${g.count}` : nameHtml;
    if (g.count >= 3) scorerHtml = `<span class="mgr-highlight">${scorerHtml}</span>`;
    let assistHtml = "";
    if (!isCsc && g.passeurs.some(p => p)) {
      const aOrder = [], aCounts = {};
      g.passeurs.forEach(p => {
        const key = p || "ø";
        if (!aCounts[key]) { aCounts[key] = 0; aOrder.push(key); }
        aCounts[key]++;
      });
      const aParts = aOrder.map(key => {
        const n = aCounts[key];
        const disp = key === "ø" ? "ø" : `<span style="color:var(--text2)">${key}</span>`;
        let part = n > 1 ? `${disp} ×${n}` : disp;
        if (n >= 3) part = `<span class="mgr-highlight">${part}</span>`;
        return part;
      });
      assistHtml = ` <span style="color:var(--text2)">(${aParts.join(", ")})</span>`;
    }
    return scorerHtml + assistHtml;
  }).join(", ");
}

function _recapSideSummary(m, side) {
  const eq = side === "A" ? m.eqA : m.eqB;
  const buteurs = (side === "A" ? m.buteursA : m.buteursB) || [];
  const passeurs = (side === "A" ? m.passeursA : m.passeursB) || [];
  if (!buteurs.length) return "";
  return `${dot(eq)} : ⚽️ ${_matchGoalsRecapHTML(buteurs, passeurs)}`;
}

function buildMatchRecapRowHTML(m, idx) {
  const sideA = _recapSideSummary(m, "A"), sideB = _recapSideSummary(m, "B");
  const summary = [sideA, sideB].filter(Boolean).join(` <span style="color:var(--border2)">|</span> `);
  const sc = scoreColors(m);
  return `<div class="match-recap-row">
    <span class="mrr-num">#${idx+1}</span>
    <span class="mrr-teams">${dot(m.eqA)}<span class="mrr-score"><span style="color:${sc.a}">${m.scoreA}</span>–<span style="color:${sc.b}">${m.scoreB}</span></span>${dot(m.eqB)}</span>
    <span class="mrr-sep"></span>
    <span class="mrr-goals">${summary || "—"}</span>
  </div>`;
}

/* ══════════════════════════════════════════════════════════
   SESSIONS V2 — « Feuille de match »
   Nouvelle mise en page utilisée par renderSessionResults() (onglet
   Sessions). Le Dashboard (préfixe dbx-) a son propre rendu agrégé
   et n'utilise pas ces fonctions.
══════════════════════════════════════════════════════════ */

function _sfmGkLineHTML(gardiens) {
  const names = [...new Set((gardiens || []).filter(Boolean))];
  if (!names.length) return "";
  return `<span class="sfm-spot-gk">🧤 ${names.map(n => pLink(n)).join(" / ")}</span>`;
}
function _sfmGoalsPhrase(n) {
  if (n === 1) return "1 but";
  if (n === 2) return "un doublé";
  if (n === 3) return "un triplé";
  if (n === 4) return "un quadruplé";
  if (n === 5) return "un quintuplé";
  return `${n} buts`;
}

function _sfmHeroDate(dateStr) {
  const days = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
  const dt = new Date(dateStr + "T12:00:00");
  const day = isNaN(dt.getTime()) ? "" : days[dt.getDay()];
  return `${day ? day + " " : ""}${fmtDate(dateStr)}`;
}

function _sfmStandings(matchs) {
  const goalsFor = {}, goalsAgainst = {}, wins = {}, drawsPerTeam = {}, matchesPerTeam = {};
  matchs.forEach(m => {
    goalsFor[m.eqA]     = (goalsFor[m.eqA]||0)     + m.scoreA;
    goalsFor[m.eqB]     = (goalsFor[m.eqB]||0)     + m.scoreB;
    goalsAgainst[m.eqA] = (goalsAgainst[m.eqA]||0) + m.scoreB;
    goalsAgainst[m.eqB] = (goalsAgainst[m.eqB]||0) + m.scoreA;
    matchesPerTeam[m.eqA] = (matchesPerTeam[m.eqA]||0) + 1;
    matchesPerTeam[m.eqB] = (matchesPerTeam[m.eqB]||0) + 1;
    if (m.scoreA > m.scoreB) wins[m.eqA] = (wins[m.eqA]||0) + 1;
    else if (m.scoreB > m.scoreA) wins[m.eqB] = (wins[m.eqB]||0) + 1;
    else { drawsPerTeam[m.eqA] = (drawsPerTeam[m.eqA]||0) + 1; drawsPerTeam[m.eqB] = (drawsPerTeam[m.eqB]||0) + 1; }
  });
  const teamsPlayed = [...new Set(matchs.flatMap(m => [m.eqA, m.eqB]))];
  return teamsPlayed.map(t => {
    const pj = matchesPerTeam[t]||0, v = wins[t]||0, n = drawsPerTeam[t]||0, d = pj-v-n;
    return { team: t, pj, v, n, d, pts: v*3+n, gf: goalsFor[t]||0, ga: goalsAgainst[t]||0, diff: (goalsFor[t]||0)-(goalsAgainst[t]||0) };
  }).sort((a,b) => b.pts-a.pts || b.diff-a.diff || b.gf-a.gf);
}

function _sfmTopScorerInMatch(m) {
  const c = {};
  (m.buteursA||[]).forEach(b => { if (b && b !== "CSC") c[b] = (c[b]||0)+1; });
  (m.buteursB||[]).forEach(b => { if (b && b !== "CSC") c[b] = (c[b]||0)+1; });
  const ranked = Object.entries(c).sort((a,b) => b[1]-a[1]);
  return ranked.length ? { name: ranked[0][0], count: ranked[0][1] } : null;
}

// Choisit jusqu'à 3 matchs « temps forts » distincts : ouverture, plus gros écart, plus tendu.
function _sfmPickSpotlights(matchs) {
  if (!matchs.length) return [];
  const used = new Set();
  const spots = [];
  spots.push({ i: 0, kind: "opener" }); used.add(0);

  let blowoutI = -1, blowoutMargin = -1;
  matchs.forEach((m,i) => {
    if (used.has(i)) return;
    const mg = Math.abs(m.scoreA - m.scoreB);
    if (mg > blowoutMargin) { blowoutMargin = mg; blowoutI = i; }
  });
  if (blowoutI !== -1 && blowoutMargin > 0) { spots.push({ i: blowoutI, kind: "blowout" }); used.add(blowoutI); }

  let thrillI = -1, thrillGoals = Infinity;
  matchs.forEach((m,i) => {
    if (used.has(i)) return;
    const tg = m.scoreA + m.scoreB;
    if (tg < thrillGoals) { thrillGoals = tg; thrillI = i; }
  });
  if (thrillI !== -1) { spots.push({ i: thrillI, kind: "thriller" }); used.add(thrillI); }

  return spots.sort((a,b) => a.i - b.i);
}

function _sfmPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

/* Ne credite un gardien de "cage inviolee" que s il a garde SEUL tout le
   match (pas de rotation a la mi-temps) et n a rien encaisse. Un gardien
   qui n a joue qu une mi-temps sans encaisser ne compte pas comme clean
   sheet de match, meme si son propre compteur "buts" affiche 0. */
function _sfmFindFullCleanSheet(matchs) {
  const names = [];
  matchs.forEach(m => {
    const checkSide = (gardiens, conceded) => {
      const uniq = [...new Set((gardiens || []).filter(Boolean))];
      if (uniq.length === 1 && conceded === 0) names.push(uniq[0]);
    };
    checkSide(m.gardiensA, m.scoreB);
    checkSide(m.gardiensB, m.scoreA);
  });
  if (!names.length) return null;
  const count = {};
  names.forEach(n => { count[n] = (count[n]||0) + 1; });
  const [name, times] = Object.entries(count).sort((a,b) => b[1]-a[1])[0];
  return { name, times };
}

function _sfmSpotlightMeta(m, kind) {
  const eyebrows = { opener: "🎩 Ouverture des hostilités", blowout: "💥 Correction en règle", thriller: "🥶 Frisson du soir" };
  const top = _sfmTopScorerInMatch(m);
  let caption = "";
  if (kind === "blowout" && top && top.count >= 2) {
    const ph = _sfmGoalsPhrase(top.count);
    caption = _sfmPick([
      `${top.name} n'a pas fait dans la dentelle : ${ph}, et l'adversaire n'a rien vu venir.`,
      `${top.name} a décidé que le match était plié — ${ph}, sans même forcer le ton.`,
      `Quand ${top.name} s'y met (${ph}), la défense d'en face ferait mieux de checker les horaires du dernier bus.`,
    ]);
  } else if (kind === "thriller") {
    if (m.scoreA + m.scoreB === 0) {
      caption = _sfmPick([
        `0–0 : les deux défenses ont pris la soirée très au sérieux.`,
        `0–0, personne n'a voulu prendre le moindre risque — remboursez les organisateurs.`,
      ]);
    } else if (m.scoreA === m.scoreB) {
      caption = _sfmPick([
        `Nul et non avenu, ${m.scoreA}–${m.scoreB} : les deux équipes repartent avec leur fierté et pas grand-chose d'autre.`,
        `${m.scoreA}–${m.scoreB}, un partage des points aussi juste qu'ennuyeux à raconter.`,
      ]);
    } else if (m.scoreA === 0 || m.scoreB === 0) {
      const gk = m.scoreA === 0 ? (m.gardiensA||[])[0] : (m.gardiensB||[])[0];
      caption = gk
        ? _sfmPick([
            `${gk} n'a rien laissé passer ce soir-là : cage fermée à double tour.`,
            `${gk} a passé la rencontre les mains dans les poches — enfin, façon de parler.`,
          ])
        : `Une seule frappe dans toute la rencontre.`;
    } else {
      // L'écart n'est pas forcément de 1 : le "thriller" est le match le moins
      // prolifique de la soirée, pas nécessairement le plus serré.
      const ecart = Math.abs(m.scoreA - m.scoreB);
      caption = ecart === 1
        ? _sfmPick([
            `Un but d'écart, l'équivalent footballistique d'un cheveu sur la soupe.`,
            `Un seul but a fait la différence — de quoi discuter jusqu'à la prochaine session.`,
          ])
        : `${ecart} buts d'écart dans le match le plus verrouillé de la soirée.`;
    }
  } else if (kind === "opener" && top) {
    caption = top.count >= 2
      ? _sfmPick([
          `${top.name} lance les hostilités avec ${_sfmGoalsPhrase(top.count)} — la soirée commence fort, tant pis pour les autres.`,
          `Coup d'envoi, et déjà ${top.name} qui sort le grand jeu : ${_sfmGoalsPhrase(top.count)}.`,
        ])
      : `Coup d'envoi de la soirée, tout le monde est encore frais.`;
  } else if (top) {
    caption = `${top.name} se distingue avec ${_sfmGoalsPhrase(top.count)}, notez-le quelque part.`;
  }
  return { eyebrow: eyebrows[kind] || "⭐ Temps fort", caption };
}

function _sfmSpotlightCardHTML(m, kind, delay) {
  const meta = _sfmSpotlightMeta(m, kind);
  const clA = teamCls(m.eqA), clB = teamCls(m.eqB);
  const sc = scoreColors(m);
  const mt = (m.mt1A !== undefined && m.mt1B !== undefined) ? `<div class="sfm-spot-mt">mi-temps ${m.mt1A}–${m.mt1B}</div>` : "";
  const goalsA = _matchGoalsRecapHTML(m.buteursA, m.passeursA);
  const goalsB = _matchGoalsRecapHTML(m.buteursB, m.passeursB);
  const gkA = _sfmGkLineHTML(m.gardiensA);
  const gkB = _sfmGkLineHTML(m.gardiensB);
  return `<div class="sfm-spot-card sfm-fade-up" style="animation-delay:${delay}s">
    <div class="sfm-spot-eyebrow">${meta.eyebrow}</div>
    <div class="sfm-spot-score">
      <div class="sfm-spot-side"><div class="sfm-spot-num" style="color:${sc.a}">${m.scoreA}</div><div class="sfm-spot-lbl ${clA}">${TEAM_LABEL[m.eqA]||m.eqA}</div></div>
      <span class="sfm-spot-vs">–</span>
      <div class="sfm-spot-side"><div class="sfm-spot-num" style="color:${sc.b}">${m.scoreB}</div><div class="sfm-spot-lbl ${clB}">${TEAM_LABEL[m.eqB]||m.eqB}</div></div>
    </div>
    ${mt}
    ${meta.caption ? `<p class="sfm-spot-caption">${meta.caption}</p>` : ""}
    <div class="sfm-spot-sep"></div>
    <div class="sfm-spot-goals">
      <div>${goalsA?`⚽ ${goalsA}`:""}${gkA}</div>
      <div class="r">${goalsB?`⚽ ${goalsB}`:""}${gkB}</div>
    </div>
  </div>`;
}

function _sfmRecapSentence(session, matchs, totalButs, buteursRanked, passeursRanked, gkRanking) {
  if (!matchs.length) return "";
  const parts = [];
  const avgButs = totalButs / matchs.length;
  if (avgButs >= 3) {
    parts.push(_sfmPick([
      `Une soirée à ${totalButs} buts en ${matchs.length} match${matchs.length>1?"s":""} — les défenses ont visiblement pris congé.`,
      `${totalButs} buts en ${matchs.length} match${matchs.length>1?"s":""} : on a plus vu de célébrations que de tacles ce soir-là.`,
    ]));
  } else if (avgButs <= 1.2) {
    parts.push(_sfmPick([
      `${totalButs} but${totalButs>1?"s":""} en ${matchs.length} match${matchs.length>1?"s":""} : soirée cadenassée, les gardiens ont fait le plus dur.`,
      `${matchs.length} match${matchs.length>1?"s":""}, ${totalButs} but${totalButs>1?"s":""} au compteur — plus de tacles que de caviars ce soir.`,
    ]));
  } else {
    parts.push(`${matchs.length} match${matchs.length>1?"s":""}, ${totalButs} but${totalButs>1?"s":""} inscrit${totalButs>1?"s":""} sous les projecteurs.`);
  }

  const topScorerName = buteursRanked.length ? buteursRanked[0][0] : null;
  if (buteursRanked.length) {
    const [name, count] = buteursRanked[0];
    const eq = (session.presences && session.presences[name]) ? session.presences[name].equipe : "";
    const cls = eq ? teamCls(eq) : "";
    const nameHtml = cls ? `<b style="color:var(--${cls})">${name}</b>` : `<b>${name}</b>`;
    const teamHtml = cls ? ` pour les <b style="color:var(--${cls})">${TEAM_LABEL[eq]||eq}</b>` : "";
    const ph = _sfmGoalsPhrase(count);
    parts.push(_sfmPick([
      `${nameHtml} s'est chargé du service après-vente offensif avec ${ph}${teamHtml} — pas franchement discret.`,
      `${nameHtml} régale avec ${ph}${teamHtml}, les autres n'avaient plus qu'à applaudir.`,
      `Ce soir-là, ${nameHtml} a fait le travail tout seul ou presque : ${ph}${teamHtml}.`,
    ]));
  }

  const fullCleanSheet = _sfmFindFullCleanSheet(matchs);
  if (fullCleanSheet) {
    parts.push(_sfmPick([
      `${fullCleanSheet.name} a verrouillé sa cage sur tout le match${fullCleanSheet.times>1?`, à ${fullCleanSheet.times} reprises`:""} — porte blindée, code changé.`,
      `Derrière, ${fullCleanSheet.name} n'a rien laissé filtrer sur l'intégralité d'un match : soirée tranquille dans ses buts.`,
    ]));
  } else if (gkRanking && gkRanking.length) {
    const best = [...gkRanking].filter(g => g.matchs >= 2).sort((a,b) => a.rate - b.rate)[0];
    if (best && best.buts > 0) {
      parts.push(_sfmPick([
        `${best.name} n'a craqué que ${best.buts} fois sur ses ${best.matchs} passages dans les buts — pas parfait, mais solide.`,
        `Dans les cages, ${best.name} affiche le meilleur bilan de la soirée (${best.buts} encaissé${best.buts>1?"s":""} en ${best.matchs} passages).`,
      ]));
    }
  }

  if (passeursRanked.length) {
    const [name, count] = passeursRanked[0];
    if (name !== topScorerName) {
      parts.push(_sfmPick([
        `${name} a plus donné de ballons que le facteur : ${count} passe${count>1?"s":""} décisive${count>1?"s":""} au compteur.`,
        `${name} s'est chargé de la distribution avec ${count} passe${count>1?"s":""} décisive${count>1?"s":""} — service cinq étoiles.`,
      ]));
    }
  }

  return parts.join(" ");
}

function _sfmTickerHTML(matchs, spotlightIdxSet) {
  const chips = matchs.map((m, i) => {
    const spot = spotlightIdxSet.has(i) ? " sfm-spot" : "";
    return `<div class="sfm-t-stop"><span class="sfm-t-num">#${i+1}</span>
      <button class="sfm-t-chip${spot}" data-sfm-goto="sfm-m${i}">${dot(m.eqA)}${m.scoreA}–${m.scoreB}${dot(m.eqB)}</button>
    </div>`;
  }).join("");
  return `<div class="sfm-ticker-wrap"><div class="sfm-ticker">${chips}</div></div>`;
}

function _sfmStatStripHTML(presentsCount, matchsCount, totalButs, avgButs) {
  return `<div class="sfm-stat-strip">
    <div class="sfm-stat-item"><div class="v">${presentsCount}</div><div class="l">Présents</div></div>
    <div class="sfm-stat-item"><div class="v">${matchsCount}</div><div class="l">Matchs</div></div>
    <div class="sfm-stat-item"><div class="v">${totalButs}</div><div class="l"><span class="full">Buts marqués</span><span class="short">Buts</span></div></div>
    <div class="sfm-stat-item"><div class="v">${avgButs}</div><div class="l"><span class="full">Buts / match</span><span class="short">Buts/m.</span></div></div>
  </div>`;
}

function _sfmHeroGradient(teamsPlayed) {
  const order = ["Rouge","Vert","Bleue"];
  const active = order.filter(c => teamsPlayed.includes(c));
  if (active.length < 2) {
    const c = active[0];
    return c ? `linear-gradient(120deg, var(--${teamCls(c)}-bg), transparent 75%)` : "";
  }
  const stops = active.map(c => `var(--${teamCls(c)}-bg)`).join(", ");
  return `linear-gradient(120deg, ${stops})`;
}

function _sfmHeroHTML(session, matchs, presentsCount, teamsPlayed, recapSentence, tickerHtml, statStripHtml) {
  const dateHtml = _sfmHeroDate(session.date);
  const teamsPlayedCount = teamsPlayed.length;
  const metaParts = [`${presentsCount} présent${presentsCount>1?"s":""}`];
  if (matchs.length) metaParts.push(`${matchs.length} match${matchs.length>1?"s":""}`);
  const metaLine1 = metaParts.join(" <b>·</b> ");
  const metaLine2 = teamsPlayedCount ? `${teamsPlayedCount} équipe${teamsPlayedCount>1?"s":""} en rotation` : "";
  const heroBg = _sfmHeroGradient(teamsPlayed);
  return `<div class="sfm-hero sfm-fade-up"${heroBg ? ` style="background:${heroBg}"` : ""}>
    <div class="sfm-hero-top">
      <div>
        <div class="sfm-eyebrow">Compte-rendu de soirée</div>
        <div class="sfm-hero-date">${dateHtml}</div>
      </div>
      <div class="sfm-hero-meta">${metaLine1}${metaLine2?`<br>${metaLine2}`:""}</div>
    </div>
    ${recapSentence ? `<p class="sfm-hero-recap">${recapSentence}</p>` : ""}
    ${tickerHtml}
    ${statStripHtml}
  </div>`;
}

function _sfmScoreboardHTML(standings) {
  if (standings.length < 2) return "";
  const ranks = ["1re place","2e place","3e place","4e place","5e place"];
  const medals = ["🥇","🥈","🥉"];
  const cards = standings.map((row, i) => {
    const cls = teamCls(row.team);
    const diffSign = row.diff > 0 ? "+" : "";
    const diffCls  = row.diff > 0 ? "pos" : row.diff < 0 ? "neg" : "";
    const medal = medals[i] ? `<div class="sfm-sb-medal">${medals[i]}</div>` : "";
    return `<div class="sfm-sb-card sfm-fade-up${i===0?" sfm-sb-lead":""}" style="animation-delay:${(i*0.05).toFixed(2)}s">
      <div class="sfm-sb-accent ${cls}"></div>
      <div class="sfm-sb-body">
        <div class="sfm-sb-head">
          ${medal}
          <div style="flex:1;min-width:0"><div class="sfm-sb-rank${i===0?" first":""}">${ranks[i]||(i+1)+"e place"}</div><div class="sfm-sb-name ${cls}">${dot(row.team)}${TEAM_LABEL[row.team]||row.team}</div></div>
          <div class="sfm-sb-pts"><div class="v">${row.pts}</div><div class="l">Pts</div></div>
        </div>
        <div class="sfm-sb-sep"></div>
        <div class="sfm-sb-wdl"><span class="v">${row.v}V</span><span class="n">${row.n}N</span><span class="d">${row.d}D</span></div>
        <div class="sfm-sb-gf"><span>${row.gf} pour · ${row.ga} contre</span><span class="diff ${diffCls}">${diffSign}${row.diff}</span></div>
      </div>
    </div>`;
  }).join("");
  const hasTie = standings.some((s,i) => i>0 && s.pts === standings[i-1].pts);
  const tieNote = hasTie ? `<p style="font-size:11.5px;color:var(--text3);margin-top:9px;font-style:italic">Égalité de points — départagée à la différence de buts, puis aux buts marqués.</p>` : "";
  return `<div class="section-label">Classement de la soirée</div><div class="sfm-sb-grid">${cards}</div>${tieNote}`;
}

function _sfmPerfCard(role, name, cls, statLine, delay) {
  const initials = name.slice(0,2).toUpperCase();
  return `<div class="sfm-perf-card sfm-fade-up" style="animation-delay:${delay}s">
    <div class="sfm-perf-av ${cls}">${initials}</div>
    <div>
      <div class="sfm-perf-role">${role}</div>
      <div class="sfm-perf-name">${pLink(name)}</div>
      <div class="sfm-perf-stat">${statLine}</div>
    </div>
  </div>`;
}

function _sfmBuildPerformers(session, matchs, buteursCount, passeursCount, gkRanking) {
  const cards = [];
  let delay = 0;
  const teamOf = name => (session.presences && session.presences[name]) ? (session.presences[name].equipe||"") : "";

  const buteursRanked  = Object.entries(buteursCount).sort((a,b) => b[1]-a[1]);
  const passeursRanked = Object.entries(passeursCount).sort((a,b) => b[1]-a[1]);

  if (buteursRanked.length) {
    const [name, count] = buteursRanked[0];
    cards.push(_sfmPerfCard("Étoile de la soirée", name, teamCls(teamOf(name)),
      `${count} but${count>1?"s":""} inscrit${count>1?"s":""} durant la soirée`, (delay+=0.05).toFixed(2)));
  }
  if (passeursRanked.length) {
    const [name, count] = passeursRanked[0];
    cards.push(_sfmPerfCard("Passeur en chef", name, teamCls(teamOf(name)),
      `${count} passe${count>1?"s":""} décisive${count>1?"s":""}`, (delay+=0.05).toFixed(2)));
  }
  if (gkRanking && gkRanking.length) {
    const best = [...gkRanking].sort((a,b) => a.rate-b.rate || b.matchs-a.matchs || a.name.localeCompare(b.name,"fr"))[0];
    const stat = best.buts === 0
      ? `0 but encaissé dans les buts (${best.matchs} mi-temps${best.matchs>1?"s":""})`
      : `${best.buts} but${best.buts>1?"s":""} encaissé${best.buts>1?"s":""} en ${best.matchs} mi-temps${best.matchs>1?"s":""}`;
    cards.push(_sfmPerfCard("Mur infranchissable", best.name, teamCls(teamOf(best.name)), stat, (delay+=0.05).toFixed(2)));
  }

  let bestSingle = null;
  matchs.forEach((m, i) => {
    const c = {};
    (m.buteursA||[]).forEach(b => { if (b && b!=="CSC") c[b]=(c[b]||0)+1; });
    (m.buteursB||[]).forEach(b => { if (b && b!=="CSC") c[b]=(c[b]||0)+1; });
    Object.entries(c).forEach(([name, count]) => {
      if (!bestSingle || count > bestSingle.count) bestSingle = { name, count, idx: i, m };
    });
  });
  if (bestSingle && bestSingle.count >= 2) {
    cards.push(_sfmPerfCard("Festival offensif", bestSingle.name, teamCls(teamOf(bestSingle.name)),
      `${_sfmGoalsPhrase(bestSingle.count)} lors du match #${bestSingle.idx+1} (${bestSingle.m.scoreA}-${bestSingle.m.scoreB})`, (delay+=0.05).toFixed(2)));
  }

  return cards;
}

function _sfmLogisticsHTML(session) {
  const parts = [];

  if (session.maillots) parts.push(`<span>👕 Maillots : <b>${pLink(session.maillots)}</b></span>`);
  const byStatut = statut => Object.entries(session.presences||{})
    .filter(([,i]) => i.statut === statut).map(([n]) => n).sort((a,b)=>a.localeCompare(b,"fr"));
  const blesses    = byStatut("Blessé");
  const absents    = byStatut("Absent");
  const pasRepondu = byStatut("Pas répondu");
  if (blesses.length)    parts.push(`<span>🩹 Blessé${blesses.length>1?"s":""} : <b>${blesses.map(n=>pLink(n)).join(", ")}</b></span>`);
  if (absents.length)    parts.push(`<span>❌ Absent${absents.length>1?"s":""} : <b>${absents.map(n=>pLink(n)).join(", ")}</b></span>`);

}

      const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
      buts.forEach((b,i) => {
        if (!b || b==="CSC") return;
        buteursCount[b] = (buteursCount[b]||0)+1;
        const p = passes[i]; if (p && p!=="CSC") passeursCount[p] = (passeursCount[p]||0)+1;
      });
    });
  });
  const buteursRanked  = Object.entries(buteursCount).sort((a,b)=>b[1]-a[1]);
  const passeursRanked = Object.entries(passeursCount).sort((a,b)=>b[1]-a[1]);
  const standings  = _sfmStandings(matchs);
  const gkRanking  = computeGardiensRanking([session]);
  const avgButs    = matchs.length ? (totalButs/matchs.length).toFixed(1).replace(".", ",") : "—";

  const recapSentence   = matchs.length ? _sfmRecapSentence(session, matchs, totalButs, buteursRanked, passeursRanked, gkRanking) : "";
  const spotlights      = _sfmPickSpotlights(matchs);
  const spotlightIdxSet = new Set(spotlights.map(s => s.i));
  const tickerHtml      = matchs.length ? _sfmTickerHTML(matchs, spotlightIdxSet) : "";
  const statStripHtml   = matchs.length ? _sfmStatStripHTML(presentsCount, matchs.length, totalButs, avgButs) : "";

  let h = _sfmHeroHTML(session, matchs, presentsCount, standings.map(s => s.team), recapSentence, tickerHtml, statStripHtml);

  if (!matchs.length) {
    h += `<div class="sfm-no-data-card sfm-fade-up">
      <div class="big">🌒</div>
      Aucun match enregistré pour cette soirée pour le moment.
    </div>`;
  } else {
    h += _sfmScoreboardHTML(standings);

    const spotCards = spotlights.map((s,i) => _sfmSpotlightCardHTML(matchs[s.i], s.kind, (i*0.05).toFixed(2)));
    if (spotCards.length) {
      h += `<div class="section-label">Temps forts</div><div class="sfm-spot-grid">${spotCards.join("")}</div>`;
    }

    const perfCards = _sfmBuildPerformers(session, matchs, buteursCount, passeursCount, gkRanking);

    }
  }

  /* ── Compositions & coulisses ── */

  presentsAll.forEach(p => { teamMap[p.equipe] !== undefined ? teamMap[p.equipe].push(p) : noTeam.push(p); });
  const activeColors = ["Rouge","Vert","Bleue"].filter(c => teamMap[c].length > 0);

      wrap.scrollIntoView({ behavior: 'smooth', block: 'center' });

function computeBestAllTimeStreak() {
  let best = null;
  ALL_PLAYERS.filter(p => !JOKERS.has(p)).forEach(player => {
    const st = computePlayerDetailStats(player);
    const cs = st.currentStreak;
    const hs = st.bestHistoricalStreak;
    let candidate = null;
    if (cs && hs) {
      if (cs.count > hs.count || (cs.count === hs.count && (cs.g + cs.a) >= (hs.g + hs.a))) {
        candidate = { player, ...cs, isActive: true };
      } else {
        candidate = { player, ...hs, isActive: false };
      }
    } else if (cs) {
      candidate = { player, ...cs, isActive: true };
    } else if (hs) {
      candidate = { player, ...hs, isActive: false };
    }
    if (!candidate) return;
    if (!best || candidate.count > best.count ||
        (candidate.count === best.count && (candidate.g + candidate.a) > (best.g + best.a))) {
      best = candidate;
    }
  });
  return best;
}

function computeBestTeamAllTime() {
  let best = null;
  SESSIONS.forEach(session => {
    const matchs = session.matchs || [];
    if (!matchs.length) return;
    ["Rouge", "Vert", "Bleue"].forEach(team => {
      const tmMatchs = matchs.filter(m => m.eqA === team || m.eqB === team);
      if (!tmMatchs.length) return;
      let wins = 0, goalsFor = 0, goalsAgainst = 0;
      const scorers = {}, assisters = {};
      tmMatchs.forEach(m => {
        const isA = m.eqA === team;
        const gf = isA ? m.scoreA : m.scoreB;
        const ga = isA ? m.scoreB : m.scoreA;
        goalsFor += gf; goalsAgainst += ga;
        if (gf > ga) wins++;
        (isA ? (m.buteursA||[])  : (m.buteursB||[])).forEach(p  => { if (p && p !== "CSC") scorers[p]   = (scorers[p]   || 0) + 1; });
        (isA ? (m.passeursA||[]) : (m.passeursB||[])).forEach(p => { if (p)                assisters[p] = (assisters[p] || 0) + 1; });
      });
      const goalDiff = goalsFor - goalsAgainst;
      const players = Object.entries(session.presences)
        .filter(([, info]) => info.statut === "Présent" && info.equipe === team)
        .map(([name]) => name).sort((a, b) => a.localeCompare(b, "fr"));
      const topSc = Object.entries(scorers).sort((a,b)=>b[1]-a[1])[0];
      const topAs = Object.entries(assisters).sort((a,b)=>b[1]-a[1])[0];
      const c = { session, team, wins, goalsFor, goalsAgainst, goalDiff, players,
        topScorer:   topSc ? { name: topSc[0], count: topSc[1] } : null,
        topAssister: topAs ? { name: topAs[0], count: topAs[1] } : null };
      if (!best || wins > best.wins || (wins === best.wins && goalDiff > best.goalDiff)) best = c;
    });
  });
  return best;
}

function _mhfTierName(ach, rawLv) { const dl = _mhfDisplayLevel(ach, rawLv); return (ach.tierNames && ach.tierNames[rawLv-1]) || ACH_TIER_NAMES[dl] || `Niveau ${dl}`; }
// Pilules (légende / tiroir) : couleur pleine, copiée telle quelle depuis .ach-cell.tN.
function _mhfTierStyleAttr(dl) { return dl>0 ? `background:var(--mhf-t${dl}-bg);border:1px solid var(--mhf-t${dl}-b);color:var(--mhf-t${dl}-c);` : ''; }
// Cases de la matrice : ne redéfinit que fond + couleur de bordure, la largeur/épaisseur vient de .mhf-tier-box(.filled).
function _mhfCellStyleAttr(dl) { return dl>0 ? `background:var(--mhf-t${dl}-bg);border-color:var(--mhf-t${dl}-b);` : ''; }

function computeMhfData() {
  const players = ALL_PLAYERS.slice();
  const achs = ACH_DEFS.map(a => ({ ...a, cat: MHF_CAT_BY_ID[a.id] || 'Distinctions' }));
  const statsByPlayer = {};
  players.forEach(p => {
    const s = computeAchievementStats(p);
    let lc = 0;
    ACH_DEFS.filter(a => a.id !== 'legende').forEach(a => { lc += _achLevel(s[a.key]||0, a.tiers); });
    s.legendeCount = lc;
    statsByPlayer[p] = s;
  });
  const levels = {};
  players.forEach(p => {
    levels[p] = {};
    achs.forEach(a => { const val = statsByPlayer[p][a.key] || 0; levels[p][a.id] = { raw: _achLevel(val, a.tiers), val }; });
  });
  const completion = {};
  achs.forEach(a => {
    let unlocked = 0;
    players.forEach(p => { if (levels[p][a.id].raw > 0) unlocked++; });
    completion[a.id] = { unlocked, rate: players.length ? unlocked/players.length : 0 };
  });
  const summary = {};
  players.forEach(p => {
    let niveaux = 0, hautsFaits = 0;
    achs.forEach(a => { const raw = levels[p][a.id].raw; niveaux += raw; if (raw>0) hautsFaits++; });
    summary[p] = { niveaux, hautsFaits };
  });
  return { players, achs, statsByPlayer, levels, completion, summary };
}

function _mhfVisibleAch() {
  return _mhf.achs.filter(a => _mhfState.activeCats.has(a.cat) && (_mhfState.showHidden || !a.hidden));
}
function _mhfVisiblePlayers() {
  const q = _mhfState.search.trim().toLowerCase();
  let list = q ? _mhf.players.filter(p => p.toLowerCase().includes(q)) : _mhf.players.slice();
  list = list.filter(p => _mhf.summary[p].hautsFaits > 0);
  list.sort((a,b) => {
    if (_mhfState.sortKey === 'name') return _mhfState.sortDir * a.localeCompare(b,'fr');
    const va = _mhfState.sortKey === 'hautsFaits' ? _mhf.summary[a].hautsFaits : _mhf.summary[a].niveaux;
    const vb = _mhfState.sortKey === 'hautsFaits' ? _mhf.summary[b].hautsFaits : _mhf.summary[b].niveaux;
    if (va === vb) return a.localeCompare(b,'fr');
    return _mhfState.sortDir * (va - vb);
  });
  return list;
}

// Points colores representant les niveaux possibles d un haut fait (t1..t6).
function _mhfLevelDotsHTML(a) {
  const levels = a.fixedTier
    ? [a.fixedTier]
    : a.tiers.map((_, i) => Math.min(6, i + 1 + (a.tierOffset || 0)));
  return `<span class="mhf-rarity-levels">${levels.map(lv =>
    `<span class="dot" style="background:var(--mhf-t${lv}-c)"></span>`
  ).join('')}</span>`;
}

function _mhfRenderRarityHtml() {
  const RARITY_PAGE = 10;
  const rows = [..._mhf.achs].sort((a,b) => _mhf.completion[b.id].rate - _mhf.completion[a.id].rate);
  const rowHtml = a => {
    const c = _mhf.completion[a.id];
    const pct = Math.round(c.rate*100);
    const color = pct<=15 ? 'var(--bad)' : pct<=45 ? 'var(--gold)' : 'var(--good)';
    return `<div class="mhf-rarity-row${_mhfState.selectedAch===a.id?' selected':''}" data-acid="${a.id}">
      <span class="mhf-rarity-ic">${a.icon}</span>
      <span class="mhf-rarity-name"><span class="n">${a.name}</span>${_mhfLevelDotsHTML(a)}${a.hidden?'<span class="mhf-rarity-secret">SECRET</span>':''}</span>
      <span class="mhf-rarity-track"><span class="mhf-rarity-fill" style="width:${pct}%;background:${color}"></span></span>
      <span class="mhf-rarity-stat"><b>${c.unlocked}</b>/${_mhf.players.length} &middot; ${pct}%</span>
    </div>`;
  };
  const visible = rows.slice(0, RARITY_PAGE).map(rowHtml).join('');
  const rest = rows.slice(RARITY_PAGE);
  const restHtml = rest.length
    ? `<div class="mhf-rarity-more" id="mhf-rarity-more">${rest.map(rowHtml).join('')}</div>
       <button class="mhf-rarity-toggle" id="mhf-rarity-toggle" data-label="Voir tout (${rows.length}) ›">Voir tout (${rows.length}) ›</button>`
    : '';
  return visible + restHtml;
}

function _mhfRenderChipsHtml() {
  let h = `<button class="pill${_mhfState.activeCats.size===MHF_CATS.length?' active':''}" data-cat="__all">Tous</button>`;
  h += MHF_CATS.map(c => `<button class="pill${_mhfState.activeCats.has(c)&&_mhfState.activeCats.size<MHF_CATS.length?' active':''}" data-cat="${c}">${c}</button>`).join('');
  return h;
}

function renderMhfMatrixHtml() {
  const achs = _mhfVisibleAch();
  const players = _mhfVisiblePlayers();
  if (!achs.length) return `<div class="mhf-matrix" id="mhf-matrix"><div class="mhf-mcell" style="padding:16px;color:var(--text3)">Aucun haut fait visible avec ces filtres.</div></div>`;
  if (!players.length) return `<div class="mhf-matrix" id="mhf-matrix"><div class="mhf-mcell" style="padding:16px;color:var(--text3)">Aucun joueur ne correspond à la recherche.</div></div>`;

  const firstOfCat = {};
  achs.forEach(a => { if (!(a.cat in firstOfCat)) firstOfCat[a.cat] = a.id; });

  let h = `<div class="mhf-matrix" id="mhf-matrix" style="grid-template-columns:176px 60px 60px repeat(${achs.length},34px)">`;
  h += `<div class="mhf-mcell mhf-mh-corner mhf-mh-txt${_mhfState.sortKey==='name'?' sorted':''}" data-sort="name" title="Trier par nom" style="justify-content:flex-start;padding-left:10px">Joueur</div>`;
  h += `<div class="mhf-mcell mhf-msum mhf-mh-txt${_mhfState.sortKey==='hautsFaits'?' sorted':''}" data-sort="hautsFaits" title="Trier par nombre de hauts faits débloqués">HF</div>`;
  h += `<div class="mhf-mcell mhf-msum mhf-mh-txt${_mhfState.sortKey==='niveaux'?' sorted':''}" data-sort="niveaux" title="Trier par total de niveaux cumulés">NIV</div>`;
  achs.forEach(a => {
    const grp = firstOfCat[a.cat]===a.id ? ' grp-start' : '';
    const c = _mhf.completion[a.id];
    const tip = `${a.icon} ${a.name}\n${c.unlocked}/${_mhf.players.length} joueurs &middot; ${Math.round(c.rate*100)}%\n${ACH_ABOUT[a.id]||''}`.replace(/"/g,'&quot;');
    h += `<div class="mhf-mcell mhf-mh${grp}" data-ach="${a.id}" data-tip="${tip}">
      <span class="ic">${a.icon}</span>${a.hidden?'<span class="lock">&#9679;</span>':''}
    </div>`;
  });

  const _mhfInitials = computeAllInitials([...new Set([...ALL_PLAYERS, ...players])]);
  players.forEach((p,i) => {
    const rowCls = i%2===0 ? 'mhf-mrow-odd' : 'mhf-mrow-even';
    const rank = i+1;
    const rankCls = _mhfState.sortKey!=='name' && rank<=3 ? (rank===1?'gold':rank===2?'silver':'bronze') : '';
    const jokerTag = JOKERS.has(p) ? ' <span style="color:var(--text3);font-size:10px">[+1]</span>' : '';
    h += `<div class="mhf-mcell mhf-mname player-link ${rowCls}" data-player="${p}">
      <span class="mhf-mrank ${rankCls}">${rank}</span>
      <span class="mhf-mavatar">${_mhfInitials[p] || p.slice(0,2).toUpperCase()}</span>
      <span class="mhf-mname-txt">${p}${jokerTag}</span>
    </div>`;
    h += `<div class="mhf-mcell mhf-msum ${rowCls}${_mhfState.sortKey==='hautsFaits'?' sorted':''}">${_mhf.summary[p].hautsFaits}</div>`;
    h += `<div class="mhf-mcell mhf-msum ${rowCls}${_mhfState.sortKey==='niveaux'?' sorted':''}">${_mhf.summary[p].niveaux}</div>`;
    achs.forEach(a => {
      const grp = firstOfCat[a.cat]===a.id ? ' grp-start' : '';
      const L = _mhf.levels[p][a.id];
      const dl = L.raw>0 ? _mhfDisplayLevel(a,L.raw) : 0;
      const anim = dl===6 ? ' mhf-t6-anim' : '';
      let line1, line2 = '';
      if (L.raw>0) {
        line1 = `${_mhfTierName(a,L.raw)} &middot; ${a.desc(L.val)}`;
        if (!a.fixedTier && L.raw < a.tiers.length) line2 = `Prochain seuil : ${a.tiers[L.raw]}`;
      } else {
        line1 = `Non débloqué &middot; ${a.desc(L.val)}`;
        line2 = `Seuil requis : ${a.tiers[0]}`;
      }
      const tip = `${a.icon} ${a.name} — ${p}\n${line1}\n${line2}`.replace(/"/g,'&quot;');
      h += `<div class="mhf-mcell mval ${rowCls}${grp}" data-tip="${tip}">
        <div class="mhf-tier-box${dl>0?' filled':''}${anim}" style="${_mhfCellStyleAttr(dl)}"></div>
      </div>`;
    });
  });

  h += `</div>`;
  return h;
}

// Section publique (4 cases KPI) : accessible hors admin. Les hauts faits secrets ne
// doivent jamais y être nommés (rare/commun), même si leur taux les qualifierait.
function _mhfKpiSectionHtml() {
  _mhf = computeMhfData();

  let kpiHtml = '';
  if (_mhf.players.length) {
    const totalCells = _mhf.players.length * _mhf.achs.length;
    let filledCells = 0;
    _mhf.players.forEach(p => _mhf.achs.forEach(a => { if (_mhf.levels[p][a.id].raw > 0) filledCells++; }));
    const avgRate = totalCells ? filledCells/totalCells : 0;
    const publicAchs = _mhf.achs.filter(a => !a.hidden);
    const sortedByRate = [...publicAchs].sort((a,b) => _mhf.completion[a.id].rate - _mhf.completion[b.id].rate);
    const rarest = sortedByRate[0], common = sortedByRate[sortedByRate.length-1];
    const topCollector = [..._mhf.players].sort((a,b) => _mhf.summary[b].niveaux - _mhf.summary[a].niveaux)[0];
    const cards = [
      { ico:'📊', lbl:'Complétion Hauts Faits', num: Math.round(avgRate*100)+'%',
        sub:`${filledCells} / ${totalCells} cases débloquées` },
      { ico: rarest.icon, lbl:'Haut fait le plus rare', num: rarest.name,
        sub:`${_mhf.completion[rarest.id].unlocked}/${_mhf.players.length} joueurs (${Math.round(_mhf.completion[rarest.id].rate*100)}%)` },
      { ico: common.icon, lbl:'Haut fait le plus commun', num: common.name,
        sub:`${_mhf.completion[common.id].unlocked}/${_mhf.players.length} joueurs (${Math.round(_mhf.completion[common.id].rate*100)}%)` },
      { ico:'👑', lbl:'Meilleur collectionneur', num: topCollector,
        sub:`${_mhf.summary[topCollector].niveaux} niveaux &middot; ${_mhf.summary[topCollector].hautsFaits} HF` },
    ];
    kpiHtml = `<div class="kpi-grid mhf-kpi-grid">` + cards.map(c => `
      <div class="kpi-card mhf-kpi-card">
        <div class="mhf-kpi-head"><span class="mhf-kpi-ico">${c.ico}</span><span class="kpi-lbl" style="margin-top:0">${c.lbl}</span></div>
        <div class="kpi-num mhf-kpi-num">${c.num}</div>
        <div class="kpi-sub">${c.sub}</div>
      </div>`).join('') + `</div>`;
  }

  return `<div class="section-label" style="margin-top:2rem">Hauts faits — Matrice</div>` + kpiHtml;
}

function openMhfAchievementDrawer(acid) {
  const a = _mhf.achs.find(x => x.id === acid);
  if (!a) return;
  const c = _mhf.completion[acid];
  const unlocked = _mhf.players.filter(p => _mhf.levels[p][acid].raw > 0)
    .sort((x,y) => _mhf.levels[y][acid].raw - _mhf.levels[x][acid].raw || _mhf.levels[y][acid].val - _mhf.levels[x][acid].val || x.localeCompare(y,'fr'));
  const locked = _mhf.players.filter(p => _mhf.levels[p][acid].raw === 0)
    .sort((x,y) => _mhf.levels[y][acid].val - _mhf.levels[x][acid].val || x.localeCompare(y,'fr'));

  let ladder = '';
  if (a.fixedTier) {
    ladder = `<span class="mhf-tier-pill${a.fixedTier===6?' mhf-t6-anim':''}" style="${_mhfTierStyleAttr(a.fixedTier)}"><span class="dot"></span>Déblocage en 1 fois — ${ACH_TIER_NAMES[a.fixedTier]}</span>`;
  } else {
    ladder = a.tiers.map((th,i) => {
      const dl = _mhfDisplayLevel(a, i+1);
      const tn = (a.tierNames && a.tierNames[i]) || ACH_TIER_NAMES[dl];
      return `<span class="mhf-tier-pill${dl===6?' mhf-t6-anim':''}" style="${_mhfTierStyleAttr(dl)}"><span class="dot"></span>${tn} &middot; ${th}</span>`;
    }).join('');
  }

  const rateColor = c.rate<=0.15 ? 'var(--bad)' : c.rate<=0.45 ? 'var(--gold)' : 'var(--good)';

  let body = `<div class="mhf-dr-about">${ACH_ABOUT[a.id] || ''}</div>`;
  body += `<div class="mhf-dr-ladder">${ladder}</div>`;
  body += `<div class="mhf-dr-completion">
    <div class="top"><span>Complétion roster</span><b>${c.unlocked}/${_mhf.players.length}</b></div>
    <div class="mhf-dr-bar-track"><div class="mhf-dr-bar-fill" style="width:${Math.round(c.rate*100)}%;background:${rateColor}"></div></div>
  </div>`;
  body += `<div class="mhf-dr-list">`;
  unlocked.forEach((p,i) => {
    const L = _mhf.levels[p][acid];
    const dl = _mhfDisplayLevel(a, L.raw);
    const tn = (a.tierNames && a.tierNames[L.raw-1]) || ACH_TIER_NAMES[dl];
    const rank = i+1;
    const rc = rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
    body += `<div class="mhf-dr-row">
      <span class="mhf-dr-rank ${rc}">${rank}</span>
      <button class="mhf-dr-pname player-link" data-player="${p}">${p}</button>
      <span class="mhf-dr-badge" style="${_mhfTierStyleAttr(dl)}">${tn}</span>
      <span class="mhf-dr-val">${a.desc(L.val)}</span>
    </div>`;
  });
  body += `</div>`;
  if (locked.length) {
    body += `<details class="mhf-dr-locked"><summary>${locked.length} joueur${locked.length>1?'s':''} non débloqué${locked.length>1?'s':''}</summary>`;
    locked.forEach(p => {
      const L = _mhf.levels[p][acid];
      body += `<div class="mhf-dr-locked-row">
        <button class="mhf-dr-pname player-link" data-player="${p}">${p}</button>
        <span class="mhf-dr-progress-hint">${L.val} / ${a.tiers[0]}</span>
      </div>`;
    });
    body += `</details>`;
  }

  document.getElementById('mhf-dr-icon').setAttribute('style', `font-size:24px;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;${_mhfTierStyleAttr(a.hidden?1:3)}`);
  document.getElementById('mhf-dr-icon').textContent = a.icon;
  document.getElementById('mhf-dr-title').innerHTML = `${a.name}${a.hidden?' <span class="mhf-rarity-secret" style="vertical-align:middle">SECRET</span>':''}`;
  document.getElementById('mhf-dr-cat').textContent = a.cat;
  document.getElementById('mhf-dr-body').innerHTML = body;
  document.getElementById('mhf-drawer').classList.add('open');
  document.getElementById('mhf-drawer-overlay').classList.add('open');

  _mhfState.selectedAch = acid;
  const rl = document.getElementById('mhf-rarity-list');
  if (rl) rl.innerHTML = _mhfRenderRarityHtml();
}

function closeMhfDrawer() {
  const d = document.getElementById('mhf-drawer'), o = document.getElementById('mhf-drawer-overlay');
  if (d) d.classList.remove('open');
  if (o) o.classList.remove('open');
}

/* ══════════════════════════════════════════════════════════
   RIVALITÉS
══════════════════════════════════════════════════════════ */

function computeRivalites(pA, pB, period) {
  let sessions = [...SESSIONS];
  const now = new Date();
  if (period === "year") {
    sessions = sessions.filter(s => _seasonStart(s.date) === _currentSeason());
  } else if (period === "month") {
    sessions = sessions.filter(s => {
      const d = new Date(s.date);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
  }

  // Garder seulement les sessions où pA ET pB sont présents
  sessions = sessions.filter(s => {
    const pa = s.presences[pA], pb = s.presences[pB];
    return pa && pa.statut === "Présent" && pb && pb.statut === "Présent";
  });

  const result = {
    total: sessions.length,
    matchs: sessions.reduce((acc, s) => acc + (s.matchs||[]).length, 0),
    matchsDirect: 0,
    together: { sessions: 0, wA: 0, dA: 0, lA: 0, gaA: 0, gaB: 0, gA: 0, aA: 0, gB: 0, aB: 0, best: [] },
    versus:   { sessions: 0, wA: 0, dA: 0, lA: 0, wB: 0, dB: 0, lB: 0, gaA: 0, gaB: 0, gA: 0, aA: 0, gB: 0, aB: 0, best: [] },
  };

  const togetherRaw = [];
  const versusRaw   = [];

  sessions.forEach(s => {
    const eqA = s.presences[pA].equipe;
    const eqB = s.presences[pB].equipe;
    const sameEq = eqA && eqB && eqA === eqB;
    const oppEq  = eqA && eqB && eqA !== eqB;

    // G/A individuels dans la session (tous matchs)
    let gA=0, aA=0, gB=0, aB=0;
    (s.matchs||[]).forEach(m => {
      ["A","B"].forEach(side => {
        const buts   = m[`buteurs${side}`]  || [];
        const passes = m[`passeurs${side}`] || [];
        buts.forEach((b,i) => {
          if (!b || b==="CSC") return;
          const p = passes[i];
          if (b === pA) gA++;
          if (p && p!=="CSC" && p === pA) aA++;
          if (b === pB) gB++;
          if (p && p!=="CSC" && p === pB) aB++;
        });
      });
    });

    if (sameEq) {
      result.together.sessions++;
      result.together.gaA += gA + aA; result.together.gA += gA; result.together.aA += aA;
      result.together.gaB += gB + aB; result.together.gB += gB; result.together.aB += aB;

      // W/D/L communs — par match de leur équipe
      let wMatch=0, lMatch=0;
      (s.matchs||[]).filter(m => m.eqA===eqA||m.eqB===eqA).forEach(m => {
        const w = m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;
        if (w===eqA) { result.together.wA++; wMatch++; }
        else if (w===null) { result.together.dA++; }
        else { result.together.lA++; lMatch++; }
      });

      const wdl = wMatch > lMatch ? 'W' : lMatch > wMatch ? 'L' : 'D';
      togetherRaw.push({ date: s.date, equipe: eqA, gaA: gA+aA, gaB: gB+aB, wdl });
    }

    if (oppEq) {
      result.versus.sessions++;
      result.versus.gaA += gA + aA; result.versus.gA += gA; result.versus.aA += aA;
      result.versus.gaB += gB + aB; result.versus.gB += gB; result.versus.aB += aB;

      // W/D/L uniquement sur les matchs directs eqA vs eqB
      (s.matchs||[]).filter(m => (m.eqA===eqA&&m.eqB===eqB)||(m.eqA===eqB&&m.eqB===eqA)).forEach(m => {
        const w = m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;
        if (w===eqA)      { result.versus.wA++; result.versus.lB++; }
        else if (w===eqB) { result.versus.wB++; result.versus.lA++; }
        else              { result.versus.dA++; result.versus.dB++; }
      });

      // Confrontations marquantes : un entry PAR MATCH direct eqA vs eqB
      (s.matchs||[]).forEach(m => {
        let scA, scB, swapped = false;
        if (m.eqA===eqA && m.eqB===eqB)      { scA=m.scoreA; scB=m.scoreB; }
        else if (m.eqA===eqB && m.eqB===eqA) { scA=m.scoreB; scB=m.scoreA; swapped=true; }
        else return;

        // G/A de pA et pB dans CE match uniquement
        let mgA=0, maA=0, mgB=0, maB=0;
        ["A","B"].forEach(side => {
          (m[`buteurs${side}`]||[]).forEach((b,i) => {
            if (!b||b==="CSC") return;
            const p=(m[`passeurs${side}`]||[])[i];
            if (b===pA) mgA++; if (p&&p!=="CSC"&&p===pA) maA++;
            if (b===pB) mgB++; if (p&&p!=="CSC"&&p===pB) maB++;
          });
        });

        versusRaw.push({ date: s.date, eqA, eqB, scoreA: scA, scoreB: scB, gA: mgA, aA: maA, gB: mgB, aB: maB });
      });
    }
  });

  result.matchsDirect = versusRaw.length;

  // Top 3 sessions ensemble (triées par gaA+gaB desc)
  result.together.best = togetherRaw
    .sort((a,b) => (b.gaA+b.gaB) - (a.gaA+a.gaB))
    .slice(0, 3);

  // Top 3 matchs directs (triés par G/A combinés desc, puis écart de score)
  result.versus.best = versusRaw
    .sort((a,b) => {
      const gaTotal = (b.gA+b.aA+b.gB+b.aB) - (a.gA+a.aA+a.gB+a.aB);
      if (gaTotal !== 0) return gaTotal;
      return Math.abs(b.scoreA-b.scoreB) - Math.abs(a.scoreA-a.scoreB);
    })
    .slice(0, 3);

  return result;
}

function renderRivBody(pA, pB, period) {
  if (pA === pB) {
    return `<p class="no-data">Sélectionne deux joueurs différents.</p>`;
  }
  const r = computeRivalites(pA, pB, period);
  if (r.total === 0) {
    return `<p class="no-data">Aucune session commune pour cette période.</p>`;
  }

  const wCol = "#34A853";
  const dCol = "var(--text3)";
  const lCol = "#ea4335";

  const hasTogether = r.together.sessions > 0;
  const hasVersus   = r.versus.sessions   > 0;

  // Header
  let h = `<div style="text-align:center;padding:10px 0 14px">
    <div style="font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px">
      <span>${pA}</span>
      <span style="font-size:11px;color:var(--text3);font-weight:500;letter-spacing:.1em">VS</span>
      <span>${pB}</span>
    </div>
  </div>`;

  if (!hasTogether && !hasVersus) {
    h += `<p class="no-data">Aucune session avec équipes attribuées.</p>`;
    return h;
  }

  // Stats : récap | face à face | ensemble — 3 colonnes sur la même ligne
  h += `<div class="riv-grid">`;

  // Récap (1re carte) — 2×2
  const matchsTogether = r.together.wA + r.together.dA + r.together.lA;
  const matchsTotal = matchsTogether + r.matchsDirect;
  h += `<div class="riv-col-card" style="border-color:var(--gold-border)">
    <div class="riv-col-title">Récap</div>
    <div class="riv-recap">
      <div><div class="n">${r.total}</div><div class="l">session${r.total>1?'s':''}</div></div>
      <div><div class="n">${matchsTotal}</div><div class="l">match${matchsTotal>1?'s':''}</div></div>
      <div><div class="n">${matchsTogether}</div><div class="l">ensemble</div></div>
      <div><div class="n">${r.matchsDirect}</div><div class="l">face à face</div></div>
    </div>
  </div>`;

  // Face à face (2e carte) — scoreboard pA vs pB
  if (hasVersus) {
    const v = r.versus;
    const colA = v.wA > v.wB ? wCol : v.wA < v.wB ? 'var(--text3)' : 'var(--text)';
    const colB = v.wB > v.wA ? wCol : v.wB < v.wA ? 'var(--text3)' : 'var(--text)';
    h += `<div class="riv-col-card">
      <div class="riv-col-title">⚔️ Face à face</div>
      <div class="riv-vsrow names"><span>${pA}</span><span style="font-size:9px;color:var(--text3);font-weight:600;letter-spacing:.12em;padding:0 6px;text-transform:uppercase">vs</span><span>${pB}</span></div>
      <div class="riv-score">
        <span class="num" style="color:${colA}">${v.wA}</span>
        <span class="draws">${v.dA}</span>
        <span class="num right" style="color:${colB}">${v.wB}</span>
      </div>
      <div class="riv-foot">
        <span><strong style="color:var(--text2)">${v.gA}</strong> but${v.gA>1?'s':''} · <strong style="color:var(--text2)">${v.aA}</strong> <span class="assist-full">assist${v.aA>1?'s':''}</span><span class="assist-short">ass.</span></span>
        <span><strong style="color:var(--text2)">${v.gB}</strong> but${v.gB>1?'s':''} · <strong style="color:var(--text2)">${v.aB}</strong> <span class="assist-full">assist${v.aB>1?'s':''}</span><span class="assist-short">ass.</span></span>
      </div>
    </div>`;
  } else {
    h += `<div class="riv-col-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="riv-col-title">⚔️ Face à face</div>
      <div class="riv-no-data-small">Pas de données</div>
    </div>`;
  }

  // Ensemble (3e carte) — pA × pB + V/N/D
  if (hasTogether) {
    const t = r.together;
    h += `<div class="riv-col-card">
      <div class="riv-col-title">🤝 Ensemble</div>
      <div class="riv-vsrow names"><span>${pA}</span><span style="font-size:14px;color:var(--text3);font-weight:700;padding:0 6px">×</span><span>${pB}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:2px;margin-bottom:3px">
        <span style="font-size:9px;color:${wCol};font-weight:700;text-transform:uppercase;letter-spacing:.06em">V</span>
        <span style="font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em">N</span>
        <span style="font-size:9px;color:${lCol};font-weight:700;text-transform:uppercase;letter-spacing:.06em">D</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;margin-bottom:12px">
        <span style="font-size:40px;font-weight:800;line-height:1;color:${wCol}">${t.wA}</span>
        <span style="font-size:40px;font-weight:800;line-height:1;color:var(--text3)">${t.dA}</span>
        <span style="font-size:40px;font-weight:800;line-height:1;color:${lCol}">${t.lA}</span>
      </div>
      <div class="riv-foot" style="display:block">
        <span style="font-weight:700;color:var(--text)">${pA}</span> : <strong style="color:var(--text2)">${t.gA}</strong> but${t.gA>1?'s':''} · <strong style="color:var(--text2)">${t.aA}</strong> <span class="assist-full">assist${t.aA>1?'s':''}</span><span class="assist-short">ass.</span>
        <br>
        <span style="font-weight:700;color:var(--text)">${pB}</span> : <strong style="color:var(--text2)">${t.gB}</strong> but${t.gB>1?'s':''} · <strong style="color:var(--text2)">${t.aB}</strong> <span class="assist-full">assist${t.aB>1?'s':''}</span><span class="assist-short">ass.</span>
      </div>
    </div>`;
  } else {
    h += `<div class="riv-col-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="riv-col-title">🤝 Ensemble</div>
      <div class="riv-no-data-small">Pas de données</div>
    </div>`;
  }

  h += `</div>`;

  // Top soirées ensemble
  if (hasTogether && r.together.best.length > 0) {
    h += `<div class="riv-sessions-title">📅 Top soirées ensemble</div>`;
    r.together.best.forEach(sess => {
      const dateStr = new Date(sess.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
      const resStr  = sess.wdl === 'W' ? `<span style="color:#34A853;font-weight:700">✓</span>`
                    : sess.wdl === 'L' ? `<span style="color:#ea4335;font-weight:700">✗</span>`
                    : `<span style="color:var(--text3)">=</span>`;
      h += `<div class="riv-sess-row">
        <span class="riv-sess-date">${dateStr}</span>
        ${badge(sess.equipe)}
        <span class="riv-sess-ga">${pA}: <strong>${sess.gaA}G/A</strong> · ${pB}: <strong>${sess.gaB}G/A</strong></span>
        ${resStr}
      </div>`;
    });
  }

  // Confrontations marquantes — 3 cartes par ligne
  if (hasVersus && r.versus.best.length > 0) {
    h += `<div class="riv-sessions-title">⚔️ Confrontations marquantes</div>`;
    h += `<div class="riv-match-grid">`;
    r.versus.best.forEach(m => {
      const dateStr = new Date(m.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
      const gaStrA = `${m.gA}G · ${m.aA}A`;
      const gaStrB = `${m.gB}G · ${m.aB}A`;
      const hasGaA = m.gA + m.aA > 0;
      const hasGaB = m.gB + m.aB > 0;
      h += `<div class="riv-match-card">
        <div class="riv-match-date">${dateStr}</div>
        <div class="riv-match-score-row">
          ${badge(m.eqA)}
          <span class="riv-match-score">${m.scoreA} – ${m.scoreB}</span>
          ${badge(m.eqB)}
        </div>
        <div class="riv-match-players">
          <div class="riv-match-player">
            <div class="riv-match-player-name">${pA}</div>
            <div class="riv-match-player-ga${hasGaA?' active':''}">${gaStrA}</div>
          </div>
          <div class="riv-match-player">
            <div class="riv-match-player-name">${pB}</div>
            <div class="riv-match-player-ga${hasGaB?' active':''}">${gaStrB}</div>
          </div>
        </div>
      </div>`;
    });
    h += `</div>`;
  }

  return h;
}

  const top10Passeurs = buildTop10HTMLv2(allSt.passeursRank.map(([n,p])=>({name:n, value:p.passes})), v => `${v} assist${v>1?"s":""}`);

  h += `<div class="podium-section">
    <div class="kpi-card">
      <div class="kpi-lbl" style="margin-top:0;margin-bottom:10px">Top 10 Buteurs ⚽ (all-time)</div>

    </div>

  const gardienCard = buildGardienTop3HTML();

  h += `<div class="podium-section">

  h += isAdmin ? renderAchievementsMatrix() : _mhfKpiSectionHtml();

  container.innerHTML = h;
  animateView(container);

  /* ── Récompenses : dépliage du classement complet ── */
  container.querySelectorAll('[data-award-toggle]').forEach(btn => {

      const id = btn.dataset.awardToggle;
      const rows = container.querySelectorAll(`[data-award-id="${id}"]`);

      btn.textContent = willShow ? 'Réduire ‹' : `Voir le classement complet (${total}) ›`;

  });

  /* ── Rivalités — init et listeners ── */
  const _rivSelA = container.querySelector('#riv-a');
  const _rivSelB = container.querySelector('#riv-b');
  const _rivSelP = container.querySelector('#riv-period');
  if (_rivSelA && _rivSelB && _rivSelP) {
    if (_rivDefault2) _rivSelB.value = _rivDefault2;
    const _updateRiv = () => {
      document.getElementById('riv-body').innerHTML = renderRivBody(_rivSelA.value, _rivSelB.value, _rivSelP.value);
    };
    _updateRiv();
    _rivSelA.addEventListener('change', _updateRiv);
    _rivSelB.addEventListener('change', _updateRiv);
    _rivSelP.addEventListener('change', _updateRiv);
  }

  if (isAdmin) {
    const _mhfWrap = container.querySelector('#mhf-matrix-scroll');
    if (_mhfWrap) {
      _mhfWrap.addEventListener('click', e => {
        const achEl  = e.target.closest('.mhf-mh[data-ach]');
        const sortEl = e.target.closest('[data-sort]');
        if (achEl) { openMhfAchievementDrawer(achEl.dataset.ach); return; }
        if (sortEl) {
          const key = sortEl.dataset.sort;
          if (_mhfState.sortKey === key) _mhfState.sortDir *= -1; else { _mhfState.sortKey = key; _mhfState.sortDir = -1; }
          _mhfRerenderMatrix();
        }
      });
      const _mhfTip = document.getElementById('ach-tip');
      _mhfWrap.addEventListener('pointermove', e => {
        const cell = e.target.closest('[data-tip]');
        if (!cell) { _mhfTip.classList.remove('show'); return; }
        const [l0, ...lines] = (cell.dataset.tip || '').split('\n');
        _mhfTip.innerHTML = `<div class="atn">${l0}</div>${lines.map((l,i) => `<div class="${i===0?'atv':'atn2'}">${l}</div>`).join('')}`;

          const willShow = !more.classList.contains('show');
