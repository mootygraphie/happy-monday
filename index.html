let currentPeriod = "last";
let filterYear  = null; // stocke le début de saison (ex: 2024 pour 2024/2025)
let filterMonth = null;

/* Bornes de saisons avec dates précises (sy = année de début) */
const SEASON_DEFS = [
  { sy: 2026, start: '2026-08-24', end: '2027-07-19' },
  // Ajouter ici les prochaines saisons au fil du temps
];

function _seasonStart(date) {
  const d = new Date(date);
  const ds = d.toISOString().slice(0, 10);
  // Chercher dans les bornes explicites d'abord
  for (const s of SEASON_DEFS) {
    if (ds >= s.start && ds <= s.end) return s.sy;
  }
  // Fallback : règle du 15 août
  const m = d.getMonth();
  return (m > 7 || (m === 7 && d.getDate() >= 15)) ? d.getFullYear() : d.getFullYear() - 1;
}
function _seasonLabel(sy) { return `${sy}/${sy + 1}`; }

/* Saison affichée : si on est en off-season avant une saison définie, on affiche déjà cette saison */
function _currentSeason() {
  const today = new Date().toISOString().slice(0, 10);
  // Dans une saison définie ?
  for (const s of SEASON_DEFS) {
    if (today >= s.start && today <= s.end) return s.sy;
  }
  // Off-season avant une prochaine saison définie → afficher cette prochaine saison
  const next = [...SEASON_DEFS].sort((a, b) => a.start.localeCompare(b.start)).find(s => today < s.start);
  if (next) return next.sy;
  // Fallback
  return _seasonStart(today);
}

const MONTH_NAMES = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

function filterSessions(period) {
  if (!SESSIONS.length) return [];
  const sorted = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
  if (period === "last")  return [sorted[0]];
  if (period === "month") return SESSIONS.filter(s => {
    const d = new Date(s.date);
    return d.getMonth() === filterMonth && _seasonStart(d) === filterYear;
  });
  if (period === "year")  return SESSIONS.filter(s => _seasonStart(s.date) === filterYear);
  return SESSIONS;
}

function updateSubFilter(period) {
  const sub   = document.getElementById("period-sub");
  const selM  = document.getElementById("filter-month");
  const selY  = document.getElementById("filter-year");

  if (period !== "month" && period !== "year") {
    sub.style.visibility = "hidden";
    return;
  }
  sub.style.visibility = "visible";

  /* Saisons disponibles (triées desc) */
  const seasons = [...new Set(SESSIONS.map(s => _seasonStart(s.date)))].sort((a,b)=>b-a);

  /* Mois disponibles pour la saison sélectionnée (mode mois) */
  function monthsForSeason(sy) {
    return [...new Set(
      SESSIONS
        .filter(s => _seasonStart(s.date) === sy)
        .map(s => new Date(s.date).getMonth())
    )].sort((a,b)=>b-a);
  }

  if (period === "year") {
    selM.hidden = true;
    selY.hidden = false;
    selY.innerHTML = seasons.map(sy => `<option value="${sy}" ${sy===filterYear?"selected":""}>${_seasonLabel(sy)}</option>`).join("");
    if (filterYear === null && seasons.length) filterYear = seasons[0];
    selY.value = filterYear;

  } else {
    selM.hidden = false;
    selY.hidden = false;

    /* Populate seasons */
    selY.innerHTML = seasons.map(sy => `<option value="${sy}" ${sy===filterYear?"selected":""}>${_seasonLabel(sy)}</option>`).join("");
    if (filterYear === null && seasons.length) filterYear = seasons[0];
    selY.value = filterYear;

    /* Populate months for selected season */
    const months = monthsForSeason(Number(selY.value));
    selM.innerHTML = months.map(m => `<option value="${m}" ${m===filterMonth?"selected":""}>${MONTH_NAMES[m]}</option>`).join("");
    if (filterMonth === null || !months.includes(filterMonth)) filterMonth = months[0] ?? null;
    selM.value = filterMonth;
  }
}

function computeStats(sessions) {
  const allMatchs = sessions.flatMap(s => (s.matchs||[]).map(m => ({...m, date:s.date})));
  const ps = {};
  ALL_PLAYERS.forEach(p => { ps[p] = {presences:0,absences:0,blesses:0,pasRepondu:0,buts:0,passes:0,vR:0,vV:0,vB:0}; });

  sessions.forEach(s => {
    Object.entries(s.presences).forEach(([p, info]) => {
      if (!ps[p]) ps[p] = {presences:0,absences:0,blesses:0,pasRepondu:0,buts:0,passes:0,vR:0,vV:0,vB:0};
      if      (info.statut==="Présent")     ps[p].presences++;
      else if (info.statut==="Absent")      ps[p].absences++;
      else if (info.statut==="Blessé")      ps[p].blesses++;
      else if (info.statut==="Pas répondu") ps[p].pasRepondu++;
    });
    (s.matchs||[]).forEach(m => {
      ["A","B"].forEach(side => {
        const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
        buts.forEach((b,i) => {
          if (!b || b==="CSC") return;
          if (ps[b]) ps[b].buts++;
          const p = passes[i]; if (p && p!=="CSC" && ps[p]) ps[p].passes++;
        });
      });
      const winner = m.scoreA > m.scoreB ? m.eqA : m.scoreB > m.scoreA ? m.eqB : null;
      if (winner) {
        Object.entries(s.presences).forEach(([p, info]) => {
          if (info.statut==="Présent" && info.equipe===winner && ps[p]) {
            if (winner==="Rouge") ps[p].vR++; else if (winner==="Vert") ps[p].vV++; else ps[p].vB++;
          }
        });
      }
    });
  });

  Object.values(ps).forEach(p => {
    p.totalVic = p.vR + p.vV + p.vB;
    const best = Math.max(p.vR, p.vV, p.vB);
    p.bestColor = best===0 ? null : p.vR===best ? "Rouge" : p.vV===best ? "Vert" : "Bleue";
  });

  /* Episode detection: séquences consécutives de "Blessé" = 1 épisode */
  const sessionsByDate = [...sessions].sort((a,b) => new Date(a.date)-new Date(b.date));
  const inEpisode = {};
  Object.keys(ps).forEach(p => { ps[p].episodesBlessures = 0; ps[p].matchsBlessures = 0; inEpisode[p] = false; });
  sessionsByDate.forEach(s => {
    Object.keys(ps).forEach(p => {
      const info = s.presences[p];
      if (!info) { inEpisode[p] = false; return; }
      if (info.statut === "Blessé") {
        ps[p].matchsBlessures++;
        if (!inEpisode[p]) { ps[p].episodesBlessures++; inEpisode[p] = true; }
      } else {
        inEpisode[p] = false;
      }
    });
  });

  const mostGoals   = allMatchs.reduce((b,m) => { const t=m.scoreA+m.scoreB; return (!b||t>b.total)?{...m,total:t}:b; }, null);
  const biggestAmp  = allMatchs.reduce((b,m) => { const a=Math.abs(m.scoreA-m.scoreB); return (!b||a>b.amp)?{...m,amp:a}:b; }, null);
  const bestAttack  = allMatchs.reduce((b,m) => { const mx=Math.max(m.scoreA,m.scoreB); return (!b||mx>b.mx)?{...m,mx,topTeam:m.scoreA>=m.scoreB?m.eqA:m.eqB}:b; }, null);
  const topButeur   = Object.entries(ps).filter(([,p])=>p.buts>0).sort((a,b)=>b[1].buts-a[1].buts)[0]||null;
  const colorWins   = {Rouge:0,Vert:0,Bleue:0};
  allMatchs.forEach(m => { if(m.scoreA>m.scoreB) colorWins[m.eqA]++; else if(m.scoreB>m.scoreA) colorWins[m.eqB]++; });
  const bestColor   = Object.entries(colorWins).sort((a,b)=>b[1]-a[1])[0]||null;

  const goalsPerTeam = {Rouge:0, Vert:0, Bleue:0};
  allMatchs.forEach(m => { goalsPerTeam[m.eqA] = (goalsPerTeam[m.eqA]||0) + m.scoreA; goalsPerTeam[m.eqB] = (goalsPerTeam[m.eqB]||0) + m.scoreB; });

  const byAlpha = (a,b) => a[0].localeCompare(b[0], "fr");
  const top3Pres    = Object.entries(ps).filter(([n,p])=>p.presences>0&&!JOKERS.has(n)).sort((a,b)=>b[1].presences-a[1].presences||byAlpha(a,b)).slice(0,3);
  const top3Abs     = Object.entries(ps).filter(([n,p])=>p.absences>0&&!JOKERS.has(n))
    .sort((a,b)=>b[1].absences-a[1].absences||byAlpha(a,b)).slice(0,3);
  const top3Bles    = Object.entries(ps).filter(([,p])=>p.episodesBlessures>0)
    .sort((a,b)=>b[1].episodesBlessures-a[1].episodesBlessures||b[1].matchsBlessures-a[1].matchsBlessures||byAlpha(a,b)).slice(0,3);
  const buteursRank  = Object.entries(ps).filter(([,p])=>p.buts>0).sort((a,b)=>b[1].buts-a[1].buts||byAlpha(a,b));
  const passeursRank = Object.entries(ps).filter(([,p])=>p.passes>0).sort((a,b)=>b[1].passes-a[1].passes||byAlpha(a,b));

  return {ps, mostGoals, biggestAmp, bestAttack, topButeur, bestColor, colorWins, goalsPerTeam, top3Pres, top3Abs, top3Bles, buteursRank, passeursRank, allMatchs};
}

/* ══════════════════════════════════════════════════════════
   VUE PARTAGÉE : DÉTAIL D'UNE SESSION
   Utilisée dans Dashboard "Dernière session" ET onglet Sessions
══════════════════════════════════════════════════════════ */
function computeLinkUpStats(sessions) {
  const duoMap = {};
  sessions.forEach(session => {
    (session.matchs || []).forEach(m => {
      const processSide = (buteurs, passeurs) => {
        (buteurs || []).forEach((buteur, j) => {
          const passeur = passeurs && passeurs[j] ? passeurs[j] : null;
          if (!buteur || buteur === "CSC" || !passeur || passeur === "CSC") return;
          const [a, b] = [buteur, passeur].sort();
          const key = `${a}|||${b}`;
          if (!duoMap[key]) duoMap[key] = {p1: a, p2: b, connexions: 0, p1Goals: 0, p2Goals: 0};
          duoMap[key].connexions++;
          if (buteur === a) duoMap[key].p1Goals++; else duoMap[key].p2Goals++;
        });
      };
      processSide(m.buteursA, m.passeursA);
      processSide(m.buteursB, m.passeursB);
    });
  });
  return Object.values(duoMap).filter(d => d.connexions > 0).sort((a,b) => b.connexions - a.connexions);
}

function computeTopDefendersStats(sessions, minMatches) {
  const defMap = {};
  sessions.forEach(session => {
    const presences = session.presences || {};
    (session.matchs || []).forEach(m => {
      Object.entries(presences).forEach(([player, info]) => {
        if (info.statut !== "Présent" || !info.equipe) return;
        let gc = null;
        if (m.eqA === info.equipe) gc = m.scoreB;
        else if (m.eqB === info.equipe) gc = m.scoreA;
        if (gc === null) return;
        if (!defMap[player]) defMap[player] = {goalsAgainst:0, matchCount:0};
        defMap[player].goalsAgainst += gc;
        defMap[player].matchCount++;
      });
    });
  });
  const min = minMatches || 1;
  return Object.entries(defMap)
    .filter(([,d]) => d.matchCount >= min)
    .map(([name,d]) => ({name, ...d, avg: d.goalsAgainst/d.matchCount}))
    .sort((a,b) => a.avg - b.avg || b.matchCount - a.matchCount);
}

// Regroupe les entrées ex-æquo dans les 3 premiers slots (podium), reste = liste ordonnée
function buildTop10Slots(items, sameValue) {
  const slots = []; let rem = [...items];
  while (rem.length && slots.length < 3) {
    const top = rem[0].value;
    const tied = rem.filter(it => sameValue(it.value, top));
    slots.push({ rank: slots.length, players: tied.map(it => it.name), value: top });
    rem = rem.filter(it => !sameValue(it.value, top));
  }
  return { slots, rest: rem };
}

// items : [{name, value}], déjà triés du meilleur au moins bon
function buildTop10HTML(items, valueFmt, sameValue) {
  if (!items.length) return `<span class="no-data">—</span>`;
  const cmp = sameValue || ((a,b) => a === b);
  const { slots, rest } = buildTop10Slots(items, cmp);
  const podiumHtml = buildPodiumVizSlots(slots, s => valueFmt(s.value), s => s.players.map(n => pLink(n)).join(", "));
  const shownCount = slots.reduce((sum,s) => sum + s.players.length, 0);
  const restRows = rest.slice(0, Math.max(0, 10 - shownCount));
  const listHtml = restRows.length ? `<div class="top10-list">${restRows.map((it, i) => `
    <div class="top10-row"><span class="top10-rank">${shownCount + i + 1}</span><span class="top10-name">${pLink(it.name)}</span><span class="top10-val">${valueFmt(it.value)}</span></div>
  `).join('')}</div>` : '';
  return podiumHtml + listHtml;
}

// Top 3 gardien : taux de clean sheets (%), minimum 3 matchs gardés
function buildGardienTop3HTML() {
  const ranked = ALL_PLAYERS.map(p => {

  }).filter(r => r.matchs >= 3).sort((a,b) => b.rate - a.rate || b.matchs - a.matchs || a.name.localeCompare(b.name,'fr'));
  if (!ranked.length) return `<div class="kpi-card" data-card="top-gardien">
    <div class="kpi-lbl" style="margin-top:0;margin-bottom:10px">Top 3 Gardien 🧤 (% clean sheets)</div>

  </div>`;
  const slots = []; let rem = [...ranked];

    rem = rem.filter(r => r.rate !== top);
  }
  const body = buildPodiumVizSlotsV2(slots, s => `${ranked.find(r=>r.name===s.players[0]).rate}%`, s => s.players.map(n => pLink(n)).join(", "), true);
  return `<div class="kpi-card" data-card="top-gardien">
    <div class="kpi-lbl" style="margin-top:0;margin-bottom:10px">Top 3 Gardien 🧤 (% clean sheets)</div>
    ${body}
    <div style="font-size:11px;color:var(--text3);margin-top:10px;text-align:center">Minimum 3 matchs gardés</div>
  </div>`;
}

function computeGardiensRanking(sessions) {
  const stats = {};
  sessions.forEach(s => {
    (s.matchs || []).forEach(m => {
      if (m.mt1A === undefined || m.mt1B === undefined) return;
      const gA = m.gardiensA || [], gB = m.gardiensB || [];
      const mt1Ac = m.mt1B || 0, mt2Ac = Math.max(0, (m.scoreB||0) - (m.mt1B||0));
      const mt1Bc = m.mt1A || 0, mt2Bc = Math.max(0, (m.scoreA||0) - (m.mt1A||0));
      const matchMap = {};
      [[gA[0],mt1Ac],[gA[1],mt2Ac],[gB[0],mt1Bc],[gB[1],mt2Bc]].forEach(([p,c]) => {
        if (!p || !p.trim()) return;
        matchMap[p] = (matchMap[p] || 0) + c;
      });
      Object.entries(matchMap).forEach(([p, c]) => {
        if (!stats[p]) stats[p] = { matchs: 0, buts: 0 };
        stats[p].matchs++;
        stats[p].buts += c;
      });
    });
  });
  return Object.entries(stats)
    .filter(([,s]) => s.matchs > 0)
    .map(([name, s]) => ({ name, matchs: s.matchs, buts: s.buts, rate: s.buts / s.matchs }));
}

function fmtGoalsList(buteurs, passeurs) {
  if (!buteurs || !buteurs.length) return "";
  return buteurs.map((p, j) => {
    const passeur = passeurs && passeurs[j] ? passeurs[j] : null;
    const bHtml = p === "CSC" ? `<em>CSC</em>` : `<button class="player-link" data-player="${p}" style="font-size:inherit">${p}</button>`;
    const pHtml = passeur ? ` <span style="color:var(--text3);font-size:10px;white-space:nowrap">(<button class="player-link" data-player="${passeur}" style="font-size:inherit;color:inherit">${passeur}</button>)</span>` : "";
    return `<span class="mc-goal-line" style="white-space:nowrap">${bHtml}${pHtml}</span>`;
  }).join(` <span style="color:var(--text3)">•</span> `);
}

function _recapSideSummary(m, side) {
  const eq = side === "A" ? m.eqA : m.eqB;
  const buteurs = (side === "A" ? m.buteursA : m.buteursB) || [];
  const passeurs = (side === "A" ? m.passeursA : m.passeursB) || [];
  if (!buteurs.length) return "";
  const goals = buteurs.map((b, j) => {
    const passeur = passeurs[j];
    const bHtml = b === "CSC" ? `<em>CSC</em>` : `<span style="color:var(--text2)">${b}</span>`;
    const pHtml = passeur ? ` <span style="color:var(--text3)">(${passeur})</span>` : "";
    return bHtml + pHtml;
  }).join(", ");
  return `${dot(eq)} : ⚽️ ${goals}`;
}

function buildMatchRecapRowHTML(m, idx) {
  const sideA = _recapSideSummary(m, "A"), sideB = _recapSideSummary(m, "B");
  const summary = [sideA, sideB].filter(Boolean).join(` <span style="color:var(--border2)">|</span> `);
  return `<div class="match-recap-row">

}

function buildAggTop3(ranked, unitS, unitP) {
  const slots = []; let rem = [...ranked];
  while (rem.length > 0 && slots.length < 3) {
    const topN = rem[0][1];
    slots.push({ rank: slots.length, players: rem.filter(([,n])=>n===topN).map(([n])=>n), count: topN });
    rem = rem.filter(([,n]) => n < topN);
  }
  if (slots.length === 0) return `<span class="no-data">—</span>`;
  return buildPodiumVizSlots(
    slots,
    s => `${s.count} ${s.count > 1 ? unitP : unitS}`,
    s => s.players.map(n => pLink(n)).join(", ")
  );
}

function buildPresencePodium(entries) {
  if (!entries || !entries.length) return `<span class="no-data">—</span>`;
  const slots = entries.map(([name, stats], i) => ({ rank: i, players: [name], count: stats.presences }));
  return buildPodiumVizSlots(
    slots,
    s => `${s.count} sess.`,
    s => s.players.map(n => pLink(n)).join(", ")
  );
}

function computeBestAllTimeStreak() {
  let best = null;
  ALL_PLAYERS.filter(p => !JOKERS.has(p)).forEach(player => {
    const st = computePlayerDetailStats(player);
    const cs = st.currentStreak;
    const hs = st.bestHistoricalStreak;
    let candidate = null;
    if (cs && hs) {
      if (cs.count > hs.count || (cs.count === hs.count && (cs.g + cs.a) >= (hs.g + hs.a))) {
        candidate = { player, ...cs, isActive: true };
      } else {
        candidate = { player, ...hs, isActive: false };
      }
    } else if (cs) {
      candidate = { player, ...cs, isActive: true };
    } else if (hs) {
      candidate = { player, ...hs, isActive: false };
    }
    if (!candidate) return;
    if (!best || candidate.count > best.count ||
        (candidate.count === best.count && (candidate.g + candidate.a) > (best.g + best.a))) {
      best = candidate;
    }
  });
  return best;
}

function computeBestTeamAllTime() {
  let best = null;
  SESSIONS.forEach(session => {
    const matchs = session.matchs || [];
    if (!matchs.length) return;
    ["Rouge", "Vert", "Bleue"].forEach(team => {
      const tmMatchs = matchs.filter(m => m.eqA === team || m.eqB === team);
      if (!tmMatchs.length) return;
      let wins = 0, goalsFor = 0, goalsAgainst = 0;
      const scorers = {}, assisters = {};
      tmMatchs.forEach(m => {
        const isA = m.eqA === team;
        const gf = isA ? m.scoreA : m.scoreB;
        const ga = isA ? m.scoreB : m.scoreA;
        goalsFor += gf; goalsAgainst += ga;
        if (gf > ga) wins++;
        (isA ? (m.buteursA||[])  : (m.buteursB||[])).forEach(p  => { if (p && p !== "CSC") scorers[p]   = (scorers[p]   || 0) + 1; });
        (isA ? (m.passeursA||[]) : (m.passeursB||[])).forEach(p => { if (p)                assisters[p] = (assisters[p] || 0) + 1; });
      });
      const goalDiff = goalsFor - goalsAgainst;
      const players = Object.entries(session.presences)
        .filter(([, info]) => info.statut === "Présent" && info.equipe === team)
        .map(([name]) => name).sort((a, b) => a.localeCompare(b, "fr"));
      const topSc = Object.entries(scorers).sort((a,b)=>b[1]-a[1])[0];
      const topAs = Object.entries(assisters).sort((a,b)=>b[1]-a[1])[0];
      const c = { session, team, wins, goalsFor, goalsAgainst, goalDiff, players,
        topScorer:   topSc ? { name: topSc[0], count: topSc[1] } : null,
        topAssister: topAs ? { name: topAs[0], count: topAs[1] } : null };
      if (!best || wins > best.wins || (wins === best.wins && goalDiff > best.goalDiff)) best = c;
    });
  });
  return best;
}

  achs.forEach(a => {
    let unlocked = 0;
    players.forEach(p => { if (levels[p][a.id].raw > 0) unlocked++; });
    completion[a.id] = { unlocked, rate: players.length ? unlocked/players.length : 0 };
  });
  const summary = {};
  players.forEach(p => {
    let niveaux = 0, hautsFaits = 0;
    achs.forEach(a => { const raw = levels[p][a.id].raw; niveaux += raw; if (raw>0) hautsFaits++; });
    summary[p] = { niveaux, hautsFaits };
  });
  return { players, achs, statsByPlayer, levels, completion, summary };
}

function _mhfVisibleAch() {
  return _mhf.achs.filter(a => _mhfState.activeCats.has(a.cat) && (_mhfState.showHidden || !a.hidden));
}
function _mhfVisiblePlayers() {
  const q = _mhfState.search.trim().toLowerCase();
  const list = q ? _mhf.players.filter(p => p.toLowerCase().includes(q)) : _mhf.players.slice();
  list.sort((a,b) => {
    if (_mhfState.sortKey === 'name') return _mhfState.sortDir * a.localeCompare(b,'fr');
    const va = _mhfState.sortKey === 'hautsFaits' ? _mhf.summary[a].hautsFaits : _mhf.summary[a].niveaux;
    const vb = _mhfState.sortKey === 'hautsFaits' ? _mhf.summary[b].hautsFaits : _mhf.summary[b].niveaux;
    if (va === vb) return a.localeCompare(b,'fr');
    return _mhfState.sortDir * (va - vb);
  });
  return list;
}

function _mhfRenderRarityHtml() {
  const rows = [..._mhf.achs].sort((a,b) => _mhf.completion[a.id].rate - _mhf.completion[b.id].rate);
  return rows.map(a => {
    const c = _mhf.completion[a.id];
    const pct = Math.round(c.rate*100);
    const color = pct<=15 ? 'var(--bad)' : pct<=45 ? 'var(--gold)' : 'var(--good)';
    return `<div class="mhf-rarity-row${_mhfState.selectedAch===a.id?' selected':''}" data-acid="${a.id}">
      <span class="mhf-rarity-ic">${a.icon}</span>
      <span class="mhf-rarity-name"><span class="n">${a.name}</span>${a.hidden?'<span class="mhf-rarity-secret">SECRET</span>':''}</span>
      <span class="mhf-rarity-track"><span class="mhf-rarity-fill" style="width:${pct}%;background:${color}"></span></span>
      <span class="mhf-rarity-stat"><b>${c.unlocked}</b>/${_mhf.players.length} &middot; ${pct}%</span>
    </div>`;
  }).join('');
}

function _mhfRenderChipsHtml() {
  let h = `<button class="pill${_mhfState.activeCats.size===MHF_CATS.length?' active':''}" data-cat="__all">Tous</button>`;
  h += MHF_CATS.map(c => `<button class="pill${_mhfState.activeCats.has(c)&&_mhfState.activeCats.size<MHF_CATS.length?' active':''}" data-cat="${c}">${c}</button>`).join('');
  return h;
}

function renderMhfMatrixHtml() {
  const achs = _mhfVisibleAch();
  const players = _mhfVisiblePlayers();
  if (!achs.length) return `<div class="mhf-matrix" id="mhf-matrix"><div class="mhf-mcell" style="padding:16px;color:var(--text3)">Aucun haut fait visible avec ces filtres.</div></div>`;
  if (!players.length) return `<div class="mhf-matrix" id="mhf-matrix"><div class="mhf-mcell" style="padding:16px;color:var(--text3)">Aucun joueur ne correspond à la recherche.</div></div>`;

  const firstOfCat = {};
  achs.forEach(a => { if (!(a.cat in firstOfCat)) firstOfCat[a.cat] = a.id; });

  let h = `<div class="mhf-matrix" id="mhf-matrix" style="grid-template-columns:176px 60px 60px repeat(${achs.length},34px)">`;
  h += `<div class="mhf-mcell mhf-mh-corner mhf-mh-txt${_mhfState.sortKey==='name'?' sorted':''}" data-sort="name" title="Trier par nom" style="justify-content:flex-start;padding-left:10px">Joueur</div>`;
  h += `<div class="mhf-mcell mhf-msum mhf-mh-txt${_mhfState.sortKey==='hautsFaits'?' sorted':''}" data-sort="hautsFaits" title="Trier par nombre de hauts faits débloqués">HF</div>`;
  h += `<div class="mhf-mcell mhf-msum mhf-mh-txt${_mhfState.sortKey==='niveaux'?' sorted':''}" data-sort="niveaux" title="Trier par total de niveaux cumulés">NIV</div>`;
  achs.forEach(a => {
    const grp = firstOfCat[a.cat]===a.id ? ' grp-start' : '';
    const c = _mhf.completion[a.id];
    const tip = `${a.icon} ${a.name}\n${c.unlocked}/${_mhf.players.length} joueurs &middot; ${Math.round(c.rate*100)}%\n${ACH_ABOUT[a.id]||''}`.replace(/"/g,'&quot;');
    h += `<div class="mhf-mcell mhf-mh${grp}" data-ach="${a.id}" data-tip="${tip}">
      <span class="ic">${a.icon}</span>${a.hidden?'<span class="lock">&#9679;</span>':''}
    </div>`;
  });

  const _mhfInitials = computeAllInitials([...new Set([...ALL_PLAYERS, ...players])]);
  players.forEach((p,i) => {
    const rowCls = i%2===0 ? 'mhf-mrow-odd' : 'mhf-mrow-even';
    const rank = i+1;
    const rankCls = _mhfState.sortKey!=='name' && rank<=3 ? (rank===1?'gold':rank===2?'silver':'bronze') : '';
    const jokerTag = JOKERS.has(p) ? ' <span style="color:var(--text3);font-size:10px">[+1]</span>' : '';
    h += `<div class="mhf-mcell mhf-mname player-link ${rowCls}" data-player="${p}">
      <span class="mhf-mrank ${rankCls}">${rank}</span>
      <span class="mhf-mavatar">${_mhfInitials[p] || p.slice(0,2).toUpperCase()}</span>
      <span class="mhf-mname-txt">${p}${jokerTag}</span>
    </div>`;
    h += `<div class="mhf-mcell mhf-msum ${rowCls}${_mhfState.sortKey==='hautsFaits'?' sorted':''}">${_mhf.summary[p].hautsFaits}</div>`;
    h += `<div class="mhf-mcell mhf-msum ${rowCls}${_mhfState.sortKey==='niveaux'?' sorted':''}">${_mhf.summary[p].niveaux}</div>`;
    achs.forEach(a => {
      const grp = firstOfCat[a.cat]===a.id ? ' grp-start' : '';
      const L = _mhf.levels[p][a.id];
      const dl = L.raw>0 ? _mhfDisplayLevel(a,L.raw) : 0;
      const anim = dl===6 ? ' mhf-t6-anim' : '';
      let line1, line2 = '';
      if (L.raw>0) {
        line1 = `${_mhfTierName(a,L.raw)} &middot; ${a.desc(L.val)}`;
        if (!a.fixedTier && L.raw < a.tiers.length) line2 = `Prochain seuil : ${a.tiers[L.raw]}`;
      } else {
        line1 = `Non débloqué &middot; ${a.desc(L.val)}`;
        line2 = `Seuil requis : ${a.tiers[0]}`;
      }
      const tip = `${a.icon} ${a.name} — ${p}\n${line1}\n${line2}`.replace(/"/g,'&quot;');
      h += `<div class="mhf-mcell mval ${rowCls}${grp}" data-tip="${tip}">
        <div class="mhf-tier-box${dl>0?' filled':''}${anim}" style="${_mhfCellStyleAttr(dl)}"></div>
      </div>`;
    });
  });

  h += `</div>`;
  return h;
}

    const avgRate = totalCells ? filledCells/totalCells : 0;
    const sortedByRate = [..._mhf.achs].sort((a,b) => _mhf.completion[a.id].rate - _mhf.completion[b.id].rate);
    const rarest = sortedByRate[0], common = sortedByRate[sortedByRate.length-1];
    const topCollector = [..._mhf.players].sort((a,b) => _mhf.summary[b].niveaux - _mhf.summary[a].niveaux)[0];
    const cards = [
      { ico:'📊', lbl:'Complétion roster', num: Math.round(avgRate*100)+'%',
        sub:`${filledCells} / ${totalCells} cases débloquées` },
      { ico: rarest.icon, lbl:'Haut fait le plus rare', num: rarest.name,
        sub:`${_mhf.completion[rarest.id].unlocked}/${_mhf.players.length} joueurs (${Math.round(_mhf.completion[rarest.id].rate*100)}%)` },
      { ico: common.icon, lbl:'Haut fait le plus commun', num: common.name,
        sub:`${_mhf.completion[common.id].unlocked}/${_mhf.players.length} joueurs (${Math.round(_mhf.completion[common.id].rate*100)}%)` },
      { ico:'👑', lbl:'Meilleur collectionneur', num: topCollector,

    kpiHtml = `<div class="kpi-grid mhf-kpi-grid">` + cards.map(c => `
      <div class="kpi-card mhf-kpi-card">
        <div class="mhf-kpi-head"><span class="mhf-kpi-ico">${c.ico}</span><span class="kpi-lbl" style="margin-top:0">${c.lbl}</span></div>
        <div class="kpi-num mhf-kpi-num">${c.num}</div>
        <div class="kpi-sub">${c.sub}</div>
      </div>`).join('') + `</div>`;
  }

  let legendHtml = `<span class="lbl">Niveaux</span>`;
  for (let i=1;i<=6;i++) legendHtml += `<span class="mhf-tier-pill${i===6?' mhf-t6-anim':''}" style="${_mhfTierStyleAttr(i)}"><span class="dot"></span>${ACH_TIER_NAMES[i]}</span>`;

  let h = `<div class="section-label" style="margin-top:2rem">Hauts faits — Matrice</div>`;
  h += kpiHtml;
  h += `<div class="section-label" style="margin-top:2.4rem">Rareté des hauts faits (${_mhf.achs.length})</div>`;
  h += `<div class="mhf-rarity-list" id="mhf-rarity-list">${_mhfRenderRarityHtml()}</div>`;
  h += `<div class="section-label" style="margin-top:2.4rem">Roster &times; Hauts faits</div>`;
  h += `<div class="mhf-tier-legend" id="mhf-tier-legend">${legendHtml}</div>`;
  h += `<div class="mhf-toolbar">
    <div class="mhf-search"><span class="ic">&#128269;</span><input type="text" id="mhf-search-input" placeholder="Chercher un joueur…" value="${_mhfState.search}"></div>
    <div class="mhf-chip-row" id="mhf-cat-chips">${_mhfRenderChipsHtml()}</div>
    <label class="mhf-toggle-hidden${_mhfState.showHidden?' on':''}" id="mhf-hidden-toggle">
      <span class="mhf-toggle-track"><span class="mhf-toggle-dot"></span></span>
      Hauts faits secrets
    </label>

  h += `<div class="mhf-matrix-scroll" id="mhf-matrix-scroll">${renderMhfMatrixHtml()}</div>`;
  return h;

  const locked = _mhf.players.filter(p => _mhf.levels[p][acid].raw === 0)
    .sort((x,y) => _mhf.levels[y][acid].val - _mhf.levels[x][acid].val || x.localeCompare(y,'fr'));

  let ladder = '';

  } else {

  const rateColor = c.rate<=0.15 ? 'var(--bad)' : c.rate<=0.45 ? 'var(--gold)' : 'var(--good)';

  let body = `<div class="mhf-dr-about">${ACH_ABOUT[a.id] || ''}</div>`;
  body += `<div class="mhf-dr-ladder">${ladder}</div>`;
  body += `<div class="mhf-dr-completion">
    <div class="top"><span>Complétion roster</span><b>${c.unlocked}/${_mhf.players.length}</b></div>
    <div class="mhf-dr-bar-track"><div class="mhf-dr-bar-fill" style="width:${Math.round(c.rate*100)}%;background:${rateColor}"></div></div>
  </div>`;
  body += `<div class="mhf-dr-list">`;
  unlocked.forEach((p,i) => {
    const L = _mhf.levels[p][acid];
    const dl = _mhfDisplayLevel(a, L.raw);
    const tn = (a.tierNames && a.tierNames[L.raw-1]) || ACH_TIER_NAMES[dl];
    const rank = i+1;
    const rc = rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';
    body += `<div class="mhf-dr-row">
      <span class="mhf-dr-rank ${rc}">${rank}</span>
      <button class="mhf-dr-pname player-link" data-player="${p}">${p}</button>
      <span class="mhf-dr-badge" style="${_mhfTierStyleAttr(dl)}">${tn}</span>
      <span class="mhf-dr-val">${a.desc(L.val)}</span>
    </div>`;
  });
  body += `</div>`;
  if (locked.length) {
    body += `<details class="mhf-dr-locked"><summary>${locked.length} joueur${locked.length>1?'s':''} non débloqué${locked.length>1?'s':''}</summary>`;
    locked.forEach(p => {
      const L = _mhf.levels[p][acid];
      body += `<div class="mhf-dr-locked-row">
        <button class="mhf-dr-pname player-link" data-player="${p}">${p}</button>
        <span class="mhf-dr-progress-hint">${L.val} / ${a.tiers[0]}</span>

  document.getElementById('mhf-dr-icon').setAttribute('style', `font-size:24px;width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;${_mhfTierStyleAttr(a.hidden?1:3)}`);

  document.getElementById('mhf-dr-title').innerHTML = `${a.name}${a.hidden?' <span class="mhf-rarity-secret" style="vertical-align:middle">SECRET</span>':''}`;
  document.getElementById('mhf-dr-cat').textContent = a.cat;
  document.getElementById('mhf-dr-body').innerHTML = body;
  document.getElementById('mhf-drawer').classList.add('open');
  document.getElementById('mhf-drawer-overlay').classList.add('open');

  _mhfState.selectedAch = acid;
  const rl = document.getElementById('mhf-rarity-list');
  if (rl) rl.innerHTML = _mhfRenderRarityHtml();
}

/* ══════════════════════════════════════════════════════════
   RIVALITÉS
══════════════════════════════════════════════════════════ */

function computeRivalites(pA, pB, period) {
  let sessions = [...SESSIONS];
  const now = new Date();
  if (period === "year") {
    sessions = sessions.filter(s => _seasonStart(s.date) === _currentSeason());
  } else if (period === "month") {
    sessions = sessions.filter(s => {
      const d = new Date(s.date);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
  }

  // Garder seulement les sessions où pA ET pB sont présents
  sessions = sessions.filter(s => {
    const pa = s.presences[pA], pb = s.presences[pB];
    return pa && pa.statut === "Présent" && pb && pb.statut === "Présent";
  });

  const result = {
    total: sessions.length,
    matchs: sessions.reduce((acc, s) => acc + (s.matchs||[]).length, 0),
    matchsDirect: 0,
    together: { sessions: 0, wA: 0, dA: 0, lA: 0, gaA: 0, gaB: 0, gA: 0, aA: 0, gB: 0, aB: 0, best: [] },
    versus:   { sessions: 0, wA: 0, dA: 0, lA: 0, wB: 0, dB: 0, lB: 0, gaA: 0, gaB: 0, gA: 0, aA: 0, gB: 0, aB: 0, best: [] },
  };

  const togetherRaw = [];
  const versusRaw   = [];

  sessions.forEach(s => {
    const eqA = s.presences[pA].equipe;
    const eqB = s.presences[pB].equipe;
    const sameEq = eqA && eqB && eqA === eqB;
    const oppEq  = eqA && eqB && eqA !== eqB;

    // G/A individuels dans la session (tous matchs)
    let gA=0, aA=0, gB=0, aB=0;
    (s.matchs||[]).forEach(m => {
      ["A","B"].forEach(side => {
        const buts   = m[`buteurs${side}`]  || [];
        const passes = m[`passeurs${side}`] || [];
        buts.forEach((b,i) => {
          if (!b || b==="CSC") return;
          const p = passes[i];
          if (b === pA) gA++;
          if (p && p!=="CSC" && p === pA) aA++;
          if (b === pB) gB++;
          if (p && p!=="CSC" && p === pB) aB++;
        });
      });
    });

    if (sameEq) {
      result.together.sessions++;
      result.together.gaA += gA + aA; result.together.gA += gA; result.together.aA += aA;
      result.together.gaB += gB + aB; result.together.gB += gB; result.together.aB += aB;

      // W/D/L communs — par match de leur équipe
      let wMatch=0, dMatch=0, lMatch=0;
      (s.matchs||[]).filter(m => m.eqA===eqA||m.eqB===eqA).forEach(m => {
        const w = m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;
        if (w===eqA) { result.together.wA++; wMatch++; }
        else if (w===null) { result.together.dA++; dMatch++; }
        else { result.together.lA++; lMatch++; }
      });

      const wdl = wMatch > lMatch ? 'W' : lMatch > wMatch ? 'L' : 'D';
      togetherRaw.push({ date: s.date, equipe: eqA, gaA: gA+aA, gaB: gB+aB, wdl });
    }

    if (oppEq) {
      result.versus.sessions++;
      result.versus.gaA += gA + aA; result.versus.gA += gA; result.versus.aA += aA;
      result.versus.gaB += gB + aB; result.versus.gB += gB; result.versus.aB += aB;

      // W/D/L uniquement sur les matchs directs eqA vs eqB
      (s.matchs||[]).filter(m => (m.eqA===eqA&&m.eqB===eqB)||(m.eqA===eqB&&m.eqB===eqA)).forEach(m => {
        const w = m.scoreA>m.scoreB?m.eqA:m.scoreB>m.scoreA?m.eqB:null;
        if (w===eqA)      { result.versus.wA++; result.versus.lB++; }
        else if (w===eqB) { result.versus.wB++; result.versus.lA++; }
        else              { result.versus.dA++; result.versus.dB++; }
      });

      // Confrontations marquantes : un entry PAR MATCH direct eqA vs eqB
      (s.matchs||[]).forEach(m => {
        let scA, scB, swapped = false;
        if (m.eqA===eqA && m.eqB===eqB)      { scA=m.scoreA; scB=m.scoreB; }
        else if (m.eqA===eqB && m.eqB===eqA) { scA=m.scoreB; scB=m.scoreA; swapped=true; }
        else return;

        // G/A de pA et pB dans CE match uniquement
        let mgA=0, maA=0, mgB=0, maB=0;
        ["A","B"].forEach(side => {
          (m[`buteurs${side}`]||[]).forEach((b,i) => {
            if (!b||b==="CSC") return;
            const p=(m[`passeurs${side}`]||[])[i];
            if (b===pA) mgA++; if (p&&p!=="CSC"&&p===pA) maA++;
            if (b===pB) mgB++; if (p&&p!=="CSC"&&p===pB) maB++;
          });
        });

        versusRaw.push({ date: s.date, eqA, eqB, scoreA: scA, scoreB: scB, gA: mgA, aA: maA, gB: mgB, aB: maB });
      });
    }
  });

  result.matchsDirect = versusRaw.length;

  // Top 3 sessions ensemble (triées par gaA+gaB desc)
  result.together.best = togetherRaw
    .sort((a,b) => (b.gaA+b.gaB) - (a.gaA+a.gaB))
    .slice(0, 3);

  // Top 3 matchs directs (triés par G/A combinés desc, puis écart de score)
  result.versus.best = versusRaw
    .sort((a,b) => {
      const gaTotal = (b.gA+b.aA+b.gB+b.aB) - (a.gA+a.aA+a.gB+a.aB);
      if (gaTotal !== 0) return gaTotal;
      return Math.abs(b.scoreA-b.scoreB) - Math.abs(a.scoreA-a.scoreB);
    })
    .slice(0, 3);

  return result;
}

function renderRivBody(pA, pB, period) {
  if (pA === pB) {
    return `<p class="no-data">Sélectionne deux joueurs différents.</p>`;
  }
  const r = computeRivalites(pA, pB, period);
  if (r.total === 0) {
    return `<p class="no-data">Aucune session commune pour cette période.</p>`;
  }

  const wCol = "#34A853";
  const dCol = "var(--text3)";
  const lCol = "#ea4335";

  const hasTogether = r.together.sessions > 0;
  const hasVersus   = r.versus.sessions   > 0;

  // Header
  let h = `<div style="text-align:center;padding:10px 0 14px">
    <div style="font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:12px">
      <span>${pA}</span>
      <span style="font-size:11px;color:var(--text3);font-weight:500;letter-spacing:.1em">VS</span>
      <span>${pB}</span>
    </div>
  </div>`;

  if (!hasTogether && !hasVersus) {
    h += `<p class="no-data">Aucune session avec équipes attribuées.</p>`;
    return h;
  }

  // Stats : récap | face à face | ensemble — 3 colonnes sur la même ligne
  h += `<div class="riv-grid">`;

  // Récap (1re carte) — 2×2
  const matchsTogether = r.together.wA + r.together.dA + r.together.lA;
  const matchsTotal = matchsTogether + r.matchsDirect;
  h += `<div class="riv-col-card" style="border-color:var(--gold-border)">
    <div class="riv-col-title">Récap</div>
    <div class="riv-recap">
      <div><div class="n">${r.total}</div><div class="l">session${r.total>1?'s':''}</div></div>
      <div><div class="n">${matchsTotal}</div><div class="l">match${matchsTotal>1?'s':''}</div></div>
      <div><div class="n">${matchsTogether}</div><div class="l">ensemble</div></div>
      <div><div class="n">${r.matchsDirect}</div><div class="l">face à face</div></div>
    </div>
  </div>`;

  // Face à face (2e carte) — scoreboard pA vs pB
  if (hasVersus) {
    const v = r.versus;
    const colA = v.wA > v.wB ? wCol : v.wA < v.wB ? 'var(--text3)' : 'var(--text)';
    const colB = v.wB > v.wA ? wCol : v.wB < v.wA ? 'var(--text3)' : 'var(--text)';
    h += `<div class="riv-col-card">
      <div class="riv-col-title">⚔️ Face à face</div>
      <div class="riv-vsrow names"><span>${pA}</span><span style="font-size:9px;color:var(--text3);font-weight:600;letter-spacing:.12em;padding:0 6px;text-transform:uppercase">vs</span><span>${pB}</span></div>
      <div class="riv-score">
        <span class="num" style="color:${colA}">${v.wA}</span>
        <span class="draws">${v.dA}</span>
        <span class="num right" style="color:${colB}">${v.wB}</span>
      </div>
      <div class="riv-foot">
        <span><strong style="color:var(--text2)">${v.gA}</strong> but${v.gA>1?'s':''} · <strong style="color:var(--text2)">${v.aA}</strong> <span class="assist-full">assist${v.aA>1?'s':''}</span><span class="assist-short">ass.</span></span>
        <span><strong style="color:var(--text2)">${v.gB}</strong> but${v.gB>1?'s':''} · <strong style="color:var(--text2)">${v.aB}</strong> <span class="assist-full">assist${v.aB>1?'s':''}</span><span class="assist-short">ass.</span></span>
      </div>
    </div>`;
  } else {
    h += `<div class="riv-col-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="riv-col-title">⚔️ Face à face</div>
      <div class="riv-no-data-small">Pas de données</div>
    </div>`;
  }

  // Ensemble (3e carte) — pA × pB + V/N/D
  if (hasTogether) {
    const t = r.together;
    h += `<div class="riv-col-card">
      <div class="riv-col-title">🤝 Ensemble</div>
      <div class="riv-vsrow names"><span>${pA}</span><span style="font-size:14px;color:var(--text3);font-weight:700;padding:0 6px">×</span><span>${pB}</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;gap:2px;margin-bottom:3px">
        <span style="font-size:9px;color:${wCol};font-weight:700;text-transform:uppercase;letter-spacing:.06em">V</span>
        <span style="font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:.06em">N</span>
        <span style="font-size:9px;color:${lCol};font-weight:700;text-transform:uppercase;letter-spacing:.06em">D</span>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;margin-bottom:12px">
        <span style="font-size:40px;font-weight:800;line-height:1;color:${wCol}">${t.wA}</span>
        <span style="font-size:40px;font-weight:800;line-height:1;color:var(--text3)">${t.dA}</span>
        <span style="font-size:40px;font-weight:800;line-height:1;color:${lCol}">${t.lA}</span>
      </div>
      <div class="riv-foot" style="display:block">
        <span style="font-weight:700;color:var(--text)">${pA}</span> : <strong style="color:var(--text2)">${t.gA}</strong> but${t.gA>1?'s':''} · <strong style="color:var(--text2)">${t.aA}</strong> <span class="assist-full">assist${t.aA>1?'s':''}</span><span class="assist-short">ass.</span>
        <br>
        <span style="font-weight:700;color:var(--text)">${pB}</span> : <strong style="color:var(--text2)">${t.gB}</strong> but${t.gB>1?'s':''} · <strong style="color:var(--text2)">${t.aB}</strong> <span class="assist-full">assist${t.aB>1?'s':''}</span><span class="assist-short">ass.</span>
      </div>
    </div>`;
  } else {
    h += `<div class="riv-col-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="riv-col-title">🤝 Ensemble</div>
      <div class="riv-no-data-small">Pas de données</div>
    </div>`;
  }

  h += `</div>`;

  // Top soirées ensemble
  if (hasTogether && r.together.best.length > 0) {
    h += `<div class="riv-sessions-title">📅 Top soirées ensemble</div>`;
    r.together.best.forEach(sess => {
      const dateStr = new Date(sess.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short'});
      const resStr  = sess.wdl === 'W' ? `<span style="color:#34A853;font-weight:700">✓</span>`
                    : sess.wdl === 'L' ? `<span style="color:#ea4335;font-weight:700">✗</span>`
                    : `<span style="color:var(--text3)">=</span>`;
      h += `<div class="riv-sess-row">
        <span class="riv-sess-date">${dateStr}</span>
        ${badge(sess.equipe)}
        <span class="riv-sess-ga">${pA}: <strong>${sess.gaA}G/A</strong> · ${pB}: <strong>${sess.gaB}G/A</strong></span>
        ${resStr}
      </div>`;
    });
  }

  // Confrontations marquantes — 3 cartes par ligne
  if (hasVersus && r.versus.best.length > 0) {
    h += `<div class="riv-sessions-title">⚔️ Confrontations marquantes</div>`;
    h += `<div class="riv-match-grid">`;
    r.versus.best.forEach(m => {
      const dateStr = new Date(m.date).toLocaleDateString('fr-FR', {day:'numeric', month:'short', year:'numeric'});
      const gaStrA = `${m.gA}G · ${m.aA}A`;
      const gaStrB = `${m.gB}G · ${m.aB}A`;
      const hasGaA = m.gA + m.aA > 0;
      const hasGaB = m.gB + m.aB > 0;
      h += `<div class="riv-match-card">
        <div class="riv-match-date">${dateStr}</div>
        <div class="riv-match-score-row">
          ${badge(m.eqA)}
          <span class="riv-match-score">${m.scoreA} – ${m.scoreB}</span>
          ${badge(m.eqB)}
        </div>
        <div class="riv-match-players">
          <div class="riv-match-player">
            <div class="riv-match-player-name">${pA}</div>
            <div class="riv-match-player-ga${hasGaA?' active':''}">${gaStrA}</div>
          </div>
          <div class="riv-match-player">
            <div class="riv-match-player-name">${pB}</div>
            <div class="riv-match-player-ga${hasGaB?' active':''}">${gaStrB}</div>
          </div>
        </div>
      </div>`;
    });
    h += `</div>`;
  }

  return h;
}

    ${buildBallonDePlombHtml()}
    ${buildCalamityJamesHtml(SESSIONS)}

  const top10Passeurs = buildTop10HTMLv2(allSt.passeursRank.map(([n,p])=>({name:n, value:p.passes})), v => `${v} assist${v>1?"s":""}`);

  h += `<div class="podium-section">
    <div class="kpi-card">
      <div class="kpi-lbl" style="margin-top:0;margin-bottom:10px">Top 10 Buteurs ⚽ (all-time)</div>
      ${top10Buteurs}
    </div>
    <div class="kpi-card">
      <div class="kpi-lbl" style="margin-top:0;margin-bottom:10px">Top 10 Passeurs 🎯 (all-time)</div>
      ${top10Passeurs}
    </div>
  </div>`;

      : `<span class="status-pill" style="background:var(--bg3);color:var(--text3);border-color:var(--border)">Terminée</span>`;
    const ga = streak.g + streak.a;
    streakBody = `
      <div style="font-size:20px;font-weight:800;line-height:1.2">${pLink(streak.player)}</div>
      <div class="moment-big">${streak.count} <span style="font-size:13px;color:var(--text2);font-weight:600">match${streak.count>1?"s":""} consécutif${streak.count>1?"s":""}</span></div>

        <option value="month">Ce mois</option>

    <div id="riv-body"></div>

  const isAdmin = sessionStorage.getItem("hmft_role") === "admin";
  if (isAdmin) {
    h += renderAchievementsMatrix();
  }

  container.innerHTML = h;
  animateView(container);

  /* ── Récompenses : dépliage du classement complet ── */
  container.querySelectorAll('[data-award-toggle]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.awardToggle;
      const rows = container.querySelectorAll(`[data-award-id="${id}"]`);
      const willShow = rows.length > 0 && !rows[0].classList.contains('show');
      rows.forEach(r => r.classList.toggle('show', willShow));
      const total = rows.length + 5;
      btn.textContent = willShow ? 'Réduire ‹' : `Voir le classement complet (${total}) ›`;
    });
  });

  /* ── Rivalités — init et listeners ── */
  const _rivSelA = container.querySelector('#riv-a');
  const _rivSelB = container.querySelector('#riv-b');
  const _rivSelP = container.querySelector('#riv-period');
  if (_rivSelA && _rivSelB && _rivSelP) {
    if (_rivDefault2) _rivSelB.value = _rivDefault2;
    const _updateRiv = () => {
      document.getElementById('riv-body').innerHTML = renderRivBody(_rivSelA.value, _rivSelB.value, _rivSelP.value);
    };
    _updateRiv();
    _rivSelA.addEventListener('change', _updateRiv);
    _rivSelB.addEventListener('change', _updateRiv);
    _rivSelP.addEventListener('change', _updateRiv);
  }

  if (isAdmin) {
    const _mhfWrap = container.querySelector('#mhf-matrix-scroll');
    if (_mhfWrap) {
      _mhfWrap.addEventListener('click', e => {
        const achEl  = e.target.closest('.mhf-mh[data-ach]');
        const sortEl = e.target.closest('[data-sort]');
        if (achEl) { openMhfAchievementDrawer(achEl.dataset.ach); return; }
        if (sortEl) {
          const key = sortEl.dataset.sort;
          if (_mhfState.sortKey === key) _mhfState.sortDir *= -1; else { _mhfState.sortKey = key; _mhfState.sortDir = -1; }
          _mhfRerenderMatrix();
        }
      });
      const _mhfTip = document.getElementById('ach-tip');
      _mhfWrap.addEventListener('pointermove', e => {
        const cell = e.target.closest('[data-tip]');
        if (!cell) { _mhfTip.classList.remove('show'); return; }
        const [l0, ...lines] = (cell.dataset.tip || '').split('\n');
        _mhfTip.innerHTML = `<div class="atn">${l0}</div>${lines.map((l,i) => `<div class="${i===0?'atv':'atn2'}">${l}</div>`).join('')}`;
        const tw = _mhfTip.offsetWidth||180, th = _mhfTip.offsetHeight||55;
        _mhfTip.style.left = Math.min(e.clientX+14, window.innerWidth-tw-8)+'px';
        _mhfTip.style.top  = Math.max(e.clientY-th-10, 8)+'px';
        _mhfTip.classList.add('show');
      });
      _mhfWrap.addEventListener('pointerleave', () => { _mhfTip.classList.remove('show'); });
    }

    const _mhfRarity = container.querySelector('#mhf-rarity-list');
    if (_mhfRarity) {
      _mhfRarity.addEventListener('click', e => {
        const row = e.target.closest('.mhf-rarity-row');
        if (row) openMhfAchievementDrawer(row.dataset.acid);
      });
    }

    const _mhfSearch = container.querySelector('#mhf-search-input');
    if (_mhfSearch) {
      _mhfSearch.addEventListener('input', e => { _mhfState.search = e.target.value; _mhfRerenderMatrix(); });
    }

    const _mhfChips = container.querySelector('#mhf-cat-chips');
    if (_mhfChips) {
      _mhfChips.addEventListener('click', e => {
        const chip = e.target.closest('.pill');
        if (!chip) return;
        const cat = chip.dataset.cat;
        if (cat === '__all') { _mhfState.activeCats = new Set(MHF_CATS); }
        else if (_mhfState.activeCats.size === MHF_CATS.length) { _mhfState.activeCats = new Set([cat]); }
        else if (_mhfState.activeCats.has(cat)) { _mhfState.activeCats.delete(cat); if (!_mhfState.activeCats.size) _mhfState.activeCats = new Set(MHF_CATS); }
        else { _mhfState.activeCats.add(cat); }
        _mhfChips.innerHTML = _mhfRenderChipsHtml();
        _mhfRerenderMatrix();
      });
    }

    const _mhfHiddenToggle = container.querySelector('#mhf-hidden-toggle');
    if (_mhfHiddenToggle) {
      _mhfHiddenToggle.addEventListener('click', () => {
        _mhfState.showHidden = !_mhfState.showHidden;
        _mhfHiddenToggle.classList.toggle('on', _mhfState.showHidden);
        _mhfRerenderMatrix();
      });
    }
  }
}

function renderDashboard() {
  const sessions = filterSessions(currentPeriod);
  const dash = document.getElementById("dash");

  const latestDate = SESSIONS.length
    ? fmtDate([...SESSIONS].sort((a,b)=>new Date(b.date)-new Date(a.date))[0].date)
    : "—";
  document.getElementById("header-sub").textContent = `Dernière session : ${latestDate}`;

  if (!sessions.length) {
    dash.innerHTML = '<p class="no-data" style="margin-top:2rem">Aucune session pour cette période.</p>';
    return;
  }

  if (currentPeriod === "last") {
    dash.innerHTML = renderSessionDetail(sessions[0]);
    animateView(dash);
    return;
  }

  const st = computeStats(sessions);
  let h = "";

  /* ── Palmarès Ballon d'Or par année (All-Time) — à implémenter quand on aura les données des années précédentes ── */

  /* ── Calculs agrégés ── */
  let draws = 0;
  const goalsAgainst = {Rouge:0, Vert:0, Bleue:0};
  st.allMatchs.forEach(m => {
    if (m.scoreA === m.scoreB) draws++;
    goalsAgainst[m.eqA] = (goalsAgainst[m.eqA]||0) + m.scoreB;
    goalsAgainst[m.eqB] = (goalsAgainst[m.eqB]||0) + m.scoreA;
  });
  const totalButs    = st.allMatchs.reduce((acc,m) => acc + m.scoreA + m.scoreB, 0);
  const teamsActive  = [...new Set(st.allMatchs.flatMap(m => [m.eqA, m.eqB]))];
  const maxGoalsPT   = teamsActive.length ? Math.max(...teamsActive.map(t => st.goalsPerTeam[t]||0)) : 0;
  const bestAtkTeams = teamsActive.filter(t => (st.goalsPerTeam[t]||0) === maxGoalsPT && maxGoalsPT > 0);
  const maxGoalsAg   = teamsActive.length ? Math.max(...teamsActive.map(t => goalsAgainst[t]||0)) : 0;
  const worstDefTeams = teamsActive.filter(t => (goalsAgainst[t]||0) === maxGoalsAg && maxGoalsAg > 0);
  const minGoalsAgAgg   = teamsActive.length ? Math.min(...teamsActive.map(t => goalsAgainst[t]||0)) : 0;
  const bestDefTeamsAgg = teamsActive.filter(t => (goalsAgainst[t]||0) === minGoalsAgAgg);
  const maxWinsAgg   = Math.max(0, ...Object.values(st.colorWins));
  const winnerTeamsAgg = Object.entries(st.colorWins).filter(([,v]) => v === maxWinsAgg && maxWinsAgg > 0).map(([k]) => k);
  const atkGoals     = maxGoalsPT;
  const defGoals     = maxGoalsAg;
  const medals       = ["🥇","🥈","🥉"];
  const _fmtBut      = arr => {
    if (!arr || !arr.length) return "";
    const c = {}; arr.forEach(p => { c[p]=(c[p]||0)+1; });
    return Object.entries(c).sort((a,b)=>a[0].localeCompare(b[0],"fr")).map(([p,n]) => {
      const d = p==="CSC" ? p : `<button class="player-link" data-player="${p}" style="font-size:inherit">${p}</button>`;
      return n>1 ? `${d} ×${n}` : d;
    }).join(", ");
  };

  /* ── Section 1 : 8 cartes match (2 × 4) ── */
  const victSubAgg = ["Rouge","Vert","Bleue"].filter(c => st.colorWins[c] > 0)
    .map(c => `${dot(c)}${st.colorWins[c]}`).join(" · ");
  const matchSubAgg = [victSubAgg, draws > 0 ? `<span class="cdot gris"></span>${draws}` : ""].filter(Boolean).join(" · ");

  const top3Html      = buildAggTop3(st.buteursRank.map(([n,p])=>[n,p.buts]),   "but",   "buts");
  const top3PassHtml  = buildAggTop3(st.passeursRank.map(([n,p])=>[n,p.passes]),"passe","passes");

  /* KPI cards agrégées — pré-calcul */
  const avgButsAgg       = st.allMatchs.length > 0 ? (totalButs / st.allMatchs.length).toFixed(1) : "—";
  const bestTeamsHtmlAgg = winnerTeamsAgg.length===0?"—":winnerTeamsAgg.slice(0,2).map(t=>teamTagColored(t)).join(" &middot; ");

function populateSessionSelect() {
  const sel = document.getElementById("session-date");
  sel.innerHTML = "";
  if (!SESSIONS.length) {
    sel.innerHTML = `<option value="">Aucune session disponible</option>`;
    return;
  }
  const sorted = [...SESSIONS].sort((a,b) => new Date(b.date)-new Date(a.date));
  sorted.forEach((s, i) => {
    const opt = document.createElement("option");
    opt.value = s.date;
    opt.textContent = fmtDate(s.date);
    if (i === 0) opt.selected = true;
    sel.appendChild(opt);
  });
}


function renderSessionResults(date) {
  const container = document.getElementById("session-results");
  const session = SESSIONS.find(s => s.date === date);
  if (!session) {
    container.innerHTML = `<p class="no-data" style="margin-top:1rem">Aucune donnée pour cette session.</p>`;
    return;
  }
  container.innerHTML = renderSessionDetail(session);
  animateView(container);
}

let rosterSort = { col: "taux",      dir: 1 };
let jokerSort  = { col: "presences", dir: 1 };
let _joueurActiveGroup = 'reguliers';

function computePlayerStats() {
  const ps = {};
  ALL_PLAYERS.forEach(p => {
    ps[p] = { presences:0, absences:0, blesses:0, pasRepondu:0, buts:0, passes:0, vR:0, vV:0, vB:0, sac:0, maillots:0 };
  });

  SESSIONS.forEach(s => {
    Object.entries(s.presences).forEach(([p, info]) => {
      if (!ps[p]) ps[p] = { presences:0, absences:0, blesses:0, pasRepondu:0, buts:0, passes:0, vR:0, vV:0, vB:0, sac:0, maillots:0 };
      if      (info.statut === "Présent")     ps[p].presences++;
      else if (info.statut === "Absent")      ps[p].absences++;
      else if (info.statut === "Blessé")      ps[p].blesses++;
      else if (info.statut === "Pas répondu") ps[p].pasRepondu++;
    });
    if (s.sac     && ps[s.sac])     ps[s.sac].sac++;
    if (s.maillots && ps[s.maillots]) ps[s.maillots].maillots++;
    if (s.matchs) {
      s.matchs.forEach(m => {
        ["A","B"].forEach(side => {
          const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
          buts.forEach((b,i) => {
            if (!b || b==="CSC") return;
            if (ps[b]) ps[b].buts++;
            const p = passes[i]; if (p && p!=="CSC" && ps[p]) ps[p].passes++;
          });
        });
        const winner = m.scoreA > m.scoreB ? m.eqA : m.scoreB > m.scoreA ? m.eqB : null;
        if (winner) {
          Object.entries(s.presences).forEach(([p, info]) => {
            if (info.statut === "Présent" && info.equipe === winner && ps[p]) {
              if (winner==="Rouge") ps[p].vR++; else if (winner==="Vert") ps[p].vV++; else ps[p].vB++;
            }
          });
        }
      });
    }
  });

  return Object.entries(ps).map(([name, d]) => {
    const best = Math.max(d.vR, d.vV, d.vB);
    const favTeam = best === 0 ? null : d.vR === best ? "Rouge" : d.vV === best ? "Vert" : "Bleue";
    return { name, ...d, favTeam };
  });
}


function renderJoueurs() {
  const container = document.getElementById("joueurs-content");
  const rows = computePlayerStats();
  const totalSessions = SESSIONS.length;
  const isAdmin = sessionStorage.getItem("hmft_role") === "admin";

  const colDef = [
    { key:"name",       label:"Joueur"         },
    { key:"taux",       label:"%"              },
    { key:"absences",   label:"❌"             },
    { key:"blesses",    label:"🤕"             },
    { key:"pasRepondu", label:"⁉️"             },
    { key:"sac",        label:"🎒"             },
    { key:"maillots",   label:"👕"             },
  ];
  const jokerColDef = [
    { key:"name",       label:"Joueur"         },
    { key:"presences",  label:"✅"             },
  ];

  const rowsWithTaux = rows.map(r => ({
    ...r,
    taux: totalSessions > 0 ? Math.round(r.presences / totalSessions * 100) : 0
  }));

  const rosterRows = rowsWithTaux.filter(r => !JOKERS.has(r.name) && !ABSENTS.has(r.name));
  const jokerRows  = rowsWithTaux.filter(r =>  JOKERS.has(r.name));

  const _initialsMap = computeAllInitials([...new Set([...ALL_PLAYERS, ...rowsWithTaux.map(r => r.name), ...ABSENTS])]);

  function sortArr(arr, s) {
    return [...arr].sort((a, b) => {
      const av = a[s.col] ?? ""; const bv = b[s.col] ?? "";
      if (typeof av === "number" && typeof bv === "number") {
        const diff = (bv - av) * s.dir;
        return diff !== 0 ? diff : a.name.localeCompare(b.name, "fr");
      }
      const diff = String(av).localeCompare(String(bv), "fr") * s.dir;
      return diff !== 0 ? diff : a.name.localeCompare(b.name, "fr");
    });
  }

  function initials(n) { return _initialsMap[n] || n.slice(0,2).toUpperCase(); }

  function buildSortRow(id, cols, state) {
    return `<div class="roster-sort-row" id="${id}">${cols.map(c => {
      const active = state.col === c.key;
      const arrow  = active ? (state.dir === 1 ? "↑" : "↓") : "↕";
      return `<button class="roster-sort-pill${active ? " active" : ""}" data-col="${c.key}">${c.label}<span class="arrow">${arrow}</span></button>`;
    }).join("")}</div>`;
  }

  function bindSortRow(id, state) {
    document.getElementById(id)?.querySelectorAll("[data-col]").forEach(btn => {
      btn.addEventListener("click", () => {
        const col = btn.dataset.col;
        if (state.col === col) state.dir *= -1;
        else { state.col = col; state.dir = col === "name" ? 1 : -1; }
        renderJoueurs();
      });
    });
  }

  function chip(icon, val, cls) {
    if (!val) return "";
    return `<span class="roster-chip ${cls || ""}"><span class="roster-chip-ico">${icon}</span> ${val}</span>`;
  }

  function buildRosterCard(r) {
    const tCls = r.taux >= 75 ? "high" : r.taux >= 40 ? "mid" : "low";
    const chips = chip("❌", r.absences, "danger") + chip("🤕", r.blesses, "warn") + chip("⁉️", r.pasRepondu, "warn") + chip("🎒", r.sac) + chip("👕", r.maillots);
    const action = isAdmin ? `<div class="roster-actions"><button data-action="to-joker" data-player="${r.name}" title="Passer en occasionnel">🔽</button></div>` : "";
    return `<div class="roster-card">
      <div class="roster-avatar">${initials(r.name)}</div>
      <div class="roster-main">
        <button class="roster-name player-link" data-player="${r.name}">${r.name}</button>

          <div class="roster-taux-track"><div class="roster-taux-fill ${tCls}" style="width:${r.taux}%"></div></div>
          <span class="roster-taux-val ${tCls}">${r.taux}%</span>
        </div>
      </div>
      <div class="roster-chips">${chips}</div>
      ${action}
    </div>`;
  }

  function buildJokerCard(r) {
    const action = isAdmin ? `<div class="roster-actions">
      <button data-action="to-roster" data-player="${r.name}" title="Passer en régulier">🔼</button>
      <button data-action="to-absent" data-player="${r.name}" title="Marquer absent pour la saison">🔽</button>
    </div>` : "";
    return `<div class="roster-card">
      <div class="roster-avatar dim">${initials(r.name)}</div>
      <div class="roster-main">
        <button class="roster-name player-link" data-player="${r.name}">${r.name}</button>
        <div class="roster-sub"><b>${r.presences}</b> venue${r.presences > 1 ? "s" : ""} cette saison</div>
      </div>
      ${action}
    </div>`;
  }

  function buildAbsentCard(name) {
    const action = isAdmin ? `<div class="roster-actions"><button data-action="to-joker" data-player="${name}" title="Passer en occasionnel">🔼</button></div>` : "";
    return `<div class="roster-card">
      <div class="roster-avatar dim">${initials(name)}</div>
      <div class="roster-main">
        <button class="roster-name player-link" data-player="${name}">${name}</button>
        <div class="roster-sub">Absent pour la saison</div>
      </div>
      ${action}
    </div>`;
  }

  const rosterCards = sortArr(rosterRows, rosterSort).map(buildRosterCard).join("");
  const jokerCards  = sortArr(jokerRows, jokerSort).map(buildJokerCard).join("");
  const absentNames = [...ABSENTS].sort((a,b) => a.localeCompare(b,'fr'));
  const absentCards = absentNames.map(buildAbsentCard).join("");

  const jokerSection = jokerRows.length > 0 ? `
    <div class="joueurs-section-label" style="margin-top:2rem">Occasionnels (${jokerRows.length})</div>
    ${buildSortRow("jokers-sort", jokerColDef, jokerSort)}
    <div class="roster-list">${jokerCards}</div>` : '';

  const absentSection = absentNames.length > 0 ? `
    <div class="joueurs-section-label" style="margin-top:2rem">Absents pour la saison (${absentNames.length})</div>
    <div class="roster-list">${absentCards}</div>` : '';

  container.innerHTML = `
    <div class="joueurs-section-label">Réguliers (${rosterRows.length})</div>
    ${buildSortRow("roster-sort", colDef, rosterSort)}
    <div class="roster-list">${rosterCards}</div>
    ${jokerSection}${absentSection}`;

  bindSortRow("roster-sort", rosterSort);
  bindSortRow("jokers-sort", jokerSort);
}

document.getElementById("joueurs-content").addEventListener("click", e => {
  const btn = e.target.closest('[data-action]');
  if (!btn || !['to-roster','to-joker','to-absent'].includes(btn.dataset.action)) return;
  e.stopPropagation();
  const player = btn.dataset.player;
  const action = btn.dataset.action;
  if (action === 'to-roster')  { JOKERS.delete(player); ABSENTS.delete(player); _saveJokers(); _saveAbsents(); }
  if (action === 'to-joker')   { ABSENTS.delete(player); JOKERS.add(player);    _saveAbsents(); _saveJokers(); }
  if (action === 'to-absent')  { JOKERS.delete(player); ABSENTS.add(player);    _saveJokers(); _saveAbsents(); }
  renderJoueurs();
});

function computePlayerDetailStats(playerName) {
  const sessionsByDate = [...SESSIONS].sort((a,b) => new Date(a.date)-new Date(b.date));
  let presences = 0, absences = 0, blesses = 0, buts = 0, episodesBlessures = 0, pasRepondu = 0, inEpisode = false;
  let matchsJoues = 0, victoires = 0, defaites = 0, sac = 0, maillots = 0, passesDecisives = 0;
  const teamCount = {}, winsByColor = {}, teammateCount = {}, winTeammateCount = {};
  let bestMatch = null, bestMatchGoals = 0, bestMatchAssists = 0, bestMatchGA = 0;

  sessionsByDate.forEach(s => {
    const info = s.presences[playerName];
    if (!info) { inEpisode = false; return; }
    if (info.statut === "Présent") {
      presences++; inEpisode = false;
      if (s.sac === playerName) sac++;
      if (s.maillots === playerName) maillots++;
      const myEquipe = info.equipe || null;
      if (myEquipe) {
        teamCount[myEquipe] = (teamCount[myEquipe] || 0) + 1;
        Object.entries(s.presences).forEach(([other, oi]) => {
          if (other === playerName || oi.statut !== "Présent" || oi.equipe !== myEquipe) return;
          teammateCount[other] = (teammateCount[other] || 0) + 1;
        });
      }
      (s.matchs || []).forEach(m => {
        let g = 0, a = 0;
        ["A","B"].forEach(side => {
          const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
          buts.forEach((b,i) => {
            if (!b || b==="CSC") return;
            if (b === playerName) g++;
            const p = passes[i]; if (p && p!=="CSC" && p === playerName) a++;
          });
        });
        buts += g;
        passesDecisives += a;
        const ga = g + a;
        if (ga > bestMatchGA) { bestMatchGA = ga; bestMatchGoals = g; bestMatchAssists = a; bestMatch = {...m, date: s.date}; }
        if (!myEquipe || (m.eqA !== myEquipe && m.eqB !== myEquipe)) return;
        matchsJoues++;
        const winner = m.scoreA > m.scoreB ? m.eqA : m.scoreB > m.scoreA ? m.eqB : null;
        if (winner === myEquipe) {
          victoires++;
          winsByColor[myEquipe] = (winsByColor[myEquipe] || 0) + 1;
          Object.entries(s.presences).forEach(([other, oi]) => {
            if (other === playerName || oi.statut !== "Présent" || oi.equipe !== myEquipe) return;
            winTeammateCount[other] = (winTeammateCount[other] || 0) + 1;
          });
        } else if (winner !== null) {
          defaites++;
        }
      });
    } else if (info.statut === "Absent") {
      absences++; inEpisode = false;
    } else if (info.statut === "Blessé") {
      blesses++;
      if (!inEpisode) { episodesBlessures++; inEpisode = true; }
    } else if (info.statut === "Pas répondu") {
      pasRepondu++; inEpisode = false;
    } else {
      inEpisode = false;
    }
  });

  const top3T  = Object.entries(teammateCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const top3WT = Object.entries(winTeammateCount).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const maxTeam = Math.max(0, ...Object.values(teamCount));
  const recurringColor = maxTeam > 0 ? Object.entries(teamCount).sort((a,b)=>b[1]-a[1])[0][0] : null;
  const maxWins = Math.max(0, ...Object.values(winsByColor));
  const prefWinColor = maxWins > 0 ? Object.entries(winsByColor).sort((a,b)=>b[1]-a[1])[0][0] : null;

  /* Meilleure série G/A — par MATCH joué (présent + équipe jouait).
     Seul un match joué à 0 G/A coupe la série ; les absences ne la cassent pas. */
  const participatedMatches = [];
  sessionsByDate.forEach(s => {
    const info = s.presences[playerName];
    if (!info || info.statut !== "Présent") return;
    const myEquipe = info.equipe;
    if (!myEquipe) return;
    (s.matchs || []).forEach(m => {
      if (m.eqA !== myEquipe && m.eqB !== myEquipe) return;
      let g = 0, a = 0;
      ["A","B"].forEach(side => {
        const buts = m[`buteurs${side}`]||[], passes = m[`passeurs${side}`]||[];
        buts.forEach((b,i) => {
          if (!b || b==="CSC") return;
          if (b === playerName) g++;
          const p = passes[i]; if (p && p!=="CSC" && p === playerName) a++;
        });
      });
      participatedMatches.push({ date: s.date, g, a });
    });
  });

  let bestHistoricalStreak = null;
  let currentStreak       = null;
  let _scur = null;

  const _finalizeStreak = (active) => {
    if (!_scur) return;
    const s = { start: _scur.start, end: _scur.end, count: _scur.count, g: _scur.g, a: _scur.a };
    _scur = null;
    if (active) {
      currentStreak = s;
    } else if (!bestHistoricalStreak || s.count > bestHistoricalStreak.count ||
               (s.count === bestHistoricalStreak.count && (s.g+s.a) > (bestHistoricalStreak.g+bestHistoricalStreak.a))) {
      bestHistoricalStreak = s;
    }
  };

  for (const pm of participatedMatches) {
    if (pm.g + pm.a > 0) {
      if (!_scur) _scur = { start: pm.date, end: pm.date, count: 0, g: 0, a: 0 };
      _scur.end = pm.date;
      _scur.count++;
      _scur.g += pm.g;
      _scur.a += pm.a;
    } else {
      _finalizeStreak(false);
    }
  }
  _finalizeStreak(true);

  return { presences, absences, blesses, episodesBlessures, pasRepondu, buts, passesDecisives,
           matchsJoues, victoires, defaites, sac, maillots,
           bestMatch, bestMatchGoals, bestMatchAssists, recurringColor, teamCount,
           top3Teammates: top3T, top3WinTeammates: top3WT, prefWinColor, maxWins,
           bestHistoricalStreak, currentStreak };
}
